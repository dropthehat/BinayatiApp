<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Our Building · بنايتنا — V1 App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f7ff; --card: #ffffff; --ink: #0f1c2e; --mut: #5b6f8a;
  --line: #d9e5f5; --soft: #e8f0fe; --acc: #0b6cf0; --aq: #0e7c86;
  --ok: #1a7f4b; --okbg: #e3f5ec; --warn: #b54708; --wbg: #fef3c7;
  --bad: #b42318; --errbg: #fee2e2; --zebra: #f7faff;
}
:root[data-theme="dark"] {
  --bg: #0d1520; --card: #142031; --ink: #e6eefb; --mut: #8fa6c4;
  --line: #233450; --soft: #1b2d48; --acc: #4da3ff; --aq: #4cc3cd;
  --ok: #4ade80; --okbg: #10301f; --warn: #fbbf24; --wbg: #3a2a0b;
  --bad: #f87171; --errbg: #3a1416; --zebra: #172639;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
  font-variant-numeric: tabular-nums; padding-bottom: 90px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; }

/* Simulator Role Switcher Bar (Top) */
.sim-bar {
  background: #0f1c2e; color: #fff; padding: 8px 14px; font-size: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #233450;
}
.sim-pills { display: flex; background: #1e2f47; border-radius: 999px; padding: 3px; gap: 4px; }
.sim-pills button {
  background: transparent; color: #9ab0ce; border-radius: 999px; padding: 5px 12px; font-size: 12px;
}
.sim-pills button.on { background: var(--acc); color: #fff; }
.sim-actions { display: flex; gap: 6px; align-items: center; }
.sim-actions button {
  background: #1e2f47; color: #e6eefb; border-radius: 8px; padding: 5px 10px; font-size: 12px;
}

/* App Shell Container */
.shell { max-width: 580px; margin: 0 auto; }

/* App Header */
header.app-hdr {
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 14px 16px 0; position: sticky; top: 43px; z-index: 40;
}
.brand {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  font-weight: 700; letter-spacing: .05em; color: var(--acc); margin-bottom: 2px;
}
.hdr-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; }
.hdr-row h1 { margin: 0; font-size: 20px; }
.badge-cycle {
  background: var(--soft); color: var(--acc); padding: 4px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 700;
}

/* Navigation Tabs (Manager Mode) */
.nav-tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line);
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tabs button {
  flex: 1 0 auto; background: transparent; color: var(--mut); border-radius: 0;
  padding: 10px 12px; border-bottom: 2.5px solid transparent; font-size: 14px;
}
.nav-tabs button.on { color: var(--acc); border-bottom-color: var(--acc); }

/* Cards & Common UI */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 16px; margin: 12px 14px;
}
.card h2 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.hint { color: var(--mut); font-size: 12.5px; margin: 0 0 12px; }
.hero {
  background: linear-gradient(135deg, var(--card) 55%, rgba(14,154,167,.14));
  border-top: 4px solid var(--aq);
}
.dual-money {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;
}
.money-box {
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
.money-box small { display: block; color: var(--mut); font-size: 11.5px; }
.money-box b { font-size: 22px; font-weight: 800; display: block; margin-top: 2px; }
.money-box span.rem { font-size: 12px; color: var(--bad); font-weight: 600; }
.money-box span.ok { font-size: 12px; color: var(--ok); font-weight: 600; }

.pbar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0; }
.pbar i { display: block; height: 100%; background: var(--ok); transition: width .25s ease; }

/* Collector Apartment Rows */
.flt-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px;
}
.btn-outline {
  border: 1.5px solid var(--acc); background: transparent; color: var(--acc);
  border-radius: 999px; padding: 6px 14px; font-size: 13px;
}
.btn-outline.on { background: var(--acc); color: #fff; }

.apt-list { margin: 12px 14px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.band {
  background: var(--acc); color: #fff; font-weight: 700; padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center; font-size: 14px;
}
.apt {
  padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--line);
}
.apt:last-child { border-bottom: 0; }
.apt.z { background: var(--zebra); }
.apt.settled { background: var(--okbg); }
.apt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.apt-name { font-weight: 700; font-size: 16px; flex: 1; }
.apt-name small { color: var(--mut); font-weight: 500; font-size: 13px; margin-inline-start: 6px; }
.apt-right { display: flex; align-items: center; gap: 6px; }
.owe-tag { font-weight: 800; font-size: 14px; color: var(--bad); }
.owe-tag.done { color: var(--ok); font-size: 16px; }

.wa-btn {
  text-decoration: none; font-size: 18px; padding: 5px 7px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--line); line-height: 1;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.chip {
  border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 12px;
  font-size: 13px; font-weight: 600; background: var(--card); color: var(--ink);
  display: inline-flex; align-items: center; gap: 5px; transition: transform .08s;
}
.chip:active { transform: scale(0.96); }
.chip.on { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.chip.on::before { content: "✓"; font-weight: 800; }

/* Inputs & Tables in Setup */
.field-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 8px 0; border-top: 1px solid var(--line);
}
.field-row:first-of-type { border-top: 0; }
input[type="text"], input[type="number"], select {
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 9px; padding: 7px 10px;
}
input.num-in { width: 105px; text-align: right; font-weight: 700; }
.btn-primary { background: var(--acc); color: #fff; }
.btn-soft { background: var(--soft); color: var(--acc); width: 100%; margin-top: 8px; }
.btn-del { background: var(--errbg); color: var(--bad); padding: 6px 10px; }

/* Activity Feed & Notification Toast */
.feed-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px;
}
.feed-item:first-child { border-top: 0; }
.feed-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
  display: inline-block; margin-inline-end: 8px;
}
.feed-dot.un { background: var(--warn); }

#push-toast {
  position: fixed; top: 52px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: #0f1c2e; color: #fff; padding: 11px 16px; border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 13.5px; font-weight: 600;
  display: flex; align-items: center; gap: 10px; z-index: 999;
  opacity: 0; pointer-events: none; transition: all .25s cubic-bezier(.2,.8,.2,1);
  border: 1px solid #334e73; max-width: 92vw;
}
#push-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- TOP SIMULATOR BAR (For testing Manager vs Natour views) -->
<div class="sim-bar">
  <div class="sim-pills">
    <button id="role-mgr" class="on" onclick="setRole('mgr')">👨‍💼 Manager App</button>
    <button id="role-col" onclick="setRole('col')">👷‍♂️ Natour App</button>
  </div>
  <div class="sim-actions">
    <button id="btn-lang" onclick="toggleLang()">العربية</button>
    <button id="btn-theme" onclick="toggleTheme()">◐</button>
  </div>
</div>

<!-- LIVE PUSH NOTIFICATION SIMULATOR TOAST -->
<div id="push-toast">🔔 <span id="push-text"></span></div>

<div class="shell">
  <!-- HEADER -->
  <header class="app-hdr">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 2.5C8 7.6 5.5 11 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 11 16 7.6 12 2.5z" fill="currentColor"/></svg>
      <span>OUR BUILDING · بنايتنا</span>
    </div>
    <div class="hdr-row">
      <h1 id="hdr-title">Block C · مبنى C</h1>
      <span class="badge-cycle" id="hdr-month">November 2026</span>
    </div>
    <nav class="nav-tabs" id="mgr-nav">
      <button data-tab="dash" class="on" onclick="setTab('dash')">📊 Dashboard</button>
      <button data-tab="setup" onclick="setTab('setup')">⚙️ Monthly Setup</button>
      <button data-tab="bills" onclick="setTab('bills')">🧾 Building Bills</button>
      <button data-tab="dir" onclick="setTab('dir')">👥 Directory</button>
    </nav>
  </header>

  <!-- MAIN VIEW CONTAINER -->
  <main id="view"></main>
</div>

<script>
/* ============================================================================
   1. DEFAULT V1 STATE (Extracted from your Block C setup + Dual Currency)
   ============================================================================ */
var STORAGE_KEY = 'bina2itna_v1_state';
var ROLE = 'mgr'; // 'mgr' | 'col'
var TAB = 'dash'; // 'dash' | 'setup' | 'bills' | 'dir'
var LANG = 'en';
var UNPAID_ONLY = false;

var DEFAULT_STATE = {
  building: {
    nameEn: 'Block C',
    nameAr: 'البلوك C',
    collectorEn: 'Anas',
    collectorAr: 'أنس',
    rate: 89500,
    startBalanceUsd: 420
  },
  month: 'November 2026',
  apartments: [
    { id: 'PC01', unit: 'SS2R', en: 'Rami Haddad', ar: 'رامي حداد', ph: '9613111222' },
    { id: 'PC02', unit: 'SS1R', en: 'Nadia Khoury', ar: 'ناديا خوري', ph: '9613222333' },
    { id: 'PC04', unit: '1R',   en: 'Inan',         ar: 'عنان',       ph: '9613444555' },
    { id: 'PC06', unit: 'SS1L', en: 'Treasury (SS1L)', ar: 'أمين الصندوق (SS1L)', ph: '9613666777' },
    { id: 'PC07', unit: '2L',   en: 'Karim Salameh', ar: 'كريم سلامة', ph: '9613777888' },
    { id: 'PC09', unit: '2R',   en: 'Carl Halal',   ar: 'كارل حلال',  ph: '9613999000' }
  ],
  fixed: [
    { id: 'f_maint', en: 'Maintenance', ar: 'الصيانة', amt: 20, cur: 'USD', exc: { 'PC04': 15 } },
    { id: 'f_anas',  en: "Anas's fee",  ar: 'أتعاب أنس', amt: 15, cur: 'USD', exc: {} }
  ],
  dues: [
    { id: 'd_water', en: 'Cistern Water Share', ar: 'حصة صهريج المياه', mode: 'each', amt: 1350000, cur: 'LBP' }
  ],
  services: [
    { id: 's_net', en: 'Internet', ar: 'اشتراك الإنترنت', cur: 'USD', map: { 'PC01': 20, 'PC02': 20, 'PC04': 20, 'PC09': 25 } },
    { id: 's_gen', en: 'Private Generator', ar: 'المولد الخاص', cur: 'USD', map: { 'PC01': 45, 'PC07': 50, 'PC09': 40 } }
  ],
  bills: [
    { id: 'b_elev', en: 'Elevator bill', ar: 'فاتورة المصعد', amt: 65, cur: 'USD', paid: true },
    { id: 'b_gen',  en: 'Shared generator bill', ar: 'فاتورة المشترك', amt: 4475000, cur: 'LBP', paid: false }
  ],
  paid: {
    'f_maint': { 'PC01': 1, 'PC09': 1 },
    'f_anas':  { 'PC01': 1, 'PC09': 1 },
    's_net':   { 'PC09': 1 },
    's_gen':   { 'PC09': 1 },
    'd_water': { 'PC01': 1, 'PC09': 1 }
  },
  log: [
    { at: '10:15 AM', apt: 'Carl Halal (2R)', item: 'Cistern Water Share', amt: 1350000, cur: 'LBP', on: true },
    { at: '10:14 AM', apt: 'Carl Halal (2R)', item: 'Maintenance', amt: 20, cur: 'USD', on: true },
    { at: 'Yesterday', apt: 'Rami Haddad (SS2R)', item: 'Maintenance', amt: 20, cur: 'USD', on: true }
  ]
};

var S = loadState();
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ============================================================================
   2. HELPERS & ACCOUNTING ENGINE (USD + LBP)
   ============================================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function fmtMoney(amt, cur) {
  var n = Math.round((Number(amt) || 0) * 100) / 100;
  if (cur === 'LBP') return Math.round(n).toLocaleString('en-US') + (LANG === 'ar' ? ' ل.ل.' : ' LBP');
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function arMon(s) {
  var M = {january:'كانون الثاني',february:'شباط',march:'آذار',april:'نيسان',may:'أيار',june:'حزيران',july:'تموز',august:'آب',september:'أيلول',october:'تشرين الأول',november:'تشرين الثاني',december:'كانون الأول'};
  var x = /^\s*([A-Za-z]+)\s+(\d{4})/.exec(String(s || ''));
  return x && M[x[1].toLowerCase()] ? M[x[1].toLowerCase()] + ' ' + x[2] : String(s || '');
}

// Builds the unified list of charge columns for all apartments
function getColumns() {
  var cols = [], nApts = S.apartments.length || 1;
  S.fixed.forEach(function(f) {
    if (f.amt <= 0 && Object.keys(f.exc || {}).length === 0) return;
    cols.push({
      id: f.id, en: f.en, ar: f.ar, cur: f.cur || 'USD',
      amtFor: function(aptId) {
        return (f.exc && f.exc[aptId] != null && f.exc[aptId] !== '') ? Number(f.exc[aptId]) : Number(f.amt);
      }
    });
  });
  S.dues.forEach(function(d) {
    var each = d.mode === 'each' ? Number(d.amt) : (d.cur === 'LBP' ? Math.round(d.amt / nApts) : Math.round((d.amt / nApts) * 100) / 100);
    if (each <= 0) return;
    cols.push({
      id: d.id, en: d.en, ar: d.ar || d.en, cur: d.cur || 'USD',
      amtFor: function() { return each; }
    });
  });
  S.services.forEach(function(sv) {
    var hasAny = S.apartments.some(function(a) { return Number((sv.map || {})[a.id]) > 0; });
    if (!hasAny) return;
    cols.push({
      id: sv.id, en: sv.en, ar: sv.ar || sv.en, cur: sv.cur || 'USD',
      amtFor: function(aptId) { return Number((sv.map || {})[aptId]) || 0; }
    });
  });
  return cols;
}

function isPaid(colId, aptId) {
  return !!(S.paid[colId] && S.paid[colId][aptId]);
}

function calcMetrics() {
  var cols = getColumns();
  var usdSum = 0, usdGot = 0, lbpSum = 0, lbpGot = 0, settledCount = 0;
  var rate = Number(S.building.rate) || 89500;

  S.apartments.forEach(function(a) {
    var aptAllPaid = true;
    cols.forEach(function(c) {
      var v = c.amtFor(a.id);
      if (v <= 0) return;
      var pd = isPaid(c.id, a.id);
      if (!pd) aptAllPaid = false;
      if (c.cur === 'LBP') { lbpSum += v; if (pd) lbpGot += v; }
      else { usdSum += v; if (pd) usdGot += v; }
    });
    if (aptAllPaid && cols.length) settledCount++;
  });

  var eqSum = usdSum + (lbpSum / rate);
  var eqGot = usdGot + (lbpGot / rate);
  var pct = eqSum > 0 ? Math.min(100, Math.round((eqGot / eqSum) * 100)) : 0;

  // Building Outflow Bills
  var billsUsdPaid = 0, billsLbpPaid = 0;
  S.bills.forEach(function(b) {
    if (!b.paid) return;
    if (b.cur === 'LBP') billsLbpPaid += Number(b.amt) || 0;
    else billsUsdPaid += Number(b.amt) || 0;
  });

  return {
    cols: cols,
    usdSum: usdSum, usdGot: usdGot, usdRem: usdSum - usdGot,
    lbpSum: lbpSum, lbpGot: lbpGot, lbpRem: lbpSum - lbpGot,
    settled: settledCount, totalApts: S.apartments.length, pct: pct,
    treasuryUsd: (Number(S.building.startBalanceUsd) || 0) + usdGot - billsUsdPaid,
    treasuryLbp: lbpGot - billsLbpPaid
  };
}

/* ============================================================================
   3. WHATSAPP INVOICE (📣) & RECEIPT (🧾) GENERATOR
   ============================================================================ */
function buildWhatsAppMsg(apt, mode) {
  var cols = getColumns();
  var pAr = [], pEn = [], uAr = [], uEn = [];
  var paidUsd = 0, paidLbp = 0, dueUsd = 0, dueLbp = 0;

  cols.forEach(function(c) {
    var v = c.amtFor(apt.id);
    if (v <= 0) return;
    var pd = isPaid(c.id, apt.id);
    var fEn = c.cur === 'LBP' ? Math.round(v).toLocaleString('en-US') + ' LBP' : '$' + v;
    var fAr = c.cur === 'LBP' ? Math.round(v).toLocaleString('en-US') + ' ل.ل.' : '$' + v;

    if (pd) {
      if (c.cur === 'LBP') paidLbp += v; else paidUsd += v;
      pAr.push('• ' + (c.ar || c.en) + ': ' + fAr + ' ✅');
      pEn.push('• ' + c.en + ': ' + fEn + ' ✅');
    } else {
      if (c.cur === 'LBP') dueLbp += v; else dueUsd += v;
      uAr.push('• ' + (c.ar || c.en) + ': ' + fAr);
      uEn.push('• ' + c.en + ': ' + fEn);
    }
  });

  function joinTotals(u, l, isAr) {
    var parts = [];
    if (u > 0) parts.push('$' + (Math.round(u * 100) / 100));
    if (l > 0) parts.push(Math.round(l).toLocaleString('en-US') + (isAr ? ' ل.ل.' : ' LBP'));
    return parts.join(isAr ? ' + ' : ' + ') || '$0';
  }

  var nameAr = apt.ar || apt.en;
  var monAr = arMon(S.month);
  var colEn = S.building.collectorEn || 'Anas';
  var colAr = S.building.collectorAr || 'أنس';
  var bldEn = S.building.nameEn || 'Block C';
  var bldAr = S.building.nameAr || 'البلوك C';

  var hdr = mode === 'rc'
    ? '🧾 *إيصال ' + bldAr + ' · ' + bldEn + ' Receipt*'
    : '🏢 *فاتورة ' + bldAr + ' · ' + bldEn + ' Invoice*';

  var ar = '', en = '';
  if (mode === 'rc') {
    var gotStrAr = joinTotals(paidUsd, paidLbp, true);
    var gotStrEn = joinTotals(paidUsd, paidLbp, false);
    var remStrAr = joinTotals(dueUsd, dueLbp, true);
    var remStrEn = joinTotals(dueUsd, dueLbp, false);
    ar = 'تحية طيبة *' + nameAr + '*، 👋\n\n' + bldAr + ' · *' + monAr + '*\n\n'
       + '✅ *إيصال استلام* — وصلنا منكم *' + gotStrAr + '*:\n' + pAr.join('\n') + '\n\n'
       + (uAr.length ? '⚠️ *المتبقي عليكم:*\n' + uAr.join('\n') + '\n*المجموع: ' + remStrAr + '*\n\nيُرجى تسليمه إلى ' + colAr + '.' : '🎉 لا يوجد أي مبلغ متبقٍّ عليكم — كل شيء مسدَّد.')
       + '\n\nنشكر لكم حسن تعاونكم معنا! 🙏✨';
    en = 'Hello *' + apt.en + '*, 👋\n\n' + bldEn + ' · *' + S.month + '*\n\n'
       + '✅ *Payment receipt* — we received *' + gotStrEn + '*:\n' + pEn.join('\n') + '\n\n'
       + (uEn.length ? '⚠️ *Still remaining:*\n' + uEn.join('\n') + '\n*Total: ' + remStrEn + '*\n\nPlease pass it to ' + colEn + '.' : '🎉 Nothing is left to pay — you are all settled.')
       + '\n\nThank you for your valued cooperation! 🙏✨';
  } else {
    var allAr = pAr.concat(uAr).join('\n');
    var allEn = pEn.concat(uEn).join('\n');
    var dueStrAr = joinTotals(dueUsd, dueLbp, true);
    var dueStrEn = joinTotals(dueUsd, dueLbp, false);
    ar = 'تحية طيبة *' + nameAr + '*، 👋\n\n' + bldAr + ' · *' + monAr + '*\n' + allAr + '\n\n'
       + (uAr.length ? '👉 *المبلغ المستحق: ' + dueStrAr + ' — يُرجى تسليمه إلى ' + colAr + '.*' : 'لا يترتب عليكم أي مبلغ هذا الشهر — كل شيء مسدّد. ✅')
       + '\n\nنشكر لكم حسن تعاونكم معنا! 🙏✨';
    en = 'Hello *' + apt.en + '*, 👋\n\n' + bldEn + ' · *' + S.month + '*\n' + allEn + '\n\n'
       + (uEn.length ? '👉 *Total due: ' + dueStrEn + ' — please pass it to ' + colEn + '.*' : 'You have nothing to pay this month — all settled. ✅')
       + '\n\nThank you for your valued cooperation! 🙏✨';
  }

  var note = '────────────────────\n_ملاحظة: هذه رسالة تلقائية. لأي استفسار أو تعديل، يُرجى الرد مباشرة عبر هذه المحادثة._\n_Note: This is an automated message. For any questions or corrections, please reply directly to this chat._\n\n💧 *بنايتنا · Our Building*';
  var fullText = hdr + '\n\n' + ar + '\n\n' + en + '\n\n' + note;
  return 'https://wa.me/' + String(apt.ph || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(fullText);
}

/* ============================================================================
   4. TICKING ENGINE + PUSH NOTIFICATION SIMULATION
   ============================================================================ */
var toastTimer = null;
function showPushToast(txt) {
  var el = document.getElementById('push-toast');
  document.getElementById('push-text').textContent = txt;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3500);
}

function toggleTick(colId, aptId) {
  var cols = getColumns();
  var col = cols.filter(function(c) { return c.id === colId; })[0];
  var apt = S.apartments.filter(function(a) { return a.id === aptId; })[0];
  if (!col || !apt) return;

  if (!S.paid[colId]) S.paid[colId] = {};
  var newVal = !S.paid[colId][aptId];
  if (newVal) S.paid[colId][aptId] = 1;
  else delete S.paid[colId][aptId];

  var amt = col.amtFor(aptId);
  var nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  S.log.unshift({
    at: nowStr,
    apt: apt.en + ' (' + apt.unit + ')',
    item: col.en,
    amt: amt,
    cur: col.cur,
    on: newVal
  });
  S.log = S.log.slice(0, 30);
  saveState();

  var msg = (newVal ? 'Paid: ' : 'Unmarked: ') + apt.en + ' (' + apt.unit + ') · ' + col.en + ' ' + fmtMoney(amt, col.cur);
  showPushToast(msg);
  render();
}

/* ============================================================================
   5. VIEW RENDERERS
   ============================================================================ */
function render() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btn-lang').textContent = LANG === 'ar' ? 'English' : 'العربية';
  document.getElementById('hdr-title').textContent = LANG === 'ar' ? S.building.nameAr : S.building.nameEn;
  document.getElementById('hdr-month').textContent = LANG === 'ar' ? arMon(S.month) : S.month;

  var nav = document.getElementById('mgr-nav');
  nav.style.display = ROLE === 'mgr' ? 'flex' : 'none';

  if (ROLE === 'col') {
    renderCollectorView();
  } else {
    if (TAB === 'dash') renderDashboardView();
    else if (TAB === 'setup') renderSetupView();
    else if (TAB === 'bills') renderBillsView();
    else if (TAB === 'dir') renderDirectoryView();
  }
}

/* ---- A. COLLECTOR VIEW (NATOUR) ---- */
function renderCollectorView() {
  var m = calcMetrics();
  var ar = LANG === 'ar';
  var h = '';

  // Sticky Summary Card
  h += '<div class="card hero">';
  h += '<h2><span>' + (ar ? 'تحصيل الشهر' : 'Monthly Collection') + '</span><small style="color:var(--mut);font-size:13px">' + m.settled + ' / ' + m.totalApts + ' ' + (ar ? 'سدّدوا بالكامل' : 'settled') + '</small></h2>';
  h += '<div class="dual-money">';
  h += '<div class="money-box"><small>' + (ar ? 'دولار تم تحصيله' : 'USD Collected') + '</small><b dir="ltr">' + fmtMoney(m.usdGot, 'USD') + '</b><span class="' + (m.usdRem > 0 ? 'rem' : 'ok') + '" dir="ltr">' + (ar ? 'المتبقي: ' : 'Rem: ') + fmtMoney(m.usdRem, 'USD') + '</span></div>';
  h += '<div class="money-box"><small>' + (ar ? 'ل.ل. تم تحصيلها' : 'LBP Collected') + '</small><b dir="ltr">' + fmtMoney(m.lbpGot, 'LBP') + '</b><span class="' + (m.lbpRem > 0 ? 'rem' : 'ok') + '" dir="ltr">' + (ar ? 'المتبقي: ' : 'Rem: ') + fmtMoney(m.lbpRem, 'LBP') + '</span></div>';
  h += '</div>';
  h += '<div class="pbar"><i style="width:' + m.pct + '%"></i></div>';
  h += '<div class="flt-bar">';
  h += '<button class="btn-outline' + (UNPAID_ONLY ? ' on' : '') + '" onclick="UNPAID_ONLY=!UNPAID_ONLY;render()">' + (UNPAID_ONLY ? (ar ? 'عرض الكل' : 'Show All') : (ar ? 'غير المدفوعين فقط' : 'Unpaid Only')) + '</button>';
  h += '<small style="color:var(--mut);font-size:12px">' + (ar ? '📣 تذكير · 🧾 إيصال واتساب' : '📣 Reminder · 🧾 Receipt') + '</small>';
  h += '</div></div>';

  // Apartments List
  h += '<div class="apt-list">';
  h += '<div class="band"><span>' + esc(ar ? S.building.nameAr : S.building.nameEn) + '</span><span>' + m.pct + '%</span></div>';

  var shown = 0;
  S.apartments.forEach(function(apt, idx) {
    var owedUsd = 0, owedLbp = 0, paidAny = false;
    m.cols.forEach(function(c) {
      var v = c.amtFor(apt.id);
      if (v <= 0) return;
      if (isPaid(c.id, apt.id)) paidAny = true;
      else { if (c.cur === 'LBP') owedLbp += v; else owedUsd += v; }
    });
    var isSettled = owedUsd === 0 && owedLbp === 0;
    if (UNPAID_ONLY && isSettled) return;
    shown++;

    var oweParts = [];
    if (owedUsd > 0) oweParts.push(fmtMoney(owedUsd, 'USD'));
    if (owedLbp > 0) oweParts.push(fmtMoney(owedLbp, 'LBP'));

    var dispName = ar ? (apt.ar || apt.en) : apt.en;
    h += '<div class="apt' + (idx % 2 ? ' z' : '') + (isSettled ? ' settled' : '') + '">';
    h += '<div class="apt-top">';
    h += '<div class="apt-name">' + esc(dispName) + '<small>(' + esc(apt.unit) + ')</small></div>';
    h += '<div class="apt-right">';
    h += '<span class="owe-tag' + (isSettled ? ' done' : '') + '" dir="ltr">' + (isSettled ? '✓' : oweParts.join(' + ')) + '</span>';
    if (apt.ph) {
      h += '<a class="wa-btn" href="' + buildWhatsAppMsg(apt, 'inv') + '" target="_blank" title="Send WhatsApp Invoice">📣</a>';
      if (paidAny) {
        h += '<a class="wa-btn" href="' + buildWhatsAppMsg(apt, 'rc') + '" target="_blank" title="Send WhatsApp Receipt">🧾</a>';
      }
    }
    h += '</div></div>';

    // Chips
    h += '<div class="chips">';
    m.cols.forEach(function(c) {
      var v = c.amtFor(apt.id);
      if (v <= 0) return;
      var pd = isPaid(c.id, apt.id);
      var lbl = ar ? (c.ar || c.en) : c.en;
      h += '<button class="chip' + (pd ? ' on' : '') + '" onclick="toggleTick(\'' + c.id + '\',\'' + apt.id + '\')">'
        + esc(lbl) + ' <span dir="ltr">' + fmtMoney(v, c.cur) + '</span></button>';
    });
    h += '</div></div>';
  });

  if (shown === 0) {
    h += '<div style="padding:28px;text-align:center;color:var(--ok);font-weight:700">' + (ar ? 'الجميع سدّد بالكامل ✅' : 'Everyone has settled ✅') + '</div>';
  }
  h += '</div>';
  document.getElementById('view').innerHTML = h;
}

/* ---- B. MANAGER DASHBOARD VIEW ---- */
function renderDashboardView() {
  var m = calcMetrics();
  var h = '';

  // Treasury + Collection Overview
  h += '<div class="card hero">';
  h += '<h2><span>Building Treasury & Collection</span><small style="color:var(--mut);font-weight:500">Rate: ' + Number(S.building.rate).toLocaleString() + ' LBP/$</small></h2>';
  h += '<div class="dual-money">';
  h += '<div class="money-box"><small>Treasury Cash (USD)</small><b dir="ltr">' + fmtMoney(m.treasuryUsd, 'USD') + '</b><span class="ok" dir="ltr">Collected: ' + fmtMoney(m.usdGot, 'USD') + ' / ' + fmtMoney(m.usdSum, 'USD') + '</span></div>';
  h += '<div class="money-box"><small>Treasury Cash (LBP)</small><b dir="ltr">' + fmtMoney(m.treasuryLbp, 'LBP') + '</b><span class="ok" dir="ltr">Collected: ' + fmtMoney(m.lbpGot, 'LBP') + '</span></div>';
  h += '</div>';
  h += '<div class="pbar"><i style="width:' + m.pct + '%"></i></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--mut)"><span>' + m.settled + ' of ' + m.totalApts + ' apartments fully settled (' + m.pct + '%)</span><button class="btn-outline" style="padding:3px 10px;font-size:12px" onclick="setRole(\'col\')">Open Natour View →</button></div>';
  h += '</div>';

  // Live Notifications / Latest Payments Activity Feed
  h += '<div class="card">';
  h += '<h2><span>🔔 Latest Payments Activity</span><small style="color:var(--mut);font-size:12px">Live Feed</small></h2>';
  h += '<p class="hint">Every time ' + esc(S.building.collectorEn) + ' ticks or unticks a charge, you get a push notification and an entry here.</p>';
  if (!S.log.length) {
    h += '<div style="color:var(--mut);font-size:13px">No activity yet.</div>';
  } else {
    S.log.slice(0, 8).forEach(function(item) {
      h += '<div class="feed-item"><div><span class="feed-dot' + (item.on ? '' : ' un') + '"></span><b>' + esc(item.apt) + '</b> · ' + esc(item.item) + '</div><div dir="ltr" style="font-weight:700;color:' + (item.on ? 'var(--ok)' : 'var(--warn)') + '">' + (item.on ? '+' : '↺ ') + fmtMoney(item.amt, item.cur) + ' <small style="color:var(--mut);font-weight:400">' + esc(item.at) + '</small></div></div>';
    });
  }
  h += '</div>';

  document.getElementById('view').innerHTML = h;
}

/* ---- C. MANAGER MONTHLY SETUP VIEW ---- */
function renderSetupView() {
  var h = '';

  // 1. Cycle & Exchange Rate
  h += '<div class="card"><h2>1. Cycle & Currency Rate</h2><p class="hint">Set the active month and LBP exchange rate.</p>';
  h += '<div class="field-row"><span>Active Month</span><input type="text" value="' + esc(S.month) + '" onchange="S.month=this.value.trim();saveState();render()"></div>';
  h += '<div class="field-row"><span>Exchange Rate (LBP per $1)</span><input class="num-in" type="number" value="' + S.building.rate + '" onchange="S.building.rate=Number(this.value)||89500;saveState();render()"></div>';
  h += '</div>';

  // 2. Fixed Monthly Charges
  h += '<div class="card"><h2>2. Fixed Monthly Charges</h2><p class="hint">Charged to every apartment (e.g., Maintenance & Natour Fee).</p>';
  S.fixed.forEach(function(f, idx) {
    h += '<div class="field-row"><div style="flex:1"><b>' + esc(f.en) + '</b> <small style="color:var(--mut)">(' + esc(f.ar) + ')</small></div>';
    h += '<input class="num-in" type="number" value="' + f.amt + '" onchange="S.fixed[' + idx + '].amt=Number(this.value)||0;saveState();render()">';
    h += '<select onchange="S.fixed[' + idx + '].cur=this.value;saveState();render()"><option value="USD"' + (f.cur==='USD'?' selected':'') + '>USD ($)</option><option value="LBP"' + (f.cur==='LBP'?' selected':'') + '>LBP (ل.ل.)</option></select>';
    h += '</div>';
  });
  h += '</div>';

  // 3. One-Off / Split Dues
  h += '<div class="card"><h2>3. Extra Dues (Split or Per Unit)</h2><p class="hint">Add water cistern shares, repairs, or extra dues in USD or LBP.</p>';
  S.dues.forEach(function(d, idx) {
    h += '<div class="field-row" style="flex-wrap:wrap">';
    h += '<input type="text" placeholder="English Name" value="' + esc(d.en) + '" style="flex:1;min-width:120px" onchange="S.dues[' + idx + '].en=this.value;saveState()">';
    h += '<input type="text" dir="rtl" placeholder="الاسم بالعربية" value="' + esc(d.ar) + '" style="flex:1;min-width:120px" onchange="S.dues[' + idx + '].ar=this.value;saveState()">';
    h += '<select onchange="S.dues[' + idx + '].mode=this.value;saveState();render()"><option value="each"' + (d.mode==='each'?' selected':'') + '>Each Apt</option><option value="split"' + (d.mode==='split'?' selected':'') + '>Split Total</option></select>';
    h += '<input class="num-in" type="number" value="' + d.amt + '" onchange="S.dues[' + idx + '].amt=Number(this.value)||0;saveState();render()">';
    h += '<select onchange="S.dues[' + idx + '].cur=this.value;saveState();render()"><option value="USD"' + (d.cur==='USD'?' selected':'') + '>USD</option><option value="LBP"' + (d.cur==='LBP'?' selected':'') + '>LBP</option></select>';
    h += '<button class="btn-del" onclick="S.dues.splice(' + idx + ',1);saveState();render()">✕</button>';
    h += '</div>';
  });
  h += '<button class="btn-soft" onclick="S.dues.push({id:\'d_\'+Date.now(),en:\'New Due\',ar:\'رسم إضافي\',mode:\'each\',amt:0,cur:\'USD\'});saveState();render()">+ Add Extra Due</button>';
  h += '</div>';

  // 4. Per-Apartment Services (Internet, Generator, etc.)
  h += '<div class="card"><h2>4. Per-Apartment Services</h2><p class="hint">Variable monthly amounts per unit (leave 0 if apartment is not subscribed).</p>';
  S.services.forEach(function(sv, sIdx) {
    h += '<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px">';
    h += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">';
    h += '<input type="text" value="' + esc(sv.en) + '" style="flex:1;font-weight:700" onchange="S.services[' + sIdx + '].en=this.value;saveState()">';
    h += '<input type="text" dir="rtl" value="' + esc(sv.ar) + '" style="flex:1" onchange="S.services[' + sIdx + '].ar=this.value;saveState()">';
    h += '<select onchange="S.services[' + sIdx + '].cur=this.value;saveState();render()"><option value="USD"' + (sv.cur==='USD'?' selected':'') + '>USD</option><option value="LBP"' + (sv.cur==='LBP'?' selected':'') + '>LBP</option></select>';
    h += '</div>';
    S.apartments.forEach(function(a) {
      var val = (sv.map && sv.map[a.id]) || '';
      h += '<div class="field-row"><span>' + esc(a.en) + ' <small style="color:var(--mut)">(' + esc(a.unit) + ')</small></span>';
      h += '<input class="num-in" type="number" placeholder="0" value="' + val + '" onchange="S.services[' + sIdx + '].map[\'' + a.id + '\']=Number(this.value)||0;saveState()"></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  document.getElementById('view').innerHTML = h;
}

/* ---- D. BUILDING BILLS (OUTFLOWS) VIEW ---- */
function renderBillsView() {
  var h = '<div class="card"><h2>Building Payables (Outflows)</h2><p class="hint">Track Elevator, Shared Generator, and maintenance expenses paid from the building treasury.</p>';
  S.bills.forEach(function(b, idx) {
    h += '<div class="field-row" style="flex-wrap:wrap">';
    h += '<input type="text" value="' + esc(b.en) + '" style="flex:1;min-width:130px" onchange="S.bills[' + idx + '].en=this.value;saveState()">';
    h += '<input class="num-in" type="number" value="' + b.amt + '" onchange="S.bills[' + idx + '].amt=Number(this.value)||0;saveState();render()">';
    h += '<select onchange="S.bills[' + idx + '].cur=this.value;saveState();render()"><option value="USD"' + (b.cur==='USD'?' selected':'') + '>USD</option><option value="LBP"' + (b.cur==='LBP'?' selected':'') + '>LBP</option></select>';
    h += '<label style="display:flex;align-items:center;gap:5px;font-weight:700;color:' + (b.paid ? 'var(--ok)' : 'var(--bad)') + '"><input type="checkbox"' + (b.paid ? ' checked' : '') + ' onchange="S.bills[' + idx + '].paid=this.checked;saveState();render()"> ' + (b.paid ? 'Settled' : 'Due') + '</label>';
    h += '</div>';
  });
  h += '<button class="btn-soft" onclick="S.bills.push({id:\'b_\'+Date.now(),en:\'Repair Bill\',ar:\'فاتورة تصليح\',amt:0,cur:\'USD\',paid:false});saveState();render()">+ Add Building Bill</button>';
  h += '</div>';
  document.getElementById('view').innerHTML = h;
}

/* ---- E. DIRECTORY VIEW ---- */
function renderDirectoryView() {
  var h = '<div class="card"><h2>Apartments & WhatsApp Directory</h2><p class="hint">Edit resident names (English & Arabic) and WhatsApp numbers.</p>';
  S.apartments.forEach(function(a, idx) {
    h += '<div style="padding:10px 0;border-top:1px solid var(--line)">';
    h += '<div style="display:flex;gap:6px;margin-bottom:6px"><input type="text" value="' + esc(a.unit) + '" style="width:70px;font-weight:700" onchange="S.apartments[' + idx + '].unit=this.value;saveState()">';
    h += '<input type="text" value="' + esc(a.en) + '" placeholder="English Name" style="flex:1" onchange="S.apartments[' + idx + '].en=this.value;saveState()"></div>';
    h += '<div style="display:flex;gap:6px"><input type="text" dir="rtl" value="' + esc(a.ar) + '" placeholder="الاسم بالعربية" style="flex:1" onchange="S.apartments[' + idx + '].ar=this.value;saveState()">';
    h += '<input type="text" value="' + esc(a.ph) + '" placeholder="9613..." style="width:140px" onchange="S.apartments[' + idx + '].ph=this.value;saveState()"></div>';
    h += '</div>';
  });
  h += '<button class="btn-soft" onclick="S.apartments.push({id:\'PC\'+(S.apartments.length+10),unit:\'NEW\',en:\'New Resident\',ar:\'ساكن جديد\',ph:\'961\'});saveState();render()">+ Add Apartment</button>';
  h += '</div>';
  document.getElementById('view').innerHTML = h;
}

/* ============================================================================
   6. NAVIGATION & CONTROLS
   ============================================================================ */
function setRole(r) {
  ROLE = r;
  document.getElementById('role-mgr').className = r === 'mgr' ? 'on' : '';
  document.getElementById('role-col').className = r === 'col' ? 'on' : '';
  render();
}
function setTab(t) {
  TAB = t;
  document.querySelectorAll('#mgr-nav button').forEach(function(b) {
    b.className = b.getAttribute('data-tab') === t ? 'on' : '';
  });
  render();
}
function toggleLang() {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  render();
}
function toggleTheme() {
  var root = document.documentElement;
  var cur = root.getAttribute('data-theme');
  root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

render();
</script>
