<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Binayati · بنايتي — V13 Smart Building Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
 --bg: #f4f5fb;
 --card: #ffffff;
 --card2: #f8f9fe;
 --ink: #14172c;
 --mut: #6e7491;
 --line: #e6e8f4;
 --soft: #eeebff;
 --acc: #5b4cf5;
 --acc2: #7c6ff9;
 --hero: linear-gradient(145deg, #5444f2 0%, #6e5ef7 55%, #8273fa 100%);
 --ok: #10b981;
 --okbg: rgba(16, 185, 129, 0.12);
 --warn: #f59e0b;
 --wbg: rgba(245, 158, 11, 0.12);
 --bad: #ef4444;
 --errbg: rgba(239, 68, 68, 0.11);
 --purp: #7c3aed;
 --purpbg: rgba(124, 58, 237, 0.11);
 --shadow: 0 10px 30px rgba(30, 26, 82, 0.06);
 --shadow-lg: 0 18px 45px rgba(91, 76, 245, 0.22);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
 margin: 0; background: var(--bg); color: var(--ink);
 font: 14.5px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
 font-variant-numeric: tabular-nums; padding-bottom: 115px; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 14px; font-weight: 700; transition: all .16s ease; }
button:active { transform: scale(0.96); }

/* Simulator Top Bar */
.sim-strip {
 background: #14172c; color: #ffffff; padding: 6px 12px; font-size: 12px;
 display: flex; align-items: center; justify-content: space-between; gap: 6px;
 position: relative; z-index: 100;
}
.sim-pills { display: flex; background: rgba(255,255,255,0.1); border-radius: 999px; padding: 2px; }
.sim-pills button { background: transparent; color: #cbd5e1; border-radius: 999px; padding: 4px 10px; font-size: 11px; }
.sim-pills button.on { background: var(--acc); color: #fff; }
.sim-right { display: flex; gap: 6px; }
.sim-right button { background: rgba(255,255,255,0.14); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11px; }

.shell { max-width: 480px; margin: 0 auto; overflow-x: hidden; }

/* Royal Indigo Hero Wrapper */
.indigo-hero {
 background: var(--hero); color: #ffffff;
 padding: 16px 18px 26px; border-radius: 0 0 32px 32px;
 box-shadow: var(--shadow-lg); margin-bottom: 14px; position: relative;
}
.hero-top {
 display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px;
}
.hero-pill {
 background: rgba(255,255,255,0.18); backdrop-filter: blur(8px);
 color: #fff; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 700;
 display: inline-flex; align-items: center; gap: 6px;
}
.hero-center { text-align: center; margin: 6px 0 16px; }
.hero-center .lbl { font-size: 12.5px; opacity: 0.85; font-weight: 600; }
.hero-center .big-num { font-size: 38px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 4px; }
.hero-center .sub-lbl { font-size: 12px; opacity: 0.82; font-weight: 600; }

.hero-cur-toggle {
 display: inline-flex; background: rgba(0,0,0,0.18); padding: 3px; border-radius: 999px; gap: 2px;
}
.hero-cur-toggle button {
 background: transparent; color: rgba(255,255,255,0.75); padding: 4px 11px; font-size: 11px; border-radius: 999px;
}
.hero-cur-toggle button.on { background: #ffffff; color: var(--acc); }

.hero-stats-grid {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
 background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.2);
 border-radius: 20px; padding: 12px 10px; text-align: center; backdrop-filter: blur(8px);
}
.hero-stats-grid div span { display: block; font-size: 10.5px; opacity: 0.82; font-weight: 600; }
.hero-stats-grid div b { display: block; font-size: 15px; font-weight: 800; margin-top: 2px; }
.hero-stats-grid div small { display: block; font-size: 10px; opacity: 0.78; margin-top: 1px; }

/* Standard Page Header */
header.top-bar {
 padding: 12px 18px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.header-lead { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.btn-back-lead {
 width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--line);
 display: grid; place-items: center; font-size: 20px; line-height: 1; color: var(--acc); flex: none;
 box-shadow: var(--shadow);
}
.top-brand { font-size: 11px; font-weight: 800; color: var(--acc); letter-spacing: .06em; text-transform: uppercase; }
.top-title { font-size: 20px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role-badge {
 background: var(--soft); color: var(--acc);
 padding: 6px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; flex: none;
}

/* White Rounded Cards */
.card {
 background: var(--card); border: 1px solid var(--line); border-radius: 24px;
 padding: 18px; margin: 12px 16px; box-shadow: var(--shadow); position: relative; max-width: 100%;
}
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--ink); }
.subtext { color: var(--mut); font-size: 12.5px; margin: 0 0 12px; line-height: 1.45; }

.drawer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drawer-box {
 background: var(--card2); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; min-width: 0;
}
.drawer-box span { display: block; font-size: 11px; font-weight: 700; color: var(--mut); }
.drawer-box b { display: block; font-size: 16px; font-weight: 800; margin-top: 3px; color: var(--ink); }
.drawer-box small { display: block; font-size: 11px; color: var(--mut); font-weight: 600; margin-top: 2px; }

/* Month / Project Pill Strip */
.month-pills {
 display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 4px 16px 8px;
}
.month-pills::-webkit-scrollbar { display: none; }
.mpill {
 background: var(--card); border: 1px solid var(--line); color: var(--mut);
 padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
 display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}
.mpill.on { background: var(--acc); color: #ffffff; border-color: var(--acc); }
.mpill.proj { border-color: rgba(245,158,11,.45); }
.mpill.proj.on { background: var(--warn); color: #ffffff; border-color: var(--warn); }

/* Segmented 3-Button Bar */
.seg-bar {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
 background: var(--card2); padding: 4px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 12px;
}
.seg-bar button {
 background: transparent; color: var(--mut); padding: 8px 4px; font-size: 12px;
 border-radius: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg-bar button.on { background: var(--card); color: var(--acc); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

/* Horizontal Progress Bar */
.prog-wrap { margin: 8px 0 14px; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; flex-wrap: wrap; }
.prog-top b { font-size: 19px; font-weight: 800; }
.prog-top span { font-size: 12.5px; font-weight: 800; color: var(--acc); }
.prog-track {
 height: 11px; width: 100%; background: var(--card2); border: 1px solid var(--line);
 border-radius: 999px; overflow: hidden;
}
.prog-fill {
 height: 100%; border-radius: 999px;
 background: linear-gradient(90deg, var(--acc), var(--ok));
 transition: width .35s cubic-bezier(.4,0,.2,1);
}
.prog-fill.proj { background: linear-gradient(90deg, var(--warn), var(--ok)); }

/* Cycle Summary Strip */
.ledger-strip {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
 margin-top: 10px; padding: 11px; background: var(--card2);
 border: 1px solid var(--line); border-radius: 16px; text-align: center;
}
.ledger-strip div span { display: block; font-size: 10.5px; font-weight: 700; color: var(--mut); }
.ledger-strip div b { font-size: 14px; font-weight: 800; margin-top: 2px; display: block; }

/* Donut Chart Container */
.chart-wrap {
 position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
 margin: 8px 0 14px;
}
.donut-center {
 position: absolute; inset: 0; display: flex; flex-direction: column;
 align-items: center; justify-content: center; pointer-events: none; text-align: center;
}
.donut-center b { font-size: 20px; font-weight: 800; }
.donut-center span { font-size: 11.5px; color: var(--mut); font-weight: 600; }

/* Corner ⋯ Menu Button & Popover */
.corner-wrap { position: relative; flex: none; }
.dots-btn {
 width: 34px; height: 34px; border-radius: 10px; background: var(--card2);
 border: 1px solid var(--line); color: var(--ink); font-size: 18px;
 display: grid; place-items: center; line-height: 1;
}
.corner-menu {
 position: absolute; top: 40px; inset-inline-end: 0; min-width: 215px;
 background: var(--card); border: 1px solid var(--line); border-radius: 18px;
 padding: 6px; box-shadow: 0 14px 35px rgba(20,23,44,0.16); z-index: 120;
}
.corner-menu button {
 width: 100%; background: transparent; color: var(--ink); padding: 9px 12px;
 border-radius: 10px; font-size: 12.5px; font-weight: 700; text-align: start;
 display: flex; align-items: center; gap: 8px;
}
.corner-menu button:hover { background: var(--card2); }
.corner-menu button.danger { color: var(--bad); }

/* List Rows */
.list-row {
 display: flex; align-items: center; justify-content: space-between; gap: 10px;
 padding: 11px 0; border-top: 1px solid var(--line);
}
.list-row:first-of-type { border-top: 0; }
.list-row.clickable { cursor: pointer; border-radius: 12px; padding-inline: 6px; margin-inline: -6px; transition: background .15s; }
.list-row.clickable:hover, .list-row.selected-cat { background: var(--soft); }
.list-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.single-line-name {
 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
 font-weight: 700; font-size: 14px; display: block;
}
.status-stack {
 display: flex; flex-direction: column; align-items: flex-end; text-align: end;
 flex: none; line-height: 1.3;
}
.status-stack .st-paid { font-size: 12.5px; font-weight: 800; color: var(--ok); }
.status-stack .st-owed { font-size: 12px; font-weight: 800; color: var(--bad); margin-top: 2px; }
.status-stack .st-zero { font-size: 11px; font-weight: 600; color: var(--mut); }

.split-drawer {
 background: var(--card2); border: 1px dashed var(--line); border-radius: 12px;
 padding: 8px 11px; margin-top: 7px; font-size: 11.5px; font-weight: 700;
 display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
}

.badge-code {
 background: var(--soft); color: var(--acc);
 font-weight: 800; font-size: 12px; padding: 5px 9px; border-radius: 10px; flex: none;
}
.badge-lang {
 background: var(--soft); color: var(--acc); font-size: 10.5px; font-weight: 800;
 padding: 2px 7px; border-radius: 6px; margin-inline-start: 6px; display: inline-block;
}
.badge-pay {
 font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; text-transform: uppercase;
}
.badge-pay.mgr { background: var(--purpbg); color: var(--purp); }
.badge-pay.cash { background: var(--okbg); color: var(--ok); }

.btn-edit {
 background: var(--card2); border: 1px solid var(--line); color: var(--ink);
 padding: 6px 12px; border-radius: 11px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; flex: none;
}

/* Expense Category Rows */
.cat-ico {
 width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
 font-size: 18px; flex: none;
}
.cat-mid { flex: 1; min-width: 0; }
.cat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.cat-top b { font-size: 14px; font-weight: 700; }
.cat-top span { font-size: 13.5px; font-weight: 800; }
.cat-bar { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; }
.cat-bar i { display: block; height: 100%; border-radius: 999px; }

/* WhatsApp Full-Size Template Editor & Live Preview */
.wa-textarea {
 width: 100%; min-height: 150px; resize: vertical; line-height: 1.5;
 background: var(--card2); border: 1.5px solid var(--line); border-radius: 14px;
 padding: 11px 13px; font-size: 13px; font-weight: 600;
}
.wa-textarea.expanded { min-height: 240px; }
.wa-preview-box {
 background: #e5ddd5; border: 1px solid #d4ccc3; border-radius: 18px; padding: 12px; margin-top: 10px;
 max-width: 100%; overflow: hidden;
}
.wa-bubble {
 background: #dcf8c6; color: #111b21; border-radius: 14px 14px 4px 14px;
 padding: 12px 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap;
 overflow-wrap: break-word; word-break: break-word; max-width: 100%;
 box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}
.wa-bubble strong { font-weight: 800; color: #000000; }

/* Docked Bottom Navigation with Centered Indigo + Button */
nav.bottom-dock {
 position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
 width: 100%; max-width: 480px; background: rgba(255,255,255,0.96);
 backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
 border-top: 1px solid var(--line); padding: 6px 10px 14px;
 display: flex; justify-content: space-around; align-items: center;
 z-index: 90; box-shadow: 0 -8px 28px rgba(20,23,44,0.06);
}
nav.bottom-dock button.nav-tab {
 flex: 1; background: transparent; color: var(--mut); border-radius: 14px;
 padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px;
 font-size: 10.5px; font-weight: 700;
}
nav.bottom-dock button.nav-tab .ico { font-size: 18px; line-height: 1.1; }
nav.bottom-dock button.nav-tab.on { color: var(--acc); font-weight: 800; }

.dock-plus-wrap {
 position: relative; top: -18px; flex: none; padding: 0 6px;
}
.fab {
 width: 54px; height: 54px; border-radius: 50%; background: var(--hero);
 color: #ffffff; font-size: 28px; font-weight: 700; display: grid; place-items: center;
 box-shadow: 0 10px 24px rgba(91, 76, 245, 0.42); border: 4px solid var(--bg);
 transition: transform .2s ease;
}
.fab.open { transform: rotate(45deg); background: var(--bad); }

.fab-menu {
 position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
 width: calc(100% - 32px); max-width: 380px; background: var(--card); border: 1px solid var(--line);
 border-radius: 24px; padding: 10px; box-shadow: 0 20px 50px rgba(20,23,44,0.22);
 z-index: 134; display: none; flex-direction: column; gap: 6px;
}
.fab-menu.open { display: flex; }
.fab-menu button {
 width: 100%; background: var(--card2); color: var(--ink); padding: 11px 14px;
 border-radius: 16px; font-size: 13px; font-weight: 700; text-align: start;
 display: flex; align-items: center; gap: 11px; border: 1px solid var(--line);
}
.fab-menu button:hover { border-color: var(--acc); background: var(--soft); }

/* Natour Collector Apartment Cards */
.apt-card { padding: 14px 15px; background: var(--card); border-bottom: 1px solid var(--line); }
.apt-card:last-child { border-bottom: 0; }
.apt-card.settled { background: var(--okbg); }
.apt-top-row {
 display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: nowrap;
}
.apt-name-box {
 display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1;
}
.apt-name-box b {
 font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.apt-due-box {
 display: flex; align-items: center; gap: 7px; flex: none;
}
.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
 border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 11px;
 font-size: 12.5px; font-weight: 700; background: var(--card2); color: var(--ink);
 display: inline-flex; align-items: center; gap: 5px;
}
.chip.ticked { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.chip.ticked::before { content: "✓"; font-weight: 900; }
.chip.mgr-paid {
 background: var(--purpbg); border-color: var(--purp); color: var(--purp);
}
.chip.mgr-paid::before { content: "✓"; font-weight: 900; }
.chip.pass-through {
 border-style: dashed; border-color: rgba(245,158,11,.6);
}
.chip.pass-through.ticked {
 background: var(--wbg); border-style: solid; border-color: var(--warn); color: #b45309;
}
.wa-btn {
 height: 32px; padding: 0 10px; border-radius: 10px; background: var(--card2);
 border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 4px;
 text-decoration: none; font-size: 12px; font-weight: 800; color: var(--ink); white-space: nowrap;
}
.wa-btn.receipt { background: var(--okbg); border-color: var(--ok); color: var(--ok); }

/* Forms & Modals */
input[type="text"], input[type="number"], input[type="date"], select, textarea {
 width: 100%; max-width: 100%; min-width: 0; background: var(--card2); border: 1.5px solid var(--line);
 border-radius: 13px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; color: var(--ink);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); background: #fff; }
.form-row { display: flex; gap: 8px; align-items: center; width: 100%; }
.form-row > * { min-width: 0; }
.amt-cur-grid {
 display: grid; grid-template-columns: 1fr 112px; gap: 8px; width: 100%; align-items: end;
}
.two-col-grid {
 display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
}
.row-div { padding: 10px 0; border-top: 1px solid var(--line); }
.row-div:first-of-type { border-top: 0; }
.btn-del { background: var(--errbg); color: var(--bad); padding: 7px 11px; border-radius: 10px; flex: none; }

.modal-bg {
 position: fixed; inset: 0; background: rgba(20, 23, 44, 0.55); backdrop-filter: blur(5px);
 z-index: 200; display: none; align-items: center; justify-content: center; padding: 14px;
}
.modal-card {
 background: var(--card); border: 1px solid var(--line); border-radius: 28px;
 width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; overflow-x: hidden; padding: 22px;
 box-shadow: 0 24px 60px rgba(20, 23, 44, 0.25);
}
.modal-card h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }

/* Illustrated Onboarding Styles */
.ob-hero-title {
 font-size: 25px; font-weight: 800; line-height: 1.22; text-align: center; margin: 4px 0 6px; color: var(--ink);
}
.ob-hero-title span { color: var(--acc); display: block; }
.ob-illus-box {
 height: 155px; display: flex; align-items: center; justify-content: center; margin: 8px 0 14px;
 background: radial-gradient(circle, var(--soft) 0%, rgba(255,255,255,0) 72%);
 animation: floatY 3.2s ease-in-out infinite;
}
@keyframes floatY {
 0%, 100% { transform: translateY(0px); }
 50% { transform: translateY(-6px); }
}
.ob-pill-btn {
 width: 100%; padding: 14px 20px; border-radius: 999px; background: var(--acc);
 color: #ffffff; font-size: 15px; font-weight: 800; box-shadow: 0 8px 22px rgba(91, 76, 245, 0.32);
}
.choice-card {
 border: 1.5px solid var(--line); background: var(--card2); border-radius: 18px;
 padding: 12px 14px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px;
 transition: all .15s ease;
}
.choice-card.on { border-color: var(--acc); background: var(--soft); }

.step-dots { display: flex; gap: 5px; margin-bottom: 14px; }
.step-dot { height: 6px; flex: 1; border-radius: 999px; background: var(--line); transition: background .25s; }
.step-dot.on { background: var(--acc); }

.mini-phone {
 border: 3px solid #1e293b; border-radius: 22px; background: #f8fafc;
 padding: 10px 12px; margin: 10px 0 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}
.mini-phone-notch {
 width: 60px; height: 5px; background: #cbd5e1; border-radius: 999px; margin: 0 auto 8px;
}

.report-sheet {
 background: #ffffff; border: 2px solid var(--line); border-radius: 20px; padding: 16px; margin: 10px 0 14px;
}
.report-hdr {
 background: var(--hero); color: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px;
 display: flex; justify-content: space-between; align-items: center;
}

.pin-box {
 font-family: ui-monospace, monospace; font-size: 19px; font-weight: 800;
 letter-spacing: 3px; color: var(--acc); background: var(--soft);
 padding: 6px 10px; border-radius: 10px; border: 1px dashed var(--acc); text-align: center;
}

#toast {
 position: fixed; top: 46px; left: 50%; transform: translateX(-50%) translateY(-20px);
 background: #14172c; color: #fff; padding: 10px 18px; border-radius: 999px;
 font-size: 13px; font-weight: 700; z-index: 300; opacity: 0; pointer-events: none;
 transition: all .25s ease; box-shadow: 0 10px 25px rgba(20,23,44,.25);
}
#toast.pop { opacity: 1; transform: translateX(-50%) translateY(0); }

@media print {
 .sim-strip, nav.bottom-dock, .fab-menu, .no-print { display: none !important; }
 body { background: #fff; padding: 0; }
 .modal-bg { position: static; background: #fff; padding: 0; display: block !important; }
 .modal-card { max-width: 100%; max-height: none; box-shadow: none; border: 0; padding: 0; }
}

// Uses native navigator.share() to let iPhones and Androids save/share image directly to WhatsApp or Photos!
function shareReportImageNative() {
 var s = getCycleStats(SELECTED_MONTH);
 var sf = getSafeBalance();
 var cyc = DB.cycles[SELECTED_MONTH];
 var bldCols = getCycleCols(SELECTED_MONTH, true);
 var rate = Number(DB.settings.rate) || 89500;
 var cycExps = DB.expenses.filter(function(e) { return e.month === SELECTED_MONTH && e.payer !== 'natour_pending'; });

 var canvas = document.createElement('canvas');
 var w = 800;
 var h = 460 + (cycExps.length * 42) + (DB.apartments.length * 42);
 canvas.width = w;
 canvas.height = h;
 var ctx = canvas.getContext('2d');

 ctx.fillStyle = '#f4f5fb';
 ctx.fillRect(0, 0, w, h);

 var grad = ctx.createLinearGradient(0, 0, w, 160);
 grad.addColorStop(0, '#5444f2');
 grad.addColorStop(1, '#7c6ff9');
 ctx.fillStyle = grad;
 ctx.fillRect(0, 0, w, 155);

 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 16px sans-serif';
 ctx.fillText('BINAYATI · بنايتي — MONTHLY BUILDING REPORT', 40, 48);
 ctx.font = 'bold 32px sans-serif';
 ctx.fillText(DB.settings.bldEn + '  ·  ' + SELECTED_MONTH, 40, 92);
 ctx.font = '600 18px sans-serif';
 ctx.fillText('Total Building Safe: $' + Math.round(sf.netUsd + (sf.netLbp / rate)).toLocaleString() + ' USD', 40, 128);

 var y = 185;
 ctx.fillStyle = '#ffffff';
 ctx.fillRect(40, y, 720, 85);
 ctx.fillStyle = '#10b981';
 ctx.font = 'bold 22px sans-serif';
 ctx.fillText('Collected: +$' + Math.round(s.eqGotUsd), 65, y + 50);
 ctx.fillStyle = '#ef4444';
 ctx.fillText('Bills Paid: -$' + Math.round(s.expUsd), 310, y + 50);
 ctx.fillStyle = '#5b4cf5';
 ctx.fillText('Net: ' + (s.netCycleUsd>=0?'+':'-') + '$' + Math.abs(Math.round(s.netCycleUsd)), 565, y + 50);

 y += 120;
 ctx.fillStyle = '#14172c';
 ctx.font = 'bold 20px sans-serif';
 ctx.fillText('Bills & Expenses Paid (' + cycExps.length + ')', 40, y);
 y += 18;
 cycExps.forEach(function(e) {
 y += 36;
 ctx.fillStyle = '#334155';
 ctx.font = '600 17px sans-serif';
 ctx.fillText('• ' + e.desc.substring(0, 46), 50, y);
 ctx.fillStyle = '#ef4444';
 ctx.fillText('-' + fmt(e.amt, e.cur, 'en'), 630, y);
 });

 y += 52;
 ctx.fillStyle = '#14172c';
 ctx.font = 'bold 20px sans-serif';
 ctx.fillText('Apartments Status (' + s.settled + '/' + s.total + ' Settled)', 40, y);
 y += 18;
 DB.apartments.forEach(function(a) {
 y += 38;
 var uGot = 0, lGot = 0, uDue = 0, lDue = 0;
 bldCols.forEach(function(c) {
 var v = c.valFor(a.id); if (v <= 0) return;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][a.id]);
 if (c.cur === 'LBP') { if (pd) lGot += v; else lDue += v; }
 else { if (pd) uGot += v; else uDue += v; }
 });
 var eqPaid = Math.round(uGot + (lGot / rate));
 var eqOwed = Math.round(uDue + (lDue / rate));
 var uLabel = REPORT_HIDE_NAMES ? ('Unit ' + a.code) : (a.code + ' - ' + a.en);

 ctx.fillStyle = '#14172c';
 ctx.font = 'bold 17px sans-serif';
 ctx.fillText(uLabel, 50, y);
 ctx.fillStyle = eqOwed === 0 ? '#10b981' : '#ef4444';
 ctx.fillText(eqOwed === 0 ? ('✓ Paid $' + eqPaid) : ('Owes $' + eqOwed), 620, y);
 });

 canvas.toBlob(function(blob) {
 var file = new File([blob], 'Binayati-Report-' + SELECTED_MONTH.replace(/\s+/g, '-') + '.png', { type: 'image/png' });
 if (navigator.canShare && navigator.canShare({ files: [file] })) {
 navigator.share({
 files: [file],
 title: 'Binayati Monthly Report',
 text: '📊 ' + DB.settings.bldEn + ' · ' + SELECTED_MONTH + ' Financial Report'
 }).catch(function(err){ console.log(err); });
 } else {
 // Fallback for browsers that don't support file sharing
 var link = document.createElement('a');
 link.download = file.name;
 link.href = URL.createObjectURL(blob);
 link.click();
 showToast(t('Report image saved!', 'تم حفظ صورة التقرير!'));
 }
 }, 'image/png');
}

/* ---- TASK UNDO & COMPLETION LOGIC ---- */
function undoCompleteTask(cIdx) {
 var ct = (DB.completedTasks || [])[cIdx];
 if (!ct) return;
 DB.reminders.push({
 id: 'rm_' + Date.now(),
 en: ct.en,
 ar: ct.ar || ct.en,
 date: todayIso(),
 freq: 'Monthly',
 assignNatour: true
 });
 DB.completedTasks.splice(cIdx, 1);
 saveDB();
 showToast(t('Task restored to pending reminders!', 'تم استعادة المهمة للقائمة المعلقة!'));
 render();
}

 });

function updateProjCalcPreview() {
 var el = document.getElementById('nc-calc-preview');
 if (!el) return;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var checked = document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').length || 1;
 var downPerUnit = Math.round((down / checked) * 100) / 100;
 var moPerUnit = Math.round((((Math.max(0, budget - down)) / mos) / checked) * 100) / 100;
 el.innerHTML = t(
 '⚡ Auto-Split (' + checked + ' apts): <b>$' + downPerUnit + '/apt</b> Down + <b>$' + moPerUnit + '/apt/mo</b> × ' + mos + ' mos.',
 '⚡ التقسيم التلقائي (' + checked + ' شقق): <b>$' + downPerUnit + ' للشقة</b> دفعة أولى + <b>$' + moPerUnit + ' شهرياً</b> × ' + mos + ' أشهر.'
 );
}

function saveNewCycleModal() {
 if (ncType === 'month') {
 var m = document.getElementById('nc-mon').value;
 var y = document.getElementById('nc-yr').value;
 var name = m + ' ' + y;
 if (!DB.cycles[name]) {
 var copyPrev = document.getElementById('nc-copy').checked;
 var prev = DB.cycles['October 2026'] || DB.cycles[SELECTED_MONTH] || { fixed: [], services: [] };
 DB.cycles[name] = {
 isProject: false,
 arLabel: dispCycleName(name, 'ar'),
 published: false,
 fixed: copyPrev ? JSON.parse(JSON.stringify(prev.fixed || [])) : [],
 dues: [],
 services: copyPrev ? JSON.parse(JSON.stringify(prev.services || [])) : [],
 paid: {}
 };
 }
 SELECTED_MONTH = name;
 saveDB(); closeModal('new-cycle-modal'); showToast(t('Created: ' + name, 'تم إنشاء: ' + dispCycleName(name, 'ar')));
 setTab('setup');
 } else {
 var pEn = document.getElementById('nc-proj-en').value.trim();
 var pAr = document.getElementById('nc-proj-ar').value.trim() || pEn;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var injectIntoMonth = document.getElementById('nc-inject').checked;
 if (!pEn || budget <= 0) { alert(t('Enter project title and target budget', 'أدخل اسم المشروع والميزانية')); return; }

 var activeUnits = [];
 document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').forEach(function(cb) {
 activeUnits.push(cb.getAttribute('data-u'));
 });
 if (!activeUnits.length) activeUnits = DB.apartments.map(function(a) { return a.id; });

 var count = activeUnits.length;
 var downPerUnit = Math.round((down / count) * 100) / 100;
 var moPerUnit = Math.round((((budget - down) / mos) / count) * 100) / 100;

 var svList = [];
 if (down > 0) {
 var dMap = {};
 activeUnits.forEach(function(uId) { dMap[uId] = downPerUnit; });
 svList.push({ id: 'sp_down_' + Date.now(), en: 'Initial Down Payment ($' + down + ' Split)', ar: 'الدفعة الأولى (من أصل $' + down + ')', cur: 'USD', passThrough: false, map: dMap });
 }

 // Naming installments by actual calendar months!
 var monthNames = ['October', 'November', 'December', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September'];
 var monthNamesAr = ['تشرين الأول', 'تشرين الثاني', 'كانون الأول', 'كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول'];
 var firstInstId = 'sp_m1_' + Date.now();

 for (var i = 1; i <= mos; i++) {
 var mMap = {};
 activeUnits.forEach(function(uId) { mMap[uId] = moPerUnit; });
 var cId = (i === 1) ? firstInstId : ('sp_m' + i + '_' + Date.now());
 var mIdx = (9 + (i - 1)) % 12; // Starts October (idx 9)
 var yrVal = 2026 + Math.floor((9 + i - 1) / 12);
 var mLabelEn = monthNames[mIdx] + ' ' + yrVal + ' Installment (' + i + '/' + mos + ')';
 var mLabelAr = 'قسط ' + monthNamesAr[mIdx] + ' ' + yrVal + ' (' + i + '/' + mos + ')';

 svList.push({ id: cId, en: mLabelEn, ar: mLabelAr, cur: 'USD', passThrough: false, map: mMap });
 }

 DB.cycles[pEn] = {
 isProject: true,
 arLabel: pAr,
 published: true,
 targetBudget: budget,
 downPaymentTotal: down,
 installmentMonths: mos,
 fixed: [], dues: [], services: svList, paid: {}
 };

 if (injectIntoMonth && DB.cycles['October 2026']) {
 DB.cycles['October 2026'].dues.push({
 id: 'due_' + firstInstId,
 en: '🛠️ ' + pEn + ' (Oct 2026 Inst. 1/' + mos + ')',
 ar: '🛠️ ' + pAr + ' (قسط تشرين الأول 1/' + mos + ')',
 amt: moPerUnit,
 cur: 'USD',
 linkedProject: pEn,
 linkedColId: firstInstId
 });
 }

 SELECTED_MONTH = pEn;
 CYCLE_DETAIL_MODE = true;
 saveDB(); closeModal('new-cycle-modal');
 showToast(t('Project created with calendar months!', 'تم إنشاء المشروع مع أسماء الشهور التقويمية!'));
 setTab('dash');
 }
}

function deleteSelectedCycle() {
 if (Object.keys(DB.cycles).length <= 1) {
 alert(t('You must keep at least one active month.', 'يجب إبقاء دورة واحدة على الأقل.'));
 return;
 }
 if (!confirm(t('Delete "' + SELECTED_MONTH + '" and its records?', 'هل تريد حذف "' + dispCycleName(SELECTED_MONTH) + '"؟'))) return;
 delete DB.cycles[SELECTED_MONTH];
 SELECTED_MONTH = Object.keys(DB.cycles)[0];
 CYCLE_DETAIL_MODE = false;
 saveDB(); showToast(t('Deleted', 'تم الحذف')); render();
}

function openDirectPayModal() {
 var h = '<div class="card-h"><h3 style="color:var(--purp)">💵 ' + t('Record Resident Payment to Manager', 'تسجيل دفعة مستلمة مباشرة للمدير') + '</h3><button class="btn-del" onclick="closeModal(\'direct-pay-modal\')">✕</button></div>';
 h += '<p class="subtext">' + t('Whether the tenant paid you in Cash, Whish, OMT, or Bank Transfer, recording it here marks their dues as Paid on the Natour\'s phone WITHOUT adding it to the Natour\'s cash pocket.', 'سواء دفع الساكن للمدير كاش أو عبر Whish أو OMT، تسجيل الدفعة هنا يظهرها كمسددة على هاتف الناطور دون إضافتها إلى الكاش الموجود مع الناطور.') + '</p>';

 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Apartment', 'الشقة') + '</label><select id="wp-apt" style="margin-top:4px" onchange="populateDirectPayDues()">';
 DB.apartments.forEach(function(a) { h += '<option value="' + a.id + '">' + esc(a.code) + ' · ' + esc(LANG==='ar'?(a.ar||a.en):a.en) + '</option>'; });
 h += '</select></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Month / Project', 'الشهر / المشروع') + '</label><select id="wp-cyc" style="margin-top:4px" onchange="populateDirectPayDues()">';
 Object.keys(DB.cycles).forEach(function(ck) { h += '<option value="' + esc(ck) + '"' + (ck===SELECTED_MONTH?' selected':'') + '>' + esc(dispCycleName(ck)) + '</option>'; });
 h += '</select></div></div>';

 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Payment Method', 'وسيلة الدفع للمدير') + '</label><select id="wp-channel" style="margin-top:4px">'
 + '<option value="Cash to Manager">💵 Cash to Manager · كاش للمدير</option>'
 + '<option value="Whish Money">🟣 Whish Money · ويش موني</option>'
 + '<option value="OMT Pay">🟡 OMT Pay · أو أم تي</option>'
 + '<option value="Bank Transfer">🏦 Bank Transfer · تحويل بنكي</option></select></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Date', 'التاريخ') + '</label><input type="date" id="wp-date" value="' + todayIso() + '" style="margin-top:4px"></div>';
 h += '</div>';

 h += '<div class="amt-cur-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Amount Received', 'المبلغ المستلم') + '</label><input type="number" id="wp-amt" style="margin-top:4px"></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Currency', 'العملة') + '</label><select id="wp-cur" style="margin-top:4px"><option value="USD">USD ($)</option><option value="LBP">LBP (ل.ل.)</option></select></div>';
 h += '</div>';

 h += '<div style="margin-bottom:12px"><label style="font-size:11.5px;color:var(--mut)">' + t('Reference / Note (Optional)', 'رقم الإشعار أو ملاحظة') + '</label><input type="text" id="wp-ref" placeholder="e.g. Paid cash at door / WH-9821" style="margin-top:4px"></div>';
 h += '<div id="wp-due-info" style="padding:10px 12px;background:var(--soft);color:var(--acc);font-weight:700;border-radius:12px;font-size:12px;margin-bottom:14px"></div>';

 h += '<button style="width:100%;padding:13px;background:var(--purp);color:#fff" onclick="saveDirectPayModal()">✓ ' + t('Confirm Payment & Settle Unit', 'تأكيد الدفعة وتسديد الشقة') + '</button>';
 document.getElementById('direct-pay-content').innerHTML = h;
 populateDirectPayDues();
 openModal('direct-pay-modal');
}

function populateDirectPayDues() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var cyc = DB.cycles[cKey];
 var bldCols = getCycleCols(cKey, true);
 var rate = Number(DB.settings.rate) || 89500;
 var dueEqUsd = 0;
 bldCols.forEach(function(c) {
 var v = c.valFor(aptId);
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][aptId]);
 if (!pd) dueEqUsd += (c.cur === 'LBP' ? (v / rate) : v);
 });
 document.getElementById('wp-amt').value = Math.round(dueEqUsd) || 50;
 document.getElementById('wp-due-info').innerHTML = t(
 'Unpaid Building Dues in <b>' + cKey + '</b> for this apartment: <b>$' + Math.round(dueEqUsd) + ' USD</b>',
 'مستحقات البناية غير المدفوعة في <b>' + dispCycleName(cKey) + '</b> لهذه الشقة: <b>$' + Math.round(dueEqUsd) + '</b>'
 );
}

function saveDirectPayModal() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var channel = document.getElementById('wp-channel').value;
 var dt = document.getElementById('wp-date').value || todayIso();
 var amt = Number(document.getElementById('wp-amt').value) || 0;
 var cur = document.getElementById('wp-cur').value;
 var ref = document.getElementById('wp-ref').value.trim() || 'MGR-DIRECT';
 var apt = DB.apartments.filter(function(a){return a.id===aptId;})[0];

 var cyc = DB.cycles[cKey];
 cyc.paid = cyc.paid || {};
 cyc.mgrPayChannel = cyc.mgrPayChannel || {};
 cyc.mgrPayChannel[aptId] = channel;

 getCycleCols(cKey, true).forEach(function(c) {
 if (c.valFor(aptId) > 0) {
 cyc.paid[c.id] = cyc.paid[c.id] || {};
 cyc.paid[c.id][aptId] = 2;
 if (c.linkedProject && DB.cycles[c.linkedProject]) {
 var pCyc = DB.cycles[c.linkedProject];
 var tCol = c.linkedColId || 'sp_m1';
 pCyc.paid[tCol] = pCyc.paid[tCol] || {};
 pCyc.paid[tCol][aptId] = 2;
 }
 }
 });

 DB.ledger.unshift({
 id: 'l_' + Date.now(),
 desc: apt.en + ' (' + apt.code + ') · ' + cKey,
 sub: channel,
 channel: channel,
 amt: amt, cur: cur, type: 'in', at: dt, ref: ref
 });

 saveDB(); closeModal('direct-pay-modal');
 showToast(t('Recorded via ' + channel + ' (Natour cash untouched)', 'تم التسجيل عبر ' + channel + ' (دون التأثير على كاش الناطور)'));
 render();
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function showToast(msg) {
 var el = document.getElementById('toast');
 document.getElementById('toast-msg').textContent = msg;
 el.classList.add('pop');
 setTimeout(function() { el.classList.remove('pop'); }, 2800);
}
function setRole(r) {
 ROLE = r;
 document.getElementById('sim-mgr').className = r === 'mgr' ? 'on' : '';
 document.getElementById('sim-col').className = r === 'col' ? 'on' : '';
 render();
}
function setTab(tName) {
 TAB = tName;
 document.querySelectorAll('#mgr-dock button.nav-tab').forEach(function(b) {
 b.className = 'nav-tab' + (b.getAttribute('data-tab') === tName ? ' on' : '');
 });
 render();
 window.scrollTo(0, 0);
}
function toggleLang() { LANG = LANG === 'ar' ? 'en' : 'ar'; render(); }

render();
</script>

 cyc.dues.forEach(function(d, idx) {

 });

 if (activeCatObj) {

 }

 var shownCount = 0;
 DB.expenses.forEach(function(e, idx) {
 if (SELECTED_EXP_CAT && e.cat !== SELECTED_EXP_CAT) return;
 shownCount++;
 var c = EXP_CATS[e.cat] || EXP_CATS.repair;
 var payerBadge = e.payer === 'natour_pending'
 ? '<span class="badge-pay" style="background:var(--wbg);color:var(--warn)">⏳ ' + t('Sent to Natour', 'يدفعها الناطور') + '</span>'
 : (e.payer === 'natour_paid'
 ? '<span class="badge-pay cash">👷‍♂️ ' + t('Paid by Natour', 'دفعها الناطور') + '</span>'
 : '<span class="badge-pay mgr">👨‍💼 ' + t('Manager', 'المدير') + '</span>');

 DB.cycles[targetCycle].services.push({

 if (!en && !ar) { alert(t('Please enter task name', 'الرجاء إدخال اسم المهمة')); return; }
 DB.reminders.push({ id: 'rm_' + Date.now(), en: en || ar, ar: ar || en, date: dt, freq: fq, assignNatour: assignNatour });
 saveDB(); closeModal('rem-modal');
 showToast(assignNatour ? t('Added to Natour checklist!', 'تمت إضافتها لقائمة مهام الناطور!') : t('Building reminder saved!', 'تم حفظ تذكير البناية!'));
 render();
}
function completeReminder(idx) {
 var rm = DB.reminders[idx];
 if (!rm) return;
 DB.completedTasks = DB.completedTasks || [];
 DB.completedTasks.unshift({
 id: 'ct_' + Date.now(), en: rm.en, ar: rm.ar || rm.en, completedAt: todayIso(),
 by: ROLE === 'col' ? ('👷‍♂️ ' + DB.settings.collectorEn) : '👨‍💼 Manager'
 });
 showToast(t('Marked Done!', 'تم الإنجاز!'));
 DB.reminders.splice(idx, 1);
 saveDB(); render();
}

function openSettingsModal() {
 var h = '<div class="card-h"><h3>⚙️ ' + t('Building & Safe Settings', 'إعدادات البناية والصندوق') + '</h3><button class="btn-del" onclick="closeModal(\'settings-modal\')">✕</button></div>';
 h += '<div class="row-div"><label style="font-size:12px;color:var(--mut)">' + t('Building Name (EN / AR)', 'اسم البناية (EN / AR)') + '</label><div class="two-col-grid" style="margin-top:4px"><input type="text" value="' + esc(DB.settings.bldEn) + '" onchange="DB.settings.bldEn=this.value;saveDB();render()"><input type="text" dir="rtl" value="' + esc(DB.settings.bldAr) + '" onchange="DB.settings.bldAr=this.value;saveDB();render()"></div></div>';
 h += '<div class="row-div"><label style="font-size:12px;color:var(--mut)">' + t('Safe Currency Mode', 'عملة صندوق البناية') + '</label><select style="margin-top:4px" onchange="DB.settings.treasuryMode=this.value;saveDB();render()"><option value="single"' + (DB.settings.treasuryMode==='single'?' selected':'') + '>💵 USD Only ($)</option><option value="split"' + (DB.settings.treasuryMode==='split'?' selected':'') + '>🇱🇧 Both USD ($) & LBP (ل.ل.)</option></select></div>';
 h += '<div class="row-div"><label style="font-size:12px;color:var(--mut)">' + t('Exchange Rate (LBP per $1 USD)', 'سعر الصرف (ل.ل. لكل 1 دولار)') + '</label><input type="number" dir="ltr" style="margin-top:4px" value="' + (DB.settings.rate || 89500) + '" onchange="DB.settings.rate=Number(this.value)||89500;saveDB();render()"></div>';
 h += '<div class="row-div"><button style="width:100%;padding:12px;background:var(--soft);color:var(--acc)" onclick="closeModal(\'settings-modal\');openOnboarding(1)">✨ ' + t('Launch Guided Setup Wizard', 'فتح دليل الإعداد خطوة بخطوة') + '</button></div>';
 document.getElementById('settings-content').innerHTML = h;
 openModal('settings-modal');
}

render();
</script>
</body>
</html>
