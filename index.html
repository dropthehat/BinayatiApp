<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bina2itna · بنايتنا — Smart Building Treasury & Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f6fa; --card: #ffffff; --ink: #0b1526; --mut: #62748e;
  --line: #e2e8f0; --soft: #edf4fe; --acc: #0b6cf0; --aq: #0e8678;
  --ok: #15803d; --okbg: #dcfce7; --warn: #b45309; --wbg: #fef3c7;
  --bad: #b91c1c; --errbg: #fee2e2; --zebra: #f8fafc;
  --grad: linear-gradient(135deg, #ff7a00 0%, #ff5400 100%);
}
:root[data-theme="dark"] {
  --bg: #090f19; --card: #111a28; --ink: #f1f5f9; --mut: #8b9db5;
  --line: #1e2c40; --soft: #172437; --acc: #3b82f6; --aq: #14b8a6;
  --ok: #22c55e; --okbg: #052e16; --warn: #f59e0b; --wbg: #451a03;
  --bad: #ef4444; --errbg: #450a0a; --zebra: #141f30;
  --grad: linear-gradient(135deg, #c2410c 0%, #9a3412 100%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14.5px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; padding-bottom: 95px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 12px; font-weight: 700; }

/* Simulator Control Strip */
.sim-strip {
  background: #090e17; color: #fff; padding: 7px 14px; font-size: 12.5px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1a2638;
}
.sim-pills { display: flex; background: #162030; border-radius: 999px; padding: 2px; }
.sim-pills button { background: transparent; color: #94a3b8; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; }
.sim-pills button.on { background: var(--acc); color: #fff; }
.sim-meta { display: flex; gap: 5px; }
.sim-meta button { background: #162030; color: #cbd5e1; border-radius: 7px; padding: 4px 8px; font-size: 11.5px; }

.shell { max-width: 540px; margin: 0 auto; }

/* Sticky Header */
header.app-bar {
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px 16px 0; position: sticky; top: 38px; z-index: 40;
}
.brand-label {
  display: flex; align-items: center; gap: 5px; font-size: 10.5px;
  font-weight: 800; letter-spacing: .06em; color: var(--acc); text-transform: uppercase;
}
.bar-main { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-bottom: 10px; }
.bar-main h1 { margin: 0; font-size: 19px; font-weight: 800; }
.cycle-badge {
  background: var(--soft); color: var(--acc); padding: 5px 12px;
  border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line);
}

/* Tab Navigation */
nav.tab-row {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line);
}
nav.tab-row::-webkit-scrollbar { display: none; }
nav.tab-row button {
  flex: 1 0 auto; background: transparent; color: var(--mut); border-radius: 0;
  padding: 10px 10px; border-bottom: 2.5px solid transparent; font-size: 13px; font-weight: 700;
}
nav.tab-row button.on { color: var(--acc); border-bottom-color: var(--acc); }

/* Card System */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; padding: 18px; margin: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
.subtext { color: var(--mut); font-size: 12.5px; margin: 0 0 14px; }

/* DIB-Style Treasury Card */
.treasury-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 22px;
  padding: 20px; margin: 12px 14px; position: relative; overflow: hidden;
  box-shadow: 0 4px 20px -2px rgba(11, 108, 240, 0.08);
}
.treasury-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--acc);
}
.t-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.t-title { font-size: 14px; font-weight: 800; color: var(--mut); display: flex; align-items: center; gap: 6px; }

/* Currency Toggle Pill */
.cur-toggle {
  display: inline-flex; align-items: center; background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px;
}
.cur-toggle button {
  background: transparent; color: var(--mut); border-radius: 999px;
  padding: 4px 10px; font-size: 11px; font-weight: 800; transition: all .15s;
}
.cur-toggle button.active { background: var(--acc); color: #fff; box-shadow: 0 1px 4px rgba(11,108,240,.3); }

.t-main-val { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 14px; line-height: 1.1; }
.t-main-val small { font-size: 14px; font-weight: 600; color: var(--mut); }

.drawer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.drawer {
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
}
.drawer span { display: block; font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; }
.drawer b { font-size: 18px; font-weight: 800; display: block; margin-top: 3px; }

/* Monthly Collection Tracker Card */
.month-picker-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cycle-select {
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 5px 10px; font-weight: 700; font-size: 13px;
}
.progress-rail { height: 9px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
.progress-fill { height: 100%; background: var(--ok); border-radius: 999px; transition: width .3s ease; }

/* Publish Status Bar */
.pub-banner {
  padding: 12px 14px; border-radius: 14px; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; margin-top: 14px;
}
.pub-banner.live { background: var(--okbg); color: var(--ok); border: 1px solid rgba(22,163,74,.2); }
.pub-banner.draft { background: var(--wbg); color: var(--warn); border: 1px solid rgba(217,119,6,.2); }
.pub-banner button { padding: 7px 14px; font-size: 12.5px; }

/* Collector Rows */
.filter-strip { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.pill-btn {
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 700;
}
.pill-btn.active { background: var(--acc); color: #fff; border-color: var(--acc); }

.apt-table { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin: 12px 14px; }
.apt-card { padding: 13px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.apt-card:last-child { border-bottom: 0; }
.apt-card.paid-all { background: var(--okbg); }
.apt-card.z { background: var(--zebra); }
.apt-row-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.apt-title { font-weight: 800; font-size: 15.5px; }
.apt-code {
  background: var(--bg); color: var(--mut); border: 1px solid var(--line);
  padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 800; margin-inline-start: 6px;
}
.apt-due { font-weight: 800; font-size: 14px; color: var(--bad); }
.apt-due.cleared { color: var(--ok); font-size: 16px; }

.wa-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px; background: var(--bg);
  border: 1px solid var(--line); font-size: 16px; text-decoration: none;
}

.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.chip {
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 11px;
  font-size: 12.5px; font-weight: 700; background: var(--card); color: var(--ink);
  display: inline-flex; align-items: center; gap: 5px;
}
.chip.ticked { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.chip.ticked::before { content: "✓"; font-weight: 900; }

/* Input Styles */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--mut); margin-bottom: 4px; }
.form-row { display: flex; gap: 8px; align-items: center; }
.row-divider { padding: 9px 0; border-top: 1px solid var(--line); }
.row-divider:first-of-type { border-top: 0; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; background: var(--bg); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 8px 11px; font-size: 13.5px; font-weight: 600;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); }
.btn-sm-del { background: var(--errbg); color: var(--bad); padding: 7px 11px; border-radius: 9px; }

/* Feed / Transactions */
.feed-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px;
}
.feed-row:first-child { border-top: 0; }
.feed-left { display: flex; align-items: center; gap: 8px; }
.feed-tag {
  width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 11px;
}
.feed-tag.in { background: var(--okbg); color: var(--ok); }
.feed-tag.out { background: var(--errbg); color: var(--bad); }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-box {
  background: var(--card); border-radius: 20px; width: 100%; max-width: 440px;
  padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
}
.modal-box h3 { margin: 0 0 8px; font-size: 17px; font-weight: 800; }

#toast {
  position: fixed; top: 48px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: #0b1526; color: #fff; padding: 10px 16px; border-radius: 14px;
  font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  z-index: 999; opacity: 0; pointer-events: none; transition: all .25s ease;
  border: 1px solid #1e2c40; box-shadow: 0 10px 25px rgba(0,0,0,.3); max-width: 90vw;
}
#toast.pop { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- SIMULATOR CONTROL BAR -->
<div class="sim-strip">

<div class="shell">

<!-- OUT-OF-POCKET EXPENSE MODAL -->
<div class="modal-overlay" id="exp-modal">

      <div style="flex:2">
        <label>Amount</label>
        <input type="number" id="m-exp-amt" placeholder="0">
      </div>
      <div style="flex:1">
        <label>Currency</label>
        <select id="m-exp-cur">
          <option value="USD">USD ($)</option>
          <option value="LBP">LBP (ل.ل.)</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-top:16px">
      <button style="flex:1;background:var(--line);padding:10px" onclick="closeModal('exp-modal')">Cancel</button>
      <button style="flex:2;background:var(--bad);color:#fff;padding:10px" onclick="saveDirectExpense()">Save Outflow</button>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   DATA ARCHITECTURE (Separated Treasury, Multi-Month History, Custom Units)
   ============================================================================ */
var STORAGE_KEY = 'bina2itna_v3_store';
var ROLE = 'mgr';
var TAB = 'dash';
var LANG = 'en';
var UNPAID_ONLY = false;
var TREASURY_REF_CUR = 'USD'; // 'USD' or 'LBP'
var SELECTED_MONTH = 'October 2026';

var DEFAULT_DATA = {

        { id: 'f_maint', en: 'Maintenance', ar: 'صيانة المبنى', amt: 20, cur: 'USD', exc: { 'U_1A': 15 } },

        { id: 's_gen', en: 'Private Generator', ar: 'المولد الخاص', cur: 'USD', map: { 'U_SS2R': 45, 'U_2A': 50 } }
      ],
      paid: {
        'f_maint': { 'U_SS2R': 1, 'U_2B': 1 },
        'f_natour': { 'U_SS2R': 1, 'U_2B': 1 },
        'd_water': { 'U_SS2R': 1 },
        's_net': { 'U_2B': 1 }
      }
    },
    'September 2026': {
      published: true,
      fixed: [
        { id: 'f_maint', en: 'Maintenance', ar: 'صيانة المبنى', amt: 20, cur: 'USD', exc: { 'U_1A': 15 } },
        { id: 'f_natour', en: 'Collector Fee', ar: 'أتعاب الناطور', amt: 15, cur: 'USD', exc: {} }
      ],
      dues: [
        { id: 'd_water', en: 'Water Bill Share', ar: 'فاتورة المياه المشتركة', amt: 1100000, cur: 'LBP', mode: 'each' }
      ],
      services: [
        { id: 's_net', en: 'Internet', ar: 'اشتراك الإنترنت', cur: 'USD', map: { 'U_SS2R': 20, 'U_2B': 25 } }
      ],
      paid: {
        'f_maint': { 'U_SS2R': 1, 'U_SS1R': 1, 'U_1A': 1, 'U_2A': 1, 'U_2B': 1 },
        'f_natour': { 'U_SS2R': 1, 'U_SS1R': 1, 'U_1A': 1, 'U_2A': 1, 'U_2B': 1 },
        'd_water': { 'U_SS2R': 1, 'U_SS1R': 1, 'U_1A': 1, 'U_2A': 1, 'U_2B': 1 },
        's_net': { 'U_SS2R': 1, 'U_2B': 1 }
      }
    }
  },
  // Flexible Apartment / Unit Directory
  apartments: [
    { id: 'U_SS2R', floor: 'SS2', letter: 'R', customCode: 'SS2R', en: 'Ahmad El-Khatib', ar: 'أحمد الخطيب', ph: '9613100200' },
    { id: 'U_SS1R', floor: 'SS1', letter: 'R', customCode: 'SS1R', en: 'Nadia Khoury', ar: 'ناديا خوري', ph: '9613200300' },
    { id: 'U_1A',   floor: '1',   letter: 'A', customCode: '1A',   en: 'Hadi Mansour', ar: 'هادي منصور', ph: '9613400500' },
    { id: 'U_2A',   floor: '2',   letter: 'A', customCode: '2A',   en: 'Karim Salameh', ar: 'كريم سلامة', ph: '9613700800' },
    { id: 'U_2B',   floor: '2',   letter: 'B', customCode: '2B',   en: 'Ziad Nader', ar: 'زياد نادر', ph: '9613900100' }
  ],
  // Persistent Cumulative Outflow Expenses
  expenses: [
    { id: 'exp_1', desc: 'Cleaning liquids, mop & sponges', amt: 14, cur: 'USD', date: 'Oct 4', by: 'Manager' },
    { id: 'exp_2', desc: 'Entrance LED bulbs replacement', amt: 480000, cur: 'LBP', date: 'Oct 8', by: 'Manager' },
    { id: 'exp_3', desc: 'Elevator monthly service maintenance', amt: 65, cur: 'USD', date: 'Oct 10', by: 'Contract' }
  ],

  activity: [

    { id: 'a_2', desc: 'Ziad Nader (2B)', sub: 'Maintenance + Fee + Net', amt: 60, cur: 'USD', type: 'in', at: 'Oct 6' },
    { id: 'a_3', desc: 'Cleaning liquids, mop & sponges', sub: 'Building Expense', amt: 14, cur: 'USD', type: 'out', at: 'Oct 4' },
    { id: 'a_4', desc: 'Ahmad El-Khatib (SS2R)', sub: 'Maintenance + Fee', amt: 35, cur: 'USD', type: 'in', at: 'Oct 3' }
  ],
  waTemplate: '💧 *{building}*\nفاتورة شهر: *{month}*\n\nتحية طيبة *{name}* ({unit})، 👋\n{items}\n\n👉 *المبلغ المطلوب تسليمه إلى {collector}:*\n*{due}*\n\nنشكر حسن تعاونكم معنا! 🙏✨'
};

var DB = loadDB();
function loadDB() {
  try { var r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveDB() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (e) {}
}

/* ============================================================================
   ACCOUNTING & COMPUTATION ENGINE
   ============================================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function fmt(n, cur) {
  var v = Math.round((Number(n) || 0) * 100) / 100;
  if (cur === 'LBP') return Math.round(v).toLocaleString('en-US') + (LANG === 'ar' ? ' ل.ل.' : ' LBP');
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function arMon(s) {
  var M = {january:'كانون الثاني',february:'شباط',march:'آذار',april:'نيسان',may:'أيار',june:'حزيران',july:'تموز',august:'آب',september:'أيلول',october:'تشرين الأول',november:'تشرين الثاني',december:'كانون الأول'};
  var x = /^\s*([A-Za-z]+)\s+(\d{4})/.exec(String(s || ''));
  return x && M[x[1].toLowerCase()] ? M[x[1].toLowerCase()] + ' ' + x[2] : String(s || '');
}

function getCycleCols(cycleKey) {
  var cyc = DB.cycles[cycleKey] || { fixed: [], dues: [], services: [] };
  var cols = [];
  (cyc.fixed || []).forEach(function(f) {
    cols.push({
      id: f.id, en: f.en, ar: f.ar, cur: f.cur,
      valFor: function(uId) { return (f.exc && f.exc[uId] != null) ? Number(f.exc[uId]) : Number(f.amt); }
    });
  });
  (cyc.dues || []).forEach(function(d) {
    cols.push({
      id: d.id, en: d.en, ar: d.ar, cur: d.cur,
      valFor: function() { return Number(d.amt); }
    });
  });
  (cyc.services || []).forEach(function(s) {
    cols.push({
      id: s.id, en: s.en, ar: s.ar, cur: s.cur,
      valFor: function(uId) { return Number((s.map || {})[uId]) || 0; }
    });
  });
  return cols;
}

function getCycleStats(cycleKey) {
  var cyc = DB.cycles[cycleKey];
  if (!cyc) return { usdGot: 0, usdSum: 0, lbpGot: 0, lbpSum: 0, settled: 0, total: DB.apartments.length, pct: 0 };
  var cols = getCycleCols(cycleKey);
  var usdGot = 0, usdSum = 0, lbpGot = 0, lbpSum = 0, settled = 0;
  var rate = Number(DB.settings.rate) || 89500;

  DB.apartments.forEach(function(apt) {
    var allPaid = true;
    cols.forEach(function(c) {
      var v = c.valFor(apt.id);
      if (v <= 0) return;
      var isTicked = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][apt.id]);
      if (!isTicked) allPaid = false;
      if (c.cur === 'LBP') { lbpSum += v; if (isTicked) lbpGot += v; }
      else { usdSum += v; if (isTicked) usdGot += v; }
    });
    if (allPaid && cols.length) settled++;
  });

  var eqGot = usdGot + (lbpGot / rate);
  var eqSum = usdSum + (lbpSum / rate);
  var pct = eqSum > 0 ? Math.min(100, Math.round((eqGot / eqSum) * 100)) : 0;
  return { usdGot: usdGot, usdSum: usdSum, lbpGot: lbpGot, lbpSum: lbpSum, settled: settled, total: DB.apartments.length, pct: pct };
}

function getTreasuryData() {
  var rate = Number(DB.settings.rate) || 89500;
  var totalUsdCollectedAllTime = 0;
  var totalLbpCollectedAllTime = 0;

  // Add all collected funds from all historical cycles
  Object.keys(DB.cycles).forEach(function(ck) {
    var s = getCycleStats(ck);
    totalUsdCollectedAllTime += s.usdGot;
    totalLbpCollectedAllTime += s.lbpGot;
  });

  // Deduct all outflow expenses
  var totalUsdExpenses = 0;
  var totalLbpExpenses = 0;
  DB.expenses.forEach(function(e) {
    if (e.cur === 'LBP') totalLbpExpenses += Number(e.amt) || 0;
    else totalUsdExpenses += Number(e.amt) || 0;
  });

  var netUsdDrawer = (Number(DB.settings.initialUsd) || 0) + totalUsdCollectedAllTime - totalUsdExpenses;
  var netLbpDrawer = (Number(DB.settings.initialLbp) || 0) + totalLbpCollectedAllTime - totalLbpExpenses;

  var unifiedRefUsd = netUsdDrawer + (netLbpDrawer / rate);
  var unifiedRefLbp = netLbpDrawer + (netUsdDrawer * rate);

  return {
    netUsd: netUsdDrawer,
    netLbp: netLbpDrawer,
    refTotal: TREASURY_REF_CUR === 'USD' ? unifiedRefUsd : unifiedRefLbp,
    refCur: TREASURY_REF_CUR
  };
}

function toast(msg) {

  setTimeout(function() { el.classList.remove('pop'); }, 3400);

function toggleCollectorTick(colId, aptId) {
  var cyc = DB.cycles[SELECTED_MONTH];
  if (!cyc) return;
  cyc.paid = cyc.paid || {};
  cyc.paid[colId] = cyc.paid[colId] || {};
  var willBePaid = !cyc.paid[colId][aptId];

  if (willBePaid) cyc.paid[colId][aptId] = 1;
  else delete cyc.paid[colId][aptId];

  var col = getCycleCols(SELECTED_MONTH).filter(function(c) { return c.id === colId; })[0];
  var apt = DB.apartments.filter(function(a) { return a.id === aptId; })[0];
  var amt = col.valFor(aptId);

  DB.activity.unshift({
    id: 'a_' + Date.now(),
    desc: apt.en + ' (' + (apt.customCode || apt.floor + apt.letter) + ')',
    sub: col.en,
    amt: amt,
    cur: col.cur,
    type: willBePaid ? 'in' : 'revert',
    at: 'Just now'
  });
  DB.activity = DB.activity.slice(0, 30);
  saveDB();
  toast((willBePaid ? 'Received: ' : 'Reverted: ') + apt.en + ' · ' + col.en);
  render();
}

function saveDirectExpense() {
  var desc = document.getElementById('m-exp-desc').value.trim();
  var amt = Number(document.getElementById('m-exp-amt').value) || 0;
  var cur = document.getElementById('m-exp-cur').value;
  if (!desc || amt <= 0) { alert('Please enter a description and amount.'); return; }

  DB.expenses.unshift({
    id: 'exp_' + Date.now(), desc: desc, amt: amt, cur: cur, date: 'Today', by: 'Manager'
  });
  DB.activity.unshift({
    id: 'act_' + Date.now(), desc: desc, sub: 'Manager Outflow', amt: amt, cur: cur, type: 'out', at: 'Just now'
  });
  saveDB();
  closeModal('exp-modal');

  render();
}

/* ============================================================================
   WHATSAPP MESSAGE GENERATOR
   ============================================================================ */
function makeWhatsAppUrl(apt) {
  var cyc = DB.cycles[SELECTED_MONTH];
  var cols = getCycleCols(SELECTED_MONTH);
  var lines = [];
  var dueUsd = 0, dueLbp = 0;

  cols.forEach(function(c) {
    var v = c.valFor(apt.id);
    if (v <= 0) return;
    var isTicked = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][apt.id]);
    var itemStr = '• ' + (LANG === 'ar' ? (c.ar || c.en) : c.en) + ': ' + fmt(v, c.cur) + (isTicked ? ' ✅' : '');
    lines.push(itemStr);
    if (!isTicked) {
      if (c.cur === 'LBP') dueLbp += v; else dueUsd += v;
    }
  });

  var dueParts = [];
  if (dueUsd > 0) dueParts.push(fmt(dueUsd, 'USD'));
  if (dueLbp > 0) dueParts.push(fmt(dueLbp, 'LBP'));
  var dueFormatted = dueParts.join(' + ') || (LANG === 'ar' ? 'مسدّد بالكامل 🎉' : 'All Settled 🎉');

  var msg = DB.waTemplate
    .replace('{building}', LANG === 'ar' ? DB.settings.bldAr : DB.settings.bldEn)
    .replace('{month}', LANG === 'ar' ? arMon(SELECTED_MONTH) : SELECTED_MONTH)
    .replace('{name}', LANG === 'ar' ? (apt.ar || apt.en) : apt.en)
    .replace('{unit}', apt.customCode || (apt.floor + apt.letter))
    .replace('{items}', lines.join('\n'))
    .replace('{due}', dueFormatted)
    .replace('{collector}', LANG === 'ar' ? DB.settings.collectorAr : DB.settings.collectorEn);

  return 'https://wa.me/' + String(apt.ph || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
}

/* ---- 5. EXPENSES & INITIAL SETTINGS ---- */
function renderExpensesView() {
  var h = '<div class="card"><h2><span>Initial Cash & Rate</span></h2>';
  h += '<div class="form-row form-group"><div><label>Initial USD Cash</label><input type="number" value="' + DB.settings.initialUsd + '" onchange="DB.settings.initialUsd=Number(this.value)||0;saveDB();render()"></div>';
  h += '<div><label>Initial LBP Cash</label><input type="number" value="' + DB.settings.initialLbp + '" onchange="DB.settings.initialLbp=Number(this.value)||0;saveDB();render()"></div></div>';
  h += '<div class="form-group"><label>Exchange Rate (LBP / $1)</label><input type="number" value="' + DB.settings.rate + '" onchange="DB.settings.rate=Number(this.value)||89500;saveDB();render()"></div>';
  h += '</div>';

  h += '<div class="card"><h2><span>Outflow Expenses History</span><button class="pill-btn" style="background:var(--errbg);color:var(--bad)" onclick="openModal(\'exp-modal\')">+ Add Expense</button></h2>';
  DB.expenses.forEach(function(e, i) {
    h += '<div class="row-divider" style="display:flex;justify-content:space-between;align-items:center">';
    h += '<div><b>' + esc(e.desc) + '</b><div style="font-size:11.5px;color:var(--mut)">' + esc(e.date) + ' · ' + esc(e.by) + '</div></div>';
    h += '<div dir="ltr" style="font-weight:800;color:var(--bad)">- ' + fmt(e.amt, e.cur) + '</div>';
    h += '</div>';
  });
  h += '</div>';
  document.getElementById('app-view').innerHTML = h;
}

/* ---- 6. WHATSAPP TEMPLATE ENGINE ---- */
function renderWhatsAppConfigView() {
  var h = '<div class="card"><h2><span>WhatsApp Message Customizer</span></h2>';
  h += '<p class="subtext">Use tags: {building}, {month}, {name}, {unit}, {items}, {due}, {collector}.</p>';
  h += '<textarea style="height:190px;font-family:monospace;font-size:13px" onchange="DB.waTemplate=this.value;saveDB()">' + esc(DB.waTemplate) + '</textarea>';
  h += '<button class="pill-btn" style="width:100%;margin-top:10px;background:var(--acc);color:#fff" onclick="toast(\'WhatsApp template saved!\')">Save Template</button>';
  h += '</div>';
  document.getElementById('app-view').innerHTML = h;
}

/* ---- 7. UNITS DIRECTORY (Flexible Floor + Letter / Custom Code) ---- */
function renderUnitsDirectoryView() {
  var h = '<div class="card"><h2><span>Building Units Directory</span></h2>';
  h += '<p class="subtext">Floor + Letter, Apartment number, or custom code (e.g. SS2R, 1A, 2B, Ground Left).</p>';
  DB.apartments.forEach(function(apt, idx) {
    h += '<div class="row-divider">';
    h += '<div class="form-row" style="margin-bottom:6px">';
    h += '<input type="text" style="width:90px;font-weight:800" placeholder="Code (2B)" value="' + esc(apt.customCode || apt.floor + apt.letter) + '" onchange="DB.apartments[' + idx + '].customCode=this.value;saveDB()">';
    h += '<input type="text" style="flex:2" placeholder="Name EN" value="' + esc(apt.en) + '" onchange="DB.apartments[' + idx + '].en=this.value;saveDB()">';
    h += '<button class="btn-sm-del" onclick="DB.apartments.splice(' + idx + ',1);saveDB();render()">✕</button>';
    h += '</div>';
    h += '<div class="form-row">';
    h += '<input type="text" dir="rtl" style="flex:2" placeholder="الاسم بالعربية" value="' + esc(apt.ar) + '" onchange="DB.apartments[' + idx + '].ar=this.value;saveDB()">';
    h += '<input type="text" style="flex:2" placeholder="WhatsApp (961...)" value="' + esc(apt.ph) + '" onchange="DB.apartments[' + idx + '].ph=this.value;saveDB()">';
    h += '</div>';
    h += '</div>';
  });
  h += '<button class="pill-btn" style="width:100%;margin-top:12px;background:var(--soft);color:var(--acc)" onclick="DB.apartments.push({id:\'U_\'+Date.now(),floor:\'1\',letter:\'A\',customCode:\'1A\',en:\'New Resident\',ar:\'ساكن جديد\',ph:\'961\'});saveDB();render()">+ Add Unit</button>';
  h += '</div>';
  document.getElementById('app-view').innerHTML = h;
}

/* ============================================================================
   NAVIGATION CONTROLS
   ============================================================================ */
function setRole(r) {
  ROLE = r;
  document.getElementById('btn-mgr').className = r === 'mgr' ? 'on' : '';
  document.getElementById('btn-col').className = r === 'col' ? 'on' : '';
  render();
}
function setTab(t) {
  TAB = t;
  document.querySelectorAll('#mgr-nav button').forEach(function(b) {
    b.className = b.getAttribute('data-tab') === t ? 'on' : '';
  });
  render();
}
function toggleLang() {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  render();
}
function toggleTheme() {
  var r = document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

render();
</script>
</body>
</html>
