<style>
:root {
 --bg: #f2f5f9; --card: #ffffff; --card2: #f8fafc; --ink: #0f172a; --mut: #64748b;
 --line: #e2e8f0; --soft: #e0edff; --acc: #0b6cf0; --ok: #10b981; --okbg: rgba(16,185,129,.12);
 --warn: #f59e0b; --wbg: rgba(245,158,11,.12); --bad: #ef4444; --errbg: rgba(239,68,68,.12);
 --whish: #8b5cf6; --whishbg: rgba(139,92,246,.14);
 --dock: rgba(255,255,255,0.92); --shadow: 0 8px 30px rgba(15,23,42,0.06);
}
:root[data-theme="dark"] {
 --bg: #070b12; --card: #111823; --card2: #17202f; --ink: #f8fafc; --mut: #8b9bb4;
 --line: #1e293b; --soft: #172554; --acc: #38bdf8; --ok: #34d399; --okbg: rgba(52,211,153,.14);
 --warn: #fbbf24; --wbg: rgba(251,191,36,.14); --bad: #f87171; --errbg: rgba(248,113,113,.15);
 --whish: #a78bfa; --whishbg: rgba(167,139,250,.18);
 --dock: rgba(17,24,35,0.90); --shadow: 0 12px 35px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
 margin: 0; background: var(--bg); color: var(--ink);
 font: 14.5px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
 font-variant-numeric: tabular-nums; padding-bottom: 115px; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 12px; font-weight: 700; transition: all .15s ease; }
button:active { transform: scale(0.97); }

/* Simulator Header */
.sim-strip {
 background: #030712; color: #f8fafc; padding: 6px 12px; font-size: 12px;
 display: flex; align-items: center; justify-content: space-between; gap: 6px;
 position: relative; z-index: 100; border-bottom: 1px solid #1e293b;
}
.sim-pills { display: flex; background: #111827; border-radius: 999px; padding: 2px; }
.sim-pills button { background: transparent; color: #9ca3af; border-radius: 999px; padding: 4px 10px; font-size: 11px; }
.sim-pills button.on { background: #2563eb; color: #fff; }
.sim-right { display: flex; gap: 5px; }
.sim-right button { background: #1f2937; color: #e5e7eb; border-radius: 8px; padding: 4px 8px; font-size: 11px; }

.shell { max-width: 480px; margin: 0 auto; padding-top: 6px; }

/* In-Flow Clean Navigation Header (No Overlapping Sticky Clashes) */
header.top-bar {
 padding: 8px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.header-lead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.btn-back-lead {
 width: 34px; height: 34px; border-radius: 11px; background: var(--card); border: 1px solid var(--line);
 display: grid; place-items: center; font-size: 19px; line-height: 1; color: var(--acc); flex: none;
}
.top-brand { font-size: 11px; font-weight: 800; color: var(--acc); letter-spacing: .06em; text-transform: uppercase; }
.top-title { font-size: 21px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role-badge {
 background: var(--card); border: 1px solid var(--line); color: var(--mut);
 padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: none;
}

/* Cards */
.card {
 background: var(--card); border: 1px solid var(--line); border-radius: 24px;
 padding: 18px; margin: 10px 16px; box-shadow: var(--shadow); position: relative;
}
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 800; }
.subtext { color: var(--mut); font-size: 12.5px; margin: 0 0 12px; line-height: 1.45; }

/* 2×4 Rounded Icon Action Hub (Inspired by User Reference) */
.hub-grid {
 display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 16px;
}
.hub-tile {
 background: var(--card); border: 1px solid var(--line); border-radius: 20px;
 padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center;
 text-align: center; gap: 5px; cursor: pointer; box-shadow: var(--shadow);
 transition: transform .15s ease, border-color .15s ease;
}
.hub-tile:active { transform: scale(0.95); }
.hub-icon {
 width: 44px; height: 44px; border-radius: 14px; background: var(--card2);
 border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px;
}
.hub-label { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.2; }

/* Currency Switcher & Balances */
.cur-switch {
 display: inline-flex; align-items: center; background: var(--card2);
 border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px;
}
.cur-switch button {
 padding: 4px 11px; border-radius: 999px; background: transparent;
 color: var(--mut); font-size: 11.5px; font-weight: 800;
}
.cur-switch button.on { background: var(--acc); color: #070b12; }

.big-balance { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 14px; }
.big-balance small { font-size: 13px; color: var(--mut); font-weight: 600; }

.drawer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drawer-box {
 background: var(--card2); border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px; min-width: 0;
}
.drawer-box span { display: block; font-size: 10.5px; font-weight: 700; color: var(--mut); text-transform: uppercase; }
.drawer-box b { display: block; font-size: 16px; font-weight: 800; margin-top: 3px; }
.drawer-box small { display: block; font-size: 11.5px; color: var(--mut); font-weight: 600; margin-top: 2px; }

/* Cycle & Month Switcher Strip */
.month-pills {
 display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 16px 8px;
}
.month-pills::-webkit-scrollbar { display: none; }
.mpill {
 background: var(--card); border: 1px solid var(--line); color: var(--mut);
 padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
 display: inline-flex; align-items: center; gap: 5px;
}
.mpill.on { background: var(--acc); color: #070b12; border-color: var(--acc); }
.mpill.proj { border-color: rgba(245,158,11,.45); }
.mpill.proj.on { background: var(--warn); color: #070b12; border-color: var(--warn); }
.mpill.add-btn { border-style: dashed; color: var(--acc); }

/* Horizontal Progress Bar */
.prog-wrap { margin: 8px 0 14px; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; flex-wrap: wrap; }
.prog-top b { font-size: 19px; font-weight: 800; }
.prog-top span { font-size: 12.5px; font-weight: 700; color: var(--acc); }
.prog-track {
 height: 12px; width: 100%; background: var(--card2); border: 1px solid var(--line);
 border-radius: 999px; overflow: hidden; padding: 2px;
}
.prog-fill {
 height: 100%; border-radius: 999px;
 background: linear-gradient(90deg, var(--acc), var(--ok));
 transition: width .35s cubic-bezier(.4,0,.2,1);
}
.prog-fill.proj { background: linear-gradient(90deg, var(--warn), var(--ok)); }

/* Corner Action Menu */
.corner-wrap { position: relative; flex: none; }
.dots-btn {
 width: 34px; height: 34px; border-radius: 10px; background: var(--card2);
 border: 1px solid var(--line); color: var(--ink); font-size: 18px;
 display: grid; place-items: center; line-height: 1;
}
.corner-menu {
 position: absolute; top: 40px; inset-inline-end: 0; min-width: 195px;
 background: var(--card); border: 1px solid var(--line); border-radius: 16px;
 padding: 6px; box-shadow: 0 14px 35px rgba(0,0,0,0.45); z-index: 120;
}
.corner-menu button {
 width: 100%; background: transparent; color: var(--ink); padding: 9px 12px;
 border-radius: 10px; font-size: 12.5px; font-weight: 700; text-align: start;
 display: flex; align-items: center; gap: 8px;
}
.corner-menu button:hover { background: var(--card2); }
.corner-menu button.danger { color: var(--bad); }

/* Ledger & List Rows */
.list-row {
 display: flex; align-items: center; justify-content: space-between; gap: 10px;
 padding: 11px 0; border-top: 1px solid var(--line);
}
.list-row:first-of-type { border-top: 0; }
.list-row.clickable { cursor: pointer; border-radius: 12px; padding-inline: 6px; margin-inline: -6px; }
.list-row.clickable:hover { background: var(--card2); }
.list-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.single-line-name {
 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
 font-weight: 700; font-size: 14px; display: block;
}
.status-stack {
 display: flex; flex-direction: column; align-items: flex-end; text-align: end;
 flex: none; line-height: 1.3;
}
.status-stack .st-paid { font-size: 12.5px; font-weight: 800; color: var(--ok); }
.status-stack .st-owed { font-size: 12px; font-weight: 800; color: var(--bad); margin-top: 2px; }
.status-stack .st-zero { font-size: 11px; font-weight: 600; color: var(--mut); }

/* Sub-Row Currency Breakdown Accordion */
.split-drawer {
 background: var(--card2); border: 1px dashed var(--line); border-radius: 12px;
 padding: 7px 10px; margin-top: 6px; font-size: 11.5px; font-weight: 700;
 display: flex; justify-content: space-between; align-items: center;
}

.badge-code {
 background: var(--card2); border: 1px solid var(--line); color: var(--acc);
 font-weight: 800; font-size: 12px; padding: 5px 9px; border-radius: 10px; flex: none;
}
.badge-pay {
 font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; text-transform: uppercase;
}
.badge-pay.whish { background: var(--whishbg); color: var(--whish); }
.badge-pay.cash { background: var(--okbg); color: var(--ok); }

.cat-ico {
 width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
 font-size: 18px; flex: none;
}
.btn-edit {
 background: var(--card2); border: 1px solid var(--line); color: var(--ink);
 padding: 6px 11px; border-radius: 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; flex: none;
}

/* WhatsApp Live Bubble */
.wa-preview-box {
 background: #0b141a; border: 1px solid #1f2c34; border-radius: 18px; padding: 12px; margin-top: 10px;
 max-width: 100%; overflow: hidden;
}
.wa-bubble {
 background: #005c4b; color: #e9edef; border-radius: 14px 14px 4px 14px;
 padding: 12px 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap;
 overflow-wrap: break-word; word-break: break-word; max-width: 100%;
}
.wa-bubble strong { font-weight: 800; color: #ffffff; }

/* Bottom Dock */
nav.bottom-dock {
 position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
 width: calc(100% - 24px); max-width: 440px; background: var(--dock);
 backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
 border: 1px solid var(--line); border-radius: 999px; padding: 5px;
 display: flex; justify-content: space-around; align-items: center;
 z-index: 90; box-shadow: 0 12px 32px rgba(0,0,0,0.35);
}
nav.bottom-dock button {
 flex: 1; background: transparent; color: var(--mut); border-radius: 999px;
 padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
 font-size: 10.5px; font-weight: 700;
}
nav.bottom-dock button .ico { font-size: 17px; line-height: 1.1; }
nav.bottom-dock button.on { background: rgba(56, 189, 248, 0.15); color: var(--acc); }

.fab {
 position: fixed; bottom: 82px; right: max(20px, calc(50% - 220px));
 width: 50px; height: 50px; border-radius: 50%; background: var(--acc);
 color: #070b12; font-size: 25px; font-weight: 800; display: grid; place-items: center;
 box-shadow: 0 8px 25px rgba(56,189,248,0.4); z-index: 85;
}

/* Modals */
.modal-bg {
 position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(5px);
 z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-card {
 background: var(--card); border: 1px solid var(--line); border-radius: 26px;
 width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; padding: 22px;
 box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.modal-card h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
.form-row { display: flex; gap: 8px; align-items: center; }
.btn-del { background: var(--errbg); color: var(--bad); padding: 7px 11px; border-radius: 10px; flex: none; }

#toast {
 position: fixed; top: 46px; left: 50%; transform: translateX(-50%) translateY(-20px);
 background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 999px;
 font-size: 13px; font-weight: 700; z-index: 300; opacity: 0; pointer-events: none;
 transition: all .25s ease; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,.4);
}
#toast.pop { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

/* ============================================================================
 2. HELPERS & TOTALS
 ============================================================================ */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(n, cur, forceLang) {
 var lg = forceLang || LANG;
 var v = Math.round((Number(n) || 0) * 100) / 100;
 if (cur === 'LBP') return Math.round(v).toLocaleString('en-US') + (lg === 'ar' ? ' ل.ل.' : ' LBP');
 return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function dispCycleName(cKey) {
 var cyc = DB.cycles[cKey];
 if (LANG === 'ar' && cyc && cyc.arLabel) return cyc.arLabel;
 return cKey;
}

function getCycleCols(cKey) {
 var cyc = DB.cycles[cKey] || { fixed: [], dues: [], services: [] };
 var cols = [];
 (cyc.fixed || []).forEach(function(f) { cols.push({ id: f.id, en: f.en, ar: f.ar, cur: f.cur, valFor: function(uId) { return (f.exc && f.exc[uId] != null) ? Number(f.exc[uId]) : Number(f.amt); } }); });
 (cyc.dues || []).forEach(function(d) { cols.push({ id: d.id, en: d.en, ar: d.ar, cur: d.cur, valFor: function() { return Number(d.amt); } }); });
 (cyc.services || []).forEach(function(s) { cols.push({ id: s.id, en: s.en, ar: s.ar, cur: s.cur, valFor: function(uId) { return Number((s.map || {})[uId]) || 0; } }); });
 return cols;
}

function getCycleStats(cKey) {
 var cyc = DB.cycles[cKey];
 if (!cyc) return { usdGot:0, usdSum:0, lbpGot:0, lbpSum:0, eqGotUsd:0, eqSumUsd:0, expUsd:0, netCycleUsd:0, settled:0, total:DB.apartments.length, pct:0 };
 var cols = getCycleCols(cKey), usdGot=0, usdSum=0, lbpGot=0, lbpSum=0, settled=0, active=0;
 var rate = Number(DB.settings.rate) || 89500;

 DB.apartments.forEach(function(a) {
 var allPd = true, has = false;
 cols.forEach(function(c) {
 var v = c.valFor(a.id); if (v <= 0) return;
 has = true;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][a.id]);
 if (!pd) allPd = false;
 if (c.cur === 'LBP') { lbpSum += v; if (pd) lbpGot += v; }
 else { usdSum += v; if (pd) usdGot += v; }
 });
 if (has) { active++; if (allPd) settled++; }
 });

 var expUsd = 0;
 DB.expenses.forEach(function(e) {
 if (e.month === cKey) expUsd += (e.cur === 'LBP' ? (Number(e.amt) / rate) : Number(e.amt));
 });

 var eqGotUsd = usdGot + (lbpGot / rate);
 var eqSumUsd = cyc.isProject && cyc.targetBudget ? Number(cyc.targetBudget) : (usdSum + (lbpSum / rate));
 var netCycleUsd = eqGotUsd - expUsd;
 var pct = eqSumUsd > 0 ? Math.min(100, Math.round((eqGotUsd / eqSumUsd) * 100)) : 0;
 return { usdGot:usdGot, usdSum:usdSum, lbpGot:lbpGot, lbpSum:lbpSum, eqGotUsd:eqGotUsd, eqSumUsd:eqSumUsd, expUsd:expUsd, netCycleUsd:netCycleUsd, settled:settled, total:active || DB.apartments.length, pct:pct };
}

function getTreasury() {
 var rate = Number(DB.settings.rate) || 89500;
 var inUsd = 0, inLbp = 0, outUsd = 0, outLbp = 0;
 Object.keys(DB.cycles).forEach(function(ck) {
 var st = getCycleStats(ck);
 inUsd += st.usdGot; inLbp += st.lbpGot;
 });
 DB.expenses.forEach(function(e) {
 if (e.cur === 'LBP') outLbp += Number(e.amt) || 0;
 else outUsd += Number(e.amt) || 0;
 });
 var netUsd = (Number(DB.settings.initialUsd) || 0) + inUsd - outUsd;
 var netLbp = (Number(DB.settings.initialLbp) || 0) + inLbp - outLbp;
 var refVal = REF_CUR === 'USD' ? (netUsd + netLbp / rate) : (netLbp + netUsd * rate);
 return { netUsd: netUsd, netLbp: netLbp, refVal: refVal };
}

 var h = '<div class="card"><div class="card-h"><h2>👷‍♂️ ' + t('Natour Access & Setup', 'دخول الناطور والرسائل') + '</h2>';
 h += '<button class="btn-edit" style="background:var(--acc);color:#070b12;border:0" onclick="setRole(\'col\')">' + t('Preview Natour App →', 'معاينة شاشة الناطور ←') + '</button></div>';
 h += '<div class="drawer-row" style="margin-top:10px">';
 h += '<div class="drawer-box"><span>' + t('Natour Phone', 'هاتف الناطور') + '</span><b dir="ltr">+' + esc(DB.settings.collectorPhone) + '</b></div>';
 h += '<div class="drawer-box"><span>' + t('6-Digit PIN', 'رمز الأمان') + '</span><b dir="ltr" style="color:var(--acc)">' + esc(DB.settings.collectorPin) + '</b></div>';
 h += '</div></div>';
 document.getElementById('app-body').innerHTML = h;
}

/* ---- SCREEN 6: UNITS DIRECTORY ---- */
function renderUnitsScreen() {
 var h = '<div class="card"><div class="card-h"><h2>🏢 ' + t('Apartments Directory', 'دليل الشقق') + ' (' + DB.apartments.length + ')</h2></div>';
 DB.apartments.forEach(function(a) {
 h += '<div class="list-row"><div class="list-left"><span class="badge-code">' + esc(a.code) + '</span>';
 h += '<div style="min-width:0"><b class="single-line-name">' + esc(LANG==='ar'?(a.ar||a.en):a.en) + '</b><div style="font-size:11.5px;color:var(--mut)">+' + esc(a.ph) + '</div></div></div></div>';
 });
 h += '</div>';
 document.getElementById('app-body').innerHTML = h;
}

/* ---- SCREEN 7: NATOUR COLLECTOR SCREEN ---- */
function renderCollectorScreen() {
 var ar = LANG === 'ar';
 var cyc = DB.cycles[SELECTED_MONTH];
 var h = '';

 var natourTasks = (DB.reminders || []).filter(function(r) { return r.assignNatour; });
 if (natourTasks.length) {
 h += '<div class="card" style="border-color:rgba(56,189,248,.45)"><div class="card-h"><h2>🛠️ ' + t('Tasks to Complete', 'المهام المطلوبة منك') + ' (' + natourTasks.length + ')</h2></div>';
 natourTasks.forEach(function(rm, idx) {
 h += '<div class="list-row"><div class="list-left"><span style="font-size:17px">📋</span><div style="min-width:0"><b class="single-line-name">' + esc(ar ? (rm.ar || rm.en) : rm.en) + '</b></div></div>';
 h += '<button class="btn-edit" style="background:var(--okbg);color:var(--ok);border-color:var(--ok)" onclick="completeReminder(' + idx + ')">✓ ' + t('Done', 'تم') + '</button></div>';
 });
 h += '</div>';
 }

 if (!cyc || !cyc.published) {
 h += '<div class="card" style="text-align:center;padding:40px"><h3>' + t('⏳ Cycle Not Published', '⏳ لم يتم نشر الدورة بعد') + '</h3></div>';
 document.getElementById('app-body').innerHTML = h;
 return;
 }

 var s = getCycleStats(SELECTED_MONTH);
 var cols = getCycleCols(SELECTED_MONTH);

 h += '<div class="card">';
 h += '<div class="card-h"><h2>' + esc(ar ? ('تحصيل ' + dispCycleName(SELECTED_MONTH)) : ('Collection · ' + SELECTED_MONTH)) + '</h2><span style="font-weight:700">' + s.settled + '/' + s.total + '</span></div>';
 h += '<div class="prog-wrap"><div class="prog-track"><div class="prog-fill" style="width:' + s.pct + '%"></div></div></div>';
 h += '<div class="drawer-row">';
 h += '<div class="drawer-box"><span>USD</span><b dir="ltr">' + fmt(s.usdGot, 'USD', ar?'ar':'en') + '</b></div>';
 h += '<div class="drawer-box"><span>LBP</span><b dir="ltr">' + fmt(s.lbpGot, 'LBP', ar?'ar':'en') + '</b></div>';
 h += '</div></div>';

 h += '<div class="card" style="padding:0;overflow:hidden">';
 DB.apartments.forEach(function(a) {
 var dueU = 0, dueL = 0;
 cols.forEach(function(c) {
 var v = c.valFor(a.id); if (v <= 0) return;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][a.id]);
 if (!pd) { if (c.cur === 'LBP') dueL += v; else dueU += v; }
 });
 var done = dueU === 0 && dueL === 0;

 h += '<div class="apt-card' + (done ? ' settled' : '') + '"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
 h += '<div style="display:flex;align-items:center;gap:6px"><span class="badge-code" style="padding:2px 7px;font-size:11px">' + esc(a.code) + '</span><b>' + esc(ar ? (a.ar || a.en) : a.en) + '</b></div>';
 h += '<b dir="ltr" style="color:' + (done ? 'var(--ok)' : 'var(--bad)') + '">' + (done ? '✓ Paid' : ('Due $' + dueU)) + '</b></div>';

 h += '<div class="chip-grid">';
 cols.forEach(function(c) {
 var v = c.valFor(a.id); if (v <= 0) return;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][a.id]);
 h += '<button class="chip' + (pd ? ' ticked' : '') + '" onclick="toggleTick(\'' + c.id + '\',\'' + a.id + '\')">' + esc(ar ? (c.ar || c.en) : c.en) + ' ' + fmt(v, c.cur, 'en') + '</button>';
 });
 h += '</div></div>';
 });
 h += '</div>';

 document.getElementById('app-body').innerHTML = h;
}

/* ============================================================================
 4. WHISH / DIRECT PAYMENT MODAL ENGINE
 ============================================================================ */
function openWhishPaymentModal() {
 var h = '<div class="card-h"><h3 style="color:var(--whish)">🟣 ' + t('Register Direct Payment', 'تسجيل دفعة مباشرة (Whish / OMT / بنك)') + '</h3><button class="btn-del" onclick="closeModal(\'whish-modal\')">✕</button></div>';
 h += '<p class="subtext">' + t('Record payments received directly by the manager so the Natour knows not to collect cash.', 'سجل الدفعات المستلمة مباشرة من الساكن حتى لا يطالبه الناطور كاش.') + '</p>';

 h += '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--mut)">' + t('Apartment', 'الشقة') + '</label>';
 h += '<select id="wp-apt" style="margin-top:4px" onchange="populateWhishDues()">';
 DB.apartments.forEach(function(a) { h += '<option value="' + a.id + '">' + esc(a.code) + ' · ' + esc(LANG==='ar'?(a.ar||a.en):a.en) + '</option>'; });
 h += '</select></div>';

 h += '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--mut)">' + t('Payment Channel', 'طريقة الدفع المستلمة') + '</label>';
 h += '<select id="wp-channel" style="margin-top:4px">';
 h += '<option value="Whish Money">🟣 Whish Money (ويش موني)</option>';
 h += '<option value="OMT Pay">🟡 OMT Pay / Cash (أو أم تي)</option>';
 h += '<option value="Direct Cash Handover">💵 Direct Cash to Manager (كاش للمدير)</option>';
 h += '<option value="Bank Transfer">🏦 Bank Transfer (تحويل بنكي)</option>';
 h += '</select></div>';

 h += '<div class="form-row" style="margin-bottom:10px">';
 h += '<div style="flex:2"><label style="font-size:12px;color:var(--mut)">' + t('Amount Received', 'المبلغ المستلم') + '</label><input type="number" id="wp-amt" value="80" style="margin-top:4px"></div>';
 h += '<div style="flex:1"><label style="font-size:12px;color:var(--mut)">' + t('Currency', 'العملة') + '</label><select id="wp-cur" style="margin-top:4px"><option value="USD">USD ($)</option><option value="LBP">LBP (ل.ل.)</option></select></div>';
 h += '</div>';

 h += '<div style="margin-bottom:14px"><label style="font-size:12px;color:var(--mut)">' + t('Transfer Reference / Receipt #', 'رقم الحوالة أو الإشعار (اختياري)') + '</label>';
 h += '<input type="text" id="wp-ref" placeholder="e.g. WH-994012" style="margin-top:4px"></div>';

 h += '<div style="padding:10px;background:var(--card2);border-radius:14px;margin-bottom:14px" id="wp-due-preview"></div>';

 h += '<button style="width:100%;padding:12px;background:var(--whish);color:#fff" onclick="saveWhishPayment()">' + t('Confirm Payment & Generate Receipt →', 'تأكيد الدفعة وإصدار الإيصال ←') + '</button>';

 document.getElementById('whish-content').innerHTML = h;
 populateWhishDues();
 openModal('whish-modal');
}

function populateWhishDues() {
 var aptId = document.getElementById('wp-apt').value;
 var cyc = DB.cycles[SELECTED_MONTH];
 var cols = getCycleCols(SELECTED_MONTH);
 var dueU = 0;
 cols.forEach(function(c) {
 var v = c.valFor(aptId);
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][aptId]);
 if (!pd && c.cur === 'USD') dueU += v;
 });
 document.getElementById('wp-due-preview').innerHTML = t(
 'Total USD dues outstanding for ' + SELECTED_MONTH + ': <b>$' + dueU + '</b>',
 'إجمالي المستحقات المتبقية لدورة ' + dispCycleName(SELECTED_MONTH) + ': <b>$' + dueU + '</b>'
 );
}

function saveWhishPayment() {
 var aptId = document.getElementById('wp-apt').value;
 var channel = document.getElementById('wp-channel').value;
 var amt = Number(document.getElementById('wp-amt').value) || 0;
 var cur = document.getElementById('wp-cur').value;
 var ref = document.getElementById('wp-ref').value.trim() || ('DIR-' + Math.floor(1000 + Math.random()*9000));
 var apt = DB.apartments.filter(function(a){return a.id===aptId;})[0];

 // Mark current month dues as paid
 var cyc = DB.cycles[SELECTED_MONTH];
 cyc.paid = cyc.paid || {};
 getCycleCols(SELECTED_MONTH).forEach(function(c) {
 if (c.valFor(aptId) > 0) {
 cyc.paid[c.id] = cyc.paid[c.id] || {};
 cyc.paid[c.id][aptId] = 1;
 }
 });

 // If linked project exists, mark it in the project cycle as well
 if (DB.cycles['Solar 6kW Install'] && DB.cycles['Solar 6kW Install'].paid) {
 DB.cycles['Solar 6kW Install'].paid['sp_m1'] = DB.cycles['Solar 6kW Install'].paid['sp_m1'] || {};
 DB.cycles['Solar 6kW Install'].paid['sp_m1'][aptId] = 1;
 }

 // Log to General Ledger permanently
 DB.ledger.unshift({
 id: 'l_' + Date.now(),
 desc: apt.en + ' (' + apt.code + ') · Dues Settled',
 channel: channel,
 amt: amt, cur: cur, type: 'in', at: 'Just now', ref: ref
 });

 saveDB();
 closeModal('whish-modal');
 showToast(t('Payment confirmed via ' + channel, 'تم تسجيل الدفعة عبر ' + channel));
 render();
}

/* ============================================================================
 5. REMINDERS & EXPENSES
 ============================================================================ */
function openReminderModal() {
 var h = '<div class="card-h"><h3>🔔 ' + t('Schedule Task & Maintenance', 'جدولة مهمة صيانة') + '</h3><button class="btn-del" onclick="closeModal(\'rem-modal\')">✕</button></div>';
 h += '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--mut)">' + t('Task (EN / AR)', 'اسم المهمة') + '</label>';
 h += '<div class="form-row" style="margin-top:4px"><input type="text" id="rm-en" placeholder="e.g. Check Roof Drains"><input type="text" dir="rtl" id="rm-ar" placeholder="فحص مصارف السطح"></div></div>';
 h += '<div class="form-row" style="margin-bottom:12px">';
 h += '<div style="flex:1"><label style="font-size:12px;color:var(--mut)">' + t('Due Date', 'الموعد') + '</label><input type="date" id="rm-date" value="2026-10-25" style="margin-top:4px"></div>';
 h += '<div style="flex:1"><label style="font-size:12px;color:var(--mut)">' + t('Show to Natour', 'ظهورها للناطور') + '</label><select id="rm-win" style="margin-top:4px"><option value="2">2 Days Before</option><option value="7">1 Week Before</option><option value="0">Immediately</option></select></div>';
 h += '</div>';
 h += '<button style="width:100%;padding:12px;background:var(--acc);color:#070b12" onclick="saveReminderModal()">' + t('Save Task', 'حفظ المهمة') + '</button>';
 document.getElementById('rem-content').innerHTML = h;
 openModal('rem-modal');
}

function saveReminderModal() {
 var en = document.getElementById('rm-en').value.trim();
 var ar = document.getElementById('rm-ar').value.trim() || en;
 var dt = document.getElementById('rm-date').value;
 if (!en) { alert('Enter task title'); return; }
 DB.reminders.push({ id: 'r_' + Date.now(), en: en, ar: ar, date: dt, freq: 'Monthly', assignNatour: true });
 saveDB(); closeModal('rem-modal'); showToast('Task scheduled'); render();
}

function completeReminder(idx) {
 var rm = DB.reminders[idx];
 if (!rm) return;
 DB.completedTasks.unshift({
 id: 'ct_' + Date.now(), en: rm.en, ar: rm.ar,
 completedAt: new Date().toLocaleDateString(),
 by: ROLE === 'col' ? ('👷‍♂️ ' + DB.settings.collectorEn) : '👨‍💼 Manager'
 });
 DB.reminders.splice(idx, 1);
 saveDB(); showToast(t('Task moved to archive', 'تم أرشفة المهمة')); render();
}

function openExpenseModal(idx) {
 var ex = idx >= 0 ? DB.expenses[idx] : null;
 var h = '<div class="card-h"><h3>' + (ex ? t('Edit Expense', 'تعديل المصروف') : t('Record Outflow', 'تسجيل مصروف')) + '</h3><button class="btn-del" onclick="closeModal(\'exp-modal\')">✕</button></div>';
 h += '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--mut)">' + t('Description', 'الوصف') + '</label><input type="text" id="ex-desc" value="' + (ex?esc(ex.desc):'') + '" style="margin-top:4px"></div>';
 h += '<div class="form-row" style="margin-bottom:14px">';
 h += '<div style="flex:2"><label style="font-size:12px;color:var(--mut)">' + t('Amount', 'المبلغ') + '</label><input type="number" id="ex-amt" value="' + (ex?ex.amt:'') + '" style="margin-top:4px"></div>';
 h += '<div style="flex:1"><label style="font-size:12px;color:var(--mut)">' + t('Currency', 'العملة') + '</label><select id="ex-cur" style="margin-top:4px"><option value="USD">USD ($)</option><option value="LBP">LBP (ل.ل.)</option></select></div>';
 h += '</div>';
 h += '<button style="width:100%;padding:12px;background:var(--bad);color:#fff" onclick="saveExpenseModal(' + idx + ')">' + t('Save Outflow Expense', 'حفظ المصروف') + '</button>';
 document.getElementById('exp-content').innerHTML = h;
 openModal('exp-modal');
}

function saveExpenseModal(idx) {
 var desc = document.getElementById('ex-desc').value.trim();
 var amt = Number(document.getElementById('ex-amt').value) || 0;
 var cur = document.getElementById('ex-cur').value;
 if (!desc || amt <= 0) return;
 if (idx >= 0) {
 DB.expenses[idx].desc = desc; DB.expenses[idx].amt = amt; DB.expenses[idx].cur = cur;
 } else {
 DB.expenses.unshift({ id: 'e_' + Date.now(), cat: 'gen', desc: desc, amt: amt, cur: cur, month: SELECTED_MONTH, at: 'Today' });
 DB.ledger.unshift({ id: 'l_' + Date.now(), desc: desc, channel: 'Cash Drawer', amt: amt, cur: cur, type: 'out', at: 'Today' });
 }
 saveDB(); closeModal('exp-modal'); showToast('Expense recorded'); render();
}

function openSettingsModal() {
 var h = '<div class="card-h"><h3>⚙️ ' + t('Settings', 'الإعدادات') + '</h3><button class="btn-del" onclick="closeModal(\'settings-modal\')">✕</button></div>';
 h += '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--mut)">Exchange Rate (LBP / $1)</label><input type="number" value="' + DB.settings.rate + '" onchange="DB.settings.rate=Number(this.value);saveDB();render()"></div>';
 document.getElementById('settings-content').innerHTML = h;
 openModal('settings-modal');
}

function toggleTick(cId, aId) {
 var cyc = DB.cycles[SELECTED_MONTH];
 cyc.paid[cId] = cyc.paid[cId] || {};
 cyc.paid[cId][aId] = cyc.paid[cId][aId] ? 0 : 1;
 if (!cyc.paid[cId][aId]) delete cyc.paid[cId][aId];
 saveDB(); render();
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function showToast(msg) {
 var el = document.getElementById('toast');
 document.getElementById('toast-msg').textContent = msg;
 el.classList.add('pop');
 setTimeout(function(){el.classList.remove('pop');}, 2800);
}
function setRole(r) { ROLE = r; document.getElementById('sim-mgr').className=r==='mgr'?'on':''; document.getElementById('sim-col').className=r==='col'?'on':''; render(); }
function toggleLang() { LANG = LANG === 'ar' ? 'en' : 'ar'; render(); }
function toggleTheme() {
 var root = document.documentElement;
 root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

render();
</script>
</body>
</html>
