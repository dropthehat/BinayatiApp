<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Binayati · بنايتي — V13 Smart Building Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
 --bg: #f4f5fb; --card: #ffffff; --card2: #f8f9fe; --ink: #14172c; --mut: #6e7491; --line: #e6e8f4;
 --soft: #eeebff; --acc: #5b4cf5; --acc2: #7c6ff9;
 --hero: linear-gradient(145deg, #5444f2 0%, #6e5ef7 55%, #8273fa 100%);
 --ok: #10b981; --okbg: rgba(16, 185, 129, 0.12); --warn: #f59e0b; --wbg: rgba(245, 158, 11, 0.12);
 --bad: #ef4444; --errbg: rgba(239, 68, 68, 0.11); --purp: #7c3aed; --purpbg: rgba(124, 58, 237, 0.11);
 --shadow: 0 10px 30px rgba(30, 26, 82, 0.06); --shadow-lg: 0 18px 45px rgba(91, 76, 245, 0.22);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
 margin: 0; background: var(--bg); color: var(--ink);
 font: 14.5px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
 font-variant-numeric: tabular-nums; padding-bottom: 115px; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 14px; font-weight: 700; transition: all .16s ease; }
button:active { transform: scale(0.96); }

.sim-strip {
 background: #14172c; color: #ffffff; padding: 6px 12px; font-size: 12px;
 display: flex; align-items: center; justify-content: space-between; gap: 6px; position: relative; z-index: 100;
}
.sim-pills { display: flex; background: rgba(255,255,255,0.1); border-radius: 999px; padding: 2px; }
.sim-pills button { background: transparent; color: #cbd5e1; border-radius: 999px; padding: 4px 10px; font-size: 11px; }
.sim-pills button.on { background: var(--acc); color: #fff; }
.sim-right { display: flex; gap: 6px; }
.sim-right button { background: rgba(255,255,255,0.14); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11px; }

.shell { max-width: 480px; margin: 0 auto; overflow-x: hidden; }

.indigo-hero {
 background: var(--hero); color: #ffffff; padding: 16px 18px 26px; border-radius: 0 0 32px 32px;
 box-shadow: var(--shadow-lg); margin-bottom: 14px; position: relative;
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.hero-pill {
 background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); color: #fff; padding: 6px 13px;
 border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
}
/* ---- Living building hero (Home) ---- */
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px 10px; }
.home-pill { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
.home-cur-toggle { display: inline-flex; background: var(--soft); padding: 3px; border-radius: 999px; gap: 2px; }
.home-cur-toggle button { background: transparent; color: var(--mut); padding: 5px 11px; font-size: 11.5px; border-radius: 999px; }
.home-cur-toggle button.on { background: var(--card); color: var(--acc); box-shadow: 0 1px 4px rgba(20,23,44,.12); }
.bh { position: relative; margin: 0 16px 12px; border-radius: 26px; overflow: hidden; aspect-ratio: 366 / 256; box-shadow: var(--shadow-lg); background: var(--sky2); }
.bh svg.bh-art { display: block; width: 100%; height: 100%; }
.bh-chip { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.bh-chip i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.bh.day .bh-chip { background: rgba(255,255,255,.82); color: #14172C; }
.bh.dusk .bh-chip, .bh.night .bh-chip { background: rgba(10,12,40,.5); color: #F3EEDC; }
.bh.day .bh-chip i { background: #F5A524; } .bh.dusk .bh-chip i { background: #FF9A6C; } .bh.night .bh-chip i { background: #F3EEDC; }
.bh.day { --sky1:#6FB1EE; --sky2:#A6D0F4; --sky3:#F6E2C4; --sun:#FFF4CF; --cloud:rgba(255,255,255,.88); --mount:#B4C6DA; --far:#C3D0E0; --neigh:#DDD1C1; --nline:#CABEAC; --nw:#8FA5BD; --nwlit:#8FA5BD; --facade:#ECE2CF; --shade:#CDBDA2; --parapet:#F6EFE2; --slab:#F8F2E7; --slabEdge:#B9A688; --lobby:#D6C7AE; --doorFrame:#5A4A38; --doorGlass:#A9C3DE; --side:#D2CBBD; --street:#8F8B98; --lane:#EDEAE2; --pole:#56515E; --wire:#3B3A44; --rail:#4E4234; --trunk:#6A5442; --leaf:#4E8B5F; --leaf2:#76AD7F; --tankBase:#8D8577; --ac:#F4F6FA; --core:#BFC9D3; --sh:#7E9E86; --sl:#5F7F68; --w1:#FCE7B8; --w2:#F2C077; --w3:#EDB566; --glassOff:#4A5A75; --bulb:#E5E2D8; }
.bh.dusk { --sky1:#3F4B9A; --sky2:#B58AB8; --sky3:#FFB98A; --sun:#FFB27A; --cloud:rgba(255,205,195,.6); --mount:#6E6AA8; --far:#7C72AE; --neigh:#8A7EA6; --nline:#7B6F97; --nw:#5B5585; --nwlit:#F2B45E; --facade:#C8B2A6; --shade:#9C8496; --parapet:#D9C6B8; --slab:#E3D2C4; --slabEdge:#8E7A8E; --lobby:#A891A0; --doorFrame:#4A3A48; --doorGlass:#FFC35E; --side:#9C8CA6; --street:#5E5878; --lane:#C9BFD6; --pole:#3A3350; --wire:#2A2440; --rail:#3A2E3A; --trunk:#4E3E3A; --leaf:#3E5E58; --leaf2:#557A6E; --tankBase:#6E6478; --ac:#E3E2EC; --core:#8F8AAE; --sh:#6F8572; --sl:#556A59; --w1:#FFE6A6; --w2:#FFC35E; --w3:#E38A36; --glassOff:#3B3F66; --bulb:#FFF4D6; }
.bh.night { --sky1:#060920; --sky2:#15184A; --sky3:#3B2E66; --sun:#F7F1DE; --cloud:transparent; --mount:#2A2658; --far:#221F4B; --neigh:#1C1A40; --nline:#2C2960; --nw:#26234E; --nwlit:#E9A85A; --facade:#2F2B64; --shade:#1A183C; --parapet:#3E3A7A; --slab:#46418A; --slabEdge:#7C76CC; --lobby:#1E1B43; --doorFrame:#15133A; --doorGlass:#FFC35E; --side:#2A2752; --street:#15142E; --lane:#4A4680; --pole:#120F2C; --wire:#0B0A1E; --rail:#0F0D28; --trunk:#2A1E22; --leaf:#152B33; --leaf2:#1E3B43; --tankBase:#2A2756; --ac:#C5CCDA; --core:#3A3670; --sh:#3B4160; --sl:#2B3049; --w1:#FFE6A6; --w2:#FFC35E; --w3:#E38A36; --glassOff:#1E2147; --bulb:#FFF8E2; }
.bh-mount{fill:var(--mount)} .bh-far{fill:var(--far)} .bh-neigh{fill:var(--neigh)} .bh-nline{fill:var(--nline)} .bh-nw{fill:var(--nw)} .bh-nw.lit{fill:var(--nwlit)}
.bh-facade{fill:var(--facade)} .bh-shade{fill:var(--shade)} .bh-parapet{fill:var(--parapet)} .bh-slab{fill:var(--slab)} .bh-slabEdge{fill:var(--slabEdge)}
.bh-lobby{fill:var(--lobby)} .bh-doorFrame{fill:var(--doorFrame)} .bh-doorGlass{fill:var(--doorGlass)} .bh-side{fill:var(--side)} .bh-street{fill:var(--street)} .bh-lane{fill:var(--lane)}
.bh-pole{fill:var(--pole)} .bh-wire{fill:none;stroke:var(--wire);stroke-width:.6;stroke-linecap:round} .bh-rail{fill:none;stroke:var(--rail)}
.bh-trunk{fill:none;stroke:var(--trunk);stroke-width:2.2;stroke-linecap:round} .bh-leaf{fill:var(--leaf)} .bh-leaf2{fill:var(--leaf2)}
.bh-tankBase{fill:var(--tankBase)} .bh-ac{fill:var(--ac)} .bh-bulb{fill:var(--bulb)} .bh-cloud{fill:var(--cloud)}
.bh-core{fill:var(--core)} .bh.elev .bh-core{fill:#7FE3C2;animation:bhCore 2.2s ease-in-out infinite}
.bh-glassOff{fill:var(--glassOff)} .bh-mull{fill:rgba(0,0,0,.32)}
.bh-win{cursor:pointer;outline:none}
.bh-win:focus-visible .bh-frame{stroke:#FFFFFF;stroke-width:1.4}
.bh-dot{fill:#F59E0B;stroke:#FFFFFF;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:bhPulse 1.8s ease-in-out infinite}
.bh.day .bh-halo{display:none}
.bh.day .bh-lampglow{opacity:0} .bh.dusk .bh-lampglow{opacity:.7}
.bh.day .bh-moon, .bh.dusk .bh-moon, .bh.day .bh-star{display:none}
.bh.dusk .bh-star{opacity:.35}
.bh.night .bh-sun, .bh.night .bh-cloud{display:none}
.bh-star{fill:#FFF6DA;animation:bhTw 3s ease-in-out infinite}
.bh-cloud{animation:bhDrift 16s ease-in-out infinite alternate}
.bh-bob{animation:bhBob 2.4s ease-in-out infinite}
@keyframes bhCore{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes bhPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes bhTw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bhDrift{from{transform:translateX(0)}to{transform:translateX(16px)}}
@keyframes bhBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion: reduce){.bh *{animation:none!important}}
.safe-lbl { font-size: 12px; font-weight: 700; color: var(--mut); }
.safe-num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 2px; color: var(--ink); }
.owe-chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #F2C77E; background: #FFF6E6; color: #7A4A00; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.owe-chip span { font-weight: 600; }
.qa-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.qa { background: var(--card2); border: 1px solid var(--line); color: var(--ink); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.qa span { font-size: 10.5px; color: var(--mut); font-weight: 700; }
.qa b { font-size: 14px; font-weight: 800; }
.qa.cta { background: var(--acc); border-color: var(--acc); color: #FFFFFF; box-shadow: 0 8px 20px rgba(91,76,245,.3); }
.qa.cta span { color: rgba(255,255,255,.85); }
.home-note { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; font-size: 12.5px; font-weight: 700; line-height: 1.4; margin-top: 10px; }
.home-note i { flex: none; width: 9px; height: 9px; border-radius: 50%; display: block; }
.hero-center { text-align: center; margin: 6px 0 16px; }
.hero-center .lbl { font-size: 12.5px; opacity: 0.85; font-weight: 600; }
.hero-center .big-num { font-size: 38px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 4px; }
.hero-center .sub-lbl { font-size: 12px; opacity: 0.82; font-weight: 600; }
.hero-cur-toggle { display: inline-flex; background: rgba(0,0,0,0.18); padding: 3px; border-radius: 999px; gap: 2px; }
.hero-cur-toggle button { background: transparent; color: rgba(255,255,255,0.75); padding: 4px 11px; font-size: 11px; border-radius: 999px; }
.hero-cur-toggle button.on { background: #ffffff; color: var(--acc); }
.hero-stats-grid {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
 background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.2);
 border-radius: 20px; padding: 12px 10px; text-align: center; backdrop-filter: blur(8px);
}
.hero-stats-grid .stat-tile {
 display: block; width: 100%; background: transparent; padding: 0; border-radius: 14px; color: inherit;
}
.hero-stats-grid .stat-tile span { display: block; font-size: 10.5px; opacity: 0.82; font-weight: 600; }
.hero-stats-grid .stat-tile b { display: block; font-size: 15px; font-weight: 800; margin-top: 2px; }
.hero-stats-grid .stat-tile small { display: block; font-size: 10px; opacity: 0.78; margin-top: 1px; }
.hero-stats-grid .stat-cta {
 background: #ffffff; padding: 8px 4px; box-shadow: 0 6px 16px rgba(20,23,44,0.22);
}
.hero-stats-grid .stat-cta span { color: var(--acc); opacity: 0.72; }
.hero-stats-grid .stat-cta b { color: var(--acc); }
.hero-stats-grid .stat-cta small { color: var(--acc); opacity: 0.65; }

header.top-bar { padding: 12px 18px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.header-lead { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.btn-back-lead {
 width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--line);
 display: grid; place-items: center; font-size: 20px; line-height: 1; color: var(--acc); flex: none; box-shadow: var(--shadow);
}
.top-brand { font-size: 11px; font-weight: 800; color: var(--acc); letter-spacing: .06em; text-transform: uppercase; }
.top-title { font-size: 20px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role-badge { background: var(--soft); color: var(--acc); padding: 6px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; flex: none; }

.card {
 background: var(--card); border: 1px solid var(--line); border-radius: 24px;
 padding: 18px; margin: 12px 16px; box-shadow: var(--shadow); position: relative; max-width: 100%;
}
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--ink); min-width: 0; flex: 1; }
.subtext { color: var(--mut); font-size: 12.5px; margin: 0 0 12px; line-height: 1.45; }
.drawer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drawer-box { background: var(--card2); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; min-width: 0; }
.drawer-box span { display: block; font-size: 11px; font-weight: 700; color: var(--mut); }
.drawer-box b { display: block; font-size: 16px; font-weight: 800; margin-top: 3px; color: var(--ink); }
.drawer-box small { display: block; font-size: 11px; color: var(--mut); font-weight: 600; margin-top: 2px; }

.month-pills { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 4px 16px 8px; }
.month-pills::-webkit-scrollbar { display: none; }
.mpill {
 background: var(--card); border: 1px solid var(--line); color: var(--mut);
 padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
 display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}
.mpill.on { background: var(--acc); color: #ffffff; border-color: var(--acc); }
.mpill.proj { border-color: rgba(245,158,11,.45); }
.mpill.proj.on { background: var(--warn); color: #ffffff; border-color: var(--warn); }

.seg-bar {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
 background: var(--card2); padding: 4px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 12px;
}
.seg-bar button { background: transparent; color: var(--mut); padding: 8px 4px; font-size: 12px; border-radius: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg-bar button.on { background: var(--card); color: var(--acc); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

.prog-wrap { margin: 8px 0 14px; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; flex-wrap: wrap; }
.prog-top b { font-size: 19px; font-weight: 800; }
.prog-top span { font-size: 12.5px; font-weight: 800; color: var(--acc); }
.prog-track { height: 11px; width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--acc), var(--ok)); transition: width .35s cubic-bezier(.4,0,.2,1); }
.prog-fill.proj { background: linear-gradient(90deg, var(--warn), var(--ok)); }

.ledger-strip {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; padding: 11px;
 background: var(--card2); border: 1px solid var(--line); border-radius: 16px; text-align: center;
}
.ledger-strip div span { display: block; font-size: 10.5px; font-weight: 700; color: var(--mut); }
.ledger-strip div b { font-size: 14px; font-weight: 800; margin-top: 2px; display: block; }

.chart-wrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 8px 0 14px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.donut-center b { font-size: 20px; font-weight: 800; }
.donut-center span { font-size: 11.5px; color: var(--mut); font-weight: 600; }

.corner-wrap { position: relative; flex: none; }
.dots-btn {
 width: 34px; height: 34px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line);
 color: var(--ink); font-size: 18px; display: grid; place-items: center; line-height: 1;
}
.corner-menu {
 position: absolute; top: 40px; inset-inline-end: 0; min-width: 215px; background: var(--card);
 border: 1px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: 0 14px 35px rgba(20,23,44,0.16); z-index: 120;
}
.corner-menu button {
 width: 100%; background: transparent; color: var(--ink); padding: 9px 12px; border-radius: 10px;
 font-size: 12.5px; font-weight: 700; text-align: start; display: flex; align-items: center; gap: 8px;
}
.corner-menu button:hover { background: var(--card2); }
.corner-menu button.danger { color: var(--bad); }

.list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.list-row:first-of-type { border-top: 0; }
.list-row.clickable { cursor: pointer; border-radius: 12px; padding-inline: 6px; margin-inline: -6px; transition: background .15s; }
.list-row.clickable:hover, .list-row.selected-cat { background: var(--soft); }
.list-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.single-line-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; font-size: 14px; display: block; }
.status-stack { display: flex; flex-direction: column; align-items: flex-end; text-align: end; flex: none; line-height: 1.3; }
.status-stack .st-paid { font-size: 12.5px; font-weight: 800; color: var(--ok); }
.status-stack .st-owed { font-size: 12px; font-weight: 800; color: var(--bad); margin-top: 2px; }
.status-stack .st-zero { font-size: 11px; font-weight: 600; color: var(--mut); }
.split-drawer {
 background: var(--card2); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 11px; margin-top: 7px;
 font-size: 11.5px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
}
.badge-code { background: var(--soft); color: var(--acc); font-weight: 800; font-size: 12px; padding: 5px 9px; border-radius: 10px; flex: none; }
.badge-lang { background: var(--soft); color: var(--acc); font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; margin-inline-start: 6px; display: inline-block; }
.badge-pay { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; }
.badge-pay.mgr { background: var(--purpbg); color: var(--purp); }
.badge-pay.cash { background: var(--okbg); color: var(--ok); }
.btn-edit {
 background: var(--card2); border: 1px solid var(--line); color: var(--ink); padding: 6px 12px;
 border-radius: 11px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; flex: none;
}
.cat-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex: none; }
.cat-mid { flex: 1; min-width: 0; }
.cat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.cat-top b { font-size: 14px; font-weight: 700; }
.cat-top span { font-size: 13.5px; font-weight: 800; }
.cat-bar { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; }
.cat-bar i { display: block; height: 100%; border-radius: 999px; }

.wa-textarea {
 width: 100%; min-height: 150px; resize: vertical; line-height: 1.5; background: var(--card2);
 border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; font-size: 13px; font-weight: 600;
}
.wa-textarea.expanded { min-height: 240px; }
.wa-preview-box { background: #e5ddd5; border: 1px solid #d4ccc3; border-radius: 18px; padding: 12px; margin-top: 10px; max-width: 100%; overflow: hidden; }
.wa-bubble {
 background: #dcf8c6; color: #111b21; border-radius: 14px 14px 4px 14px; padding: 12px 14px; font-size: 13px;
 line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; max-width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.08);

function loadDB() {
 var base = JSON.parse(JSON.stringify(DEFAULT_DB));
 try {
 var r = localStorage.getItem(STORAGE_KEY);
 if (r) {
 var saved = JSON.parse(r);
 for (var k in saved) {
 if (k === 'settings') base.settings = Object.assign({}, base.settings, saved.settings);
 else base[k] = saved[k];
 }
 }
 } catch (e) {}
 ['reminders', 'completedTasks', 'expenses', 'ledger', 'apartments'].forEach(function(k) {
 if (!Array.isArray(base[k])) base[k] = [];
 });
 if (!base.cycles || typeof base.cycles !== 'object') base.cycles = {};
 return base;
}
var DB = loadDB();
function saveDB() {
 try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (e) {}
}

 ============================================================================ */
function t(en, ar) { return LANG === 'ar' ? ar : en; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayIso() {
 var d = new Date();
 return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function esc(s) {
 return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
 .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* Safe way to pass a name into an inline onclick: produces a quoted JS string, HTML-escaped. */
function jsArg(s) { return esc(JSON.stringify(String(s))); }

function fmt(amt, cur, lang) {
 var n = Number(amt) || 0;
 var sign = n < 0 ? '-' : '';
 n = Math.abs(n);
 if (cur === 'LBP') return sign + 'LBP ' + Math.round(n).toLocaleString('en-US');
 return sign + '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function dispCycleName(key, lang) {
 lang = lang || LANG;
 var cyc = DB.cycles[key];
 if (cyc && cyc.isProject) return lang === 'ar' ? (cyc.arLabel || key) : key;
 if (lang !== 'ar') return key;
 var parts = String(key).split(' ');
 var idx = MONTHS_EN.indexOf(parts[0]);
 if (idx < 0) return key;
 return MONTHS_AR[idx] + ' ' + (parts[1] || '');
}

 };
 var cyc = DB.cycles[cKey];
 if (!cyc) return s;

 var bldCols = getCycleCols(cKey, true);
 var allCols = getCycleCols(cKey, false);

 DB.apartments.forEach(function(a) {
 var anyV = false, owed = false;
 bldCols.forEach(function(c) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 anyV = true;
 var eq = c.cur === 'LBP' ? v / rate : v;
 s.eqSumUsd += eq;
 if (cellState(cyc, c.id, a.id) > 0) s.eqGotUsd += eq; else owed = true;
 });
 if (anyV) { s.total++; if (!owed) s.settled++; }
 });
 s.pct = s.eqSumUsd > 0 ? Math.round(s.eqGotUsd / s.eqSumUsd * 100) : 0;

 allCols.forEach(function(c) {
 DB.apartments.forEach(function(a) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 var st = cellState(cyc, c.id, a.id);
 var usdEq = c.cur === 'LBP' ? v / rate : v;
 if (c.passThrough) {
 s.supSumUsd += usdEq;
 if (st === 1) s.supGotUsd += usdEq;
 } else if (st === 1) {
 if (c.cur === 'LBP') s.natNetLbp += v; else s.natNetUsd += v;
 }
 if (st === 2) {
 if (c.cur === 'LBP') s.mgrLbpGot += v; else s.mgrUsdGot += v;
 }
 });
 });

 DB.expenses.forEach(function(e) {
 if (e.month !== cKey || e.payer === 'natour_pending') return;
 var amt = Number(e.amt) || 0;
 s.expUsd += e.cur === 'LBP' ? amt / rate : amt;
 if (e.payer === 'natour_paid') {
 if (e.cur === 'LBP') s.natNetLbp -= amt; else s.natNetUsd -= amt;
 }
 });
 s.netCycleUsd = s.eqGotUsd - s.expUsd;
 return s;
}

/* Building safe: initial balance + manager-side money in - building-safe bills out. */
function getSafeBalance() {
 var rate = getRate();
 var single = DB.settings.treasuryMode === 'single';
 var usd = Number(DB.settings.initialUsd) || 0;
 var lbp = single ? 0 : (Number(DB.settings.initialLbp) || 0);
 if (single) usd += (Number(DB.settings.initialLbp) || 0) / rate;

 Object.keys(DB.cycles).forEach(function(ck) {
 var cyc = DB.cycles[ck];
 getCycleCols(ck, true).forEach(function(c) {
 if (c.linkedProject) return; // Avoid double-counting linked project installments
 DB.apartments.forEach(function(a) {
 var v = c.valFor(a.id);
 if (v <= 0 || cellState(cyc, c.id, a.id) === 0) return;
 if (c.cur === 'LBP') { if (single) usd += v / rate; else lbp += v; }
 else usd += v;
 });
 });
 });

 (DB.expenses || []).forEach(function(e) {
 if (e.payer === 'natour_pending') return;
 var amt = Number(e.amt) || 0;
 if (e.cur === 'LBP') { if (single) usd -= amt / rate; else lbp -= amt; }
 else usd -= amt;
 });

 var refCur = single ? 'USD' : REF_CUR;
 var refVal = refCur === 'LBP' ? (lbp + usd * rate) : (usd + lbp / rate);
 return { netUsd: usd, netLbp: lbp, refVal: refVal };
}

function isAptSettled(a, cKey) {
 var cyc = DB.cycles[cKey];
 var any = false, owed = false;
 getCycleCols(cKey, true).forEach(function(c) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 any = true;
 if (cellState(cyc, c.id, a.id) === 0) owed = true;
 });
 return any && !owed;
}

/* Tap a chip: unpaid -> collected by Natour -> unpaid. Manager-paid chips reset to unpaid. */
function toggleTick(colId, aId) {
 var cyc = DB.cycles[SELECTED_MONTH];
 if (!cyc) return;
 cyc.paid = cyc.paid || {};
 cyc.paid[colId] = cyc.paid[colId] || {};
 var cur = cyc.paid[colId][aId] || 0;
 if (cur === 2 && !confirm(t('This was paid to the manager. Clear it?', 'هذا المبلغ مدفوع للمدير. هل تريد إلغاءه؟'))) return;
 var next = cur === 0 ? 1 : 0;
 if (next) cyc.paid[colId][aId] = next; else delete cyc.paid[colId][aId];

 var due = (cyc.dues || []).filter(function(d) { return d.id === colId; })[0];
 if (due && due.linkedProject && DB.cycles[due.linkedProject]) {
 var pc = DB.cycles[due.linkedProject];
 var tc = due.linkedColId || 'sp_m1';
 pc.paid = pc.paid || {};
 pc.paid[tc] = pc.paid[tc] || {};
 if (next) pc.paid[tc][aId] = next; else delete pc.paid[tc][aId];
 }
 saveDB(); render();
}

function renderWaBlock(a, lang, mode) {
 var cKey = SELECTED_MONTH, cyc = DB.cycles[cKey] || {};
 var wantPaid = mode === 'receipt';
 var lines = [], dueUsd = 0, dueLbp = 0;
 getCycleCols(cKey, false).forEach(function(c) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 var paid = cellState(cyc, c.id, a.id) > 0;
 if (wantPaid && !paid) return; /* receipts list only what was paid */
 var check = paid ? ' ✅' : '';
 lines.push('• ' + (lang === 'ar' ? (c.ar || c.en) : c.en) + ': ' + fmt(v, c.cur) + check);
 if (!paid) { if (c.cur === 'LBP') dueLbp += v; else dueUsd += v; }
 });
 var items = lines.length ? lines.join('\n') : (lang === 'ar' ? '• لا توجد مستحقات' : '• No items');
 var dueTxt = '';
 if (dueUsd > 0) dueTxt += fmt(dueUsd, 'USD');
 if (dueUsd > 0 && dueLbp > 0) dueTxt += ' + ';
 if (dueLbp > 0) dueTxt += fmt(dueLbp, 'LBP');
 if (!dueTxt) dueTxt = fmt(0, 'USD');

 var tpl = wantPaid ? (lang === 'ar' ? DB.waReceiptAr : DB.waReceiptEn) : (lang === 'ar' ? DB.waTemplateAr : DB.waTemplateEn);
 var name = lang === 'ar' ? (a.ar || a.en) : a.en;
 var collector = lang === 'ar' ? DB.settings.collectorAr : DB.settings.collectorEn;
 var bld = lang === 'ar' ? DB.settings.bldAr : DB.settings.bldEn;
 return String(tpl || '')
 .replace(/\{building\}/g, bld)
 .replace(/\{month\}/g, dispCycleName(cKey, lang))
 .replace(/\{name\}/g, name)
 .replace(/\{unit\}/g, a.code)
 .replace(/\{collector\}/g, collector)
 .replace(/\{due\}/g, dueTxt)
 .replace(/\{items\}/g, items);
}

function buildWhatsAppText(a, lang, mode) {

}

function buildWaLink(a) {

}

/* Escape first, then turn *bold* markers into <strong>. */
function formatWaHtml(text) {
 return esc(text).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
}

function buildDonutSvg(segs, centerVal, centerLbl) {
 var total = segs.reduce(function(a, s) { return a + s.usd; }, 0);
 var R = 54, C = 2 * Math.PI * R, off = 0, arcs = '';
 if (!segs.length || total <= 0) {
 arcs = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="18"/>';
 } else {
 segs.forEach(function(s) {
 var len = (s.usd / total) * C;
 arcs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="18"'
 + ' stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '"'
 + ' stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"/>';
 off += len;
 });
 }
 return '<div class="chart-wrap"><svg width="140" height="140" viewBox="0 0 140 140">' + arcs + '</svg>'
 + '<div class="donut-center"><b dir="ltr">' + esc(centerVal) + '</b><span>' + esc(centerLbl) + '</span></div></div>';
}

 LIVING BUILDING HERO — windows = who paid, sky = real time of day
 ============================================================================ */
var HERO_LAST_PHASE = '';

/* Approximate sunrise/sunset for Beirut, in local minutes after midnight. */
function sunTimesLocal(d) {
 var lat = 33.89, lon = 35.5;
 var N = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
 var B = (2 * Math.PI / 365) * (N - 81);
 var decl = (23.44 * Math.PI / 180) * Math.sin(B);
 var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
 var tz = -d.getTimezoneOffset() / 60;
 var noon = 720 - 4 * lon - eot + tz * 60;
 var phi = lat * Math.PI / 180;
 var cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(decl)) / (Math.cos(phi) * Math.cos(decl));
 var H = Math.acos(Math.max(-1, Math.min(1, cosH))) * 180 / Math.PI;
 return { rise: noon - 4 * H, set: noon + 4 * H };
}

function heroPhase(now) {
 var st = sunTimesLocal(now);
 var m = now.getHours() * 60 + now.getMinutes();
 var key, label;
 if (m < st.rise - 35 || m > st.set + 45) { key = 'night'; label = t('Night', 'ليلاً'); }
 else if (m < st.rise + 45) { key = 'dusk'; label = t('Sunrise', 'الشروق'); }
 else if (m > st.set - 50) { key = 'dusk'; label = t('Sunset', 'الغروب'); }
 else { key = 'day'; label = m < (st.rise + st.set) / 2 ? t('Morning', 'صباحاً') : t('Afternoon', 'بعد الظهر'); }
 var frac = Math.max(0, Math.min(1, (m - st.rise) / (st.set - st.rise)));
 var time = now.toLocaleTimeString(LANG === 'ar' ? 'ar-LB' : 'en-US', { hour: 'numeric', minute: '2-digit' });
 return { key: key, label: label, chip: time + ' · ' + label, sunX: 40 + frac * 286, sunY: 150 - Math.sin(Math.PI * frac) * 118 };
}

function heroAptStatus(cKey) {
 var cyc = DB.cycles[cKey];

 var isProj = !!cyc.isProject;
 var h = '<div class="card" style="background:var(--soft);border-color:var(--acc);padding:14px 18px">';
 h += '<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;font-weight:800;color:var(--acc);text-transform:uppercase">' + t('EDITING MONTHLY DUES', 'تعديل المستحقات') + '</div><b style="font-size:17px">' + esc(dispCycleName(SELECTED_MONTH)) + '</b></div>';
 h += '<button class="btn-edit" style="background:var(--acc);color:#fff;border:0" onclick="setTab(\'dash\')">✓ ' + t('Done', 'تم') + '</button></div></div>';

 if (!isProj) {
 h += '<div class="card"><div class="card-h"><h2>' + t('Fixed Monthly Fees', 'الرسوم الشهرية الثابتة') + '</h2><button class="btn-edit" style="color:var(--acc)" onclick="openChargeModal(\'fixed\', -1)">+ ' + t('Add Fee', 'إضافة رسم') + '</button></div>';
 cyc.fixed.forEach(function(f, idx) {
 h += '<div class="list-row"><div class="list-left"><div><b>' + esc(f.en) + '</b> <small style="color:var(--mut)">· ' + esc(f.ar) + '</small><div style="font-size:12px;color:var(--acc);font-weight:700" dir="ltr"><bdi>' + fmt(f.amt, f.cur, 'en') + '</bdi> / apt</div></div></div>';
 h += '<button class="btn-edit" onclick="openChargeModal(\'fixed\', ' + idx + ')">✏️ ' + t('Edit', 'تعديل') + '</button></div>';
 });
 h += '</div>';

 h += '<div class="card"><div class="card-h"><h2>' + t('Shared Bills & Project Installments', 'الفواتير المشتركة وأقساط المشاريع') + '</h2><button class="btn-edit" style="color:var(--warn)" onclick="openChargeModal(\'dues\', -1)">+ ' + t('Add Bill', 'إضافة فاتورة') + '</button></div>';
 cyc.dues.forEach(function(d, idx) {
 h += '<div class="list-row"><div class="list-left"><div><b>' + esc(d.en) + '</b> <small style="color:var(--mut)">· ' + esc(d.ar) + '</small><div style="font-size:12px;color:var(--warn);font-weight:700" dir="ltr"><bdi>' + fmt(d.amt, d.cur, 'en') + '</bdi> / apt</div></div></div>';
 h += '<button class="btn-edit" onclick="openChargeModal(\'dues\', ' + idx + ')">✏️ ' + t('Edit', 'تعديل') + '</button></div>';
 });
 h += '</div>';

 h += '<div class="card" style="border-style:dashed"><div class="card-h"><h2>🔌 ' + t('Private Subscriptions (Moteur / Internet / Dish)', 'الاشتراكات الخاصة (المولد / الإنترنت / الدش)') + '</h2><button class="btn-edit" onclick="openSupplierModal()">⚙️ ' + t('Edit', 'تعديل') + '</button></div>';
 h += '<p class="subtext" style="margin:0">' + t('Collected by the Natour for outside suppliers — never mixed with your Building Safe.', 'يحصّلها الناطور لأصحاب الاشتراكات ولا تختلط بصندوق البناية.') + '</p></div>';
 } else {
 h += '<div class="card"><div class="card-h"><h2>🛠️ ' + t('Project Down Payment & Installments', 'الدفعة الأولى وأقساط المشروع') + '</h2><button class="btn-edit" style="color:var(--acc)" onclick="openChargeModal(\'services\', -1)">+ ' + t('Add Installment', 'إضافة قسط') + '</button></div>';
 cyc.services.forEach(function(sv, idx) {
 var activeKeys = Object.keys(sv.map || {}).filter(function(k) { return Number(sv.map[k]) > 0; });
 var sumVal = activeKeys.reduce(function(acc, k) { return acc + Number(sv.map[k]); }, 0);
 h += '<div class="list-row"><div class="list-left"><div><b>' + esc(LANG === 'ar' ? (sv.ar || sv.en) : sv.en) + '</b><div style="font-size:12px;color:var(--acc);font-weight:700">' + activeKeys.length + ' ' + t('apts · Total ', 'شقق · المجموع ') + fmt(sumVal, sv.cur, 'en') + '</div></div></div>';
 h += '<button class="btn-edit" onclick="openChargeModal(\'services\', ' + idx + ')">✏️ ' + t('Edit', 'تعديل') + '</button></div>';
 });
 h += '</div>';
 }
 document.getElementById('app-body').innerHTML = h;
}

function renderExpensesScreen() {
 var rate = getRate();
 var totalsByCat = {}, grandUsd = 0;

 DB.expenses.forEach(function(e) {
 if (e.payer === 'natour_pending') return;
 var usdEq = e.cur === 'LBP' ? (Number(e.amt) / rate) : Number(e.amt);
 totalsByCat[e.cat] = (totalsByCat[e.cat] || 0) + usdEq;
 grandUsd += usdEq;
 });

 var segments = Object.keys(totalsByCat).map(function(k) {
 var c = EXP_CATS[k] || EXP_CATS.repair, val = totalsByCat[k];
 return { id: k, en: c.en, ar: c.ar, ico: c.ico, color: c.color, usd: val, pct: grandUsd > 0 ? Math.round((val / grandUsd) * 100) : 0 };
 }).sort(function(a, b) { return b.usd - a.usd; });

 var h = '<div class="card"><div class="card-h"><h2>📊 ' + t('Expenses by Category', 'المصاريف حسب الفئة') + '</h2><button class="btn-edit" style="color:var(--bad)" onclick="openExpenseModal(-1)">+ ' + t('Add Bill', 'إضافة فاتورة') + '</button></div>';
 h += '<p class="subtext">' + t('Tap any category below to see all bills in that category.', 'اضغط على أي فئة أدناه لعرض جميع الفواتير الخاصة بها.') + '</p>';
 h += buildDonutSvg(segments, '$' + Math.round(grandUsd).toLocaleString(), t('Total Bills Paid', 'مجموع المصاريف'));

 segments.forEach(function(seg) {
 var isSel = SELECTED_EXP_CAT === seg.id;
 h += '<div class="list-row clickable' + (isSel ? ' selected-cat' : '') + '" onclick="SELECTED_EXP_CAT=(SELECTED_EXP_CAT===' + jsArg(seg.id) + '?null:' + jsArg(seg.id) + ');render()">';
 h += '<div class="cat-ico" style="background:' + seg.color + '22;color:' + seg.color + '">' + seg.ico + '</div>';
 h += '<div class="cat-mid" style="margin-inline-start:10px"><div class="cat-top"><b>' + esc(LANG === 'ar' ? seg.ar : seg.en) + (isSel ? ' ✓' : '') + '</b><span dir="ltr">$' + Math.round(seg.usd) + ' <small style="color:var(--mut)">(' + seg.pct + '%)</small></span></div>';
 h += '<div class="cat-bar"><i style="width:' + seg.pct + '%;background:' + seg.color + '"></i></div></div></div>';
 });
 h += '</div>';

 var activeCatObj = SELECTED_EXP_CAT ? EXP_CATS[SELECTED_EXP_CAT] : null;
 h += '<div class="card"><div class="card-h"><h2>' + (activeCatObj ? (activeCatObj.ico + ' ' + esc(LANG === 'ar' ? activeCatObj.ar : activeCatObj.en)) : t('All Bills & Expenses', 'سجل جميع الفواتير والمصاريف')) + '</h2>';
 if (activeCatObj) h += '<button class="btn-edit" onclick="SELECTED_EXP_CAT=null;render()">✕ ' + t('Show All', 'عرض الكل') + '</button>';
 h += '</div>';

 var shownCount = 0;
 DB.expenses.forEach(function(e, idx) {
 if (SELECTED_EXP_CAT && e.cat !== SELECTED_EXP_CAT) return;
 shownCount++;
 var c = EXP_CATS[e.cat] || EXP_CATS.repair;
 var payerBadge = e.payer === 'natour_pending'
 ? '<span class="badge-pay" style="background:var(--wbg);color:var(--warn)">⏳ ' + t('Sent to Natour', 'يدفعها الناطور') + '</span>'
 : (e.payer === 'natour_paid'
 ? '<span class="badge-pay cash">👷‍♂️ ' + t('Paid by Natour', 'دفعها الناطور') + '</span>'
 : '<span class="badge-pay mgr">👨‍💼 ' + t('Manager', 'المدير') + '</span>');

 h += '<div class="list-row clickable" onclick="openExpenseModal(' + idx + ')">';
 h += '<div class="list-left"><div class="cat-ico" style="width:34px;height:34px;font-size:15px;background:' + c.color + '22;color:' + c.color + '">' + c.ico + '</div>';
 h += '<div style="min-width:0"><b class="single-line-name">' + esc(e.desc) + '</b>';
 h += '<div style="font-size:11.5px;color:var(--mut)">📅 ' + esc(e.date || '') + ' · ' + payerBadge + (e.ref ? (' · #' + esc(e.ref)) : '') + '</div>';
 if (e.notes) h += '<div style="font-size:11px;color:var(--acc)">📝 ' + esc(e.notes) + '</div>';
 h += '</div></div>';
 h += '<div style="display:flex;align-items:center;gap:8px;flex:none"><b dir="ltr" style="color:' + (e.payer === 'natour_pending' ? 'var(--warn)' : 'var(--bad)') + '"><bdi>- ' + fmt(e.amt, e.cur, 'en') + '</bdi></b><span style="font-size:12px;color:var(--mut)">✏️</span></div></div>';
 });
 if (!shownCount) h += '<div class="subtext">' + t('No bills in this category.', 'لا توجد فواتير في هذه الفئة.') + '</div>';
 h += '</div>';

 document.getElementById('app-body').innerHTML = h;
}

/* ---- Expense modal ---- */
function populateExpensePresets() {
 var sel = document.getElementById('ex-preset');
 if (!sel) return;
 var h = '<option value="">✍️ ' + t('Custom', 'مخصص') + '</option>';
 EXP_PRESETS.forEach(function(p, i) { h += '<option value="' + i + '">' + esc(p.en) + ' · ' + esc(p.ar) + '</option>'; });
 sel.innerHTML = h;
 sel.value = '';
}

function applyExpensePreset(val) {
 if (val === '' || val == null) return;
 var p = EXP_PRESETS[Number(val)];
 if (!p) return;
 document.getElementById('ex-cat').value = p.cat;
 document.getElementById('ex-desc').value = p.en + ' · ' + p.ar;
}

function openExpenseModal(idx) {
 curExpIdx = (idx == null) ? -1 : idx;
 var ex = curExpIdx >= 0 ? DB.expenses[curExpIdx] : null;
 document.getElementById('ex-modal-title').textContent = ex ? t('Edit Bill', 'تعديل الفاتورة') : t('Add Building Bill / Expense', 'تسجيل فاتورة أو مصروف');
 document.getElementById('ex-del-btn').style.display = ex ? 'block' : 'none';
 document.getElementById('ex-save-btn').textContent = ex ? t('Update Bill', 'تحديث الفاتورة') : t('Save Bill / Expense', 'حفظ الفاتورة');

 var sel = document.getElementById('ex-cycle'), html = '';
 Object.keys(DB.cycles).forEach(function(k) {
 html += '<option value="' + esc(k) + '">' + esc(dispCycleName(k)) + '</option>';
 });
 sel.innerHTML = html;
 sel.value = ex ? ex.month : SELECTED_MONTH;

 document.getElementById('ex-date').value = ex ? (ex.date || todayIso()) : todayIso();
 document.getElementById('ex-payer').value = ex ? ex.payer : 'mgr';
 document.getElementById('ex-cat').value = ex ? ex.cat : 'gen';
 document.getElementById('ex-desc').value = ex ? ex.desc : '';
 document.getElementById('ex-amt').value = ex ? ex.amt : '';
 document.getElementById('ex-cur').value = ex ? ex.cur : 'USD';
 document.getElementById('ex-ref').value = ex ? (ex.ref || '') : '';
 document.getElementById('ex-notes').value = ex ? (ex.notes || '') : '';
 document.getElementById('ex-split-toggle').checked = false;
 document.getElementById('ex-split-box').style.display = 'none';
 populateExpensePresets();
 openModal('exp-modal');
}

function saveCategorizedExpense() {
 var dt = document.getElementById('ex-date').value || todayIso();
 var targetCycle = document.getElementById('ex-cycle').value || SELECTED_MONTH;
 var payer = document.getElementById('ex-payer').value || 'mgr';
 var isSplit = document.getElementById('ex-split-toggle').checked;
 var cat = document.getElementById('ex-cat').value;
 var desc = document.getElementById('ex-desc').value.trim();
 var amt = Number(document.getElementById('ex-amt').value) || 0;
 var cur = document.getElementById('ex-cur').value;
 var ref = document.getElementById('ex-ref').value.trim();
 var notes = document.getElementById('ex-notes').value.trim();

 if (!desc || amt <= 0) { alert(t('Enter description and amount', 'أدخل الوصف والمبلغ')); return; }
 var cObj = EXP_CATS[cat] || EXP_CATS.repair;

 if (curExpIdx >= 0) {
 var ex = DB.expenses[curExpIdx];
 ex.date = dt; ex.month = targetCycle; ex.payer = payer; ex.cat = cat;
 ex.desc = desc; ex.amt = amt; ex.cur = cur; ex.ref = ref; ex.notes = notes;
 showToast(t('Bill updated!', 'تم تحديث الفاتورة!'));
 } else {
 DB.expenses.unshift({ id: 'e_' + Date.now(), cat: cat, desc: desc, amt: amt, cur: cur, month: targetCycle, date: dt, ref: ref, notes: notes, payer: payer });
 if (payer !== 'natour_pending') {
 DB.ledger.unshift({
 id: 'l_' + Date.now(), desc: desc, sub: cObj.ico + ' ' + dispCycleName(targetCycle),
 channel: payer === 'natour_paid' ? 'Paid by Natour Cash' : 'Building Safe',
 amt: amt, cur: cur, type: 'out', at: dt, ref: ref
 });
 }
 if (isSplit && DB.cycles[targetCycle] && !DB.cycles[targetCycle].isProject) {
 var aptCount = DB.apartments.length || 1;
 var shareAmt = Math.round((amt / aptCount) * 100) / 100;
 var dMap = {};
 DB.apartments.forEach(function(a) { dMap[a.id] = shareAmt; });
 DB.cycles[targetCycle].services.push({
 id: 's_split_' + Date.now(), en: desc + ' (Split)', ar: desc + ' (مقسم)',
 cur: cur, passThrough: false, map: dMap
 });
 showToast(t('Bill saved & split across apartments!', 'تم حفظ الفاتورة وتقسيمها على الشقق!'));
 } else {
 showToast(t('Expense saved!', 'تم حفظ المصروف!'));
 }
 }
 saveDB(); closeModal('exp-modal'); render();
}

function deleteExpenseFromModal() {
 if (curExpIdx < 0) return;
 if (!confirm(t('Delete this bill?', 'هل تريد حذف هذه الفاتورة؟'))) return;
 DB.expenses.splice(curExpIdx, 1);
 saveDB(); closeModal('exp-modal'); showToast(t('Deleted', 'تم الحذف')); render();
}

function toggleNatourBillPaid(expIdx) {
 var ex = DB.expenses[expIdx];
 if (!ex) return;
 ex.payer = (ex.payer === 'natour_paid') ? 'natour_pending' : 'natour_paid';
 saveDB();
 showToast(ex.payer === 'natour_paid'
 ? t('Deducted from your Building Cash in hand!', 'تم حسم الفاتورة من الكاش معك!')
 : t('Marked as unpaid', 'تم إلغاء الدفع'));
 render();
}

/* ---- Charge modal (fixed fees, shared bills, project installments) ---- */
var cmSplitMode = 'total'; // 'total' or 'apt'

function setChargeSplitMode(mode) {
 cmSplitMode = mode;
 var bTot = document.getElementById('cm-mode-total');
 var bApt = document.getElementById('cm-mode-apt');
 if (bTot && bApt) {
 bTot.className = (mode === 'total' ? 'on' : '');
 bApt.className = (mode === 'apt' ? 'on' : '');
 }
 var lbl = document.getElementById('cm-amt-lbl');
 if (lbl) {
 lbl.textContent = (curChargeKind === 'dues' && mode === 'total')
 ? t('Total Building Bill (Auto-split across ' + (DB.apartments.length || 1) + ' apts)', 'إجمالي الفاتورة للبناية (تقسّم على ' + (DB.apartments.length || 1) + ' شقق)')
 : t('Amount per Apartment', 'المبلغ لكل شقة');
 }
 updateChargeModalSplitPreview();
}

function updateChargeModalSplitPreview() {
 var prev = document.getElementById('cm-split-preview');
 if (!prev) return;
 if (curChargeKind !== 'dues') { prev.style.display = 'none'; return; }
 prev.style.display = 'block';
 var units = Math.max(1, DB.apartments.length || 1);
 var raw = Number(document.getElementById('cm-amt').value) || 0;
 var cur = document.getElementById('cm-cur').value || 'USD';
 if (cmSplitMode === 'total') {
 var perApt = cur === 'LBP' ? Math.round(raw / units) : (Math.round((raw / units) * 100) / 100);
 prev.innerHTML = '➗ ' + t(
 '<b>' + fmt(raw, cur, 'en') + '</b> total ÷ <b>' + units + ' apartments</b> = <b>' + fmt(perApt, cur, 'en') + ' / apt</b>',
 'إجمالي <b>' + fmt(raw, cur, 'ar') + '</b> ÷ <b>' + units + ' شقق</b> = <b>' + fmt(perApt, cur, 'ar') + ' للشقة</b>'
 );
 } else {
 var totalBld = raw * units;
 prev.innerHTML = '🏢 ' + t(
 '<b>' + fmt(raw, cur, 'en') + ' / apt</b> × <b>' + units + ' apartments</b> = <b>' + fmt(totalBld, cur, 'en') + ' total collected</b>',
 '<b>' + fmt(raw, cur, 'ar') + ' للشقة</b> × <b>' + units + ' شقق</b> = <b>' + fmt(totalBld, cur, 'ar') + ' إجمالي التحصيل</b>'
 );
 }
}

function openChargeModal(kind, idx) {
 curChargeKind = kind; curChargeIdx = idx;
 var cyc = DB.cycles[SELECTED_MONTH];
 var list = cyc[kind];
 var item = idx >= 0 ? list[idx] : null;

 document.getElementById('cm-title').textContent = (idx >= 0 ? t('Edit ', 'تعديل ') : t('Add ', 'إضافة '))
 + (kind === 'fixed' ? t('Fixed Fee', 'رسم ثابت') : kind === 'dues' ? t('Shared Bill', 'فاتورة مشتركة') : t('Installment', 'قسط'));
 document.getElementById('cm-del-btn').style.display = idx >= 0 ? 'block' : 'none';
 document.getElementById('cm-amt-row').style.display = kind === 'services' ? 'none' : 'grid';

 var presets = CHARGE_PRESETS[kind] || [];
 var pHtml = '<option value="custom">' + t('✍️ Custom (Type below)', '✍️ مخصص (اكتب أدناه)') + '</option>';
 presets.forEach(function(p, pi) { pHtml += '<option value="' + pi + '">' + esc(p.en) + ' · ' + esc(p.ar) + '</option>'; });
 document.getElementById('cm-preset').innerHTML = pHtml;

 document.getElementById('cm-en').value = item ? item.en : '';
 document.getElementById('cm-ar').value = item ? item.ar : '';
 document.getElementById('cm-amt').value = item && item.amt != null ? item.amt : '';
 document.getElementById('cm-cur').value = item ? item.cur : ((kind === 'dues' && DB.settings.treasuryMode !== 'single') ? 'LBP' : 'USD');

 document.getElementById('cm-split-mode-wrap').style.display = (kind === 'dues') ? 'block' : 'none';
 document.getElementById('cm-mode-total').textContent = '➗ ' + t('Total bill (auto-split)', 'إجمالي الفاتورة (تقسيم)');
 document.getElementById('cm-mode-apt').textContent = '👤 ' + t('Per apartment', 'لكل شقة');
 setChargeSplitMode(kind === 'dues' && idx < 0 ? 'total' : 'apt');

 var aptBox = document.getElementById('cm-apts-box');
 if (kind === 'services') {
 aptBox.style.display = 'block';
 var ah = '<div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px">' + t('Amount per Apartment (leave 0 if exempt):', 'المبلغ لكل شقة (اتركه 0 للإعفاء):') + '</div>';
 DB.apartments.forEach(function(a) {
 var v = (item && item.map && item.map[a.id]) || '';
 ah += '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--line)"><span><b>' + esc(a.code) + '</b> · ' + esc(LANG === 'ar' ? (a.ar || a.en) : a.en) + '</span><input type="number" data-apt="' + esc(a.id) + '" style="width:95px;text-align:right" placeholder="0" value="' + v + '"></div>';
 });
 aptBox.innerHTML = ah;
 } else {
 aptBox.style.display = 'none';
 }
 openModal('charge-modal');
}

function applyChargePreset(val) {
 if (val === 'custom' || val === '') {
 document.getElementById('cm-en').value = ''; document.getElementById('cm-ar').value = '';
 document.getElementById('cm-en').focus();
 return;
 }
 var p = (CHARGE_PRESETS[curChargeKind] || [])[Number(val)];
 if (!p) return;
 document.getElementById('cm-en').value = p.en;
 document.getElementById('cm-ar').value = p.ar;
 if (p.amt != null) document.getElementById('cm-amt').value = p.amt;
 if (p.cur) document.getElementById('cm-cur').value = p.cur;
 updateChargeModalSplitPreview();
}

function saveChargeModal() {
 var en = document.getElementById('cm-en').value.trim();
 var ar = document.getElementById('cm-ar').value.trim() || en;
 var amt = Number(document.getElementById('cm-amt').value) || 0;
 var cur = document.getElementById('cm-cur').value;
 if (!en) { alert(t('Please enter a name', 'الرجاء إدخال الاسم')); return; }
 if (curChargeKind === 'dues' && cmSplitMode === 'total') {
 var splitUnits = Math.max(1, DB.apartments.length || 1);
 amt = cur === 'LBP' ? Math.round(amt / splitUnits) : Math.round((amt / splitUnits) * 100) / 100;
 }

 var cyc = DB.cycles[SELECTED_MONTH];
 if (curChargeKind === 'services') {
 var map = {};
 document.querySelectorAll('#cm-apts-box input[data-apt]').forEach(function(inp) {
 var v = Number(inp.value) || 0;
 if (v > 0) map[inp.getAttribute('data-apt')] = v;
 });
 if (curChargeIdx >= 0) {
 var sv = cyc.services[curChargeIdx];
 sv.en = en; sv.ar = ar; sv.cur = cur; sv.map = map;
 } else {
 cyc.services.push({ id: 's_' + Date.now(), en: en, ar: ar, cur: cur, passThrough: !cyc.isProject, map: map });
 }
 } else {
 var list = cyc[curChargeKind];
 if (curChargeIdx >= 0) {
 list[curChargeIdx].en = en; list[curChargeIdx].ar = ar; list[curChargeIdx].amt = amt; list[curChargeIdx].cur = cur;
 } else {
 list.push({ id: curChargeKind.charAt(0) + '_' + Date.now(), en: en, ar: ar, amt: amt, cur: cur, exc: {} });
 }
 }
 saveDB(); closeModal('charge-modal'); showToast(t('Saved!', 'تم الحفظ!')); render();
}

function deleteCurrentCharge() {
 if (curChargeIdx < 0) return;
 if (!confirm(t('Delete this item?', 'هل تريد حذف هذا البند؟'))) return;
 DB.cycles[SELECTED_MONTH][curChargeKind].splice(curChargeIdx, 1);
 saveDB(); closeModal('charge-modal'); render();
}

/* ---- Supplier subscriptions (pass-through: Moteur / Internet / Dish) ---- */
function openSupplierModal() {
 var cyc = DB.cycles[SELECTED_MONTH];
 if (!cyc || cyc.isProject) {
 alert(t('Subscriptions apply to monthly collections only.', 'الاشتراكات للأشهر العادية فقط.'));
 return;
 }
 var h = '<div class="card-h"><h3>🔌 ' + t('Private Subscriptions', 'الاشتراكات الخاصة') + '</h3><button class="btn-del" onclick="closeModal(\'supplier-modal\')">✕</button></div>';
 h += '<p class="subtext">' + t('What each apartment pays to outside suppliers this month. Leave 0 for none.', 'المبالغ التي تدفعها كل شقة للمزودين هذا الشهر. اتركه 0 لعدم وجود اشتراك.') + '</p>';
 cyc.services.forEach(function(sv, idx) {
 if (!sv.passThrough) return;
 h += '<div style="margin-bottom:12px;padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:16px">';
 h += '<b>' + esc(LANG === 'ar' ? (sv.ar || sv.en) : sv.en) + '</b> <small style="color:var(--mut)">' + esc(sv.cur) + '</small>';
 DB.apartments.forEach(function(a) {
 var v = (sv.map && sv.map[a.id]) || '';

 var duesArr = [];
 var sharePerApt = getObSharePerApt();
 if (OB.useWater && sharePerApt > 0) {
 var spParts = (OB.sharedPreset || 'Water Bill|فاتورة المياه').split('|');
 duesArr.push({
 id: 'd_init_' + Date.now(),

 ar: spParts[1] || spParts[0],

 cur: OB.waterCur || (OB.curMode === 'single' ? 'USD' : 'LBP')
 });
 }

 if (!DB.cycles[mName]) {
 DB.cycles[mName] = {
 isProject: false, arLabel: dispCycleName(mName, 'ar'), published: true,
 fixed: fixedArr,
 dues: duesArr,
 services: OB.useSuppliers ? [
 { id: 's_gen', en: 'Private Generator', ar: 'المولد الخاص (موتور)', cur: 'USD', passThrough: true, map: {} },
 { id: 's_net', en: 'Internet', ar: 'اشتراك الإنترنت', cur: 'USD', passThrough: true, map: {} }
 ] : [],
 paid: {}
 };
 }
 SELECTED_MONTH = mName;

 var rems = [];
 if (OB.remTrash) rems.push({ id: 'rm_tr', en: 'Wash Trash Bins & Entrance', ar: 'غسيل مستوعبات النفايات والمدخل', date: '2026-10-24', freq: 'Weekly', assignNatour: true });
 if (OB.remSolar) rems.push({ id: 'rm_sl', en: 'Wipe Dust off Solar Panels & Drains', ar: 'تنظيف ألواح الطاقة ومصارف المطر', date: '2026-10-28', freq: 'Monthly', assignNatour: true });
 if (OB.remPest) rems.push({ id: 'rm_ps', en: 'Building Pest Control & Fumigation', ar: 'رش مبيدات وحشرات للبناية', date: '2026-11-15', freq: 'Every 6 Months', assignNatour: false });
 if (OB.remElev) rems.push({ id: 'rm_el', en: 'Elevator & Generator Service Check', ar: 'فحص المصعد وغيار زيت المولد', date: '2026-11-01', freq: 'Monthly', assignNatour: false });
 DB.reminders = rems;

 saveDB();
 OB.step = 7;
 renderOnboardingModalContent();
}

function openNewCycleModal(defaultType) {

}

 h += '<div class="choice-card' + (ncType === 'project' ? ' on' : '') + '" onclick="ncType=\'project\';renderNewCycleModalContent()">';

 MONTHS_EN.forEach(function(m, i) {

 h += '<div><label style="font-size:12px;color:var(--mut)">' + t('Year', 'السنة') + '</label><select id="nc-yr" style="margin-top:4px"><option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option><option value="2028">2028</option></select></div>';

 h += '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin:10px 0 16px;cursor:pointer"><input type="checkbox" id="nc-copy" checked style="width:18px;height:18px"><span>' + t('Copy fixed fees & subscriptions from current month', 'نسخ الرسوم الثابتة والاشتراكات من الشهر الحالي') + '</span></label>';
 } else {
 h += '<div style="margin:12px 0;padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:16px">';
 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Project Title (EN)', 'اسم المشروع (EN)') + '</label><input type="text" id="nc-proj-en" value="Solar 6kW Install" style="margin-top:4px"></div>';

function updateProjCalcPreview() {
 var el = document.getElementById('nc-calc-preview');
 if (!el) return;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var checked = document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').length || 1;
 var downPerUnit = Math.round((down / checked) * 100) / 100;
 var moPerUnit = Math.round((Math.max(0, budget - down) / mos / checked) * 100) / 100;
 el.innerHTML = t(
 '⚡ Auto-Split (' + checked + ' apts): <b>$' + downPerUnit + '/apt</b> Down + <b>$' + moPerUnit + '/apt/mo</b> × ' + mos + ' mos.',
 '⚡ التقسيم التلقائي (' + checked + ' شقق): <b>$' + downPerUnit + ' للشقة</b> دفعة أولى + <b>$' + moPerUnit + ' شهرياً</b> × ' + mos + ' أشهر.'
 );
}

function saveNewCycleModal() {
 if (ncType === 'month') {
 var m = document.getElementById('nc-mon').value;
 var y = document.getElementById('nc-yr').value;
 var name = m + ' ' + y;
 if (!DB.cycles[name]) {
 var copyPrev = document.getElementById('nc-copy').checked;
 var prev = DB.cycles[SELECTED_MONTH] || { fixed: [], services: [] };
 DB.cycles[name] = {
 isProject: false, arLabel: dispCycleName(name, 'ar'), published: false,
 fixed: copyPrev ? JSON.parse(JSON.stringify(prev.fixed || [])) : [],
 dues: [],
 services: copyPrev ? JSON.parse(JSON.stringify((prev.services || []).filter(function(s) { return s.passThrough; }))) : [],
 paid: {}
 };
 }
 SELECTED_MONTH = name;
 saveDB(); closeModal('new-cycle-modal');
 showToast(t('Created: ' + name, 'تم إنشاء: ' + dispCycleName(name, 'ar')));
 setTab('setup');
 return;
 }

 var pEn = document.getElementById('nc-proj-en').value.trim();
 var pAr = document.getElementById('nc-proj-ar').value.trim() || pEn;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var injectIntoMonth = document.getElementById('nc-inject').checked;
 if (!pEn || budget <= 0) { alert(t('Enter project title and target budget', 'أدخل اسم المشروع والميزانية')); return; }
 if (DB.cycles[pEn]) { alert(t('A project with this name already exists.', 'يوجد مشروع بهذا الاسم.')); return; }

 var activeUnits = [];
 document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').forEach(function(cb) {
 activeUnits.push(cb.getAttribute('data-u'));
 });
 if (!activeUnits.length) activeUnits = DB.apartments.map(function(a) { return a.id; });

 var count = activeUnits.length;
 var downPerUnit = Math.round((down / count) * 100) / 100;
 var moPerUnit = Math.round(((budget - down) / mos / count) * 100) / 100;

 var svList = [];
 if (down > 0) {
 var dMap = {};
 activeUnits.forEach(function(uId) { dMap[uId] = downPerUnit; });
 svList.push({ id: 'sp_down_' + Date.now(), en: 'Initial Down Payment ($' + down + ' Split)', ar: 'الدفعة الأولى (من أصل $' + down + ')', cur: 'USD', passThrough: false, map: dMap });
 }

 /* Installment N starts in October 2026 (index 0 of this array), one month per step. */
 var calMonthsEn = ['October', 'November', 'December', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September'];
 var calMonthsAr = ['تشرين الأول', 'تشرين الثاني', 'كانون الأول', 'كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول'];
 var firstInstId = 'sp_m1_' + Date.now();

 for (var i = 1; i <= mos; i++) {
 var mMap = {};
 activeUnits.forEach(function(uId) { mMap[uId] = moPerUnit; });
 var cId = (i === 1) ? firstInstId : ('sp_m' + i + '_' + Date.now());
 var mIdx = (i - 1) % 12;
 var yrVal = 2026 + Math.floor((9 + i - 1) / 12);
 var mLabelEn = calMonthsEn[mIdx] + ' ' + yrVal + ' Installment (' + i + '/' + mos + ')';
 var mLabelAr = 'قسط ' + calMonthsAr[mIdx] + ' ' + yrVal + ' (' + i + '/' + mos + ')';
 svList.push({ id: cId, en: mLabelEn, ar: mLabelAr, cur: 'USD', passThrough: false, map: mMap });
 }

 DB.cycles[pEn] = {
 isProject: true, arLabel: pAr, published: true,
 targetBudget: budget, downPaymentTotal: down, installmentMonths: mos,
 fixed: [], dues: [], services: svList, paid: {}
 };

 if (injectIntoMonth && DB.cycles['October 2026']) {
 DB.cycles['October 2026'].dues.push({
 id: 'due_' + firstInstId,
 en: '🛠️ ' + pEn + ' (Oct 2026 Inst. 1/' + mos + ')',
 ar: '🛠️ ' + pAr + ' (قسط تشرين الأول 1/' + mos + ')',
 amt: moPerUnit, cur: 'USD',
 linkedProject: pEn, linkedColId: firstInstId
 });
 }

 SELECTED_MONTH = pEn;
 CYCLE_DETAIL_MODE = true;
 saveDB(); closeModal('new-cycle-modal');
 showToast(t('Project created with calendar months!', 'تم إنشاء المشروع مع أسماء الشهور التقويمية!'));
 setTab('dash');
}

function deleteSelectedCycle() {
 if (Object.keys(DB.cycles).length <= 1) {
 alert(t('You must keep at least one active month.', 'يجب إبقاء دورة واحدة على الأقل.'));
 return;
 }
 if (!confirm(t('Delete "' + SELECTED_MONTH + '" and its records?', 'هل تريد حذف "' + dispCycleName(SELECTED_MONTH, 'ar') + '" وسجلاتها؟'))) return;
 delete DB.cycles[SELECTED_MONTH];
 SELECTED_MONTH = Object.keys(DB.cycles)[0];
 CYCLE_DETAIL_MODE = false;
 saveDB(); showToast(t('Deleted', 'تم الحذف')); render();
}

function openDirectPayModal() {
 var h = '<div class="card-h"><h3 style="color:var(--purp)">💵 ' + t('Record Resident Payment to Manager', 'تسجيل دفعة مستلمة مباشرة للمدير') + '</h3><button class="btn-del" onclick="closeModal(\'direct-pay-modal\')">✕</button></div>';
 h += '<p class="subtext">' + t('Whether the tenant paid you in Cash, Whish, OMT, or Bank Transfer, recording it here marks their dues as Paid on the Natour\'s phone WITHOUT adding it to the Natour\'s cash pocket.', 'سواء دفع الساكن للمدير كاش أو عبر Whish أو OMT، تسجيل الدفعة هنا يظهرها كمسددة على هاتف الناطور دون إضافتها إلى الكاش الموجود مع الناطور.') + '</p>';

 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Apartment', 'الشقة') + '</label><select id="wp-apt" style="margin-top:4px" onchange="populateDirectPayDues()">';
 DB.apartments.forEach(function(a) { h += '<option value="' + esc(a.id) + '">' + esc(a.code) + ' · ' + esc(LANG === 'ar' ? (a.ar || a.en) : a.en) + '</option>'; });
 h += '</select></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Month / Project', 'الشهر / المشروع') + '</label><select id="wp-cyc" style="margin-top:4px" onchange="populateDirectPayDues()">';
 Object.keys(DB.cycles).forEach(function(ck) { h += '<option value="' + esc(ck) + '"' + (ck === SELECTED_MONTH ? ' selected' : '') + '>' + esc(dispCycleName(ck)) + '</option>'; });
 h += '</select></div></div>';

 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Payment Method', 'وسيلة الدفع للمدير') + '</label><select id="wp-channel" style="margin-top:4px">'
 + '<option value="Cash to Manager">💵 Cash to Manager · كاش للمدير</option>'
 + '<option value="Whish Money">🟣 Whish Money · ويش موني</option>'
 + '<option value="OMT Pay">🟡 OMT Pay · أو أم تي</option>'
 + '<option value="Bank Transfer">🏦 Bank Transfer · تحويل بنكي</option></select></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Date', 'التاريخ') + '</label><input type="date" id="wp-date" value="' + todayIso() + '" style="margin-top:4px"></div>';
 h += '</div>';

 h += '<div class="amt-cur-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Amount Received', 'المبلغ المستلم') + '</label><input type="number" id="wp-amt" style="margin-top:4px"></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Currency', 'العملة') + '</label><select id="wp-cur" style="margin-top:4px"><option value="USD">USD ($)</option><option value="LBP">LBP (ل.ل.)</option></select></div>';
 h += '</div>';

 h += '<div style="margin-bottom:12px"><label style="font-size:11.5px;color:var(--mut)">' + t('Reference / Note (Optional)', 'رقم الإشعار أو ملاحظة') + '</label><input type="text" id="wp-ref" placeholder="e.g. Paid cash at door / WH-9821" style="margin-top:4px"></div>';
 h += '<div id="wp-due-info" style="padding:10px 12px;background:var(--soft);color:var(--acc);font-weight:700;border-radius:12px;font-size:12px;margin-bottom:14px"></div>';
 h += '<button style="width:100%;padding:13px;background:var(--purp);color:#fff" onclick="saveDirectPayModal()">✓ ' + t('Confirm Payment & Settle Unit', 'تأكيد الدفعة وتسديد الشقة') + '</button>';

 document.getElementById('direct-pay-content').innerHTML = h;
 populateDirectPayDues();
 openModal('direct-pay-modal');
}

function populateDirectPayDues() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var cyc = DB.cycles[cKey];
 var rate = getRate();
 var dueEqUsd = 0;
 getCycleCols(cKey, true).forEach(function(c) {
 var v = c.valFor(aptId);
 if (v <= 0 || cellState(cyc, c.id, aptId) > 0) return;
 dueEqUsd += (c.cur === 'LBP' ? v / rate : v);
 });
 document.getElementById('wp-amt').value = Math.round(dueEqUsd) || 50;
 document.getElementById('wp-due-info').innerHTML = t(
 'Unpaid Building Dues in <b>' + esc(cKey) + '</b> for this apartment: <b>$' + Math.round(dueEqUsd) + ' USD</b>',
 'مستحقات البناية غير المدفوعة في <b>' + esc(dispCycleName(cKey, 'ar')) + '</b> لهذه الشقة: <b>$' + Math.round(dueEqUsd) + '</b>'
 );
}

function saveDirectPayModal() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var channel = document.getElementById('wp-channel').value;
 var dt = document.getElementById('wp-date').value || todayIso();
 var amt = Number(document.getElementById('wp-amt').value) || 0;
 var cur = document.getElementById('wp-cur').value;
 var ref = document.getElementById('wp-ref').value.trim() || 'MGR-DIRECT';
 var apt = DB.apartments.filter(function(a) { return a.id === aptId; })[0];
 if (!apt) return;

 var cyc = DB.cycles[cKey];
 cyc.paid = cyc.paid || {};
 cyc.mgrPayChannel = cyc.mgrPayChannel || {};
 cyc.mgrPayChannel[aptId] = channel;

 getCycleCols(cKey, true).forEach(function(c) {
 if (c.valFor(aptId) <= 0) return;
 cyc.paid[c.id] = cyc.paid[c.id] || {};
 cyc.paid[c.id][aptId] = 2;
 if (c.linkedProject && DB.cycles[c.linkedProject]) {
 var pCyc = DB.cycles[c.linkedProject];
 var tCol = c.linkedColId || 'sp_m1';
 pCyc.paid = pCyc.paid || {};
 pCyc.paid[tCol] = pCyc.paid[tCol] || {};
 pCyc.paid[tCol][aptId] = 2;
 }
 });

 DB.ledger.unshift({
 id: 'l_' + Date.now(),
 desc: apt.en + ' (' + apt.code + ') · ' + dispCycleName(cKey),
 sub: channel, channel: channel,
 amt: amt, cur: cur, type: 'in', at: dt, ref: ref
 });

 saveDB(); closeModal('direct-pay-modal');
 showToast(t('Recorded via ' + channel + ' (Natour cash untouched)', 'تم التسجيل عبر ' + channel + ' (دون التأثير على كاش الناطور)'));
 render();
}
