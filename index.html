<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Binayati · بنايتي — V10 Smart Building Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
 --bg: #f2f5f9; --card: #ffffff; --card2: #f8fafc; --ink: #0f172a; --mut: #64748b;
 --line: #e2e8f0; --soft: #e0edff; --acc: #0b6cf0; --ok: #10b981; --okbg: rgba(16,185,129,.12);
 --warn: #f59e0b; --wbg: rgba(245,158,11,.12); --bad: #ef4444; --errbg: rgba(239,68,68,.12);
 --whish: #8b5cf6; --whishbg: rgba(139,92,246,.14);
 --dock: rgba(255,255,255,0.94); --shadow: 0 8px 30px rgba(15,23,42,0.06);
}
:root[data-theme="dark"] {
 --bg: #070b12; --card: #111823; --card2: #17202f; --ink: #f8fafc; --mut: #8b9bb4;
 --line: #1e293b; --soft: #172554; --acc: #38bdf8; --ok: #34d399; --okbg: rgba(52,211,153,.14);
 --warn: #fbbf24; --wbg: rgba(251,191,36,.14); --bad: #f87171; --errbg: rgba(248,113,113,.15);
 --whish: #a78bfa; --whishbg: rgba(167,139,250,.18);
 --dock: rgba(17,24,35,0.92); --shadow: 0 12px 35px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
 margin: 0; background: var(--bg); color: var(--ink);
 font: 14.5px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
 font-variant-numeric: tabular-nums; padding-bottom: 120px; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 12px; font-weight: 700; transition: all .15s ease; }
button:active { transform: scale(0.97); }

/* Simulator Top Bar */
.sim-strip {
 background: #030712; color: #f8fafc; padding: 6px 12px; font-size: 12px;
 display: flex; align-items: center; justify-content: space-between; gap: 6px;
 position: relative; z-index: 100; border-bottom: 1px solid #1e293b;
}
.sim-pills { display: flex; background: #111827; border-radius: 999px; padding: 2px; }
.sim-pills button { background: transparent; color: #9ca3af; border-radius: 999px; padding: 4px 10px; font-size: 11px; }
.sim-pills button.on { background: #2563eb; color: #fff; }
.sim-right { display: flex; gap: 5px; }
.sim-right button { background: #1f2937; color: #e5e7eb; border-radius: 8px; padding: 4px 8px; font-size: 11px; }

.shell { max-width: 480px; margin: 0 auto; padding-top: 6px; overflow-x: hidden; }

/* In-Flow Clean Navigation Header */
header.top-bar {
 padding: 8px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.header-lead { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.btn-back-lead {
 width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
 display: grid; place-items: center; font-size: 20px; line-height: 1; color: var(--acc); flex: none;
 box-shadow: var(--shadow);
}
.top-brand { font-size: 11px; font-weight: 800; color: var(--acc); letter-spacing: .06em; text-transform: uppercase; }
.top-title { font-size: 20px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role-badge {
 background: var(--card); border: 1px solid var(--line); color: var(--mut);
 padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: none;
}

/* Cards */
.card {
 background: var(--card); border: 1px solid var(--line); border-radius: 24px;
 padding: 18px; margin: 10px 16px; box-shadow: var(--shadow); position: relative; max-width: 100%;
}
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 800; }
.subtext { color: var(--mut); font-size: 12.5px; margin: 0 0 12px; line-height: 1.45; }

/* 2×4 Rounded Icon Action Hub */
.hub-grid {
 display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 10px 16px;
}
.hub-tile {
 background: var(--card); border: 1px solid var(--line); border-radius: 20px;
 padding: 11px 4px 9px; display: flex; flex-direction: column; align-items: center;
 text-align: center; gap: 5px; cursor: pointer; box-shadow: var(--shadow);
}
.hub-tile:active { transform: scale(0.95); }
.hub-icon {
 width: 42px; height: 42px; border-radius: 14px; background: var(--card2);
 border: 1px solid var(--line); display: grid; place-items: center; font-size: 19px;
}
.hub-label { font-size: 10.5px; font-weight: 700; color: var(--ink); line-height: 1.2; }

/* Currency Switcher & Balances */
.cur-switch {
 display: inline-flex; align-items: center; background: var(--card2);
 border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px;
}
.cur-switch button {
 padding: 4px 11px; border-radius: 999px; background: transparent;
 color: var(--mut); font-size: 11.5px; font-weight: 800;
}
.cur-switch button.on { background: var(--acc); color: #070b12; }

.big-balance { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 14px; }
.big-balance small { font-size: 13px; color: var(--mut); font-weight: 600; }

.drawer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drawer-box {
 background: var(--card2); border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px; min-width: 0;
}
.drawer-box span { display: block; font-size: 10.5px; font-weight: 700; color: var(--mut); text-transform: uppercase; }
.drawer-box b { display: block; font-size: 16px; font-weight: 800; margin-top: 3px; }
.drawer-box small { display: block; font-size: 11.5px; color: var(--mut); font-weight: 600; margin-top: 2px; }

/* Month / Cycle Pill Strip */
.month-pills {
 display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 16px 8px;
}
.month-pills::-webkit-scrollbar { display: none; }
.mpill {
 background: var(--card); border: 1px solid var(--line); color: var(--mut);
 padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
 display: inline-flex; align-items: center; gap: 5px;
}
.mpill.on { background: var(--acc); color: #070b12; border-color: var(--acc); }
.mpill.proj { border-color: rgba(245,158,11,.45); }
.mpill.proj.on { background: var(--warn); color: #070b12; border-color: var(--warn); }
.mpill.add-btn { border-style: dashed; color: var(--acc); }

/* Segmented 3-Button Bar */
.seg-bar {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
 background: var(--card2); padding: 4px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 12px;
}
.seg-bar button {
 background: transparent; color: var(--mut); padding: 7px 4px; font-size: 11.5px;
 border-radius: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg-bar button.on { background: var(--acc); color: #070b12; }

/* Horizontal Progress Bar */
.prog-wrap { margin: 8px 0 14px; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; flex-wrap: wrap; }
.prog-top b { font-size: 19px; font-weight: 800; }
.prog-top span { font-size: 12.5px; font-weight: 700; color: var(--acc); }
.prog-track {
 height: 12px; width: 100%; background: var(--card2); border: 1px solid var(--line);
 border-radius: 999px; overflow: hidden; padding: 2px;
}
.prog-fill {
 height: 100%; border-radius: 999px;
 background: linear-gradient(90deg, var(--acc), var(--ok));
 transition: width .35s cubic-bezier(.4,0,.2,1);
}
.prog-fill.proj { background: linear-gradient(90deg, var(--warn), var(--ok)); }

/* Cycle Ledger Mini Summary Strip */
.ledger-strip {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
 margin-top: 10px; padding: 10px; background: var(--card2);
 border: 1px solid var(--line); border-radius: 16px; text-align: center;
}
.ledger-strip div span { display: block; font-size: 10px; font-weight: 700; color: var(--mut); text-transform: uppercase; }
.ledger-strip div b { font-size: 13.5px; font-weight: 800; margin-top: 2px; display: block; }

/* Donut Chart Container */
.chart-wrap {
 position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
 margin: 8px 0 14px;
}
.donut-center {
 position: absolute; inset: 0; display: flex; flex-direction: column;
 align-items: center; justify-content: center; pointer-events: none; text-align: center;
}
.donut-center b { font-size: 20px; font-weight: 800; }
.donut-center span { font-size: 11.5px; color: var(--mut); font-weight: 600; }

/* Corner ⋯ Menu Button & Popover */
.corner-wrap { position: relative; flex: none; }
.dots-btn {
 width: 34px; height: 34px; border-radius: 10px; background: var(--card2);
 border: 1px solid var(--line); color: var(--ink); font-size: 18px;
 display: grid; place-items: center; line-height: 1;
}
.corner-menu {
 position: absolute; top: 40px; inset-inline-end: 0; min-width: 210px;
 background: var(--card); border: 1px solid var(--line); border-radius: 16px;
 padding: 6px; box-shadow: 0 14px 35px rgba(0,0,0,0.5); z-index: 120;
}
.corner-menu button {
 width: 100%; background: transparent; color: var(--ink); padding: 9px 12px;
 border-radius: 10px; font-size: 12.5px; font-weight: 700; text-align: start;
 display: flex; align-items: center; gap: 8px;
}
.corner-menu button:hover { background: var(--card2); }
.corner-menu button.danger { color: var(--bad); }

/* List Rows + Single-Line Names + 2-Line Stacked Paid/Owed */
.list-row {
 display: flex; align-items: center; justify-content: space-between; gap: 10px;
 padding: 11px 0; border-top: 1px solid var(--line);
}
.list-row:first-of-type { border-top: 0; }
.list-row.clickable { cursor: pointer; border-radius: 12px; padding-inline: 6px; margin-inline: -6px; transition: background .15s; }
.list-row.clickable:hover, .list-row.selected-cat { background: var(--card2); }
.list-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.single-line-name {
 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
 font-weight: 700; font-size: 14px; display: block;
}
.status-stack {
 display: flex; flex-direction: column; align-items: flex-end; text-align: end;
 flex: none; line-height: 1.3;
}
.status-stack .st-paid { font-size: 12.5px; font-weight: 800; color: var(--ok); }
.status-stack .st-owed { font-size: 12px; font-weight: 800; color: var(--bad); margin-top: 2px; }
.status-stack .st-zero { font-size: 11px; font-weight: 600; color: var(--mut); }

.split-drawer {
 background: var(--card2); border: 1px dashed var(--line); border-radius: 12px;
 padding: 8px 11px; margin-top: 7px; font-size: 11.5px; font-weight: 700;
 display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
}

.badge-code {
 background: var(--card2); border: 1px solid var(--line); color: var(--acc);
 font-weight: 800; font-size: 12px; padding: 5px 9px; border-radius: 10px; flex: none;
}
.badge-lang {
 background: var(--soft); color: var(--acc); font-size: 10.5px; font-weight: 800;
 padding: 2px 7px; border-radius: 6px; margin-inline-start: 6px; display: inline-block;
}
.badge-pay {
 font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; text-transform: uppercase;
}
.badge-pay.whish { background: var(--whishbg); color: var(--whish); }
.badge-pay.cash { background: var(--okbg); color: var(--ok); }

.btn-edit {
 background: var(--card2); border: 1px solid var(--line); color: var(--ink);
 padding: 6px 11px; border-radius: 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; flex: none;
}

/* Expense Category Rows */
.cat-ico {
 width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
 font-size: 18px; flex: none;
}
.cat-mid { flex: 1; min-width: 0; }
.cat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.cat-top b { font-size: 14px; font-weight: 700; }
.cat-top span { font-size: 13.5px; font-weight: 800; }
.cat-bar { height: 5px; background: var(--card2); border-radius: 999px; overflow: hidden; }
.cat-bar i { display: block; height: 100%; border-radius: 999px; }

/* WhatsApp Full-Size Template Editor & Live Preview */
.wa-textarea {
 width: 100%; min-height: 150px; resize: vertical; line-height: 1.5;
 background: var(--card2); border: 1.5px solid var(--line); border-radius: 14px;
 padding: 11px 13px; font-size: 13px; font-weight: 600;
}
.wa-textarea.expanded { min-height: 240px; }
.wa-preview-box {
 background: #0b141a; border: 1px solid #1f2c34; border-radius: 18px; padding: 12px; margin-top: 10px;
 max-width: 100%; overflow: hidden;
}
.wa-bubble {
 background: #005c4b; color: #e9edef; border-radius: 14px 14px 4px 14px;
 padding: 12px 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap;
 overflow-wrap: break-word; word-break: break-word; max-width: 100%;
 box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.wa-bubble strong { font-weight: 800; color: #ffffff; }

/* Floating Bottom Dock */
nav.bottom-dock {
 position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
 width: calc(100% - 24px); max-width: 440px; background: var(--dock);
 backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
 border: 1px solid var(--line); border-radius: 999px; padding: 5px;
 display: flex; justify-content: space-around; align-items: center;
 z-index: 90; box-shadow: 0 12px 32px rgba(0,0,0,0.35);
}
nav.bottom-dock button {
 flex: 1; background: transparent; color: var(--mut); border-radius: 999px;
 padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
 font-size: 10.5px; font-weight: 700;
}
nav.bottom-dock button .ico { font-size: 17px; line-height: 1.1; }
nav.bottom-dock button.on { background: rgba(56, 189, 248, 0.15); color: var(--acc); }

/* Multi-Action Floating + Button & Speed-Dial Menu */
.fab {
 position: fixed; bottom: 82px; inset-inline-end: max(20px, calc(50% - 220px));
 width: 52px; height: 52px; border-radius: 50%; background: var(--acc);
 color: #070b12; font-size: 26px; font-weight: 800; display: grid; place-items: center;
 box-shadow: 0 8px 25px rgba(56,189,248,0.45); z-index: 135; transition: transform .2s ease;
}
.fab.open { transform: rotate(45deg); background: var(--bad); color: #fff; }

.fab-menu {
 position: fixed; bottom: 144px; inset-inline-end: max(18px, calc(50% - 220px));
 width: 255px; background: var(--card); border: 1px solid var(--line);
 border-radius: 22px; padding: 8px; box-shadow: 0 18px 45px rgba(0,0,0,0.55);
 z-index: 134; display: none; flex-direction: column; gap: 4px;
}
.fab-menu.open { display: flex; }
.fab-menu button {
 width: 100%; background: var(--card2); color: var(--ink); padding: 11px 13px;
 border-radius: 14px; font-size: 13px; font-weight: 700; text-align: start;
 display: flex; align-items: center; gap: 10px; border: 1px solid var(--line);
}
.fab-menu button:hover { border-color: var(--acc); }

/* Natour Collector Apartment Cards (Fixed Name Wrapping & Layout!) */
.apt-card { padding: 14px 15px; background: var(--card); border-bottom: 1px solid var(--line); }
.apt-card:last-child { border-bottom: 0; }
.apt-card.settled { background: var(--okbg); }
.apt-top-row {
 display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: nowrap;
}
.apt-name-box {
 display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1;
}
.apt-name-box b {
 font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.apt-due-box {
 display: flex; align-items: center; gap: 7px; flex: none;
}
.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
 border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 11px;
 font-size: 12.5px; font-weight: 700; background: var(--card2); color: var(--ink);
 display: inline-flex; align-items: center; gap: 5px;
}
.chip.ticked { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.chip.ticked::before { content: "✓"; font-weight: 900; }
.wa-btn {
 height: 32px; padding: 0 10px; border-radius: 10px; background: var(--card2);
 border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 4px;
 text-decoration: none; font-size: 12px; font-weight: 800; color: var(--ink); white-space: nowrap;
}
.wa-btn.receipt { background: var(--okbg); border-color: var(--ok); color: var(--ok); }

/* Forms & Modals (Zero Horizontal Overflow!) */
input[type="text"], input[type="number"], input[type="date"], select, textarea {
 width: 100%; max-width: 100%; min-width: 0; background: var(--card2); border: 1.5px solid var(--line);
 border-radius: 12px; padding: 9px 11px; font-size: 13.5px; font-weight: 600;
}
.form-row { display: flex; gap: 8px; align-items: center; width: 100%; }
.form-row > * { min-width: 0; }
/* Dedicated 2-column grid for Amount + Currency so it NEVER overflows horizontally */
.amt-cur-grid {
 display: grid; grid-template-columns: 1fr 112px; gap: 8px; width: 100%; align-items: end;
}
.two-col-grid {
 display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
}
.row-div { padding: 10px 0; border-top: 1px solid var(--line); }
.row-div:first-of-type { border-top: 0; }
.btn-del { background: var(--errbg); color: var(--bad); padding: 7px 11px; border-radius: 10px; flex: none; }

.modal-bg {
 position: fixed; inset: 0; background: rgba(0,0,0,0.74); backdrop-filter: blur(5px);
 z-index: 200; display: none; align-items: center; justify-content: center; padding: 14px;
}
.modal-card {
 background: var(--card); border: 1px solid var(--line); border-radius: 26px;
 width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; overflow-x: hidden; padding: 20px;
 box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.modal-card h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }

.choice-card {
 border: 1.5px solid var(--line); background: var(--card2); border-radius: 16px;
 padding: 12px 14px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px;
}
.choice-card.on { border-color: var(--acc); background: rgba(56,189,248,0.1); }

.step-dots { display: flex; gap: 6px; margin-bottom: 14px; }
.step-dot { height: 6px; flex: 1; border-radius: 999px; background: var(--line); }
.step-dot.on { background: var(--acc); }

.pin-box {
 font-family: ui-monospace, monospace; font-size: 19px; font-weight: 800;
 letter-spacing: 3px; color: var(--acc); background: var(--card2);
 padding: 6px 10px; border-radius: 10px; border: 1px dashed var(--acc); text-align: center;
}

#toast {
 position: fixed; top: 46px; left: 50%; transform: translateX(-50%) translateY(-20px);
 background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 999px;
 font-size: 13px; font-weight: 700; z-index: 300; opacity: 0; pointer-events: none;
 transition: all .25s ease; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,.4);
}
#toast.pop { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body onclick="closeAllPopovers()">

<!-- TOP DEV SIMULATOR BAR -->
<div class="sim-strip">
 <div class="sim-pills">
 <button id="sim-mgr" class="on" onclick="setRole('mgr')">👨‍💼 Manager</button>
 <button id="sim-col" onclick="setRole('col')">👷‍♂️ Natour</button>
 </div>
 <div class="sim-right">
 <button onclick="openOnboarding(1)" id="btn-ob-sim">✨ First-Time UX</button>
 <button id="btn-lang" onclick="toggleLang()">العربية</button>
 <button onclick="toggleTheme()">◐</button>
 </div>
</div>

<div id="toast">🔔 <span id="toast-msg"></span></div>

<div class="shell">
 <header class="top-bar">
 <div class="header-lead">
 <button class="btn-back-lead" id="hdr-back-btn" style="display:none" onclick="goBackLead()">‹</button>
 <div style="min-width:0">
 <div class="top-brand" id="hdr-brand">💧 BINAYATI · بنايتي</div>
 <h1 class="top-title" id="hdr-title">Overview</h1>
 </div>
 </div>
 <div id="hdr-right"></div>
 </header>

 <main id="app-body"></main>
</div>

<!-- MULTI-ACTION FLOATING + SPEED DIAL MENU -->
<div class="fab-menu" id="fab-menu" onclick="event.stopPropagation()">
 <button onclick="closeAllPopovers();openExpenseModal(-1)">
 <span style="font-size:18px">🧾</span>
 <div><b id="fm-exp">Add Expense / Bill</b><div style="font-size:11px;color:var(--mut)" id="fm-exp-sub">Date, category, invoice # & notes</div></div>
 </button>
 <button onclick="closeAllPopovers();openWhishPaymentModal()">
 <span style="font-size:18px">🟣</span>
 <div><b id="fm-pay">Register Direct Payment</b><div style="font-size:11px;color:var(--mut)" id="fm-pay-sub">Whish, OMT, Bank or Cash to Manager</div></div>
 </button>
 <button onclick="closeAllPopovers();openNewCycleModal('month')">
 <span style="font-size:18px">📅</span>
 <div><b id="fm-mon">New Monthly Cycle</b><div style="font-size:11px;color:var(--mut)" id="fm-mon-sub">Pick Month & Year from dropdown</div></div>
 </button>

/* ============================================================================
 2. HELPERS, TRANSLATION & ACCOUNTING
 ============================================================================ */
function esc(s) {
 return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
 });
}
function fmt(n, cur, forceLang) {
 var lg = forceLang || LANG;
 var v = Math.round((Number(n) || 0) * 100) / 100;
 if (cur === 'LBP') return Math.round(v).toLocaleString('en-US') + (lg === 'ar' ? ' ل.ل.' : ' LBP');
 return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function dispCycleName(cKey, forceLang) {
 var lg = forceLang || LANG;
 var cyc = DB.cycles[cKey];
 if (lg === 'ar') {
 if (cyc && cyc.arLabel) return cyc.arLabel;
 var M = {january:'كانون الثاني',february:'شباط',march:'آذار',april:'نيسان',may:'أيار',june:'حزيران',july:'تموز',august:'آب',september:'أيلول',october:'تشرين الأول',november:'تشرين الثاني',december:'كانون الأول'};
 var x = /^\s*([A-Za-z]+)\s+(\d{4})/.exec(String(cKey || ''));
 return x && M[x[1].toLowerCase()] ? M[x[1].toLowerCase()] + ' ' + x[2] : String(cKey || '');
 }
 return cKey;
}

function formatWaHtml(rawText) {
 var safe = esc(rawText);
 return safe.replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
}

function getCycleCols(cKey) {
 var cyc = DB.cycles[cKey] || { fixed: [], dues: [], services: [] };
 var cols = [];
 (cyc.fixed || []).forEach(function(f) {
 cols.push({ id: f.id, kind: 'fixed', en: f.en, ar: f.ar, cur: f.cur, valFor: function(uId) { return (f.exc && f.exc[uId] != null) ? Number(f.exc[uId]) : Number(f.amt); } });
 });
 (cyc.dues || []).forEach(function(d) {
 cols.push({ id: d.id, kind: 'dues', en: d.en, ar: d.ar, cur: d.cur, linkedProject: d.linkedProject, linkedColId: d.linkedColId, valFor: function() { return Number(d.amt); } });
 });
 (cyc.services || []).forEach(function(s) {
 cols.push({ id: s.id, kind: 'services', en: s.en, ar: s.ar, cur: s.cur, valFor: function(uId) { return Number((s.map || {})[uId]) || 0; } });
 });
 return cols;
}

function getCycleStats(cKey) {
 var cyc = DB.cycles[cKey];
 if (!cyc) return { usdGot:0, usdSum:0, lbpGot:0, lbpSum:0, eqGotUsd:0, eqSumUsd:0, expUsd:0, netCycleUsd:0, settled:0, total:DB.apartments.length, pct:0 };
 var cols = getCycleCols(cKey);
 var usdGot = 0, usdSum = 0, lbpGot = 0, lbpSum = 0, settled = 0, activeUnits = 0;
 var rate = Number(DB.settings.rate) || 89500;

 DB.apartments.forEach(function(a) {
 var allPd = true, hasAny = false;
 cols.forEach(function(c) {
 var v = c.valFor(a.id); if (v <= 0) return;
 hasAny = true;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][a.id]);
 if (!pd) allPd = false;
 if (c.cur === 'LBP') { lbpSum += v; if (pd) lbpGot += v; }
 else { usdSum += v; if (pd) usdGot += v; }
 });
 if (hasAny) {
 activeUnits++;
 if (allPd) settled++;
 }
 });

 var expUsd = 0;
 DB.expenses.forEach(function(e) {
 if (e.month === cKey) {
 expUsd += e.cur === 'LBP' ? (Number(e.amt) / rate) : Number(e.amt);
 }
 });

 var eqGotUsd = usdGot + (lbpGot / rate);
 var eqSumUsd = cyc.isProject && cyc.targetBudget ? Math.max(Number(cyc.targetBudget), usdSum + (lbpSum / rate)) : (usdSum + (lbpSum / rate));
 var netCycleUsd = eqGotUsd - expUsd;
 var pct = eqSumUsd > 0 ? Math.min(100, Math.round((eqGotUsd / eqSumUsd) * 100)) : 0;
 return { usdGot:usdGot, usdSum:usdSum, lbpGot:lbpGot, lbpSum:lbpSum, eqGotUsd:eqGotUsd, eqSumUsd:eqSumUsd, expUsd:expUsd, netCycleUsd:netCycleUsd, settled:settled, total:activeUnits || DB.apartments.length, pct:pct };
}

function getTreasury() {
 var rate = Number(DB.settings.rate) || 89500;
 var inUsd = 0, inLbp = 0, outUsd = 0, outLbp = 0;
 Object.keys(DB.cycles).forEach(function(ck) {
 // Avoid double counting linked project installments if already counted in monthly cycle
 var cyc = DB.cycles[ck];
 var cols = getCycleCols(ck);
 DB.apartments.forEach(function(a) {
 cols.forEach(function(c) {
 if (c.linkedProject) return; // Counted inside the project itself
 var v = c.valFor(a.id); if (v <= 0) return;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][a.id]);
 if (pd) {
 if (c.cur === 'LBP') inLbp += v; else inUsd += v;
 }
 });
 });
 });
 DB.expenses.forEach(function(e) {
 if (e.cur === 'LBP') outLbp += Number(e.amt) || 0;
 else outUsd += Number(e.amt) || 0;
 });
 var netUsd = (Number(DB.settings.initialUsd) || 0) + inUsd - outUsd;
 var netLbp = (Number(DB.settings.initialLbp) || 0) + inLbp - outLbp;
 var refVal = REF_CUR === 'USD' ? (netUsd + netLbp / rate) : (netLbp + netUsd * rate);
 return { netUsd: netUsd, netLbp: netLbp, refVal: refVal };
}

function buildDonutSvg(segments, totalUsdStr, subLabel) {
 var r = 74, c = 2 * Math.PI * r, offset = 0, circles = '';
 if (!segments.length) {
 circles = '<circle cx="95" cy="95" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="22"/>';
 } else {
 segments.forEach(function(seg) {
 var len = Math.max(0, (seg.pct / 100) * c - 3);
 circles += '<circle cx="95" cy="95" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="22" stroke-linecap="round" stroke-dasharray="' + len + ' ' + c + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 95 95)"/>';
 offset += (seg.pct / 100) * c;
 });
 }
 return '<div class="chart-wrap"><svg width="190" height="190" viewBox="0 0 190 190">' + circles + '</svg>'
 + '<div class="donut-center"><b dir="ltr">' + totalUsdStr + '</b><span>' + esc(subLabel) + '</span></div></div>';
}

function isAptSettled(apt, cKey) {
 var cyc = DB.cycles[cKey];
 var cols = getCycleCols(cKey);
 var dueU = 0, dueL = 0, hasCharges = false;
 cols.forEach(function(c) {
 var v = c.valFor(apt.id); if (v <= 0) return;
 hasCharges = true;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][apt.id]);
 if (!pd) { if (c.cur === 'LBP') dueL += v; else dueU += v; }
 });
 return hasCharges && dueU === 0 && dueL === 0;
}

function buildWhatsAppText(apt, overrideLang, forceState) {
 var cyc = DB.cycles[SELECTED_MONTH];
 var cols = getCycleCols(SELECTED_MONTH);
 var mode = overrideLang || apt.prefLang || 'both';
 var itemsAr = [], itemsEn = [], u = 0, l = 0;

 cols.forEach(function(c) {
 var v = c.valFor(apt.id); if (v <= 0) return;
 var pd = !!(cyc.paid && cyc.paid[c.id] && cyc.paid[c.id][apt.id]);
 var tickMark = (forceState === 'receipt' || pd) ? ' ✅' : '';
 itemsAr.push('• ' + (c.ar || c.en) + ': ' + fmt(v, c.cur, 'ar') + tickMark);
 itemsEn.push('• ' + c.en + ': ' + fmt(v, c.cur, 'en') + tickMark);
 if (!pd) { if (c.cur === 'LBP') l += v; else u += v; }
 });

 var settled = (forceState === 'receipt') || (forceState !== 'due' && u === 0 && l === 0);

 var dueAr = [], dueEn = [];
 if (u > 0) { dueAr.push(fmt(u, 'USD', 'ar')); dueEn.push(fmt(u, 'USD', 'en')); }
 if (l > 0) { dueAr.push(fmt(l, 'LBP', 'ar')); dueEn.push(fmt(l, 'LBP', 'en')); }

 var tplAr = settled ? (DB.waReceiptAr || DEFAULT_DB.waReceiptAr) : (DB.waTemplateAr || DEFAULT_DB.waTemplateAr);
 var tplEn = settled ? (DB.waReceiptEn || DEFAULT_DB.waReceiptEn) : (DB.waTemplateEn || DEFAULT_DB.waTemplateEn);

 var blockAr = tplAr
 .replace('{building}', DB.settings.bldAr || DB.settings.bldEn)
 .replace('{month}', dispCycleName(SELECTED_MONTH, 'ar'))
 .replace('{name}', apt.ar || apt.en)
 .replace('{unit}', apt.code)
 .replace('{items}', itemsAr.join('\n'))
 .replace('{due}', dueAr.join(' + ') || 'مسدّد بالكامل ✅')
 .replace('{collector}', DB.settings.collectorAr || DB.settings.collectorEn);

 var blockEn = tplEn
 .replace('{building}', DB.settings.bldEn)
 .replace('{month}', dispCycleName(SELECTED_MONTH, 'en'))
 .replace('{name}', apt.en)
 .replace('{unit}', apt.code)
 .replace('{items}', itemsEn.join('\n'))
 .replace('{due}', dueEn.join(' + ') || 'All Settled ✅')
 .replace('{collector}', DB.settings.collectorEn);

 if (mode === 'ar') return blockAr;
 if (mode === 'en') return blockEn;
 return blockAr + '\n\n────────────\n\n' + blockEn;
}

function buildWaLink(apt) {
 var txt = buildWhatsAppText(apt);
 return 'https://wa.me/' + String(apt.ph || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(txt);
}

 h += '<div class="chip-grid">';
 cols.forEach(function(c) {
 var v = c.valFor(a.id); if (v <= 0) return;

 var cLabel = ar ? (c.ar || c.en) : c.en;
 h += '<button class="chip' + (pd ? ' ticked' : '') + '" onclick="toggleTick(\'' + c.id + '\',\'' + a.id + '\')">'

 });

 });

function updateProjCalcPreview() {
 var el = document.getElementById('nc-calc-preview');
 if (!el) return;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var checked = document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').length || 1;
 var downPerUnit = Math.round((down / checked) * 100) / 100;
 var moPerUnit = Math.round((((Math.max(0, budget - down)) / mos) / checked) * 100) / 100;
 el.innerHTML = t(
 '⚡ Auto-Split (' + checked + ' units): <b>$' + downPerUnit + '/unit</b> Down + <b>$' + moPerUnit + '/unit/mo</b> × ' + mos + ' mos.',
 '⚡ التقسيم التلقائي (' + checked + ' شقق): <b>$' + downPerUnit + ' للشقة</b> دفعة أولى + <b>$' + moPerUnit + ' شهرياً</b> × ' + mos + ' أشهر.'
 );
}

function saveNewCycleModal() {
 if (ncType === 'month') {
 var m = document.getElementById('nc-mon').value;
 var y = document.getElementById('nc-yr').value;
 var name = m + ' ' + y;
 if (!DB.cycles[name]) {
 var copyPrev = document.getElementById('nc-copy').checked;
 var prev = DB.cycles['October 2026'] || DB.cycles[SELECTED_MONTH] || { fixed: [], services: [] };
 DB.cycles[name] = {
 isProject: false,
 arLabel: dispCycleName(name, 'ar'),
 published: false,
 fixed: copyPrev ? JSON.parse(JSON.stringify(prev.fixed || [])) : [],
 dues: [],
 services: copyPrev ? JSON.parse(JSON.stringify(prev.services || [])) : [],
 paid: {}
 };
 }
 SELECTED_MONTH = name;
 saveDB(); closeModal('new-cycle-modal'); showToast(t('Created: ' + name, 'تم إنشاء: ' + dispCycleName(name, 'ar')));
 setTab('setup');
 } else {
 var pEn = document.getElementById('nc-proj-en').value.trim();
 var pAr = document.getElementById('nc-proj-ar').value.trim() || pEn;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var injectIntoMonth = document.getElementById('nc-inject').checked;
 if (!pEn || budget <= 0) { alert(t('Enter project title and target budget', 'أدخل اسم المشروع والميزانية')); return; }

 var activeUnits = [];
 document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').forEach(function(cb) {
 activeUnits.push(cb.getAttribute('data-u'));
 });
 if (!activeUnits.length) activeUnits = DB.apartments.map(function(a) { return a.id; });

 var count = activeUnits.length;
 var downPerUnit = Math.round((down / count) * 100) / 100;
 var moPerUnit = Math.round((((budget - down) / mos) / count) * 100) / 100;

 var svList = [];
 if (down > 0) {
 var dMap = {};
 activeUnits.forEach(function(uId) { dMap[uId] = downPerUnit; });
 svList.push({ id: 'sp_down_' + Date.now(), en: 'Initial Down Payment ($' + down + ' Split)', ar: 'الدفعة الأولى (من أصل $' + down + ')', cur: 'USD', map: dMap });
 }
 var firstInstId = 'sp_m1_' + Date.now();
 for (var i = 1; i <= mos; i++) {
 var mMap = {};
 activeUnits.forEach(function(uId) { mMap[uId] = moPerUnit; });
 var cId = (i === 1) ? firstInstId : ('sp_m' + i + '_' + Date.now());
 svList.push({ id: cId, en: 'Installment ' + i + ' of ' + mos, ar: 'القسط الشهري ' + i + ' من ' + mos, cur: 'USD', map: mMap });
 }

 DB.cycles[pEn] = {
 isProject: true,
 arLabel: pAr,
 published: true,
 targetBudget: budget,
 downPaymentTotal: down,
 installmentMonths: mos,
 fixed: [], dues: [], services: svList, paid: {}
 };

 // If auto-inject is checked, add Installment 1 into October 2026
 if (injectIntoMonth && DB.cycles['October 2026']) {
 DB.cycles['October 2026'].dues.push({
 id: 'due_' + firstInstId,
 en: '🛠️ ' + pEn + ' (Inst. 1/' + mos + ')',
 ar: '🛠️ ' + pAr + ' (قسط 1/' + mos + ')',
 amt: moPerUnit,
 cur: 'USD',
 linkedProject: pEn,
 linkedColId: firstInstId
 });
 }

 SELECTED_MONTH = pEn;
 CYCLE_DETAIL_MODE = true;
 saveDB(); closeModal('new-cycle-modal');
 showToast(t('Project created!', 'تم إنشاء المشروع!'));
 setTab('dash');
 }
}

function deleteSelectedCycle() {

}

function saveWhishPayment() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var channel = document.getElementById('wp-channel').value;
 var dt = document.getElementById('wp-date').value || todayIso();
 var amt = Number(document.getElementById('wp-amt').value) || 0;
 var cur = document.getElementById('wp-cur').value;
 var ref = document.getElementById('wp-ref').value.trim() || ('WH-' + Math.floor(1000 + Math.random()*9000));
 var apt = DB.apartments.filter(function(a){return a.id===aptId;})[0];

 var cyc = DB.cycles[cKey];
 cyc.paid = cyc.paid || {};
 getCycleCols(cKey).forEach(function(c) {
 if (c.valFor(aptId) > 0) {
 cyc.paid[c.id] = cyc.paid[c.id] || {};
 cyc.paid[c.id][aptId] = 1;
 if (c.linkedProject && DB.cycles[c.linkedProject]) {
 var pCyc = DB.cycles[c.linkedProject];
 var tCol = c.linkedColId || 'sp_m1';
 pCyc.paid[tCol] = pCyc.paid[tCol] || {};
 pCyc.paid[tCol][aptId] = 1;
 }
 }
 });

 DB.ledger.unshift({
 id: 'l_' + Date.now(),
 desc: apt.en + ' (' + apt.code + ') · ' + cKey,
 sub: channel,
 channel: channel,
 amt: amt, cur: cur, type: 'in', at: dt, ref: ref
 });

 saveDB(); closeModal('whish-modal');
 showToast(t('Payment recorded via ' + channel + '!', 'تم تسجيل الدفعة عبر ' + channel + '!'));
 render();
}

}

 var h = '<div class="card-h"><h3>⚙️ ' + t('Building & Account Settings', 'إعدادات البناية والحساب') + '</h3><button class="btn-del" onclick="closeModal(\'settings-modal\')">✕</button></div>';
 h += '<div class="row-div"><label style="font-size:12px;color:var(--mut)">' + t('Building Name (EN / AR)', 'اسم البناية (EN / AR)') + '</label><div class="two-col-grid" style="margin-top:4px"><input type="text" value="' + esc(DB.settings.bldEn) + '" onchange="DB.settings.bldEn=this.value;saveDB();render()"><input type="text" dir="rtl" value="' + esc(DB.settings.bldAr) + '" onchange="DB.settings.bldAr=this.value;saveDB();render()"></div></div>';
 h += '<div class="row-div"><label style="font-size:12px;color:var(--mut)">' + t('Collector / Natour Name (EN / AR)', 'اسم الناطور (EN / AR)') + '</label><div class="two-col-grid" style="margin-top:4px"><input type="text" value="' + esc(DB.settings.collectorEn) + '" onchange="DB.settings.collectorEn=this.value;saveDB();render()"><input type="text" dir="rtl" value="' + esc(DB.settings.collectorAr) + '" onchange="DB.settings.collectorAr=this.value;saveDB();render()"></div></div>';
 h += '<div class="row-div"><label style="font-size:12px;color:var(--mut)">' + t('Exchange Rate (LBP per $1 USD)', 'سعر الصرف (ل.ل. لكل 1 دولار)') + '</label><input type="number" dir="ltr" style="margin-top:4px" value="' + (DB.settings.rate || 89500) + '" onchange="DB.settings.rate=Number(this.value)||89500;saveDB();render()"></div>';
 h += '<div class="row-div"><button style="width:100%;padding:10px;background:var(--card2);border:1px solid var(--line)" onclick="closeModal(\'settings-modal\');openOnboarding(1)">✨ ' + t('Re-open First-Time Setup Wizard', 'إعادة فتح معالج الإعداد الأولي') + '</button></div>';
 document.getElementById('settings-content').innerHTML = h;
 openModal('settings-modal');
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function showToast(msg) {
 var el = document.getElementById('toast');
 document.getElementById('toast-msg').textContent = msg;
 el.classList.add('pop');
 setTimeout(function() { el.classList.remove('pop'); }, 2800);
}
function setRole(r) {
 ROLE = r;
 document.getElementById('sim-mgr').className = r === 'mgr' ? 'on' : '';
 document.getElementById('sim-col').className = r === 'col' ? 'on' : '';
 render();
}
function setTab(tName) {
 TAB = tName;
 document.querySelectorAll('#mgr-dock button').forEach(function(b) {
 b.className = b.getAttribute('data-tab') === tName ? 'on' : '';
 });
 render();
 window.scrollTo(0, 0);
}
function toggleLang() { LANG = LANG === 'ar' ? 'en' : 'ar'; render(); }
function toggleTheme() {
 var root = document.documentElement;
 root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

render();
</script>
</body>
</html>
