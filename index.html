<title>Binayati · بنايتي — V14.1 Smart Building Manager</title>

<style>
:root {
 --bg: #f4f5fb; --card: #ffffff; --card2: #f8f9fe; --ink: #14172c; --mut: #6e7491; --line: #e6e8f4;
 --soft: #eeebff; --acc: #5b4cf5; --acc2: #7c6ff9;
 --hero: linear-gradient(145deg, #5444f2 0%, #6e5ef7 55%, #8273fa 100%);
 --ok: #10b981; --okbg: rgba(16, 185, 129, 0.12); --warn: #f59e0b; --wbg: rgba(245, 158, 11, 0.12);
 --bad: #ef4444; --errbg: rgba(239, 68, 68, 0.11); --purp: #7c3aed; --purpbg: rgba(124, 58, 237, 0.11);
 --shadow: 0 10px 30px rgba(30, 26, 82, 0.06); --shadow-lg: 0 18px 45px rgba(91, 76, 245, 0.22);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
 margin: 0; background: var(--bg); color: var(--ink);
 font: 14.5px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
 font-variant-numeric: tabular-nums; padding-bottom: 115px; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 14px; font-weight: 700; transition: all .16s ease; }
button:active { transform: scale(0.96); }

.sim-strip {
 background: #14172c; color: #ffffff; padding: 6px 12px; font-size: 12px;
 display: flex; align-items: center; justify-content: space-between; gap: 6px; position: relative; z-index: 100;
}
.sim-pills { display: flex; background: rgba(255,255,255,0.1); border-radius: 999px; padding: 2px; }
.sim-pills button { background: transparent; color: #cbd5e1; border-radius: 999px; padding: 4px 10px; font-size: 11px; }
.sim-pills button.on { background: var(--acc); color: #fff; }
.sim-right { display: flex; gap: 6px; }
.sim-right button { background: rgba(255,255,255,0.14); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11px; }

.shell { max-width: 480px; margin: 0 auto; overflow-x: hidden; }

.indigo-hero {
 background: var(--hero); color: #ffffff; padding: 16px 18px 26px; border-radius: 0 0 32px 32px;
 box-shadow: var(--shadow-lg); margin-bottom: 14px; position: relative;
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.hero-pill {
 background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); color: #fff; padding: 6px 13px;
 border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
}
/* ---- Living building hero (Home) ---- */
.home-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px 10px; }
.home-pill { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
.home-cur-toggle { display: inline-flex; background: var(--soft); padding: 3px; border-radius: 999px; gap: 2px; }
.home-cur-toggle button { background: transparent; color: var(--mut); padding: 5px 11px; font-size: 11.5px; border-radius: 999px; }
.home-cur-toggle button.on { background: var(--card); color: var(--acc); box-shadow: 0 1px 4px rgba(20,23,44,.12); }
.bh { position: relative; margin: 0 16px 12px; border-radius: 26px; overflow: hidden; aspect-ratio: 366 / 256; box-shadow: var(--shadow-lg); background: var(--sky2); }
.bh svg.bh-art { display: block; width: 100%; height: 100%; }
.bh-chip { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.bh-chip i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.bh.day .bh-chip { background: rgba(255,255,255,.82); color: #14172C; }
.bh.dusk .bh-chip, .bh.night .bh-chip { background: rgba(10,12,40,.5); color: #F3EEDC; }
.bh.day .bh-chip i { background: #F5A524; } .bh.dusk .bh-chip i { background: #FF9A6C; } .bh.night .bh-chip i { background: #F3EEDC; }
.bh.day { --sky1:#3FA9F5; --sky2:#8FD3FF; --sky3:#FFF1DC; --sun:#FFF4CF; --cloud:rgba(255,255,255,.88); --mount:#B4C6DA; --far:#C3D0E0; --neigh:#DDD1C1; --nline:#CABEAC; --nw:#8FA5BD; --nwlit:#8FA5BD; --facade:#ECE2CF; --shade:#CDBDA2; --parapet:#F6EFE2; --slab:#F8F2E7; --slabEdge:#B9A688; --lobby:#D6C7AE; --doorFrame:#5A4A38; --doorGlass:#A9C3DE; --side:#D2CBBD; --street:#8F8B98; --lane:#EDEAE2; --pole:#56515E; --wire:#3B3A44; --rail:#4E4234; --trunk:#6A5442; --leaf:#4E8B5F; --leaf2:#76AD7F; --tankBase:#8D8577; --ac:#F4F6FA; --core:#BFC9D3; --sh:#7E9E86; --sl:#5F7F68; --w1:#FCE7B8; --w2:#F2C077; --w3:#EDB566; --glassOff:#4A5A75; --bulb:#E5E2D8; }
.bh.dusk { --sky1:#3B6FD8; --sky2:#F59FB5; --sky3:#FFD49A; --sun:#FFB36B; --cloud:rgba(255,228,218,.8); --mount:#9AA6DD; --far:#AEB3E2; --neigh:#C4BCDF; --nline:#B0A8D0; --nw:#8A90C2; --nwlit:#FFC56E; --facade:#F3DFCB; --shade:#CCB2A8; --parapet:#FCEDE0; --slab:#FFF4EA; --slabEdge:#BC9E93; --lobby:#DCC3B2; --doorFrame:#5A4440; --doorGlass:#FFC35E; --side:#CDBDCB; --street:#76729A; --lane:#EAE4F3; --pole:#4A4266; --wire:#3A3256; --rail:#4A3A3E; --trunk:#5E4A40; --leaf:#4C7A62; --leaf2:#6E9E7E; --tankBase:#8A7E8E; --ac:#F4F2F8; --core:#BCB8DA; --sh:#7E9E86; --sl:#5F7F68; --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#5B6386; --bulb:#FFF4D6; }
.bh.night { --sky1:#0E1A4A; --sky2:#22357F; --sky3:#4262B4; --sun:#F7F1DE; --cloud:transparent; --mount:#2F428C; --far:#2C3A7C; --neigh:#36438A; --nline:#2B3775; --nw:#45529A; --nwlit:#FFC56E; --facade:#5E6DB0; --shade:#404D8C; --parapet:#7886C6; --slab:#8A99D8; --slabEdge:#B3BEEE; --lobby:#4A5796; --doorFrame:#1C2350; --doorGlass:#FFC35E; --side:#3D4A88; --street:#1C275C; --lane:#6572AE; --pole:#18204A; --wire:#121A40; --rail:#1A2150; --trunk:#2E2630; --leaf:#2D5260; --leaf2:#427080; --tankBase:#404D8C; --ac:#DCE2F4; --core:#5463A8; --sh:#7080B8; --sl:#5A6AA2; --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#2C3774; --bulb:#FFF8E2; }
.bh.eve { --sky1:#1E2160; --sky2:#5B4E8E; --sky3:#C97E8A; --sun:#FF9A7A; --cloud:rgba(255,190,190,.35); --mount:#4A4688; --far:#4F4888; --neigh:#4A4277; --nline:#3F386A; --nw:#3A3566; --nwlit:#F0B05A; --facade:#8E7E9E; --shade:#5E5276; --parapet:#A595B2; --slab:#B3A3BE; --slabEdge:#6E6290; --lobby:#6E5F86; --doorFrame:#2E2448; --doorGlass:#FFC35E; --side:#5E5486; --street:#34305A; --lane:#8C84B0; --pole:#241F3E; --wire:#1A1530; --rail:#22193A; --trunk:#3A2E30; --leaf:#2A4448; --leaf2:#3B5C5E; --tankBase:#4A4266; --ac:#D4D2E2; --core:#62598E; --sh:#556A62; --sl:#43554D; --w1:#FFE6A6; --w2:#FFC35E; --w3:#E38A36; --glassOff:#2C2E58; --bulb:#FFF4D6; }
.bh.eve .bh-chip { background: rgba(10,12,40,.5); color: #F3EEDC; }
.bh.eve .bh-moon { display: none; }
.bh.eve .bh-star { opacity: .6; }
.bh.eve .bh-lampglow { opacity: .9; }
.bh.bh-ob { margin: 0 0 14px; border-radius: 22px; box-shadow: 0 10px 28px rgba(20,23,44,.18); }
.bh-stream { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 3 6; animation: bhDash 1s linear infinite; }
.bh-drop { fill: #3B9EFF; opacity: 0; }
.bh.drops .bh-drop { animation: bhDrop 1.8s ease-in infinite; }
.bh-burst { transform-box: fill-box; transform-origin: center; animation: bhBurst 3.6s ease-out infinite both; }
.bh-pop { animation: bhPop .5s cubic-bezier(.2,.8,.2,1.3) both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes bhDash { to { stroke-dashoffset: -18; } }
@keyframes bhDrop { 0% { transform: translateY(-14px); opacity: 0; } 25% { opacity: 1; } 75% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(2px); opacity: 0; } }
@keyframes bhBurst { 0% { transform: scale(.15); opacity: 0; } 8% { opacity: 1; } 55% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(1.12); opacity: 0; } }
@keyframes bhPop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.bh-mount{fill:var(--mount)} .bh-far{fill:var(--far)} .bh-neigh{fill:var(--neigh)} .bh-nline{fill:var(--nline)} .bh-nw{fill:var(--nw)} .bh-nw.lit{fill:var(--nwlit)}
.bh-facade{fill:var(--facade)} .bh-shade{fill:var(--shade)} .bh-parapet{fill:var(--parapet)} .bh-slab{fill:var(--slab)} .bh-slabEdge{fill:var(--slabEdge)}
.bh-lobby{fill:var(--lobby)} .bh-doorFrame{fill:var(--doorFrame)} .bh-doorGlass{fill:var(--doorGlass)} .bh-side{fill:var(--side)} .bh-street{fill:var(--street)} .bh-lane{fill:var(--lane)}
.bh-pole{fill:var(--pole)} .bh-wire{fill:none;stroke:var(--wire);stroke-width:.6;stroke-linecap:round} .bh-rail{fill:none;stroke:var(--rail)}
.bh-trunk{fill:none;stroke:var(--trunk);stroke-width:2.2;stroke-linecap:round} .bh-leaf{fill:var(--leaf)} .bh-leaf2{fill:var(--leaf2)}
.bh-tankBase{fill:var(--tankBase)} .bh-ac{fill:var(--ac)} .bh-bulb{fill:var(--bulb)} .bh-cloud{fill:var(--cloud)}
.bh-core{fill:var(--core)} .bh.elev .bh-core{fill:#7FE3C2;animation:bhCore 2.2s ease-in-out infinite}
.bh-glassOff{fill:var(--glassOff)} .bh-mull{fill:rgba(0,0,0,.32)}
.bh-win{cursor:pointer;outline:none}
.bh-win:focus-visible .bh-frame{stroke:#FFFFFF;stroke-width:1.4}
.bh-dot{fill:#F59E0B;stroke:#FFFFFF;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:bhPulse 1.8s ease-in-out infinite}
.bh.day .bh-halo{display:none}
.bh.day .bh-lampglow{opacity:0} .bh.dusk .bh-lampglow{opacity:.7}
.bh.day .bh-moon, .bh.dusk .bh-moon, .bh.day .bh-star{display:none}
.bh.dusk .bh-star{opacity:.35}
.bh.night .bh-sun, .bh.night .bh-cloud{display:none}
.bh-star{fill:#FFF6DA;animation:bhTw 3s ease-in-out infinite}
.bh-cloud{animation:bhDrift 16s ease-in-out infinite alternate}
.bh-bob{animation:bhBob 2.4s ease-in-out infinite}
@keyframes bhCore{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes bhPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes bhTw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bhDrift{from{transform:translateX(0)}to{transform:translateX(16px)}}
@keyframes bhBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion: reduce){.bh *{animation:none!important}}
/* Onboarding studio (building only), reveal + confetti */
.bh.studio { --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#5D6B85; }
.bh.studio .bh-halo { display: inline; }
.bh.bh-bare { aspect-ratio: auto; width: 100%; height: 100%; margin: 0; border-radius: 0; box-shadow: none; background: transparent; overflow: visible; }
.bh.nopop .bh-pop { animation: none; }
.bh.reveal { background: transparent; }
.bh.reveal .bh-bg { animation: bhReveal 1.8s ease .35s both; }
.bh.reveal .bh-chip { animation: bhReveal .8s ease 1.6s both; }
@keyframes bhReveal { from { opacity: 0; } to { opacity: 1; } }
.cf-layer { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.cf-layer i { position: absolute; top: -24px; width: 8px; height: 13px; border-radius: 2px; animation-name: cfFall; animation-timing-function: cubic-bezier(.25,.6,.4,1); animation-fill-mode: forwards; }
@keyframes cfFall { to { transform: translateY(112vh) rotate(560deg); } }

#onboard-modal { padding: 0; background: linear-gradient(180deg, #EEF0FF 0%, #F7F5FF 45%, #FFFFFF 100%); backdrop-filter: none; -webkit-backdrop-filter: none; }
#onboard-content { width: 100%; max-width: 480px; height: 100%; max-height: none; border: 0; border-radius: 0; box-shadow: none; padding: 0; background: transparent; overflow: hidden; }
.ob-screen { height: 100%; display: flex; flex-direction: column; }
.ob-top { display: flex; justify-content: space-between; align-items: center; padding: calc(12px + env(safe-area-inset-top)) 20px 4px; }
.ob-progress { display: flex; gap: 4px; padding: 8px 20px 0; }
.ob-progress i { flex: 1; height: 5px; border-radius: 999px; background: #DDD9F0; transition: background .3s; }
.ob-progress i.on { background: var(--acc); }
.ob-stage { position: relative; flex: 0 0 auto; height: clamp(110px, calc(100vh - 560px), 250px); height: clamp(110px, calc(100dvh - 560px), 250px); padding: 8px 14px 0; display: flex; justify-content: center; }
.ob-stage::before { content: ""; position: absolute; left: 50%; bottom: 4%; width: 82%; height: 86%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(124,111,249,.18) 0%, rgba(124,111,249,0) 70%); }
.ob-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 20px 4px; display: flex; flex-direction: column; gap: 8px; }
.ob-title { margin: 0; font-size: 23px; line-height: 1.15; font-weight: 800; color: var(--ink); }
.ob-sub { margin: 0 0 2px; font-size: 13.5px; line-height: 1.45; color: var(--mut); }
.ob-foot { flex: 0 0 auto; display: flex; gap: 10px; padding: 10px 20px calc(14px + env(safe-area-inset-bottom)); }
.ob-back { height: 52px; padding: 0 18px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; }
.ob-next { flex: 1; height: 52px; border-radius: 16px; background: var(--acc); color: #FFFFFF; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px rgba(91,76,245,.3); }
.ob-next.green { background: #0E7C55; box-shadow: 0 8px 20px rgba(14,124,85,.28); }
.ob-card { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); text-align: start; color: var(--ink); }
.ob-card.on { border-color: var(--acc); background: var(--soft); }
.ob-card .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; font-size: 20px; }
.ob-card.on .ic { background: #FFFFFF; }
.ob-card b { display: block; font-size: 14.5px; }
.ob-card small { display: block; font-size: 12px; color: var(--mut); margin-top: 2px; line-height: 1.35; font-weight: 500; }
.ob-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 10px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: start; color: var(--ink); }
.ob-row b { font-size: 14px; display: block; }
.ob-row small { display: block; font-size: 12px; color: var(--mut); font-weight: 500; margin-top: 1px; }
.ob-stepper { display: flex; align-items: center; gap: 8px; flex: none; }
.ob-stepper button { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card2); font-size: 20px; font-weight: 700; color: var(--ink); }
.ob-stepper span { min-width: 44px; text-align: center; font-size: 17px; font-weight: 800; }
.ob-sw { flex: none; position: relative; width: 46px; height: 28px; border-radius: 14px; background: #CFCCDD; transition: background .2s; }
.ob-sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.ob-sw.on { background: var(--acc); }
.ob-sw.on::after { transform: translateX(18px); }
.ob-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.ob-pill { padding: 7px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 700; color: var(--ink); }
.ob-pill.on { background: var(--acc); border-color: var(--acc); color: #FFFFFF; }
.ob-badge { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; margin-inline-start: 6px; vertical-align: 1px; }
.ob-badge.nat { background: #FFF3DC; color: #8A5300; }
.ob-badge.you { background: var(--soft); color: var(--acc); }
.ob-lbl { font-size: 12px; font-weight: 700; color: var(--mut); display: block; margin-bottom: 4px; }
.ob-note { font-size: 12.5px; font-weight: 700; padding: 9px 12px; border-radius: 12px; background: var(--soft); color: var(--acc); line-height: 1.4; }
.ob-recap { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.ob-recap div { display: flex; justify-content: space-between; gap: 10px; }
.ob-recap span { color: var(--mut); font-weight: 600; }
.safe-lbl { font-size: 12px; font-weight: 700; color: var(--mut); }
.safe-num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 2px; color: var(--ink); }
.owe-chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #F2C77E; background: #FFF6E6; color: #7A4A00; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.owe-chip span { font-weight: 600; }
.qa-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.qa { background: var(--card2); border: 1px solid var(--line); color: var(--ink); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.qa span { font-size: 10.5px; color: var(--mut); font-weight: 700; }
.qa b { font-size: 14px; font-weight: 800; }
.qa.cta { background: var(--acc); border-color: var(--acc); color: #FFFFFF; box-shadow: 0 8px 20px rgba(91,76,245,.3); }
.qa.cta span { color: rgba(255,255,255,.85); }
.home-note { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; font-size: 12.5px; font-weight: 700; line-height: 1.4; margin-top: 10px; }
.home-note i { flex: none; width: 9px; height: 9px; border-radius: 50%; display: block; }
.hero-center { text-align: center; margin: 6px 0 16px; }
.hero-center .lbl { font-size: 12.5px; opacity: 0.85; font-weight: 600; }

.hero-cur-toggle { display: inline-flex; background: rgba(0,0,0,0.18); padding: 3px; border-radius: 999px; gap: 2px; }
.hero-cur-toggle button { background: transparent; color: rgba(255,255,255,0.75); padding: 4px 11px; font-size: 11px; border-radius: 999px; }
.hero-cur-toggle button.on { background: #ffffff; color: var(--acc); }
.hero-stats-grid {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
 background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.2);
 border-radius: 20px; padding: 12px 10px; text-align: center; backdrop-filter: blur(8px);
}
.hero-stats-grid .stat-tile {
 display: block; width: 100%; background: transparent; padding: 0; border-radius: 14px; color: inherit;
}
.hero-stats-grid .stat-tile span { display: block; font-size: 10.5px; opacity: 0.82; font-weight: 600; }
.hero-stats-grid .stat-tile b { display: block; font-size: 15px; font-weight: 800; margin-top: 2px; }
.hero-stats-grid .stat-tile small { display: block; font-size: 10px; opacity: 0.78; margin-top: 1px; }

 background: #ffffff; padding: 8px 4px; box-shadow: 0 6px 16px rgba(20,23,44,0.22);
}

function loadDB() {
 var base = JSON.parse(JSON.stringify(DEFAULT_DB));
 try {
 var r = localStorage.getItem(STORAGE_KEY);
 if (r) {
 var saved = JSON.parse(r);
 for (var k in saved) {
 if (k === 'settings') base.settings = Object.assign({}, base.settings, saved.settings);
 else base[k] = saved[k];
 }
 }
 } catch (e) {}
 ['reminders', 'completedTasks', 'expenses', 'ledger', 'apartments'].forEach(function(k) {
 if (!Array.isArray(base[k])) base[k] = [];
 });
 if (!base.cycles || typeof base.cycles !== 'object') base.cycles = {};
 return base;
}
var DB = loadDB();
function saveDB() {
 try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (e) {}
}

function t(en, ar) { return LANG === 'ar' ? ar : en; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayIso() {
 var d = new Date();
 return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function esc(s) {
 return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
 .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* Safe way to pass a name into an inline onclick: produces a quoted JS string, HTML-escaped. */
function jsArg(s) { return esc(JSON.stringify(String(s))); }

function fmt(amt, cur, lang) {
 var n = Number(amt) || 0;
 var sign = n < 0 ? '-' : '';
 n = Math.abs(n);
 if (cur === 'LBP') return sign + 'LBP ' + Math.round(n).toLocaleString('en-US');
 return sign + '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function dispCycleName(key, lang) {
 lang = lang || LANG;
 var cyc = DB.cycles[key];
 if (cyc && cyc.isProject) return lang === 'ar' ? (cyc.arLabel || key) : key;
 if (lang !== 'ar') return key;
 var parts = String(key).split(' ');
 var idx = MONTHS_EN.indexOf(parts[0]);
 if (idx < 0) return key;
 return MONTHS_AR[idx] + ' ' + (parts[1] || '');
}

function getRate() { return Number(DB.settings.rate) || 89500; }

<script>
/* ============================================================================
 4. CALCULATION HELPERS (these were referenced but never defined)
 ============================================================================ */
function cellState(cyc, colId, aId) {
 return (cyc && cyc.paid && cyc.paid[colId] && cyc.paid[colId][aId]) || 0;
}

/* Columns of a month/project. buildingOnly=true excludes pass-through supplier subscriptions. */
function getCycleCols(cKey, buildingOnly) {
 var cyc = DB.cycles[cKey];
 if (!cyc) return [];
 var cols = [];
 (cyc.fixed || []).forEach(function(f) {
 cols.push({
 id: f.id, en: f.en, ar: f.ar, cur: f.cur || 'USD', passThrough: false,
 valFor: function(aId) {
 var ex = f.exc || {};
 return ex[aId] != null ? Number(ex[aId]) || 0 : Number(f.amt) || 0;
 }
 });
 });
 (cyc.dues || []).forEach(function(d) {
 cols.push({
 id: d.id, en: d.en, ar: d.ar, cur: d.cur || 'USD', passThrough: false,
 linkedProject: d.linkedProject, linkedColId: d.linkedColId,
 valFor: function() { return Number(d.amt) || 0; }
 });
 });
 (cyc.services || []).forEach(function(sv) {
 if (buildingOnly && sv.passThrough) return;
 cols.push({
 id: sv.id, en: sv.en, ar: sv.ar, cur: sv.cur || 'USD', passThrough: !!sv.passThrough,
 valFor: function(aId) { return Number((sv.map || {})[aId]) || 0; }
 });
 });
 return cols;
}

function getCycleStats(cKey) {
 var rate = getRate();
 var s = {
 eqGotUsd: 0, eqSumUsd: 0, settled: 0, total: 0, pct: 0,
 expUsd: 0, netCycleUsd: 0,
 mgrUsdGot: 0, mgrLbpGot: 0,
 natNetUsd: 0, natNetLbp: 0,
 supGotUsd: 0, supSumUsd: 0
 };
 var cyc = DB.cycles[cKey];
 if (!cyc) return s;

 var bldCols = getCycleCols(cKey, true);
 var allCols = getCycleCols(cKey, false);

 DB.apartments.forEach(function(a) {
 var anyV = false, owed = false;
 bldCols.forEach(function(c) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 anyV = true;
 var eq = c.cur === 'LBP' ? v / rate : v;
 s.eqSumUsd += eq;
 if (cellState(cyc, c.id, a.id) > 0) s.eqGotUsd += eq; else owed = true;
 });
 if (anyV) { s.total++; if (!owed) s.settled++; }
 });
 s.pct = s.eqSumUsd > 0 ? Math.round(s.eqGotUsd / s.eqSumUsd * 100) : 0;

 allCols.forEach(function(c) {
 DB.apartments.forEach(function(a) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 var st = cellState(cyc, c.id, a.id);
 var usdEq = c.cur === 'LBP' ? v / rate : v;
 if (c.passThrough) {
 s.supSumUsd += usdEq;
 if (st === 1) s.supGotUsd += usdEq;
 } else if (st === 1) {
 if (c.cur === 'LBP') s.natNetLbp += v; else s.natNetUsd += v;
 }
 if (st === 2) {
 if (c.cur === 'LBP') s.mgrLbpGot += v; else s.mgrUsdGot += v;
 }
 });
 });

 DB.expenses.forEach(function(e) {
 if (e.month !== cKey || e.payer === 'natour_pending') return;
 var amt = Number(e.amt) || 0;
 s.expUsd += e.cur === 'LBP' ? amt / rate : amt;
 if (e.payer === 'natour_paid') {
 if (e.cur === 'LBP') s.natNetLbp -= amt; else s.natNetUsd -= amt;
 }
 });
 s.netCycleUsd = s.eqGotUsd - s.expUsd;
 return s;
}

/* Building safe: initial balance + manager-side money in - building-safe bills out. */
function getSafeBalance() {
 var rate = getRate();
 var single = DB.settings.treasuryMode === 'single';
 var usd = Number(DB.settings.initialUsd) || 0;
 var lbp = single ? 0 : (Number(DB.settings.initialLbp) || 0);
 if (single) usd += (Number(DB.settings.initialLbp) || 0) / rate;

 Object.keys(DB.cycles).forEach(function(ck) {
 var cyc = DB.cycles[ck];
 getCycleCols(ck, true).forEach(function(c) {
 if (c.linkedProject) return; // Avoid double-counting linked project installments
 DB.apartments.forEach(function(a) {
 var v = c.valFor(a.id);
 if (v <= 0 || cellState(cyc, c.id, a.id) === 0) return;
 if (c.cur === 'LBP') { if (single) usd += v / rate; else lbp += v; }
 else usd += v;
 });
 });
 });

 (DB.expenses || []).forEach(function(e) {
 if (e.payer === 'natour_pending') return;
 var amt = Number(e.amt) || 0;
 if (e.cur === 'LBP') { if (single) usd -= amt / rate; else lbp -= amt; }
 else usd -= amt;
 });

 var refCur = single ? 'USD' : REF_CUR;
 var refVal = refCur === 'LBP' ? (lbp + usd * rate) : (usd + lbp / rate);
 return { netUsd: usd, netLbp: lbp, refVal: refVal };
}

function isAptSettled(a, cKey) {
 var cyc = DB.cycles[cKey];
 var any = false, owed = false;
 getCycleCols(cKey, true).forEach(function(c) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 any = true;
 if (cellState(cyc, c.id, a.id) === 0) owed = true;
 });
 return any && !owed;
}

/* Tap a chip: unpaid -> collected by Natour -> unpaid. Manager-paid chips reset to unpaid. */
function toggleTick(colId, aId) {
 var cyc = DB.cycles[SELECTED_MONTH];
 if (!cyc) return;
 cyc.paid = cyc.paid || {};
 cyc.paid[colId] = cyc.paid[colId] || {};
 var cur = cyc.paid[colId][aId] || 0;
 if (cur === 2 && !confirm(t('This was paid to the manager. Clear it?', 'هذا المبلغ مدفوع للمدير. هل تريد إلغاءه؟'))) return;
 var next = cur === 0 ? 1 : 0;
 if (next) cyc.paid[colId][aId] = next; else delete cyc.paid[colId][aId];

 var due = (cyc.dues || []).filter(function(d) { return d.id === colId; })[0];
 if (due && due.linkedProject && DB.cycles[due.linkedProject]) {
 var pc = DB.cycles[due.linkedProject];
 var tc = due.linkedColId || 'sp_m1';
 pc.paid = pc.paid || {};
 pc.paid[tc] = pc.paid[tc] || {};
 if (next) pc.paid[tc][aId] = next; else delete pc.paid[tc][aId];
 }
 saveDB(); render();
}

function renderWaBlock(a, lang, mode) {
 var cKey = SELECTED_MONTH, cyc = DB.cycles[cKey] || {};
 var wantPaid = mode === 'receipt';
 var lines = [], dueUsd = 0, dueLbp = 0;
 getCycleCols(cKey, false).forEach(function(c) {
 var v = c.valFor(a.id);
 if (v <= 0) return;
 var paid = cellState(cyc, c.id, a.id) > 0;
 if (wantPaid && !paid) return; /* receipts list only what was paid */
 var check = paid ? ' ✅' : '';
 lines.push('• ' + (lang === 'ar' ? (c.ar || c.en) : c.en) + ': ' + fmt(v, c.cur) + check);
 if (!paid) { if (c.cur === 'LBP') dueLbp += v; else dueUsd += v; }
 });
 var items = lines.length ? lines.join('\n') : (lang === 'ar' ? '• لا توجد مستحقات' : '• No items');
 var dueTxt = '';
 if (dueUsd > 0) dueTxt += fmt(dueUsd, 'USD');
 if (dueUsd > 0 && dueLbp > 0) dueTxt += ' + ';
 if (dueLbp > 0) dueTxt += fmt(dueLbp, 'LBP');
 if (!dueTxt) dueTxt = fmt(0, 'USD');

 var tpl = wantPaid ? (lang === 'ar' ? DB.waReceiptAr : DB.waReceiptEn) : (lang === 'ar' ? DB.waTemplateAr : DB.waTemplateEn);
 var name = lang === 'ar' ? (a.ar || a.en) : a.en;
 var collector = lang === 'ar' ? DB.settings.collectorAr : DB.settings.collectorEn;
 var bld = lang === 'ar' ? DB.settings.bldAr : DB.settings.bldEn;
 return String(tpl || '')
 .replace(/\{building\}/g, bld)
 .replace(/\{month\}/g, dispCycleName(cKey, lang))
 .replace(/\{name\}/g, name)
 .replace(/\{unit\}/g, a.code)
 .replace(/\{collector\}/g, collector)
 .replace(/\{due\}/g, dueTxt)
 .replace(/\{items\}/g, items);
}

function buildWhatsAppText(a, lang, mode) {
 if (mode === 'auto') mode = isAptSettled(a, SELECTED_MONTH) ? 'receipt' : 'due';
 var parts = [];
 if (lang === 'ar' || lang === 'both') parts.push(renderWaBlock(a, 'ar', mode));
 if (lang === 'en' || lang === 'both') parts.push(renderWaBlock(a, 'en', mode));
 return parts.join('\n\n━━━━━━━━━━\n\n');
}

function buildWaLink(a) {
 var digits = String(a.ph || '').replace(/\D/g, '');
 return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(buildWhatsAppText(a, a.prefLang || 'both', 'auto'));
}

/* Escape first, then turn *bold* markers into <strong>. */
function formatWaHtml(text) {
 return esc(text).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
}

function buildDonutSvg(segs, centerVal, centerLbl) {
 var total = segs.reduce(function(a, s) { return a + s.usd; }, 0);
 var R = 54, C = 2 * Math.PI * R, off = 0, arcs = '';
 if (!segs.length || total <= 0) {
 arcs = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="18"/>';
 } else {
 segs.forEach(function(s) {
 var len = (s.usd / total) * C;
 arcs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="18"'
 + ' stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '"'
 + ' stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"/>';
 off += len;
 });
 }
 return '<div class="chart-wrap"><svg width="140" height="140" viewBox="0 0 140 140">' + arcs + '</svg>'
 + '<div class="donut-center"><b dir="ltr">' + esc(centerVal) + '</b><span>' + esc(centerLbl) + '</span></div></div>';
}

 DB.apartments.forEach(function(a) {

var HERO_LAST_PHASE = '';

/* Approximate sunrise/sunset for Beirut, in local minutes after midnight. */
function sunTimesLocal(d) {
 var lat = 33.89, lon = 35.5;
 var N = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
 var B = (2 * Math.PI / 365) * (N - 81);
 var decl = (23.44 * Math.PI / 180) * Math.sin(B);
 var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
 var tz = -d.getTimezoneOffset() / 60;
 var noon = 720 - 4 * lon - eot + tz * 60;
 var phi = lat * Math.PI / 180;
 var cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(decl)) / (Math.cos(phi) * Math.cos(decl));
 var H = Math.acos(Math.max(-1, Math.min(1, cosH))) * 180 / Math.PI;
 return { rise: noon - 4 * H, set: noon + 4 * H };
}

function heroPhase(now) {
 var st = sunTimesLocal(now);
 var m = now.getHours() * 60 + now.getMinutes();
 var key, label;
 if (m < st.rise - 35 || m > st.set + 45) { key = 'night'; label = t('Night', 'ليلاً'); }
 else if (m < st.rise + 45) { key = 'dusk'; label = t('Sunrise', 'الشروق'); }
 else if (m > st.set - 50) { key = 'dusk'; label = t('Sunset', 'الغروب'); }
 else { key = 'day'; label = m < (st.rise + st.set) / 2 ? t('Morning', 'صباحاً') : t('Afternoon', 'بعد الظهر'); }
 var frac = Math.max(0, Math.min(1, (m - st.rise) / (st.set - st.rise)));
 var time = now.toLocaleTimeString(LANG === 'ar' ? 'ar-LB' : 'en-US', { hour: 'numeric', minute: '2-digit' });
 return { key: key, label: label, chip: time + ' · ' + label, sunX: 40 + frac * 286, sunY: 150 - Math.sin(Math.PI * frac) * 118 };
}

/* Home screen: the scene driven by real data and the real clock. */
function buildingHeroHtml(statuses, natourEqUsd, dueRm) {
 var ph = heroPhase(new Date());
 HERO_LAST_PHASE = ph.key + '|' + ph.label;
 var reveal = HERO_REVEAL;
 HERO_REVEAL = false;
 var wins = statuses.map(function(st) {
 var label = st.a.code + ' · ' + (st.owes ? t('still owes', 'لم يسدد بعد') : t('paid', 'مسدد'));
 return { state: st.owes ? 'owes' : 'paid', label: label, onclick: 'heroWinTap(' + jsArg(st.a.id) + ')' };
 });
 return buildBuildingScene({
 phase: ph, wins: wins, interactive: true, idp: 'hm',
 signText: DB.settings.bldEn,
 chip: ph.chip,
 natourFigure: natourEqUsd >= 1,
 natourAmt: natourEqUsd >= 1 ? '$' + Math.round(natourEqUsd).toLocaleString('en-US') : null,
 coreGlow: !!dueRm,
 extraCls: reveal ? 'reveal' : ''
 });
}

/* Onboarding: just the building and what you add to it, lighting up step by step. */
function obSceneHtml(noPop) {
 var login = OB.step === 2 && OB.role === 'col';
 var k = login ? 1 : OB.step;
 var n = Math.max(1, Math.min(40, Number(OB.unitCount) || 1));
 var frac = { 1: 0, 2: 0, 3: 0.1, 4: 0.2, 5: 0.35, 6: 0.5, 7: 0.65, 8: 0.8, 9: 0.9, 10: 1 }[k] || 0;
 var litN = Math.round(frac * n);
 var wins = [];
 for (var i = 0; i < n; i++) wins.push({ state: i < litN ? 'paid' : 'closed' });
 var existing = OB.balMode === 'existing';
 var safe = k >= 3 ? {
 split: OB.curMode === 'split',
 usdH: existing ? Math.min(22, 4 + (Number(OB.initUsd) || 0) / 30) : 2,
 lbpH: existing ? Math.min(22, 4 + (Number(OB.initLbp) || 0) / 1500000) : 2
 } : null;
 var fixedOn = OB.useMaint || OB.natFeeMode === 'separate';
 return buildBuildingScene({
 phase: { key: 'day', sunX: 0, sunY: 0 },
 bare: true,
 wins: wins,
 signText: OB.bldEn || 'Building',
 mgrFigure: !login && (k >= 2 || OB.role !== 'col'),
 natourFigure: login || (k === 1 && OB.role === 'col') || k === 10,
 coreGlow: k >= 8 && OB.remElev,
 solar: k < 8 || OB.remSolar,
 safe: safe,
 fixedStream: k >= 5 && !!safe && fixedOn,
 supStream: k >= 7 && OB.useSuppliers,
 drops: k === 6 && OB.useWater,
 dropsOn: k === 6 && OB.useWater && Number(OB.waterTotalAmt) > 0,
 extraCls: 'studio bh-bare bh-ob' + (noPop ? ' nopop' : ''),
 idp: 'ob'
 });
}

/* Confetti shower used when setup finishes. */

 var layer = document.createElement('div');

 var colors = ['#FFC857', '#5B4CF5', '#10B981', '#3B9EFF', '#F59E0B', '#FF6B8A', '#8B7BFF'];

 var left = Math.random() * 100, dur = 2.2 + Math.random() * 1.8, delay = Math.random() * 0.9;
 html += '<i style="left:' + left.toFixed(1) + '%;background:' + colors[i % colors.length] + ';animation-duration:' + dur.toFixed(2) + 's;animation-delay:' + delay.toFixed(2) + 's;transform:rotate(' + Math.round(Math.random() * 360) + 'deg)"></i>';

 layer.innerHTML = html;
 document.body.appendChild(layer);
 setTimeout(function() { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 4800);
}

function saveCategorizedExpense() {

 if (curExpIdx >= 0) {

 } else {
 DB.expenses.unshift({ id: 'e_' + Date.now(), cat: cat, desc: desc, amt: amt, cur: cur, month: targetCycle, date: dt, ref: ref, notes: notes, payer: payer });
 if (payer !== 'natour_pending') {

}

 }
 h += '</div></div>';

 h += '<div class="chip-grid">';
 allCols.forEach(function(c) {
 var v = c.valFor(a.id);

 + (c.passThrough ? '🔌 ' : '') + esc(cLabel + mgrTag) + ' <span dir="ltr"><bdi>' + fmt(v, c.cur, ar ? 'ar' : 'en') + '</bdi></span></button>';
 });
 h += '</div></div>';
 });
 h += '</div>';

 document.getElementById('app-body').innerHTML = h;
}

function updateProjCalcPreview() {

 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var checked = document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').length || 1;
 var downPerUnit = Math.round((down / checked) * 100) / 100;
 var moPerUnit = Math.round((Math.max(0, budget - down) / mos / checked) * 100) / 100;
 el.innerHTML = t(
 '⚡ Auto-Split (' + checked + ' apts): <b>$' + downPerUnit + '/apt</b> Down + <b>$' + moPerUnit + '/apt/mo</b> × ' + mos + ' mos.',
 '⚡ التقسيم التلقائي (' + checked + ' شقق): <b>$' + downPerUnit + ' للشقة</b> دفعة أولى + <b>$' + moPerUnit + ' شهرياً</b> × ' + mos + ' أشهر.'
 );
}

function saveNewCycleModal() {
 if (ncType === 'month') {
 var m = document.getElementById('nc-mon').value;
 var y = document.getElementById('nc-yr').value;
 var name = m + ' ' + y;
 if (!DB.cycles[name]) {
 var copyPrev = document.getElementById('nc-copy').checked;
 var prev = DB.cycles[SELECTED_MONTH] || { fixed: [], services: [] };
 DB.cycles[name] = {
 isProject: false, arLabel: dispCycleName(name, 'ar'), published: false,
 fixed: copyPrev ? JSON.parse(JSON.stringify(prev.fixed || [])) : [],
 dues: [],
 services: copyPrev ? JSON.parse(JSON.stringify((prev.services || []).filter(function(s) { return s.passThrough; }))) : [],
 paid: {}
 };
 }
 SELECTED_MONTH = name;
 saveDB(); closeModal('new-cycle-modal');
 showToast(t('Created: ' + name, 'تم إنشاء: ' + dispCycleName(name, 'ar')));
 setTab('setup');
 return;
 }

 var pEn = document.getElementById('nc-proj-en').value.trim();
 var pAr = document.getElementById('nc-proj-ar').value.trim() || pEn;
 var budget = Number(document.getElementById('nc-budget').value) || 0;
 var down = Number(document.getElementById('nc-down').value) || 0;
 var mos = Math.max(1, Number(document.getElementById('nc-months').value) || 1);
 var injectIntoMonth = document.getElementById('nc-inject').checked;
 if (!pEn || budget <= 0) { alert(t('Enter project title and target budget', 'أدخل اسم المشروع والميزانية')); return; }
 if (DB.cycles[pEn]) { alert(t('A project with this name already exists.', 'يوجد مشروع بهذا الاسم.')); return; }

 var activeUnits = [];
 document.querySelectorAll('#nc-unit-checks input[type="checkbox"]:checked').forEach(function(cb) {
 activeUnits.push(cb.getAttribute('data-u'));
 });
 if (!activeUnits.length) activeUnits = DB.apartments.map(function(a) { return a.id; });

 var count = activeUnits.length;
 var downPerUnit = Math.round((down / count) * 100) / 100;
 var moPerUnit = Math.round(((budget - down) / mos / count) * 100) / 100;

 var svList = [];
 if (down > 0) {
 var dMap = {};
 activeUnits.forEach(function(uId) { dMap[uId] = downPerUnit; });
 svList.push({ id: 'sp_down_' + Date.now(), en: 'Initial Down Payment ($' + down + ' Split)', ar: 'الدفعة الأولى (من أصل $' + down + ')', cur: 'USD', passThrough: false, map: dMap });
 }

 /* Installment N starts in October 2026 (index 0 of this array), one month per step. */
 var calMonthsEn = ['October', 'November', 'December', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September'];
 var calMonthsAr = ['تشرين الأول', 'تشرين الثاني', 'كانون الأول', 'كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول'];
 var firstInstId = 'sp_m1_' + Date.now();

 for (var i = 1; i <= mos; i++) {
 var mMap = {};
 activeUnits.forEach(function(uId) { mMap[uId] = moPerUnit; });
 var cId = (i === 1) ? firstInstId : ('sp_m' + i + '_' + Date.now());
 var mIdx = (i - 1) % 12;
 var yrVal = 2026 + Math.floor((9 + i - 1) / 12);
 var mLabelEn = calMonthsEn[mIdx] + ' ' + yrVal + ' Installment (' + i + '/' + mos + ')';
 var mLabelAr = 'قسط ' + calMonthsAr[mIdx] + ' ' + yrVal + ' (' + i + '/' + mos + ')';
 svList.push({ id: cId, en: mLabelEn, ar: mLabelAr, cur: 'USD', passThrough: false, map: mMap });
 }

 DB.cycles[pEn] = {
 isProject: true, arLabel: pAr, published: true,
 targetBudget: budget, downPaymentTotal: down, installmentMonths: mos,
 fixed: [], dues: [], services: svList, paid: {}
 };

 if (injectIntoMonth && DB.cycles['October 2026']) {
 DB.cycles['October 2026'].dues.push({
 id: 'due_' + firstInstId,
 en: '🛠️ ' + pEn + ' (Oct 2026 Inst. 1/' + mos + ')',
 ar: '🛠️ ' + pAr + ' (قسط تشرين الأول 1/' + mos + ')',
 amt: moPerUnit, cur: 'USD',
 linkedProject: pEn, linkedColId: firstInstId
 });
 }

 SELECTED_MONTH = pEn;
 CYCLE_DETAIL_MODE = true;
 saveDB(); closeModal('new-cycle-modal');
 showToast(t('Project created with calendar months!', 'تم إنشاء المشروع مع أسماء الشهور التقويمية!'));
 setTab('dash');
}

function deleteSelectedCycle() {
 if (Object.keys(DB.cycles).length <= 1) {
 alert(t('You must keep at least one active month.', 'يجب إبقاء دورة واحدة على الأقل.'));
 return;
 }
 if (!confirm(t('Delete "' + SELECTED_MONTH + '" and its records?', 'هل تريد حذف "' + dispCycleName(SELECTED_MONTH, 'ar') + '" وسجلاتها؟'))) return;
 delete DB.cycles[SELECTED_MONTH];
 SELECTED_MONTH = Object.keys(DB.cycles)[0];
 CYCLE_DETAIL_MODE = false;
 saveDB(); showToast(t('Deleted', 'تم الحذف')); render();
}

function openDirectPayModal() {
 var h = '<div class="card-h"><h3 style="color:var(--purp)">💵 ' + t('Record Resident Payment to Manager', 'تسجيل دفعة مستلمة مباشرة للمدير') + '</h3><button class="btn-del" onclick="closeModal(\'direct-pay-modal\')">✕</button></div>';
 h += '<p class="subtext">' + t('Whether the tenant paid you in Cash, Whish, OMT, or Bank Transfer, recording it here marks their dues as Paid on the Natour\'s phone WITHOUT adding it to the Natour\'s cash pocket.', 'سواء دفع الساكن للمدير كاش أو عبر Whish أو OMT، تسجيل الدفعة هنا يظهرها كمسددة على هاتف الناطور دون إضافتها إلى الكاش الموجود مع الناطور.') + '</p>';

 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Apartment', 'الشقة') + '</label><select id="wp-apt" style="margin-top:4px" onchange="populateDirectPayDues()">';
 DB.apartments.forEach(function(a) { h += '<option value="' + esc(a.id) + '">' + esc(a.code) + ' · ' + esc(LANG === 'ar' ? (a.ar || a.en) : a.en) + '</option>'; });
 h += '</select></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Month / Project', 'الشهر / المشروع') + '</label><select id="wp-cyc" style="margin-top:4px" onchange="populateDirectPayDues()">';
 Object.keys(DB.cycles).forEach(function(ck) { h += '<option value="' + esc(ck) + '"' + (ck === SELECTED_MONTH ? ' selected' : '') + '>' + esc(dispCycleName(ck)) + '</option>'; });
 h += '</select></div></div>';

 h += '<div class="two-col-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Payment Method', 'وسيلة الدفع للمدير') + '</label><select id="wp-channel" style="margin-top:4px">'
 + '<option value="Cash to Manager">💵 Cash to Manager · كاش للمدير</option>'
 + '<option value="Whish Money">🟣 Whish Money · ويش موني</option>'
 + '<option value="OMT Pay">🟡 OMT Pay · أو أم تي</option>'
 + '<option value="Bank Transfer">🏦 Bank Transfer · تحويل بنكي</option></select></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Date', 'التاريخ') + '</label><input type="date" id="wp-date" value="' + todayIso() + '" style="margin-top:4px"></div>';
 h += '</div>';

 h += '<div class="amt-cur-grid" style="margin-bottom:10px">';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Amount Received', 'المبلغ المستلم') + '</label><input type="number" id="wp-amt" style="margin-top:4px"></div>';
 h += '<div><label style="font-size:11.5px;color:var(--mut)">' + t('Currency', 'العملة') + '</label><select id="wp-cur" style="margin-top:4px"><option value="USD">USD ($)</option><option value="LBP">LBP (ل.ل.)</option></select></div>';
 h += '</div>';

 h += '<div style="margin-bottom:12px"><label style="font-size:11.5px;color:var(--mut)">' + t('Reference / Note (Optional)', 'رقم الإشعار أو ملاحظة') + '</label><input type="text" id="wp-ref" placeholder="e.g. Paid cash at door / WH-9821" style="margin-top:4px"></div>';
 h += '<div id="wp-due-info" style="padding:10px 12px;background:var(--soft);color:var(--acc);font-weight:700;border-radius:12px;font-size:12px;margin-bottom:14px"></div>';
 h += '<button style="width:100%;padding:13px;background:var(--purp);color:#fff" onclick="saveDirectPayModal()">✓ ' + t('Confirm Payment & Settle Unit', 'تأكيد الدفعة وتسديد الشقة') + '</button>';

 document.getElementById('direct-pay-content').innerHTML = h;
 populateDirectPayDues();
 openModal('direct-pay-modal');
}

function populateDirectPayDues() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var cyc = DB.cycles[cKey];
 var rate = getRate();
 var dueEqUsd = 0;
 getCycleCols(cKey, true).forEach(function(c) {
 var v = c.valFor(aptId);
 if (v <= 0 || cellState(cyc, c.id, aptId) > 0) return;
 dueEqUsd += (c.cur === 'LBP' ? v / rate : v);
 });
 document.getElementById('wp-amt').value = Math.round(dueEqUsd) || 50;
 document.getElementById('wp-due-info').innerHTML = t(
 'Unpaid Building Dues in <b>' + esc(cKey) + '</b> for this apartment: <b>$' + Math.round(dueEqUsd) + ' USD</b>',
 'مستحقات البناية غير المدفوعة في <b>' + esc(dispCycleName(cKey, 'ar')) + '</b> لهذه الشقة: <b>$' + Math.round(dueEqUsd) + '</b>'
 );
}

function saveDirectPayModal() {
 var aptId = document.getElementById('wp-apt').value;
 var cKey = document.getElementById('wp-cyc').value;
 var channel = document.getElementById('wp-channel').value;
 var dt = document.getElementById('wp-date').value || todayIso();
 var amt = Number(document.getElementById('wp-amt').value) || 0;
 var cur = document.getElementById('wp-cur').value;
 var ref = document.getElementById('wp-ref').value.trim() || 'MGR-DIRECT';
 var apt = DB.apartments.filter(function(a) { return a.id === aptId; })[0];
 if (!apt) return;

 var cyc = DB.cycles[cKey];
 cyc.paid = cyc.paid || {};
 cyc.mgrPayChannel = cyc.mgrPayChannel || {};
 cyc.mgrPayChannel[aptId] = channel;

 getCycleCols(cKey, true).forEach(function(c) {
 if (c.valFor(aptId) <= 0) return;
 cyc.paid[c.id] = cyc.paid[c.id] || {};
 cyc.paid[c.id][aptId] = 2;
 if (c.linkedProject && DB.cycles[c.linkedProject]) {
 var pCyc = DB.cycles[c.linkedProject];
 var tCol = c.linkedColId || 'sp_m1';
 pCyc.paid = pCyc.paid || {};
 pCyc.paid[tCol] = pCyc.paid[tCol] || {};
 pCyc.paid[tCol][aptId] = 2;
 }
 });

 DB.ledger.unshift({
 id: 'l_' + Date.now(),
 desc: apt.en + ' (' + apt.code + ') · ' + dispCycleName(cKey),
 sub: channel, channel: channel,
 amt: amt, cur: cur, type: 'in', at: dt, ref: ref
 });

 saveDB(); closeModal('direct-pay-modal');
 showToast(t('Recorded via ' + channel + ' (Natour cash untouched)', 'تم التسجيل عبر ' + channel + ' (دون التأثير على كاش الناطور)'));
 render();
}

/* ============================================================================
 11. BOOT
 ============================================================================ */
render();
</script>
