/* Pull a sheet down to close it (from the grab bar, or anywhere once it's scrolled to the top). */
(function() {
  var drag = null;
  document.addEventListener('touchstart', function(e) {
    var sh = e.target.closest && e.target.closest('.sheet');
    if (!sh || e.touches.length !== 1) return;
    if (e.target.closest('input,textarea,select')) return;
    var onGrab = !!e.target.closest('.grab') || (e.touches[0].clientY - sh.getBoundingClientRect().top) < 44;
    if (!onGrab && sh.scrollTop > 0) return;
    drag = { sh: sh, y0: e.touches[0].clientY, dy: 0, grab: onGrab };
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (!drag) return;
    var dy = e.touches[0].clientY - drag.y0;
    if (!drag.grab && drag.sh.scrollTop > 0) { drag = null; return; }
    if (dy <= 0) { drag.sh.style.transform = ''; drag.dy = 0; return; }
    drag.dy = dy;
    drag.sh.style.transition = 'none';
    drag.sh.style.transform = 'translateY(' + dy + 'px)';
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function() {
    if (!drag) return;
    var d = drag; drag = null;
    d.sh.style.transition = 'transform .2s ease';
    if (d.dy > 90) { d.sh.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 180); }
    else d.sh.style.transform = '';
  });
})();

/* ---------------------------------------------------------------------------
   Record a payment of any amount: it settles the oldest unpaid charges first
   --------------------------------------------------------------------------- */
function unpaidCells(u, cur) {
  var out = [];
  S.cycles.slice().filter(function(c) { return c.published !== false; }).sort(function(a, b) { return cycleOrderKey(a).localeCompare(cycleOrderKey(b)); }).forEach(function(c) {
    chargesOf(c.id).forEach(function(ch) {
      if (cur && ch.cur !== cur) return;
      var x = cell(ch, u);
      if (x.left > 0) out.push({ ch: ch, cyc: c, left: x.left });
    });
  });
  return out;
}
function allocate(u, cur, amount) {
  var rest = amount, rows = [];
  unpaidCells(u, cur).forEach(function(x) {
    if (rest <= 0) return;
    var a = round(Math.min(rest, x.left), cur);
    if (a <= 0) return;
    rows.push({ ch: x.ch, cyc: x.cyc, amount: a });
    rest = round(rest - a, cur);
  });
  return { rows: rows, extra: rest };
}

function saveUnit(id) {
  var row = { code: val('u-code').trim().toUpperCase(), name: val('u-name').trim(), name_ar: val('u-name-ar').trim() || null, phone: val('u-ph').trim() || null,
              lang: val('u-lang'), weight: num(val('u-w') || 1), active: document.getElementById('u-act').classList.contains('on'),
              block: val('u-block').trim().toUpperCase() || null };
  if (!row.code) return sheetErr(t('Give it a code like 2B', 'أعطها رمزاً مثل 2B'));
  if (S.units.some(function(x) { return x.code === row.code && blockOf(x) === (row.block || '') && x.id !== id; })) return sheetErr(t('That code is already used', 'هذا الرمز مستعمل'));
  if (!id) { row.resident_token = token(); row.sort = S.units.length; }
  // Floor and position
  var u0 = id ? byId(S.units, id) : null, fv = val('u-floor');
  row.floor = fv === '' ? null : Number(fv);
  row.spot = row.floor == null ? null : (val('u-spot') || null);
  var moved = !u0 || String(u0.floor == null ? '' : u0.floor) !== String(row.floor == null ? '' : row.floor) || String(u0.spot || '') !== String(row.spot || '');
  var spare = null;
  if (row.floor != null && moved) {
    var slot = slotCode(row), blk = row.block || '';
    var there = activeUnits().filter(function(x) { return x.id !== id && blockOf(x) === blk && (placedHere(x) ? slotCode(x) === slot : String(x.code).toUpperCase() === slot); })[0];
    if (there) {
      if (!emptyUnit(there) || placedHere(there)) return sheetErr(t(floorName(row.floor) + (row.spot ? ' ' + row.spot : '') + ' already has ' + (unitName(there) || there.code) + '. Move them first.', floorName(row.floor) + (row.spot ? ' ' + row.spot : '') + ' فيها ' + (unitName(there) || there.code) + '. انقلها أولاً.'));
      spare = there; // empty placeholder from setup: it is replaced
    }
  }
  var btn = document.querySelector('.sheet .foot .btn.pri'); if (btn) btn.disabled = true;
  (id ? dbUpdate('units', id, row) : dbInsert('units', row)).then(function() {
    return spare ? dbDelete('units', spare.id) : null;
  }).then(function() { return moved ? resortUnits() : null; }).then(function() {
    closeSheet(); toast(spare ? t('Saved · empty ' + spare.code + ' removed', 'تم الحفظ · أزيلت ' + spare.code + ' الفارغة') : t('Saved', 'تم الحفظ'));
    if (UI.fillNames && id) setTimeout(function() { nextUnnamed(id); }, 250);
  }, function(e) { if (btn) btn.disabled = false; sheetErr(e.message); });
}
function unitSpotHint() {
  var el = document.getElementById('u-spot-hint'), f = val('u-floor'), s = val('u-spot');
  if (!el || f === '') return;
  var slot = slotCode({ floor: Number(f), spot: s }), id = UI.sheet && UI.sheet.data.id, blk = val('u-block').trim().toUpperCase();
  var there = activeUnits().filter(function(x) { return x.id !== id && blockOf(x) === blk && (placedHere(x) ? slotCode(x) === slot : String(x.code).toUpperCase() === slot); })[0];
  el.textContent = !there ? t('Free spot.', 'المكان فارغ.') : emptyUnit(there) && !placedHere(there) ? t('Takes the place of the empty ' + there.code + ', which will be removed.', 'تأخذ مكان ' + there.code + ' الفارغة، وستُزال.') : t('Taken by ' + (unitName(there) || there.code) + '.', 'مشغول من ' + (unitName(there) || there.code) + '.');
  el.style.color = there && !(emptyUnit(there) && !placedHere(there)) ? 'var(--bad)' : '';

/* Keep the apartment list in building order: underground first, floor by floor, then position. */
function resortUnits() {
  var all = S.units.slice().sort(function(a, b) {
    if (blockOf(a) !== blockOf(b)) return blockOf(a).localeCompare(blockOf(b));
    var la = unitLevel(a), lb = unitLevel(b);
    if (la == null) la = 99; if (lb == null) lb = 99;
    var pa = placedHere(a) ? (a.spot || '') : String(a.code), pb = placedHere(b) ? (b.spot || '') : String(b.code);
    return la - lb || pa.localeCompare(pb, 'en', { numeric: true });
  });
  var p2 = Promise.resolve();
  all.forEach(function(u, i) { if (u.sort !== i) p2 = p2.then(function() { return dbUpdate('units', u.id, { sort: i }); }); });
  return p2;
}
function deleteUnit(id) {
  var has = S.payments.some(function(p) { return p.unit_id === id && !p.voided_at; });
  if (has) { dbUpdate('units', id, { active: false }).then(function() { closeSheet(); toast(t('It has payments, so it was set inactive instead', 'لها دفعات، فجُعلت غير فعّالة')); }, fail); return; }
  if (!confirm(t('Remove this apartment?', 'حذف هذه الشقة؟'))) return;
  dbDelete('units', id).then(function() { closeSheet(); }, fail);
}

var KIND_INFO = {
  fixed: ['Monthly fee', 'رسم شهري', 'Same every month: maintenance, cleaning, the collector\'s pay', 'كل شهر: صيانة، تنظيف، أجر الجابي'],
  due: ['Bill to split', 'فاتورة للتقسيم', 'One-off: water bill, tanker fill, a repair', 'لمرة واحدة: فاتورة مياه، صهريج، تصليح'],
  service: ['Supplier service', 'خدمة مورّد', 'Collected for someone else: moteur, internet, dish', 'تُجمع لطرف آخر: موتور، إنترنت، دش']
};
/* A lira charge is shown in LBP and in dollars. Its own fx wins; otherwise the building rate.
   A missing rate is left blank so the screen can ask the manager to set one — the 89,500 fallback is not used here. */
function statedRate() { var r = num(setting('rate')); return r > 0 ? r : 0; }
function isLiraPriced(ch) { return !!(ch && (ch.cur === 'LBP' || ch.orig_cur === 'LBP')); }
function chargeRateInfo(ch) {
  var own = ch && num(ch.fx) > 0 ? num(ch.fx) : 0, bld = statedRate();
  if (own) return { rate: own, src: 'charge', building: bld };
  if (bld) return { rate: bld, src: 'building', building: bld };
  return { rate: 0, src: 'missing', building: 0 };
}
function usdOfLbp(lbp, ch) { var r = chargeRateInfo(ch).rate; return r > 0 ? Math.round(num(lbp) / r * 100) / 100 : null; }
function lbpOfUsd(usd, ch) { var r = chargeRateInfo(ch).rate; return r > 0 ? Math.round(num(usd) * r) : null; }
function rateDiffers(info) { return !!(info && info.rate && (!info.building || Math.round(info.rate) !== Math.round(info.building))); }
function fmtDual(amt, ch) {
  if (!ch) return fmt(amt, 'USD');
  if (ch.cur === 'LBP') { var usd = usdOfLbp(amt, ch); return usd == null ? fmt(amt, 'LBP') : fmt(amt, 'LBP') + ' ≈ ' + fmt(usd, 'USD'); }
  if (ch.orig_cur === 'LBP') { var lbp = lbpOfUsd(amt, ch); return lbp == null ? fmt(amt, 'USD') : fmt(amt, 'USD') + ' ≈ ' + fmt(lbp, 'LBP'); }
  return fmt(amt, ch.cur || 'USD');
}
function fmtDualRange(min, max, ch) {
  var cur = ch.cur || 'USD', native = fmt(min, cur) + '–' + fmt(max, cur);
  if (cur === 'LBP') { var a = usdOfLbp(min, ch), b = usdOfLbp(max, ch); return a == null ? native : native + ' ≈ ' + fmt(a, 'USD') + '–' + fmt(b, 'USD'); }
  if (ch.orig_cur === 'LBP') { var c = lbpOfUsd(min, ch), d = lbpOfUsd(max, ch); return c == null ? native : native + ' ≈ ' + fmt(c, 'LBP') + '–' + fmt(d, 'LBP'); }
  return native;
}
function explicitOverride(ch, u) { var ov = (ch && ch.overrides) || {}; return ov[u.id] != null && ov[u.id] !== ''; }
/* A typed amount that is not what the share or meter formula would charge. Subscriber prices are entered per apartment, so they are not all marked changed. */
function amountChanged(ch, u) {
  if (!explicitOverride(ch, u)) return false;
  if (ch.meter) {
    var k = ch.meter.kwh ? ch.meter.kwh[u.id] : null;
    if (k == null || k === '') return num(ch.overrides[u.id]) > 0;
    var calc = meterAmount(ch.meter, k, ch.cur);
    return calc == null || !tiny(num(ch.overrides[u.id]) - calc, ch.cur);
  }
  if (ch.pass_through || ch.split === 'custom') return false;
  return !tiny(dueFor(ch, u) - dueFor(Object.assign({}, ch, { overrides: {} }), u), ch.cur);
}
function chargeAudience(ch) {
  var cyc = byId(S.cycles, ch.cycle_id);
  return activeUnits().filter(function(u) { return unitInCycle(u, cyc) && inBlock(u, ch); });
}
function chargeSpread(ch) {
  var selective = !!(ch.meter || ch.pass_through || ch.split === 'custom');
  var people = [], priced = [];
  chargeAudience(ch).forEach(function(u) {
    var due = dueFor(ch, u), changed = amountChanged(ch, u);
    var off = selective && !(due > 0) && !changed;
    people.push({ u: u, due: due, changed: changed, off: off });
    if (!off) priced.push(due);
  });
  var min = priced.length ? priced.reduce(function(a, b) { return a < b ? a : b; }) : null;
  var max = priced.length ? priced.reduce(function(a, b) { return a > b ? a : b; }) : null;
  return { people: people, min: min, max: max, same: min == null || tiny(max - min, ch.cur || 'USD'), total: chargeTotal(ch), empty: min == null };
}
function eachApartmentText(ch, spread) {
  if (spread.empty) return '—';
  return spread.same ? fmtDual(spread.min, ch) : fmtDualRange(spread.min, spread.max, ch);
}
function rateCaption(ch) {
  if (!isLiraPriced(ch)) return '';
  var info = chargeRateInfo(ch);
  if (!info.rate) return t('Set a dollar rate to see this in dollars', 'حدّد سعر الدولار لترى هذا بالدولار');
  if (!rateDiffers(info)) return '';

function newMonth() {

  S.cycles.forEach(function(c) { if (c.period === period) existing = c; });

/* A QR code as a PNG with a caption, so it can be saved, printed or forwarded. */
function qrImage(text, line1, line2) {
  if (typeof qrcode !== 'function') return '';
  try {
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), cell = Math.max(6, Math.floor(480 / (n + 8))), quiet = cell * 4, side = n * cell + quiet * 2, foot = 96;
    var cv = document.createElement('canvas'); cv.width = side; cv.height = side + foot;
    var g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#111';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect(quiet + c * cell, quiet + r * cell, cell, cell);
    g.textAlign = 'center'; g.direction = LANG === 'ar' ? 'rtl' : 'ltr';
    g.font = '700 26px "Plus Jakarta Sans","IBM Plex Sans Arabic",sans-serif'; g.fillText(line2 || '', side / 2, side + 30);
    g.font = '500 20px "Plus Jakarta Sans","IBM Plex Sans Arabic",sans-serif'; g.fillStyle = '#555'; g.fillText(line1 || '', side / 2, side + 62);
    return cv.toDataURL('image/png');
  } catch (e) { return ''; }
}
function saveQr(dataUrl, name) {
  fetch(dataUrl).then(function(r) { return r.blob(); }).then(function(b) {
    var f = typeof File === 'function' ? new File([b], name, { type: 'image/png' }) : null;
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f] }).catch(function() {});
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
}

/* Create the building from the answers, in whichever backend is active. */
function finishSetup(displayName) {
  var settings = { rate: 89500, opening_usd: num(OB.openUsd), opening_lbp: num(OB.openLbp), books_public: true, show_who_paid: false,
                   collector_name: OB.who === 'other' ? (OB.colName || '') : '', collector_name_ar: OB.who === 'other' ? (OB.colNameAr || '') : '' };
  if ((OB.blocks || 1) > 1 && OB.safeMode === 'block') settings.safe_mode = 'block';
  var bid;
  return rpc('create_building', { p_name: OB.name.trim(), p_name_ar: OB.nameAr.trim() || null, p_settings: settings, p_display_name: displayName || t('Manager', 'المدير') })
    .then(function(id) { bid = id; return openBuilding(bid); })
    .then(function() {
      var units = [], nb = OB.blocks || 1;
      for (var bi = 0; bi < nb; bi++) obUnits().forEach(function(code) {
        units.push({ code: code, name: '', sort: units.length, weight: 1, lang: 'both', active: true, resident_token: token(), block: nb > 1 ? 'ABCDEF'.charAt(bi) : null });
      });

      var cyc = { kind: 'month', period: p, title: periodLabel(p, 'en'), title_ar: periodLabel(p, 'ar'), published: true };
      return dbInsert('cycles', cyc).then(function() {
        return dbInsert('charges', { cycle_id: cyc.id, kind: 'fixed', title: 'Maintenance', title_ar: 'الصيانة', cur: OB.cur, amount: num(OB.fee),

      }).then(function() { UI.cycleId = cyc.id; });
    })
    .then(function() {
      if (OB.who === 'other' && !isCloud()) return dbInsert('members', { user_id: 'u-collector', role: 'collector', display_name: OB.colName || t('Collector', 'الجابي'), display_name_ar: OB.colNameAr || null });
    })
    .then(function() {
      return dbInsertMany('tasks', [
        { title: 'Clean water tanks', title_ar: 'تنظيف خزانات المياه', due_on: rollDate(todayIso(), 'monthly'), repeat: 'halfyear', assignee: OB.who === 'other' ? 'collector' : 'manager' },
        { title: 'Wash trash bins', title_ar: 'غسل مستوعبات النفايات', due_on: rollDate(todayIso(), 'weekly'), repeat: 'weekly', assignee: OB.who === 'other' ? 'collector' : 'manager' }
      ]);
    })
    .then(function() {
      var askInvite = OB.who === 'other' && isCloud();
      var name = OB.colName, nameAr = OB.colNameAr;
      OB = null;
      // Next step after setup: the apartments directory, to fill in residents' names and WhatsApp numbers.
      UI.screen = 'app'; UI.tab = 'home'; HERO_REVEAL = true; setupState({ open: true });
      render(); window.scrollTo(0, 0); launchConfetti();
      if (askInvite) setTimeout(function() { openSheet('invite', { role: 'collector' }); setTimeout(function() { var el = document.getElementById('inv-name'); if (el) el.value = name || ''; var ea = document.getElementById('inv-name-ar'); if (ea) ea.value = nameAr || ''; }, 50); }, 1600);
    })
    .catch(function(e) { fail(e); });
}

/* Ask for an image (camera or gallery) and shrink it so uploads stay small. */
function pickImage(cb) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function() {
    var f = inp.files && inp.files[0];
    if (!f) return;
    shrinkImage(f, 1600, 0.8).then(cb, function() { toast(t('Couldn\'t open that image', 'تعذّر فتح الصورة')); });
  };
  inp.click();
}
function shrinkImage(file, max, q) {
  return new Promise(function(res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function() {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var dataUrl = c.toDataURL('image/jpeg', q);
      c.toBlob(function(blob) { res({ dataUrl: dataUrl, b64: dataUrl.split(',')[1], blob: blob }); }, 'image/jpeg', q);
    };
    img.onerror = rej;
    img.src = url;
  });
}
function aiReady() { return isCloud(); }
function readDoc(kind, b64, extra) {
  var body = Object.assign({ kind: kind, image: b64, mime: 'image/jpeg' }, extra || {});
  return SB.functions.invoke('read-doc', { body: body }).then(function(r) {
    if (r.error || !r.data || !r.data.ok) throw new Error(t('Couldn\'t read it. Fill it in by hand, or try a sharper photo.', 'تعذّرت القراءة. املأها يدوياً أو جرّب صورة أوضح.'));
    return r.data.fields || {};
  });
}
function uploadPhoto(blob) {

}

/* Find the apartment: AI's pick first, then the phone number, then the name. */
function matchUnit(f) {
  var units = activeUnits();

  if (digits.length === 7) {
    var byPhone = units.filter(function(u) { return String(u.phone || '').replace(/\D/g, '').slice(-7) === digits; });
    if (byPhone.length === 1) return byPhone[0];

function aiReminder() {

  var left = fmtPair(r.allLeft);

function admChart() {

  });

  if (!cyc) return '<p class="muted">' + esc(t('No month yet.', 'لا شهر بعد.')) + '</p>';
  var D = statementData(cyc);
  var h = '<div class="rep-h"><div><h2>' + esc(t('Monthly statement', 'الكشف الشهري')) + ' · ' + esc(cycleTitle(cyc)) + '</h2><small>' + esc(bName() + (UI.block ? ' · ' + blockLabel(UI.block) : '') + ' · ' + t('printed ', 'طُبع ') + dateLabel(todayIso())) + '</small></div></div>';
  h += '<h3>' + esc(t('Money in', 'المقبوض')) + '</h3>' + deskTable([t('Charge', 'الرسم'), t('Due', 'المستحق'), t('Collected', 'المحصّل'), t('Left', 'المتبقي')],
    D.byCharge.map(function(x) { return [L(x.ch), fmt(x.due, x.ch.cur), fmt(x.got, x.ch.cur), fmt(Math.max(0, x.due - x.got), x.ch.cur)]; }), [1, 2, 3],
    [t('Total', 'المجموع'), fmtPair(D.s.due), fmtPair(D.s.paid), fmtPair({ USD: D.s.due.USD - D.s.paid.USD, LBP: D.s.due.LBP - D.s.paid.LBP })]);
  h += '<h3>' + esc(t('Money out', 'المدفوع')) + '</h3>' + (Object.keys(D.byCat).length ? deskTable([t('Category', 'الفئة'), t('Amount', 'المبلغ')],
    Object.keys(D.byCat).map(function(k) { return [catIcon(k) + ' ' + catName(k), fmtPair(D.byCat[k])]; }), [1], [t('Total', 'المجموع'), fmtPair(D.spent)]) : '<p class="muted">' + esc(t('Nothing spent this month.', 'لا مصاريف هذا الشهر.')) + '</p>');
  h += '<h3>' + esc(t('Where the money is now', 'أين المال الآن')) + '</h3>' + deskTable([t('', ''), t('Amount', 'المبلغ')], [
    [t('In the safe', 'في الصندوق'), fmtPair(D.cash.safe)], [t('With collectors (not handed over)', 'مع الجباة (لم يُسلّم)'), fmtPair(D.cash.withCollector || pair())],
    [t('Owed from earlier months', 'مستحق من أشهر سابقة'), fmtPair(D.arr.total || D.arr)]], [1]);
  return h;
}
function yearRows() {
  return monthCycles().slice(0, 12).reverse().map(function(c) {
    var cs = cycleSummary(c), sp = pair();
    liveExpenses().forEach(function(e) { if (e.cycle_id === c.id && (!UI.block || !e.block || e.block === UI.block)) addTo(sp, e.cur, num(e.amount)); });
    return { c: c, due: cs.due, got: cs.paid, spent: sp, pct: cs.pct };
  });
}
function yearHtml() {
  var rows = yearRows(), tg = pair(), ts = pair();
  rows.forEach(function(r) { addTo(tg, 'USD', r.got.USD); addTo(tg, 'LBP', r.got.LBP); addTo(ts, 'USD', r.spent.USD); addTo(ts, 'LBP', r.spent.LBP); });
  var h = '<div class="rep-h"><div><h2>' + esc(t('The year', 'السنة')) + '</h2><small>' + esc(t('Last 12 months', 'آخر 12 شهراً')) + '</small></div></div>';
  return h + deskTable([t('Month', 'الشهر'), t('Due', 'المستحق'), t('Collected', 'المحصّل'), '%', t('Spent', 'المصروف'), t('Net', 'الصافي')],
    rows.map(function(r) { return [cycleTitle(r.c), fmtPair(r.due), fmtPair(r.got), r.pct + '%', fmtPair(r.spent), fmtPair({ USD: r.got.USD - r.spent.USD, LBP: r.got.LBP - r.spent.LBP })]; }), [1, 2, 3, 4, 5],
    [t('Total', 'المجموع'), '', fmtPair(tg), '', fmtPair(ts), fmtPair({ USD: tg.USD - ts.USD, LBP: tg.LBP - ts.LBP })]);
}

/* ---------- CSV downloads (open in Excel, Numbers, Google Sheets) ---------- */
function csvDownload(name, rows) {
  var body = rows.map(function(r) { return r.map(function(v) { var s = v == null ? '' : String(v).replace(/[⁦-⁩]/g, ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(','); }).join('\r\n');
  var blob = new Blob(['﻿' + body], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (bName() + ' ' + name).replace(/[\\/:*?"<>|]+/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csvCollect() {
  var D = deskCollectData();
  var rows = [[t('Apartment', 'الشقة'), t('Name', 'الاسم')].concat(D.chs.map(function(c) { return L(c) + ' due (' + c.cur + ')'; })).concat(D.chs.map(function(c) { return L(c) + ' paid (' + c.cur + ')'; }))];
  D.rows.forEach(function(r) { rows.push([unitTag(r.u), unitName(r.u) || ''].concat(r.cells.map(function(x) { return x.c.due; })).concat(r.cells.map(function(x) { return x.c.paid; }))); });
  csvDownload(t('collections ', 'التحصيل ') + (D.cyc ? cycleTitle(D.cyc) : ''), rows);
}
function csvLedger() {
  var rows = [['Date', 'Type', 'What', 'Who / category', 'How', 'Amount', 'Currency', 'Ref']];
  deskLedger().forEach(function(r) { rows.push([r.d, r.type === 'in' ? 'in' : 'out', r.what, r.who, r.how, r.type === 'in' ? r.amt : -r.amt, r.cur, r.ref || '']); });
  csvDownload(t('money in and out', 'المقبوض والمدفوع'), rows);
}
function csvArrears() {
  var rows = [['Apartment', 'Name', 'Month', 'USD', 'LBP']];
  deskArrearsData().forEach(function(r) { r.per.forEach(function(x) { rows.push([unitTag(r.u), unitName(r.u) || '', cycleTitle(x.c), x.left.USD, x.left.LBP]); }); });
  csvDownload(t('arrears', 'المتأخرات'), rows);
}
function csvStatement() {
  var cyc = deskCycle(); if (!cyc) return;
  var D = statementData(cyc), rows = [['Section', 'Item', 'Due', 'Collected / amount', 'Currency']];
  D.byCharge.forEach(function(x) { rows.push(['Money in', L(x.ch), x.due, x.got, x.ch.cur]); });
  Object.keys(D.byCat).forEach(function(k) { ['USD', 'LBP'].forEach(function(c) { if (D.byCat[k][c]) rows.push(['Money out', catName(k), '', D.byCat[k][c], c]); }); });
  ['USD', 'LBP'].forEach(function(c) { rows.push(['Now', 'In the safe', '', D.cash.safe[c] || 0, c]); rows.push(['Now', 'With collectors', '', (D.cash.withCollector || {})[c] || 0, c]); });
  csvDownload(t('statement ', 'كشف ') + cycleTitle(cyc), rows);
}
function csvYear() {
  var rows = [['Month', 'Due USD', 'Due LBP', 'Collected USD', 'Collected LBP', 'Spent USD', 'Spent LBP']];
  yearRows().forEach(function(r) { rows.push([cycleTitle(r.c), r.due.USD, r.due.LBP, r.got.USD, r.got.LBP, r.spent.USD, r.spent.LBP]); });
  csvDownload(t('year', 'السنة'), rows);
}
