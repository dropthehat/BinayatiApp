<style>
:root {
  --bg: #F1F5F4; --bg2: #E7EFEC; --card: #FFFFFF; --card2: #F7FAF9; --ink: #13201C; --mut: #5E6E69; --faint: #8C9A95;
  --line: #DCE6E2; --soft: #ECEAFF; --acc: #5B4CF5; --acc-ink: #4536D9; --on-acc: #FFFFFF;
  --ok: #0E8A5F; --okbg: #E2F5EC; --warn: #B76E00; --wbg: #FFF3DD; --bad: #D33A3A; --badbg: #FDE8E8;
  --info: #2C74D6; --infobg: #E5F0FD;
  --shadow: 0 1px 2px rgba(19,32,28,.05), 0 8px 24px rgba(19,32,28,.06);
  --shadow-lg: 0 18px 40px rgba(60,52,180,.18);
  --sheet: #FFFFFF; --scrim: rgba(12,20,18,.42);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --bg2: #151E1B; --card: #18221F; --card2: #1D2925; --ink: #E8F0ED; --mut: #9AAAA4; --faint: #6F7F7A;
    --line: #2A3833; --soft: #26244A; --acc: #8E83FF; --acc-ink: #B3AAFF; --on-acc: #120F33;
    --ok: #45C993; --okbg: #15342A; --warn: #F2B14C; --wbg: #3A2C12; --bad: #FF7B7B; --badbg: #3D1A1C;
    --info: #78AEFF; --infobg: #172A44;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 40px rgba(0,0,0,.4);
    --sheet: #18221F; --scrim: rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --bg2: #151E1B; --card: #18221F; --card2: #1D2925; --ink: #E8F0ED; --mut: #9AAAA4; --faint: #6F7F7A;
  --line: #2A3833; --soft: #26244A; --acc: #8E83FF; --acc-ink: #B3AAFF; --on-acc: #120F33;
  --ok: #45C993; --okbg: #15342A; --warn: #F2B14C; --wbg: #3A2C12; --bad: #FF7B7B; --badbg: #3D1A1C;
  --info: #78AEFF; --infobg: #172A44;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 40px rgba(0,0,0,.4);
  --sheet: #18221F; --scrim: rgba(0,0,0,.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow-x: hidden; }
[dir="rtl"] body, body[dir="rtl"] { font-family: "IBM Plex Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.shell { max-width: 520px; margin: 0 auto; padding-bottom: calc(140px + env(safe-area-inset-bottom)); min-height: 100vh; }
.hidden { display: none !important; }
.muted { color: var(--mut); }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; }
.bpill { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 1; padding: 0; text-align: start; }
.bpill .logo { flex: none; width: 34px; height: 34px; border-radius: 11px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.bpill b { display: block; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bpill small { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--mut); font-weight: 600; }
.sync { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.live { background: var(--ok); }
.sync.busy { background: var(--warn); }
.sync.off { background: var(--bad); }
.iconbtn { flex: none; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); }

/* Hero */
.hero-wrap { position: relative; margin: 0 16px; }
.hero-wrap .bh { margin: 0; }
.hero-cap { position: absolute; right: 12px; bottom: 12px; left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: rgba(255,255,255,.86); color: #14172C; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
[dir="rtl"] .hero-cap { right: auto; left: 12px; }
.bh.dusk + .hero-cap, .bh.night + .hero-cap, .bh.eve + .hero-cap { background: rgba(10,12,40,.55); color: #F3EEDC; }
.hero-cap i { width: 8px; height: 8px; border-radius: 50%; background: #FFC35E; display: block; box-shadow: 0 0 6px #FFC35E; }

/* Sections and cards */
.sec { padding: 0 16px; margin-top: 16px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 8px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 800; }
.sec-h button { font-size: 13px; font-weight: 700; color: var(--acc-ink); padding: 4px 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.pad { padding: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
.h-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }

/* Month progress */
.month { padding: 14px; }
.month-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.month-top b { font-size: 16px; font-weight: 800; }
.month-top span { font-size: 13px; color: var(--mut); font-weight: 600; }
.bar { height: 10px; border-radius: 999px; background: var(--bg2); overflow: hidden; margin: 10px 0 8px; display: flex; }
.bar i { display: block; height: 100%; }
.bar i.paid { background: var(--ok); }
.bar i.pocket { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }

/* Money tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; text-align: start; width: 100%; }
.tile .lbl { font-size: 12px; color: var(--mut); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tile .val { font-size: 21px; font-weight: 800; margin-top: 4px; letter-spacing: -.01em; line-height: 1.15; }
.tile .val small { display: block; font-size: 13px; font-weight: 700; color: var(--mut); letter-spacing: 0; }
.tile .sub { font-size: 12px; color: var(--mut); margin-top: 4px; font-weight: 600; }
.tile.wide { grid-column: 1 / -1; }
.tile.alert { border-color: var(--warn); background: var(--wbg); }
.tile.alert .lbl, .tile.alert .sub { color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* Banner / notices */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; }
.banner.warn { background: var(--wbg); color: var(--warn); }
.banner.info { background: var(--infobg); color: var(--info); }
.banner.ok { background: var(--okbg); color: var(--ok); }
.banner .grow b { display: block; font-weight: 800; }
.banner button { flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 14px; font-weight: 800; font-size: 14.5px; transition: transform .12s ease, background .15s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--acc); color: var(--on-acc); }
.btn.sec { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost { color: var(--acc-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border: 1.5px solid var(--line); background: var(--card); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.wa { background: #1FA855; color: #fff; }

/* Segmented control + chips */
.seg { display: flex; background: var(--bg2); border-radius: 13px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 36px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--mut); padding: 0 8px; white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .cnt { font-size: 11px; opacity: .7; }

/* Unit cards (collect) */
.unit { padding: 12px 12px 12px 14px; }
.unit-h { display: flex; align-items: center; gap: 10px; }
.ucode { flex: none; min-width: 44px; height: 44px; padding: 0 6px; border-radius: 13px; background: var(--bg2); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.unit.settled .ucode { background: var(--okbg); color: var(--ok); }
.uname { font-weight: 800; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.umeta { font-size: 12.5px; color: var(--mut); font-weight: 600; }
.status { flex: none; font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.status.paid { background: var(--okbg); color: var(--ok); }
.status.owes { background: var(--wbg); color: var(--warn); }
.status.part { background: var(--infobg); color: var(--info); }
.status.none { background: var(--bg2); color: var(--mut); }
.arrears { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--bad); background: var(--badbg); padding: 6px 10px; border-radius: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ticks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tick { min-height: 38px; padding: 4px 11px; border-radius: 12px; border: 1.5px dashed var(--line); background: var(--card2); text-align: start; display: inline-flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.tick b { font-size: 12.5px; font-weight: 800; }
.tick span { font-size: 11px; color: var(--mut); font-weight: 600; }
.tick.paid { border-style: solid; border-color: transparent; background: var(--okbg); }
.tick.paid b, .tick.paid span { color: var(--ok); }
.tick.pocket { border-style: solid; border-color: transparent; background: var(--wbg); }
.tick.pocket b, .tick.pocket span { color: var(--warn); }
.tick.part { border-style: solid; border-color: var(--info); background: var(--infobg); }
.tick.sup { opacity: .92; }
.tick.sup b::after { content: " ↗"; font-size: 10px; }
.unit-actions { display: flex; gap: 6px; margin-top: 10px; }
.unit-actions .btn { flex: 1; }

/* Lists */
.list { padding: 4px 0; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; width: 100%; text-align: start; }
.li + .li { border-top: 1px solid var(--line); }
.li .ic { flex: none; width: 36px; height: 36px; border-radius: 11px; background: var(--bg2); display: grid; place-items: center; font-size: 16px; }
.li .ic.in { background: var(--okbg); color: var(--ok); }
.li .ic.out { background: var(--badbg); color: var(--bad); }
.li .ic.move { background: var(--wbg); color: var(--warn); }
.li b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li small { display: block; font-size: 12px; color: var(--mut); font-weight: 600; }
.li .amt { flex: none; font-weight: 800; font-size: 14px; text-align: end; }
.li .amt.in { color: var(--ok); }
.li .amt.out { color: var(--bad); }
.li .chev { color: var(--faint); font-weight: 800; }
.li .rowbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: start; background: none; padding: 0; }
/* Month review: a larger month title beside One-off / Add, and charge rows that show both figures. */
.sec-h.month-head { align-items: center; flex-wrap: wrap; row-gap: 2px; }
.sec-h.month-head h2 { font-size: clamp(19px, 5.8vw, 23px); line-height: 1.15; letter-spacing: -.02em; flex: 1 1 7.5rem; min-width: 0; }
.sec-h.month-head .month-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; column-gap: 10px; row-gap: 0; flex: none; }
.sec-h.month-head .month-acts button { white-space: nowrap; }
.li.chg { align-items: flex-start; }
.li.chg .rowbtn { align-items: flex-start; }
.li.chg b, .apt-bill b, .chg-people b, .tot-card b { white-space: normal; overflow: visible; text-overflow: unset; overflow-wrap: anywhere; line-height: 1.35; }
.li.chg > .btn { margin-top: 8px; flex: none; }
.chg-block + .chg-block { border-top: 1px solid var(--line); }
.chg-figs { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
.chg-figs .line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chg-figs .k { font-size: 11.5px; font-weight: 700; color: var(--mut); flex: none; }
.chg-figs .v { font-size: 13.5px; font-weight: 800; text-align: end; line-height: 1.3; min-width: 0; }
.chg-rate { margin-top: 4px; }
.chg-people { padding: 2px 14px 12px 62px; }
[dir="rtl"] .chg-people { padding: 2px 62px 12px 14px; }
.who { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 13.5px; }
.who + .who { border-top: 1px dashed var(--line); }
.who.ov { background: var(--wbg); margin: 0 -8px; padding: 7px 8px; border-radius: 10px; }
.pill-ov { display: inline-block; margin-inline-start: 6px; padding: 1px 7px; border-radius: 999px; background: var(--wbg); color: var(--warn); font-size: 11px; font-weight: 800; vertical-align: 1px; }
.who.ov .pill-ov { background: var(--card); }
.apt-bill { padding: 10px 14px; }
.apt-bill + .apt-bill { border-top: 1px solid var(--line); }
.apt-bill .rowbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; }
.apt-lines { padding: 4px 0 2px 50px; }
[dir="rtl"] .apt-lines { padding: 4px 50px 2px 0; }
.tot-card .kv { align-items: flex-start; }
.tot-card .kv b { text-align: end; font-weight: 800; }
.daylbl { font-size: 12px; font-weight: 800; color: var(--mut); margin: 14px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
.empty { text-align: center; padding: 28px 16px; color: var(--mut); font-weight: 600; font-size: 14px; }

/* Task row */
.task { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.task + .task { border-top: 1px solid var(--line); }
.check { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 900; font-size: 14px; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.done b { text-decoration: line-through; color: var(--mut); }
.task b { font-size: 14px; font-weight: 700; display: block; }
.task small { font-size: 12px; color: var(--mut); font-weight: 600; }
.task small.late { color: var(--bad); }

/* Dock */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 496px; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(19,32,28,.16); z-index: 50; }
.dock button.tab { flex: 1; min-height: 52px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--mut); }
.dock button.tab svg { width: 22px; height: 22px; }
.dock button.tab.on { color: var(--acc-ink); background: var(--soft); }
.dock .fab { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--acc); color: var(--on-acc); font-size: 26px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(91,76,245,.35); }
/* Plus Jakarta Sans (English) draws "+" about 4px below the middle of this square.
   IBM Plex Sans Arabic already sits in the middle, so only English is nudged. */
[dir="ltr"] .dock .fab { padding-bottom: 6.5px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .18s ease; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--sheet); border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); animation: up .24s cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 40px; height: 5px; touch-action: none; cursor: grab; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet h3 { margin: 4px 0 4px; font-size: 19px; font-weight: 800; }
.sheet .lead { margin: 0 0 14px; color: var(--mut); font-size: 13.5px; }
.sheet .foot { display: flex; gap: 10px; margin-top: 18px; }
.sheet .foot .btn { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.menu { padding: 0; }
.menu .li { border-radius: 0; }

/* Forms */
.field { display: block; margin-top: 12px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--mut); margin-bottom: 5px; }
.input { width: 100%; min-height: 46px; padding: 10px 13px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--card2); font-size: 16px; color: var(--ink); }
.input:focus { border-color: var(--acc); outline: none; background: var(--card); }
textarea.input { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.money-in { display: flex; gap: 8px; }
.money-in .input { flex: 1; }
.money-in .seg { flex: none; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.switch-row:first-child { border-top: 0; }
.switch-row b { font-size: 14px; display: block; }
.switch-row small { font-size: 12px; color: var(--mut); font-weight: 600; display: block; }
.sw { flex: none; position: relative; width: 48px; height: 28px; border-radius: 14px; background: var(--line); transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.sw.on { background: var(--acc); }
.sw.on::after { transform: translateX(20px); }
[dir="rtl"] .sw.on::after { transform: translateX(-20px); }
[dir="rtl"] .sw::after { left: auto; right: 3px; }
.hint { font-size: 12.5px; color: var(--mut); margin-top: 6px; line-height: 1.45; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; margin-top: 10px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; font-size: 14px; }
.kv + .kv { border-top: 1px dashed var(--line); }
.kv span { color: var(--mut); font-weight: 600; }
.kv b { font-weight: 800; text-align: end; }
.linkbox { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg2); font-size: 12.5px; font-weight: 600; word-break: break-all; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 700; z-index: 200; max-width: calc(100% - 32px); transition: all .25s ease; text-align: center; }
.toast.pop { opacity: 1; transform: translate(-50%, 0); }

/* Onboarding — full screen, never scrolls */
.ob { position: fixed; inset: 0; z-index: 80; display: flex; justify-content: center; background: linear-gradient(180deg, #EAF4F0 0%, #F4F8F6 50%, var(--bg) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ob { background: linear-gradient(180deg, #14211D 0%, var(--bg) 60%); } }
:root[data-theme="dark"] .ob { background: linear-gradient(180deg, #14211D 0%, var(--bg) 60%); }
.ob-in { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; }
.ob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 20px 0; min-height: 52px; }
.ob-dots { display: flex; gap: 5px; flex: 1; max-width: 200px; }
.ob-dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; }
.ob-dots i.on { background: var(--acc); }
.ob-stage { flex: 1 1 auto; min-height: 120px; display: flex; align-items: flex-end; justify-content: center; padding: 6px 24px 0; position: relative; }
.ob-stage::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 80%; height: 80%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(91,76,245,.14) 0%, rgba(91,76,245,0) 70%); }
.ob-stage .bh { max-height: 100%; }
.ob-body { flex: 0 0 auto; padding: 14px 22px 0; }
.ob-body h1 { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 800; letter-spacing: -.015em; }
.ob-body p.sub { margin: 6px 0 0; font-size: 14.5px; color: var(--mut); line-height: 1.45; }
.ob-foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 16px 22px calc(16px + env(safe-area-inset-bottom)); }
.ob-foot .row .btn { flex: 1; }
.ob-step { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.ob-step + .ob-step { border-top: 1px solid var(--line); }
.ob-step b { font-size: 15px; display: block; }
.ob-step small { font-size: 12.5px; color: var(--mut); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper button { width: 42px; height: 42px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-size: 21px; font-weight: 700; }
.stepper span { min-width: 40px; text-align: center; font-size: 18px; font-weight: 800; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); text-align: start; }
.choice + .choice { margin-top: 8px; }
.choice.on { border-color: var(--acc); background: var(--soft); }
.choice .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--bg2); display: grid; place-items: center; font-size: 19px; }
.choice b { display: block; font-size: 14.5px; }
.choice small { display: block; font-size: 12.5px; color: var(--mut); font-weight: 600; margin-top: 1px; }
.features { display: grid; gap: 8px; margin-top: 14px; }
.feat { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.feat i { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.feat span small { display: block; color: var(--mut); font-weight: 600; font-size: 12.5px; }

/* Resident page */
.res-head { padding: calc(16px + env(safe-area-inset-top)) 18px 10px; }
.res-head small { color: var(--mut); font-weight: 700; font-size: 12.5px; }
.res-head h1 { margin: 2px 0 0; font-size: 24px; font-weight: 800; }
.bill-total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 10px; margin-top: 6px; border-top: 2px solid var(--line); font-weight: 800; font-size: 16px; }
.receipt-stamp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--okbg); color: var(--ok); font-weight: 800; font-size: 12.5px; }
.foot-note { text-align: center; font-size: 12px; color: var(--faint); padding: 24px 16px; }

/* Activity */
.ev { display: flex; gap: 10px; padding: 10px 14px; font-size: 13.5px; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev .who { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--acc-ink); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.ev small { display: block; color: var(--mut); font-size: 12px; font-weight: 600; }

/* Splash */
.splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 300; }
.splash .logo { width: 58px; height: 58px; border-radius: 18px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; font-size: 26px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }

@media (min-width: 560px) { .shell { padding-top: 8px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
a.btn { text-decoration: none; }
.unit-actions .btn { min-height: 40px; }
.hero-cap { right: auto; left: 12px; }
[dir="rtl"] .hero-cap { left: auto; right: 12px; }
.tr-box:empty { display: none; }
.tr-box { margin-top: 6px; }
.tr-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 34px; padding: 4px 12px; border-radius: 999px; background: var(--soft); color: var(--acc-ink); font-size: 13px; font-weight: 600; text-align: start; }
.tr-chip span { opacity: .75; }
.tr-chip b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-wait { font-size: 12.5px; color: var(--mut); font-weight: 600; }
.scan-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
.doc-thumb { width: 64px; height: 64px; flex: none; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); cursor: zoom-in; }
.scan-btn { min-height: 44px; }
.scan-state { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 9px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; background: var(--infobg); color: var(--info); }
.scan-state.ok { background: var(--okbg); color: var(--ok); }
.scan-state.bad { background: var(--wbg); color: var(--warn); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.card.later .task{opacity:.62}


/* amount + its equivalent underneath (month review) */
.chg-figs .v .main, b.dual .main { display: block; white-space: nowrap; }
.chg-figs .v .eq, b.dual .eq { display: block; font-size: 11.5px; font-weight: 600; color: var(--mut); white-space: nowrap; }
b.dual { text-align: end; }
/* the dock: equal tabs so the + sits in the middle */
.dock button.tab { flex: 1 1 0; min-width: 0; }
/* apartment rows in the month review: name, then each figure on its own line */
.apt-bill .rowbtn .grow { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start; min-width: 0; }
.apt-bill .rowbtn .grow b, .apt-bill .rowbtn .grow small { display: block; }
.apt-bill .rowbtn .grow small { font-size: 12.5px; line-height: 1.35; }
/* iOS draws date inputs with their own size: make them match the other fields */
input.input[type="date"], input.input[type="time"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; text-align: start; line-height: normal; }
input.input[type="date"]::-webkit-date-and-time-value { text-align: start; margin: 0; }
.two > * { min-width: 0; }

/* Full-size receipt photo */
.photo-view { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.92); display: flex; flex-direction: column; }
.photo-view .pv-scroll { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top,0px) 8px 0; touch-action: pinch-zoom pan-x pan-y; }
.photo-view img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.photo-view .pv-close { margin: 10px auto calc(14px + env(safe-area-inset-bottom,0px)); min-width: 140px; min-height: 46px; border-radius: 999px; border: 0; background: #fff; color: #111; font: 600 16px/1 inherit; }

/* Invite QR */
.qr-box { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 4px; text-align: center; }
.qr-box img { width: 200px; height: auto; border-radius: 14px; background: #fff; cursor: zoom-in; }

/* Onboarding with several blocks: one building per block, side by side */
.ob-stage.ob-multi { gap: 4px; padding: 6px 8px 0; }
.ob-multi .ob-blk { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; justify-content: center; height: 100%; }
.ob-multi .ob-blk .bh { max-height: 100%; width: 100%; }
/* Apartment badges: never wrap a block-prefixed code like A-1A */
.li .ic, .ucode { white-space: nowrap; }
.li .ic { width: auto; min-width: 36px; padding: 0 6px; }
/* Setup checklist on Home */
.setup .li.done b { text-decoration: line-through; color: var(--mut); }
.setup .li .ic.ok { background: var(--okbg); color: var(--ok); }
.setup .prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.setup .prog i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.ob-multi .ob-blk + .ob-blk { margin-inline-start: -16%; }

/* Home, all blocks: the compound's buildings side by side */
.hero-multi { display: flex; align-items: flex-end; gap: 4px; margin: 4px 16px 0; padding: 14px 6px 10px; border-radius: 24px; background: linear-gradient(180deg, var(--soft), transparent); min-height: 210px; }
.hero-multi .hm-blk { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--mut); font-weight: 700; }
.hero-multi .hm-blk .bh { width: 100%; max-height: 200px; margin: 0; }
.hero-multi .hm-blk + .hm-blk { margin-inline-start: -10%; }
.hero-multi small { font-size: 12px; }

/* Admin */
.pill-st { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; vertical-align: 2px; margin-inline-start: 4px; background: var(--bg2); color: var(--mut); }
.pill-st.st-live { background: var(--okbg); color: var(--ok); }
.pill-st.st-beta, .pill-st.st-custom { background: var(--soft); color: var(--acc-ink); }
.pill-st.st-idea { background: var(--wbg); color: var(--warn); }
.pill-st.st-off { background: var(--badbg); color: var(--bad); }
.support-bar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--warn); color: #fff; font-size: 13px; }
.support-bar span { flex: 1; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.support-bar button { background: rgba(255,255,255,.22); color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.support-bar.full { background: var(--bad); }

/* Admin workspace */
.adm .desk-main { width: 100%; }
.adm .desk-tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.adm .chips { padding-inline: 0; }
.adm-sub { margin: -10px 0 14px; color: var(--mut); font-size: 13px; }
.desk-card .adm-sub { margin: -6px 0 12px; }

.adm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 18px; align-items: start; margin-top: 16px; }

.adm-two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
.adm-att { margin: -4px -14px -8px; }
.adm-att .li b { font-weight: 700; }
.adm-att .li small { display: block; color: var(--mut); }
.adm-chart { display: flex; align-items: stretch; gap: 2px; height: 160px; border-bottom: 1px solid var(--line); }
.adm-col { flex: 1; min-width: 0; display: flex; align-items: flex-end; position: relative; border-radius: 4px 4px 0 0; }
.adm-col:hover, .adm-col:focus-visible { background: var(--bg2); outline: 0; }
.adm-col i { display: block; width: 100%; background: var(--acc); border-radius: 4px 4px 0 0; }
.adm-col::after { content: attr(data-tip); display: none; position: absolute; bottom: calc(100% - 22px); left: 50%; transform: translateX(-50%); z-index: 5; padding: 6px 10px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; }
.adm-col.l::after { left: 0; transform: none; } .adm-col.r::after { left: auto; right: 0; transform: none; }
.adm-col:hover::after, .adm-col:focus-visible::after { display: block; }
.adm-axis { display: flex; justify-content: space-between; margin-top: 6px; color: var(--mut); font-size: 12px; }
.adm-more { margin-top: 10px; font-size: 13px; color: var(--mut); }
.adm-more summary { cursor: pointer; font-weight: 600; }
.adm-more .desk-tw { margin-top: 8px; color: var(--ink); max-height: 240px; overflow-y: auto; }
.adm-t th button { font-weight: 700; color: var(--mut); white-space: nowrap; }
.adm-t th button:hover { color: var(--ink); }

.adm-t tr.click { cursor: pointer; }
.adm-t td { white-space: nowrap; }

.adm-link { font-weight: 700; color: var(--ink); text-align: start; }

.adm-mode { padding: 14px 18px; }

.adm-count { font-size: 13px; }
.adm-narrow { display: none; }
.adm-narrow .li small { display: block; color: var(--mut); }
.adm-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.adm-facts div { background: var(--bg2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.adm-facts small { display: block; color: var(--mut); font-size: 11.5px; font-weight: 600; }

@media (min-width: 1000px) {
  .scrim.drawer { justify-content: flex-end; align-items: stretch; }
  .scrim.drawer .sheet { max-width: 560px; max-height: none; height: 100%; margin: 0; border-radius: 24px 0 0 24px; animation: admSlide .22s ease; padding-top: 22px; }
  .scrim.drawer .sheet.still { animation: none; }
  .scrim.drawer .grab { display: none; }
}
@keyframes admSlide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 999px) {
  .adm { flex-direction: column; }
  .adm .desk-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .adm .desk-side { position: sticky; top: 0; z-index: 20; width: 100%; height: auto; flex-direction: row; align-items: center; gap: 4px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; overflow-x: auto; border-inline-end: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }

}

/* Admin: Screen wall and Workflows */
#std-host { display: none; position: fixed; top: 0; bottom: 0; right: 0; left: 232px; z-index: 10; overflow: auto; background: var(--bg); }
.std { padding: 26px 32px 60px; }

.std-seg { flex: none; max-width: 100%; overflow-x: auto; scrollbar-width: none; }

.std-pick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--mut); }
.std-pick .input, .std-mini { width: auto; min-height: 38px; padding: 4px 10px; font-size: 14px; color: var(--ink); }

.std-fl-stage .std-bar { justify-content: center; }

.std-fl-panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }

.std-fl-panel > p { margin: 0 0 12px; font-size: 13px; }
.std-steps { list-style: none; margin: 0 0 14px; padding: 0; }
.std-steps button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 0; text-align: start; color: var(--mut); font-size: 13.5px; }
.std-steps b { font-weight: 600; }
.std-steps span { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--bg2); font-size: 12px; font-weight: 700; }
.std-steps .done span { background: var(--okbg); color: var(--ok); }
.std-steps .on button { color: var(--ink); }

.std-fl-nav { display: flex; gap: 8px; align-items: stretch; }

@media (max-width: 1250px) { .std-fl-grid { grid-template-columns: 180px minmax(0, 1fr) 260px; gap: 14px; } .std { padding: 22px 20px 50px; } }
@media (max-width: 999px) {
  #std-host { left: 0; }
  .std { padding: 18px 16px 50px; }
  .std-fl-grid { grid-template-columns: minmax(0, 1fr); }
  .std-fl-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }

}
/* Inside a preview frame */
html.pv-boot #app { visibility: hidden; }
.pv-msg { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: flex-end; justify-content: center; padding: 16px; background: var(--scrim); }
.pv-msg-card { width: 100%; max-width: 440px; max-height: 88vh; overflow: auto; padding: 14px; border-radius: 20px; background: var(--sheet); }
.pv-msg-card small { display: block; margin-bottom: 8px; color: var(--mut); font-weight: 600; }
.pv-bubble { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; background: var(--okbg); color: var(--ink); font-size: 14px; line-height: 1.45; }
.pv-hl { outline: 3px solid var(--acc); outline-offset: 2px; animation: pvPulse 1.4s ease-in-out infinite; }
@keyframes pvPulse { 50% { outline-color: transparent; } }

/* Admin: Design elements */
.ds-stage { background: var(--bg); color: var(--ink); border-radius: 18px; padding: 4px 22px 22px; border: 1px solid var(--line); }
.ds-stage[dir="rtl"] { font-family: "IBM Plex Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif; }
.ds-sec { margin-top: 18px; }
.ds-sec > h2 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
.ds-sub { margin: 0 0 12px; color: var(--mut); font-size: 13px; }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 10px; }
.ds-scenes { grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
.ds-item { min-width: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
.ds-item.wide { grid-column: span 2; }
.ds-show { min-width: 0; }
.ds-item code, .ds-type code { display: block; direction: ltr; text-align: start; font: 600 11.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mut); overflow-wrap: anywhere; }
.ds-dock { position: static; transform: none; width: fit-content; padding: 0; background: none; box-shadow: none; border: 0; backdrop-filter: none; }
.ds-scene { margin: 0; }
.ds-static { position: static !important; transform: none !important; opacity: 1 !important; left: auto; bottom: auto; padding-top: 8px; border-radius: 10px; display: flex; width: fit-content; max-width: 100%; }
.ds-inline { position: static; animation: none; background: none; padding: 0; max-height: none; overflow: visible; border-radius: 0; box-shadow: none; }
.ds-group { margin-top: 12px; }
.ds-group h3 { margin: 0 0 8px; font-size: 13px; color: var(--mut); font-weight: 700; }
.ds-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.ds-swatch { display: block; min-width: 0; cursor: pointer; }
.ds-chip { display: block; position: relative; height: 54px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 6px; overflow: hidden; }
.ds-chip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.ds-swatch b { display: block; font-size: 12.5px; }
.ds-swatch small { display: block; color: var(--mut); font-size: 11.5px; overflow-wrap: anywhere; }
.ds-edits { margin-top: 14px; }
.ds-pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 8px; }
.ds-pair { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.ds-pair b { display: block; font-size: 13px; }
.ds-pair small { color: var(--mut); font-size: 12px; }
.ds-aa { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 1px solid var(--line); }
.ds-faces { display: flex; flex-wrap: wrap; gap: 24px; }
.ds-faces b { display: block; font-size: 22px; font-weight: 700; }
.ds-faces small { color: var(--mut); }
.ds-type-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ds-type-l b { display: block; font-size: 13px; }
.ds-type-l small { display: block; color: var(--mut); font-size: 12px; }
@media (max-width: 999px) {
  .ds-stage { padding: 2px 12px 14px; }
  .ds-item.wide { grid-column: span 1; }
  .ds-type-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

/* Contacts */
.li.contact .cbtn { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bg2); text-decoration: none; font-size: 18px; margin-inline-start: 6px; }
.li.contact .cbtn.wa { background: var(--okbg); }
.li .ic.sos { background: var(--badbg); }

/* News from the Natour app */
.news-item .news-k { font-size: 12px; font-weight: 700; color: var(--acc-ink); margin-bottom: 4px; }
.news-item.offer .news-k { color: var(--warn); }
.news-item b { display: block; font-size: 16px; }
.news-item p { margin: 6px 0 8px; color: var(--mut); line-height: 1.45; }
.news-card { border-color: var(--acc); background: linear-gradient(180deg, var(--soft), var(--card)); }

/* ---------- Laptop dashboard ---------- */
.desk { display: flex; min-height: 100vh; }
.desk-side { position: sticky; top: 0; height: 100vh; width: 232px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 18px 12px; border-inline-end: 1px solid var(--line); background: var(--card); overflow-y: auto; }
.desk-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; background: none; border: 0; text-align: start; color: var(--ink); }
.desk-brand .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; }
.desk-brand small { display: block; color: var(--mut); font-size: 12px; }
.desk-nav { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 12px; background: none; border: 0; color: var(--ink); font-weight: 600; font-size: 14px; text-align: start; }
.desk-nav span { width: 22px; text-align: center; }
.desk-nav:hover { background: var(--bg2); }
.desk-nav.on { background: var(--soft); color: var(--acc-ink); }
.desk-sub { margin: 14px 10px 6px; font-size: 12px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.desk-side .grow { flex: 1; }
.desk-main { flex: 1; min-width: 0; padding: 26px 32px 60px; max-width: 1400px; }
.desk-main .sec { padding-inline: 0; }
.desk-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.desk-head h1 { margin: 0; font-size: 26px; }
.desk-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.desk-pick { width: auto; min-width: 180px; min-height: 38px; padding: 6px 12px; }
.desk-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.desk-tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.desk-tile small { display: block; color: var(--mut); font-weight: 600; font-size: 12px; }
.desk-tile b { display: block; font-size: 20px; margin: 4px 0 2px; }
.desk-tile b.in { color: var(--ok); } .desk-tile b.out { color: var(--bad); }
.desk-tile span { color: var(--mut); font-size: 12px; }
.desk-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 18px; }
.desk-card h2 { margin: 0 0 12px; font-size: 16px; }
.desk-card h3 { margin: 18px 0 8px; font-size: 14px; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; }
.desk-tw { overflow-x: auto; }
.desk-t { width: 100%; border-collapse: collapse; font-size: 14px; }
.desk-t th { text-align: start; font-size: 12px; color: var(--mut); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.desk-t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.desk-t .num { text-align: end; white-space: nowrap; font-variant-numeric: tabular-nums; }
.desk-t tbody tr:hover { background: var(--bg2); }
.desk-t tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--line); }
.dcell { border: 0; border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 13px; background: var(--bg2); color: var(--ink); white-space: nowrap; }
.dcell small { font-weight: 500; color: var(--mut); margin-inline-start: 3px; }
.dcell.ok { background: var(--okbg); color: var(--ok); } .dcell.part { background: var(--wbg); color: var(--warn); } .dcell.due { background: var(--badbg); color: var(--bad); }
.desk-filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.desk-filters .input { width: auto; min-height: 38px; padding: 6px 12px; }
.desk-chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 6px; }
.dc-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; gap: 4px; }
.dc-bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
.dc-bars i, .dc-legend i { display: block; width: 30%; max-width: 16px; border-radius: 4px 4px 0 0; }
.dc-col small { color: var(--mut); font-size: 11px; }
i.due { background: var(--line); } i.got { background: var(--acc); } i.out { background: var(--bad); opacity: .75; }
.dc-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--mut); }
.dc-legend span { display: flex; align-items: center; gap: 6px; } .dc-legend i { width: 10px; height: 10px; border-radius: 3px; }
.rep-h h2 { margin: 0; } .rep-h small { color: var(--mut); }
@media (min-width: 1000px) { .desk ~ .scrim .sheet, .scrim .sheet { border-radius: 24px; margin-bottom: 4vh; } }
@media print {
  .desk-side, .desk-acts, .desk-filters, .no-print, .support-bar, .toast { display: none !important; }
  .desk-main { padding: 0; max-width: none; }
  .desk-card { border: 0; padding: 0; break-inside: avoid; }
  body, .desk-card, .desk-tile { background: #fff !important; color: #000 !important; }
  .desk-t td, .desk-t th { border-color: #ccc; color: #000; }
}
.dc-col { max-width: 72px; } .desk-chart { justify-content: flex-start; }

.scrim.still, .sheet.still { animation: none; }

/* Collector page (test build) */
.pvbar { display: flex; align-items: center; gap: 10px; margin: 6px 12px 0; padding: 8px 12px; border-radius: 10px; background: var(--wbg); color: var(--warn); font-size: 13px; font-weight: 700; }
.pvbar span { flex: 1; }

@media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }

.cblock { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.cblock.on { border-color: var(--ink); }
.cblock small { color: var(--mut); font-weight: 600; }
.camt { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.camt small { color: var(--mut); font-size: 11.5px; font-weight: 600; }

.bh.night .bh-sun, .bh.night .bh-cloud{display:none}
.bh-star{fill:#FFF6DA;animation:bhTw 3s ease-in-out infinite}
.bh-cloud{animation:bhDrift 16s ease-in-out infinite alternate}
.bh-bob{animation:bhBob 2.4s ease-in-out infinite}
@keyframes bhCore{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes bhPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes bhTw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bhDrift{from{transform:translateX(0)}to{transform:translateX(16px)}}
@keyframes bhBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion: reduce){.bh *{animation:none!important}}
/* Onboarding studio (building only), reveal + confetti */
.bh.studio { --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#5D6B85; }
.bh.studio .bh-halo { display: inline; }
.bh.bh-bare { aspect-ratio: auto; width: 100%; height: 100%; margin: 0; border-radius: 0; box-shadow: none; background: transparent; overflow: visible; }
.bh.nopop .bh-pop { animation: none; }
.bh.reveal { background: transparent; }
.bh.reveal .bh-bg { animation: bhReveal 1.8s ease .35s both; }
.bh.reveal .bh-chip { animation: bhReveal .8s ease 1.6s both; }
@keyframes bhReveal { from { opacity: 0; } to { opacity: 1; } }
.cf-layer { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.cf-layer i { position: absolute; top: -24px; width: 8px; height: 13px; border-radius: 2px; animation-name: cfFall; animation-timing-function: cubic-bezier(.25,.6,.4,1); animation-fill-mode: forwards; }
@keyframes cfFall { to { transform: translateY(112vh) rotate(560deg); } }
/* Underground floors */
.bh.day { --earth:#C9AE8A; --base:#DCCDB3; --strata:#A88B66; }
.bh.dusk { --earth:#B9958A; --base:#D9C2B2; --strata:#9A7A70; }
.bh.eve { --earth:#5C4A68; --base:#7A6B8E; --strata:#47395A; }
.bh.night { --earth:#2E2A58; --base:#4A5796; --strata:#24204A; }
.bh-earth{fill:var(--earth)} .bh-base{fill:var(--base)} .bh-strata{fill:none;stroke:var(--strata);stroke-width:.6;opacity:.6}
.bh.day { --earth:#4A3A2E; --grain:#6B5646; --conc:#E4E1DA; --base:#EFE6D6; }
.bh.dusk { --earth:#3E302C; --grain:#5E4A42; --conc:#E2D8D2; --base:#EBDCCF; }
.bh.eve { --earth:#271E28; --grain:#3E3140; --conc:#A79BB4; --base:#8E7E9E; }
.bh.night { --earth:#16131E; --grain:#2A2434; --conc:#8C96C8; --base:#5E6DB0; }
.bh-grain{fill:var(--grain)} .bh-conc{fill:var(--conc)} .bh-pot{fill:#8A5A3C}
.bh-sconce{fill:#3A3540} .bh-sconceGlow{fill:#FFD98A;opacity:.55}
.bh.day .bh-sconceGlow{opacity:.25}

/* Concrete underground + podium (v15.2) */
.bh.day   { --conc:#C9C6C0; --base:#E2DFD9; --concDk:#A9A59E; --floorLine:#D2CEC7; --plinth:#E9E7E2; --plinthLip:#FFF3D0; }
.bh.dusk  { --conc:#C4BCBA; --base:#DDD5D2; --concDk:#A39A98; --floorLine:#CEC5C2; --plinth:#E6DEDB; --plinthLip:#FFD9A0; }
.bh.eve   { --conc:#8E8698; --base:#A59DAF; --concDk:#6E6678; --floorLine:#958D9F; --plinth:#B1A9BB; --plinthLip:#FFC979; }
.bh.night { --conc:#5D6488; --base:#717A9E; --concDk:#454C70; --floorLine:#646C90; --plinth:#7D86AC; --plinthLip:#FFD27A; }
.bh-concDk{fill:var(--concDk)} .bh-floorLine{fill:var(--floorLine)} .bh-plinth{fill:var(--plinth)} .bh-plinthHi{fill:#fff;opacity:.5}
.bh-plinthLip{fill:var(--plinthLip);opacity:.55}
.bh.day .bh-plinthLip{opacity:.35}
/* Neighbours step back so our building leads */
.bh:not(.bh-bare) .bh-neigh, .bh:not(.bh-bare) .bh-nline, .bh:not(.bh-bare) .bh-nw { opacity:.6 }
.bh.day .bh-neigh{fill:#DCE1E8} .bh.day .bh-nline{fill:#CBD2DC} .bh.day .bh-nw{fill:#A9B7C8}

/* Elevator */
.bh-shaft{fill:#BFD6E6;opacity:.55;stroke:var(--rail);stroke-width:.5}
.bh.night .bh-shaft,.bh.eve .bh-shaft{fill:#2B3A6E;opacity:.7}
.bh-cable{stroke:var(--rail);stroke-width:.3;opacity:.5}
.bh-cab rect{fill:#5A6070} .bh-cab .bh-cabLit{fill:#FFE7AE}
@media (prefers-reduced-motion: reduce){ .bh-cab animateTransform{display:none} }

.bh-cabMid .bh-cabLit{fill:#FFE3A0} .bh-cabGlow{fill:#FFD27A;opacity:.45}

/* Safe */
.bh-safeBody{fill:#4A5262} .bh-safeIn{fill:#2A2F3A} .bh-safeDoor{fill:#69728A;stroke:#3A4050;stroke-width:.5}
.bh-safeDial{fill:#C9CED8;stroke:#3A4050;stroke-width:.5} .bh-safeFoot{fill:#2A2F3A}
.bh-tag{fill:#fff;stroke:#2E2B5F;stroke-width:.6} .bh-tagTx,.bh-plaqueTx,.bh-brassTx{font:700 5.2px Inter,system-ui,sans-serif;text-anchor:middle;fill:#2E2B5F}
.bh-niche{fill:#2A2F3A} .bh-nicheGlass{fill:#FFE7AE;opacity:.18;stroke:var(--doorFrame);stroke-width:.8}
.bh-plaque{fill:#FFF6E3;stroke:var(--doorFrame);stroke-width:.4} .bh-plaqueTx{font-size:4.2px}
.bh-brass{fill:#E8C77A;stroke:#9A7A34;stroke-width:.6} .bh-brassTx{fill:#4A3510;font-size:5px}
.bh-safeTap{cursor:pointer}

.bh-safeFrame{fill:#7A8296;stroke:#3A4050;stroke-width:.5} .bh-safeShelf{fill:#5A6274}

.bh-safe .bh-safeBody{fill:#8E939C;stroke:#6B7079;stroke-width:.6} .bh-safeFace{fill:#9EA3AC;stroke:#7A7F88;stroke-width:.5}
.bh-safeDialRing{fill:#7A7F88} .bh-safe .bh-safeDial{fill:#C4C8CF;stroke:none} .bh-safeKnob{fill:#4A4F58} .bh-safeTick{stroke:#E6E8EC;stroke-width:.35}
.bh-safeBolt{fill:#6B7079} .bh-safe .bh-safeIn{fill:#2E3138} .bh-safe .bh-safeShelf{fill:#4A4F58}
.bh-safe .bh-safeDoor{fill:#A2A7B0;stroke:#6B7079;stroke-width:.5}

.bh-safeTap:focus{outline:none} .bh-safeTap:focus-visible .bh-safeBody{stroke:#5B4CF5;stroke-width:1}

.bh-flip{opacity:0;transition:opacity .25s;pointer-events:none} .bh-win.flip .bh-flip{opacity:1}
.bh-liftTap{cursor:pointer}
.bh{touch-action:manipulation}

/* Tower */
.bh-blink{animation:bhBlink 2.4s steps(1) infinite} @keyframes bhBlink{0%{opacity:1}50%{opacity:.15}}

.bh-liftLight{fill:#FFE3A0;filter:drop-shadow(0 0 1.5px #FFD27A)}
.bh-safeAmt{font:700 5px Inter,system-ui,sans-serif;text-anchor:middle;fill:#F2D68E}

.bh-bubble{fill:#fff;filter:drop-shadow(0 1px 1.5px rgba(30,30,60,.25))}
.bh-bubbleAmt{font:800 14px Inter,system-ui,sans-serif;text-anchor:middle;fill:#14805A}
.bh-bubbleSub{font:600 6px Inter,system-ui,sans-serif;text-anchor:middle;fill:#6B7079}

.bh-chip{border:0;font-family:inherit;cursor:pointer;transition:opacity .2s,transform .2s;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-chip span{overflow:hidden;text-overflow:ellipsis}
.bh-chip.swap{opacity:0;transform:translateY(-3px)}
/* With an elevator, the middle windows are dark glass so the cabin light shows */
.bh.lift .bh-core{fill:#263049;animation:none;stroke:rgba(0,0,0,.25);stroke-width:.4}
.bh.night.lift .bh-core,.bh.eve.lift .bh-core{fill:#141A33}

/* The building cat (black). Always on screen: nap on A, walk to B, nap on B, walk back (60 s). */
.bh-cat{cursor:pointer}
.bh-cat ellipse,.bh-cat circle:not(.bh-catEye),.bh-cat path,.bh-cat rect:not([fill=transparent]){stroke:rgba(236,232,255,.75);stroke-width:.45px;paint-order:stroke}
.bh-catMove{animation:catMove 60s ease-in-out infinite}
.bh-catPoseSit{animation:poseSit 60s steps(1) infinite}
.bh-catPoseGo{opacity:0;animation:poseGo 60s steps(1) infinite}
.bh-catPoseBack{opacity:0;animation:poseBack 60s steps(1) infinite}
.bh-cat:not(.bh-catMove) .bh-catPoseSit{animation:none}
.bh-cat.pet{animation-play-state:paused}
.bh-catHop{transform-box:fill-box}.bh-cat.pet .bh-catHop{animation:catHop .45s ease}
.bh-catTail{transform-box:fill-box;transform-origin:100% 100%;animation:catTail 2.8s ease-in-out infinite}
.bh-catEarR{transform-box:fill-box;transform-origin:50% 100%;animation:catEar 7s ease-in-out infinite}
.bh-catEyes{transform-box:fill-box;transform-origin:50% 50%;animation:catBlink 5.5s steps(1) infinite}
.bh-catBody{transform-box:fill-box;transform-origin:50% 100%;animation:catBreath 3.2s ease-in-out infinite}
.bh-catEye{fill:#F2DC4C}
.bh.night .bh-catEye,.bh.eve .bh-catEye{fill:#FFE66B}
.bh-catLegA{animation:catLeg .46s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.bh-catLegB{animation:catLeg .46s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:50% 0}
@keyframes catTail{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes catEar{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(18deg)}94%{transform:rotate(0)}}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes catBreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
@keyframes catLeg{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes catHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes catMove{0%,30%{transform:translateX(0)}42%,72%{transform:translateX(var(--dx))}84%,100%{transform:translateX(0)}}
@keyframes poseSit{0%{opacity:1}30%{opacity:0}42%{opacity:1}72%{opacity:0}84%{opacity:1}}
@keyframes poseGo{0%{opacity:0}30%{opacity:1}42%{opacity:0}}
@keyframes poseBack{0%{opacity:0}72%{opacity:1}84%{opacity:0}}
.bh-say{position:absolute;z-index:5;transform:translate(-50%,-100%);background:#FFFFFF;color:#17142B;font-size:13px;font-weight:700;padding:7px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;animation:saySay .25s cubic-bezier(.2,.9,.3,1.3)}
.bh-say::after{content:"";position:absolute;left:calc(50% + var(--tail, 0px) - 6px);bottom:-5px;width:12px;height:12px;background:#FFFFFF;transform:rotate(45deg);border-radius:2px}
.bh-say.out{opacity:0;transform:translate(-50%,-115%);transition:opacity .4s,transform .4s}
@keyframes saySay{from{opacity:0;transform:translate(-50%,-80%) scale(.7)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
@media (prefers-reduced-motion: reduce){.bh-catMove,.bh-catPoseSit{animation:none}.bh-catPoseGo,.bh-catPoseBack{display:none}.bh-catTail,.bh-catEarR,.bh-catEyes,.bh-catBody{animation:none}}

</style>

function rollDate(iso, rep) {
  var d = new Date((iso || todayIso()) + 'T12:00:00');
  if (rep === 'daily') { var td = new Date(todayIso() + 'T12:00:00'); if (d < td) d = td; d.setDate(d.getDate() + 1); }
  else if (rep === 'weekly') d.setDate(d.getDate() + 7);

/* ---------------------------------------------------------------------------
   Which floor an apartment is on, read from its code:
   SS1A / SS2 / -1 → underground, G / GF / 0 → ground, 2B / 12 / 201 → that floor.
   --------------------------------------------------------------------------- */
function unitLevel(code) {
  // An apartment placed by hand (floor set in its sheet) wins over its code.
  if (code && typeof code === 'object') { if (code.floor != null && code.floor !== '') return Number(code.floor); code = code.code; }
  var c = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
  var m;
  if ((m = c.match(/^SS(\d*)/))) return -(Number(m[1]) || 1);
  if ((m = c.match(/^-(\d+)/))) return -Number(m[1]);
  if (/^(G|RDC|0)/.test(c)) return 0;
  if ((m = c.match(/^(\d+)/))) { var v = Number(m[1]); return m[1].length >= 3 ? Math.floor(v / 100) : v; }
  return null;
}
/* Group scene windows into floors. items: [{code, win}]. Returns null when codes don't say. */
function levelsFor(items) {
  var known = items.filter(function(x) { return unitLevel(x.u || x.code) != null; });
  if (!items.length || known.length < items.length / 2) return null;
  var by = {};
  items.forEach(function(x) {
    var lv = unitLevel(x.u || x.code);
    if (lv == null) lv = 1;
    (by[lv] = by[lv] || []).push(x);
  });
  function pos(x) { return x.u && x.u.spot ? x.u.spot : String(x.code); }
  return Object.keys(by).map(function(k) {
    var row = by[k].sort(function(a, b) { return pos(a).localeCompare(pos(b), 'en', { numeric: true }); });
    // more than 6 on one floor: split into extra rows above so nothing is hidden
    return { lv: Number(k), wins: row.map(function(x) { return x.win; }) };
  }).reduce(function(out, r) {
    if (r.wins.length <= 6) { out.push(r); return out; }
    for (var i = 0; i < r.wins.length; i += 6) out.push({ lv: r.lv + i / 600, wins: r.wins.slice(i, i + 6) });
    return out;
  }, []);
}

/* A <select> that lists presets grouped, each shown in both languages. */
function presetSelect(id, list, onchange, label) {
  var h = '<select class="input preset-pick" id="' + id + '" onchange="' + onchange + '"><option value="">' + esc(label || t('Pick from the list…', 'اختر من القائمة…')) + '</option>';
  var group = null;
  list.forEach(function(p, i) {
    var gk = p.g ? p.g[0] : (p.cat ? catName(p.cat) : '');
    if (gk !== group) {
      if (group !== null) h += '</optgroup>';
      group = gk;
      h += '<optgroup label="' + esc(p.g ? (LANG === 'ar' ? p.g[1] + ' · ' + p.g[0] : p.g[0] + ' · ' + p.g[1]) : catIcon(p.cat) + ' ' + gk) + '">';
    }
    h += '<option value="' + i + '">' + esc(LANG === 'ar' ? p.ar + ' · ' + p.en : p.en + ' · ' + p.ar) + '</option>';
  });
  if (group !== null) h += '</optgroup>';
  return h + '</select>';
}

/* ============================================================================
   Live config: the feature map, feature switches and the app's lists
   (expense categories, common charges/expenses/tasks, transfer methods).
   They live in Supabase and are edited from the admin screen; changes reach
   every open app within seconds. The lists in presets.js / core.js are the
   built-in fallback when the server can't be reached.
   ============================================================================ */
var CFG = { features: {}, bfeat: {}, lists: [], loaded: false, supportMode: 'consent' };
var IS_ADMIN = false, WANT_ADMIN = false;
var PAY_METHODS = [{ key: 'Whish', en: 'Whish', ar: 'ويش' }, { key: 'OMT', en: 'OMT', ar: 'OMT' }, { key: 'Bank', en: 'Bank transfer', ar: 'تحويل مصرفي' }];
var CATS_ALL = null; // every category ever defined, hidden ones too, so old expenses keep their name
var CODE_LISTS = null;
function snapshotCodeLists() {
  if (CODE_LISTS) return;
  CODE_LISTS = JSON.parse(JSON.stringify({ CATS: CATS, CHARGE_PRESETS: CHARGE_PRESETS, EXPENSE_PRESETS: EXPENSE_PRESETS, TASK_PRESETS: TASK_PRESETS, PAY_METHODS: PAY_METHODS }));
}

/* Is a feature on here? A building's own switch wins, then the global switch, then on. */
function feature(key) {
  if (CFG.bfeat[key] != null) return !!CFG.bfeat[key];
  var f = CFG.features[key];
  if (!f) return true;
  return f.status !== 'off' && f.default_on !== false;
}

function loadConfig(bid) {
  snapshotCodeLists();
  if (!isCloud()) { applyLists(); return Promise.resolve(); }
  var q = [
    SB.from('app_features').select('*'),
    bid ? SB.from('building_features').select('*').eq('building_id', bid) : Promise.resolve({ data: [] }),
    bid ? SB.from('app_lists').select('*').or('building_id.is.null,building_id.eq.' + bid).order('sort') : SB.from('app_lists').select('*').is('building_id', null).order('sort'),
    SB.rpc('am_admin'),
    SB.from('app_settings').select('*')
  ];
  return Promise.all(q).then(function(r) {
    if (r[0].error && r[2].error) return; // tables not there yet: keep the built-in lists
    CFG.features = {}; (r[0].data || []).forEach(function(f) { CFG.features[f.key] = f; });
    CFG.bfeat = {}; (r[1].data || []).forEach(function(f) { CFG.bfeat[f.key] = f.on; });
    CFG.lists = r[2].data || [];
    IS_ADMIN = !!(r[3] && r[3].data);
    if (WANT_ADMIN && IS_ADMIN) { WANT_ADMIN = false; setTimeout(openAdmin, 0); }
    (r[4].data || []).forEach(function(x) { if (x.key === 'support_mode') CFG.supportMode = x.value === 'full' ? 'full' : 'consent'; });
    CFG.loaded = true;
    applyLists();
    watchConfig(bid);
    var after = [];
    if (bid && typeof loadSupport === 'function') after.push(loadSupport());
    if (typeof loadNews === 'function') after.push(loadNews());
    return Promise.all(after);
  }).catch(function(e) { console.warn('config', e); });
}

/* Rebuild the app's lists from the rows. Global rows first, then the building's own. */
function applyLists() {
  var L0 = CODE_LISTS, rows = CFG.lists.filter(function(r) { return !r.hidden; });
  var has = function(kind) { return CFG.lists.some(function(r) { return r.kind === kind && !r.building_id; }); };
  var by = function(kind) { return rows.filter(function(r) { return r.kind === kind; }).sort(function(a, b) { return (a.building_id ? 1 : 0) - (b.building_id ? 1 : 0) || a.sort - b.sort; }); };
  // Expense categories
  CATS_ALL = JSON.parse(JSON.stringify(L0.CATS));
  CFG.lists.filter(function(r) { return r.kind === 'expense_cat' && r.key; }).forEach(function(r) { CATS_ALL[r.key] = [r.icon || '🧾', r.en, r.ar || r.en]; });
  if (has('expense_cat')) {
    var c = {};
    by('expense_cat').forEach(function(r) { if (r.key) c[r.key] = [r.icon || '🧾', r.en, r.ar || r.en]; });
    c.supplier = c.supplier || L0.CATS.supplier; c.other = c.other || L0.CATS.other;
    CATS = c;
  } else CATS = JSON.parse(JSON.stringify(L0.CATS));
  // Common expenses
  EXPENSE_PRESETS = has('expense_preset') ? by('expense_preset').map(function(r) { return { cat: (r.data && r.data.cat) || 'other', en: r.en, ar: r.ar || r.en }; })
    .sort(function(a, b) { var ka = Object.keys(CATS), x = ka.indexOf(a.cat), y = ka.indexOf(b.cat); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); }) : L0.EXPENSE_PRESETS.slice();
  // Common charges, per kind
  if (has('charge_preset')) {
    var cp = { fixed: [], due: [], service: [] };
    by('charge_preset').forEach(function(r) {
      var d = r.data || {}, k = cp[d.kind] ? d.kind : 'fixed';
      cp[k].push({ g: d.g || [t('Other', 'Other'), 'أخرى'], en: r.en, ar: r.ar || r.en, amt: d.amt, cur: d.cur || 'USD', split: d.split });
    });

  PAY_METHODS = has('pay_method') ? by('pay_method').map(function(r) { return { key: r.key || r.en, en: r.en, ar: r.ar || r.en }; }) : L0.PAY_METHODS.slice();
}

/* Instant answer from the lists, or null. */
function localTranslate(text, kind, to) {
  var s = String(text || '').trim();
  if (!s) return null;
  if (to === 'ar') {
    var low = s.toLowerCase().replace(/\s+/g, ' ');
    var lists = [].concat(CHARGE_PRESETS.fixed, CHARGE_PRESETS.due, CHARGE_PRESETS.service, TASK_PRESETS, EXPENSE_PRESETS);
    for (var i = 0; i < lists.length; i++) if (lists[i].en.toLowerCase() === low) return lists[i].ar;
    if (kind === 'name') {
      var parts = low.split(/\s+/), out = [];
      for (var j = 0; j < parts.length; j++) {
        var w = parts[j], hit = NAME_DICT[w];
        if (!hit && /^(el|al)-/.test(w) && NAME_DICT[w.slice(3)]) hit = 'ال' + NAME_DICT[w.slice(3)].replace(/^ال/, '');
        if (!hit) return null;
        out.push(hit);
      }
      return out.join(' ');
    }
  } else {
    var lists2 = [].concat(CHARGE_PRESETS.fixed, CHARGE_PRESETS.due, CHARGE_PRESETS.service, TASK_PRESETS, EXPENSE_PRESETS);
    for (var k = 0; k < lists2.length; k++) if (lists2[k].ar === s) return lists2[k].en;
  }
  return null;
}

var TR_CACHE = {};
function serverTranslate(text, kind, to) {
  var key = kind + '|' + to + '|' + text;
  if (TR_CACHE[key] !== undefined) return Promise.resolve(TR_CACHE[key]);
  if (!isCloud()) return Promise.resolve(null);
  return SB.functions.invoke('translate', { body: { text: text, kind: kind, to: to } }).then(function(r) {
    var out = r && !r.error && r.data && r.data.text ? r.data.text : null;
    if (out && out.trim().toLowerCase() === text.trim().toLowerCase()) out = null;
    TR_CACHE[key] = out;
    return out;
  }, function() { return null; });
}

/* Wiring: an input with data-tr="otherId" data-tr-kind="name|phrase" proposes text for #otherId.
   The suggestion appears under #otherId, in a div with id "trs-otherId". */
var _trT = {};
function trInput(el) {
  var dst = el.getAttribute('data-tr'), kind = el.getAttribute('data-tr-kind') || 'phrase';
  var target = document.getElementById(dst), box = document.getElementById('trs-' + dst);
  if (!target || !box) return;
  var src = el.value.trim();
  var arabicSrc = /[؀-ۿ]/.test(src);
  // The pair can go either way: English field → Arabic field, or the reverse.
  var to = target.getAttribute('dir') === 'rtl' ? 'ar' : 'en';
  if (!src || (to === 'ar' && arabicSrc) || (to === 'en' && !arabicSrc)) { box.innerHTML = ''; return; }
  if (target.value.trim() && target.getAttribute('data-tr-auto') !== String(target.value)) { box.innerHTML = ''; return; }
  var quick = localTranslate(src, kind, to);
  if (quick) { showTr(box, dst, quick); return; }
  clearTimeout(_trT[dst]);
  if (!isCloud()) { box.innerHTML = ''; return; }
  box.innerHTML = '<span class="tr-wait">' + esc(t('Suggesting…', 'جارٍ الاقتراح…')) + '</span>';
  _trT[dst] = setTimeout(function() {
    serverTranslate(src, kind, to).then(function(out) {
      if (el.value.trim() !== src) return;
      if (out) showTr(box, dst, out); else box.innerHTML = '';
    });
  }, 650);
}
function showTr(box, dst, text) {
  box.innerHTML = '<button type="button" class="tr-chip" onclick="useTr(' + jsArg(dst) + ',' + jsArg(text) + ')"><span>' + esc(t('Use', 'استعمل')) + '</span> <b dir="auto">' + esc(text) + '</b></button>';
}
function useTr(dst, text) {
  var el = document.getElementById(dst);
  if (!el) return;
  el.value = text;
  el.setAttribute('data-tr-auto', text);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  var box = document.getElementById('trs-' + dst); if (box) box.innerHTML = '';
}
document.addEventListener('input', function(e) {
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-tr')) trInput(e.target);
});
/* After a re-render, show a suggestion again for fields that already have text. */
function trRefresh() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-tr]'), function(el) { if (el.value.trim()) trInput(el); });
}

/* Living building scene — carried over from V13 (windows = who paid, sky = real time of day). */
function sunTimesLocal(d) {
 var lat = 33.89, lon = 35.5;
 var N = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
 var B = (2 * Math.PI / 365) * (N - 81);
 var decl = (23.44 * Math.PI / 180) * Math.sin(B);
 var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
 var tz = -d.getTimezoneOffset() / 60;
 var noon = 720 - 4 * lon - eot + tz * 60;
 var phi = lat * Math.PI / 180;
 var cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(decl)) / (Math.cos(phi) * Math.cos(decl));
 var H = Math.acos(Math.max(-1, Math.min(1, cosH))) * 180 / Math.PI;
 return { rise: noon - 4 * H, set: noon + 4 * H };
}

function heroPhase(now) {
 var st = sunTimesLocal(now);
 var m = now.getHours() * 60 + now.getMinutes();
 var key, label;
 if (m < st.rise - 35 || m > st.set + 45) { key = 'night'; label = t('Night', 'ليلاً'); }
 else if (m < st.rise + 45) { key = 'dusk'; label = t('Sunrise', 'الشروق'); }
 else if (m > st.set - 50) { key = 'dusk'; label = t('Sunset', 'الغروب'); }
 else { key = 'day'; label = m < (st.rise + st.set) / 2 ? t('Morning', 'صباحاً') : t('Afternoon', 'بعد الظهر'); }
 var frac = Math.max(0, Math.min(1, (m - st.rise) / (st.set - st.rise)));
 var time = now.toLocaleTimeString(LANG === 'ar' ? 'ar-LB' : 'en-US', { hour: 'numeric', minute: '2-digit' });
 return { key: key, label: label, chip: time + ' · ' + label, sunX: 40 + frac * 286, sunY: 150 - Math.sin(Math.PI * frac) * 118 };
}
function heroR(n) { return Math.round(n * 10) / 10; }

function heroRailPath(x, w, y1, y2) {
 var d = 'M' + heroR(x - 4) + ' ' + heroR(y1) + 'H' + heroR(x + w + 4);
 for (var px = x - 3; px <= x + w + 3; px += 4) d += 'M' + heroR(px) + ' ' + heroR(y1) + 'V' + heroR(y2);
 return d;
}

/* Shared building scene — used by the Home hero and the onboarding wizard.
 o.phase: {key:'day'|'dusk'|'eve'|'night', sunX, sunY}

    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)) throw new Error(t('Enter a valid email address', 'أدخل بريداً إلكترونياً صحيحاً'));

    }).then(function(r) { return r.json().catch(function() { return {}; }); }, function() {
      throw new Error(t('No connection to the server. Check your internet and try again.', 'لا اتصال بالخادم. تحقق من الإنترنت وحاول مجدداً.'));
    }).then(function(res) {

      if (res.error === 'bad_username') throw new Error(t('Usernames are 3 to 30 letters or numbers, no spaces', 'اسم المستخدم من 3 إلى 30 حرفاً أو رقماً بلا مسافات'));
      if (!res.ok) throw new Error(t('Couldn\'t create the account. Try again.', 'تعذّر إنشاء الحساب. حاول مجدداً.'));

/* Top chip: a few short, useful facts that take turns (tap to go there). */
var HERO_FACTS = [], HERO_FI = 0;
function heroFacts(cyc, units) {
  var f = [];

    var left = pair(), owe = 0;
    units.forEach(function(u) {
      var any = false;
      chargesOf(cyc.id).forEach(function(ch) { var x = cell(ch, u); if (x.left > 0) { addTo(left, ch.cur, x.left); any = true; } });
      if (any) owe++;

  units.forEach(function(u) {

  if (urgent.length) h += '<div class="sec"><div class="sec-h"><h2>' + esc(t('Do today', 'اليوم')) + '</h2></div><div class="card">' + urgent.map(taskRow).join('') + '</div></div>';
  if (owing.length) {
    h += '<div class="sec"><div class="sec-h"><h2>' + esc(t('Doors to knock on', 'أبواب لطرقها')) + '</h2><button onclick="go(\'collect\')">' + esc(t('All', 'الكل')) + '</button></div><div class="card list">';
    owing.slice(0, 5).forEach(function(o) {
      var late = pairUsd(o.arr) > 0.005;
      h += '<button class="li" onclick="openSheet(\'unit\',{id:' + jsArg(o.u.id) + '})"><div class="ic' + (late ? ' out' : '') + '">' + esc(unitTag(o.u)) + '</div><div class="grow"><b>' + esc(unitName(o.u) || unitTag(o.u)) + '</b><small' + (late ? ' style="color:var(--bad)"' : '') + '>' + esc(late ? t('Also owes earlier months', 'عليه أشهر سابقة') : t('This month', 'هذا الشهر')) + '</small></div><span class="amt">' + esc(fmtPair({ USD: o.now.USD + o.arr.USD, LBP: o.now.LBP + o.arr.LBP })) + '</span></button>';
    });

  return h;
}

/* Tap a charge: unpaid → paid in full by the chosen channel; paid → offer to undo. */
function channelRow() {
  var ch = defaultChannel();
  if (ch.indexOf('collector:') === 0) return { channel: 'collector', received_by: ch.slice(10), method: 'Cash' };
  if (ch === 'transfer') return { channel: 'transfer', received_by: S.me.id, method: setting('transfer_method') || 'Whish' };
  return { channel: 'manager', received_by: S.me.id, method: 'Cash' };
}
function tapCell(chId, uId) {
  if (!can('pay')) return noPerm();
  var ch = byId(S.charges, chId), u = byId(S.units, uId);
  if (!ch || !u) return;
  var c = cell(ch, u);
  if (isPend(chId, uId) || doubleTap(chId, uId)) return;
  if (c.state === 'paid' || c.state === 'part') { openSheet('cell', { ch: chId, u: uId }); return; }
  var r = channelRow();
  safePay([{ charge_id: ch.id, unit_id: u.id, amount: c.left, cur: ch.cur, channel: r.channel, method: r.method, received_by: r.received_by, received_at: nowIso() }])
    .then(tickToast, fail);
}
function payAll(uId, cycId) {
  var u = byId(S.units, uId), r = channelRow(), rows = [];
  chargesOf(cycId).forEach(function(ch) {
    var c = cell(ch, u);
    if (c.left > 0) rows.push({ charge_id: ch.id, unit_id: u.id, amount: c.left, cur: ch.cur, channel: r.channel, method: r.method, received_by: r.received_by, received_at: nowIso() });
  });
  if (!rows.length) return;
  safePay(rows).then(function(done) {
    if (done && done.length) toastUndo(t(unitTag(u) + ' is settled for ' + cycleTitle(byId(S.cycles, cycId)), unitTag(u) + ' سدد ' + cycleTitle(byId(S.cycles, cycId))), done.map(function(r) { return r.id; }));
  }, fail);
}
function undoPayments(ids) {
  if (!isCloud()) ids = ids.filter(function(id) { return byId(S.payments, id); });
  var p = Promise.resolve();
  ids.forEach(function(id) { p = p.then(function() { return rpc('void_payment', { p_payment: id }); }); });
  return p.then(function() { UI.cb = null; if (isCloud()) reloadBuilding(); closeSheet(); toast(t('Payment undone', 'تم التراجع عن الدفعة')); }, function(e) { fail(e); });
}
SHEETS.cell = function(d) {

/* ---------------------------------------------------------------------------
   Tasks
   --------------------------------------------------------------------------- */
function taskRow(x) {

    var dsub = t('Done ', 'أُنجزت ') + dateLabel(x.done_at) + (x.done_by ? ' · ' + memberName(x.done_by) : '');

  }
  var sub = (x.due_on ? dateLabel(x.due_on) : t('No date', 'بلا تاريخ')) + (x.repeat !== 'none' ? ' · ' + (LANG === 'ar' ? REPEATS[x.repeat][1] : REPEATS[x.repeat][0]) : '') + (x.assignee === 'collector' ? ' · ' + collectorLabel() : '');
  return '<div class="task' + (x.done_at ? ' done' : '') + '"><button class="check' + (x.done_at ? ' on' : '') + '" onclick="tickTask(' + jsArg(x.id) + ')" aria-label="' + esc(t('Done', 'تم')) + '">✓</button><div class="grow" role="button" tabindex="0" onclick="' + (isManager() ? 'openSheet(\'task\',{id:' + jsArg(x.id) + '})' : '') + '"><b>' + esc(L(x)) + '</b><small class="' + (late ? 'late' : '') + '">' + esc(sub) + '</small></div></div>';

/* Open tasks: what's due in the next 2 weeks, then a quieter "later" list (e.g. the next tank cleaning in 6 months). */
function taskLists(open) {
  var lim = new Date(); lim.setDate(lim.getDate() + 14);
  var limIso = lim.toISOString().slice(0, 10);
  var soon = open.filter(function(x) { return !x.due_on || x.due_on <= limIso; });
  var later = open.filter(function(x) { return x.due_on && x.due_on > limIso; });
  var h = soon.length ? '<div class="card">' + soon.map(taskRow).join('') + '</div>' : '<div class="card empty">' + esc(t('Nothing due in the next 2 weeks', 'لا شيء مستحق خلال أسبوعين')) + '</div>';
  if (later.length) h += '<div class="daylbl">' + esc(t('Later', 'لاحقاً')) + '</div><div class="card later">' + later.map(taskRow).join('') + '</div>';
  return h;
}
function tickTask(id) {
  if (!can('tasks')) return noPerm();
  var x = byId(S.tasks, id);
  if (!x) return;
  if (x.done_at) { dbUpdate('tasks', id, { done_at: null, done_by: null }).then(render, fail); render(); return; }
  var rep = x.repeat && x.repeat !== 'none' ? x.repeat : null;
  var next = rep ? rollDate(x.due_on, rep) : null;
  // On the server a trigger creates the next one; locally we do the same here.
  var p = dbUpdate('tasks', id, isCloud() ? { done_at: nowIso(), done_by: S.me.id } : { done_at: nowIso(), done_by: S.me.id, repeat: 'none' });
  if (rep) {
    if (!isCloud()) p = p.then(function() { return dbInsert('tasks', { title: x.title, title_ar: x.title_ar, due_on: next, repeat: rep, assignee: x.assignee }); });
    else p = p.then(function() { reloadBuilding(); });
    toast(t('Done. Next one on ' + dateLabel(next), 'تم. التالية في ' + dateLabel(next)));
  }
  p.then(render, fail);
  render();
}
function renderTasksScreen() {
  var h = renderTopbar(t('Tasks', 'المهام'));

  var open = mine.filter(function(x) { return !x.done_at; }).sort(function(a, b) { return String(a.due_on || '9').localeCompare(String(b.due_on || '9')); });

  if (done.length) h += '<div class="sec"><div class="sec-h"><h2>' + esc(t('Done recently', 'أُنجزت مؤخراً')) + '</h2></div><div class="card">' + done.map(taskRow).join('') + '</div></div>';
  return h;
}

/* ---------------------------------------------------------------------------
