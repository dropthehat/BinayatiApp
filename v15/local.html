/* ---------------- Building layout: fix floors after setup ---------------- */
var LAYOUT_CODE = /^(SS\d+|\d+)[A-H]?$/;
function currentLayout(block) {
  var floors = 0, under = 0, per = 1, by = {};
  activeUnits().filter(function(u) { return block == null || blockOf(u) === block; }).forEach(function(u) {
    var lv = unitLevel(u.code);
    if (lv == null || lv === 0) return;
    if (lv > 0) floors = Math.max(floors, lv); else under = Math.max(under, -lv);
    by[lv] = (by[lv] || 0) + 1;
    per = Math.max(per, by[lv]);
  });
  return { floors: Math.max(1, floors), per: Math.min(6, per), under: Math.min(3, under) };
}
function layoutSummary(l) {
  return t(l.floors + ' floors × ' + l.per + (l.under ? ' · ' + l.under + ' underground' : ''), l.floors + ' طوابق × ' + l.per + (l.under ? ' · ' + l.under + ' سفلية' : ''));
}
function layoutPlan(l, block) {
  block = block || '';
  var target = layoutCodes(l.floors, l.per, l.under), want = {};
  target.forEach(function(c) { want[c] = 1; });
  var byCode = {};
  S.units.forEach(function(u) { if (blockOf(u) === block) byCode[String(u.code).toUpperCase()] = u; });
  var add = [], revive = [], drop = [];
  target.forEach(function(c) { var u = byCode[c]; if (!u) add.push(c); else if (u.active === false) revive.push(u); });
  activeUnits().forEach(function(u) { var c = String(u.code).toUpperCase(); if (blockOf(u) === block && LAYOUT_CODE.test(c) && !want[c]) drop.push(u); });
  return { target: target, add: add, revive: revive, drop: drop };
}
SHEETS.layout = function(d) {
  var bl = blocks();
  if (bl.length > 1 && d.block == null) d.block = bl[0];
  if (!d.l) d.l = currentLayout(bl.length > 1 ? d.block : null);
  var l = d.l, plan = layoutPlan(l, bl.length > 1 ? d.block : '');
  var h = '<h3>' + esc(t('Floors & apartments', 'الطوابق والشقق')) + '</h3>';
  h += '<div class="chips" style="padding:4px 0 8px;flex-wrap:wrap">';

  h += '<button class="chip" onclick="addBlock()">＋ ' + esc(bl.length > 1 ? t('Another block', 'بلوك آخر') : t('This is a compound with blocks', 'هذا مجمّع ببلوكات')) + '</button></div>';
  h += '<p class="lead">' + esc(t('Fix the building if setup got it wrong. Apartments you renamed yourself are left alone.', 'صحّح البناية إذا أخطأ الإعداد. الشقق التي سمّيتها بنفسك لا تتغير.')) + '</p>';
  h += '<div class="ob-stage" style="height:190px;padding:0">' + obScene(plan.target.length, plan.target, d.block ? (S.building.name + ' ' + d.block).slice(0, 12) : S.building.name, false) + '</div>';
  [['floors', t('Floors', 'الطوابق'), 1, 12], ['per', t('Apartments per floor', 'شقق في الطابق'), 1, 6], ['under', t('Underground floors', 'طوابق سفلية'), 0, 3]].forEach(function(x) {
    h += '<div class="ob-step"><div><b>' + esc(x[1]) + '</b></div><div class="stepper"><button onclick="layoutBump(\'' + x[0] + '\',-1,' + x[2] + ',' + x[3] + ')">−</button><span>' + l[x[0]] + '</span><button onclick="layoutBump(\'' + x[0] + '\',1,' + x[2] + ',' + x[3] + ')">+</button></div></div>';
  });
  var lines = [];
  if (plan.add.length) lines.push(t('Adds ', 'يضيف ') + plan.add.join(', '));
  if (plan.revive.length) lines.push(t('Brings back ', 'يعيد ') + plan.revive.map(function(u) { return u.code; }).join(', '));
  if (plan.drop.length) {
    var paid = plan.drop.filter(function(u) { return S.payments.some(function(p) { return p.unit_id === u.id && !p.voided_at; }); });
    lines.push(t('Removes ', 'يحذف ') + plan.drop.map(function(u) { return u.code; }).join(', ') + (paid.length ? t(' (those with payments are kept as inactive)', ' (التي لها دفعات تبقى غير فعّالة)') : ''));
  }
  h += '<div class="card pad" style="margin-top:8px;font-size:13.5px">' + (lines.length ? lines.map(function(x) { return '<div style="padding:3px 0">' + esc(x) + '</div>'; }).join('') : '<span class="muted">' + esc(t('No change', 'لا تغيير')) + '</span>') + '</div>';
  h += '<div id="sheet-err" class="err"></div><div class="foot"><button class="btn sec" onclick="closeSheet()">' + esc(t('Cancel', 'إلغاء')) + '</button><button class="btn pri" ' + (lines.length ? '' : 'disabled ') + 'onclick="applyLayout()">' + esc(t('Apply', 'تطبيق')) + '</button></div>';
  return h;
};
function layoutBump(k, dlt, min, max) {
  var l = UI.sheet.data.l, was = l[k];
  l[k] = Math.max(min, Math.min(max, was + dlt));
  if ((l.floors + l.under) * l.per > 60) l[k] = was;
  render();
}
function applyLayout() {
  var blk = blocks().length > 1 ? UI.sheet.data.block : '';
  var plan = layoutPlan(UI.sheet.data.l, blk), ops = Promise.resolve();
  var base = S.units.length;
  var rows = plan.add.map(function(c, i) { return { code: c, name: '', sort: base + i, weight: 1, lang: 'both', active: true, resident_token: token(), block: blk || null }; });
  if (rows.length) ops = ops.then(function() { return dbInsertMany('units', rows); });
  plan.revive.forEach(function(u) { ops = ops.then(function() { return dbUpdate('units', u.id, { active: true }); }); });
  plan.drop.forEach(function(u) {
    var used = S.payments.some(function(p) { return p.unit_id === u.id; });
    ops = ops.then(function() { return used ? dbUpdate('units', u.id, { active: false }) : dbDelete('units', u.id); });
  });
  // keep the list in building order: underground first, then floor by floor
  ops.then(function() {
    var all = S.units.slice().sort(function(a, b) {
      if (blockOf(a) !== blockOf(b)) return blockOf(a).localeCompare(blockOf(b));
      var la = unitLevel(a.code), lb = unitLevel(b.code);
      if (la == null) la = 99; if (lb == null) lb = 99;
      return la - lb || String(a.code).localeCompare(String(b.code), 'en', { numeric: true });
    });
    var p2 = Promise.resolve();
    all.forEach(function(u, i) { if (u.sort !== i) p2 = p2.then(function() { return dbUpdate('units', u.id, { sort: i }); }); });
    return p2;
  }).then(function() { closeSheet(); toast(t('Building updated', 'تم تحديث البناية')); }, function(e) { sheetErr(e.message); });
}

/* Turn the building into a compound with blocks, or add one more block. */
function addBlock() {
  var bl = blocks(), letters = 'ABCDEFGHIJ';
  var ops = Promise.resolve();
  if (bl.length < 2) {
    var first = bl[0] || 'A';
    activeUnits().forEach(function(u) { if (!blockOf(u)) ops = ops.then(function() { return dbUpdate('units', u.id, { block: first }); }); });
    bl = [first];
  }
  var next = '';
  for (var i = 0; i < letters.length; i++) if (bl.indexOf(letters.charAt(i)) < 0) { next = letters.charAt(i); break; }
  var name = prompt(t('Name of the new block', 'اسم البلوك الجديد'), next);
  if (!name) return;
  name = name.trim().toUpperCase().slice(0, 12);
  if (bl.indexOf(name) >= 0) { toast(t('That block exists already', 'هذا البلوك موجود')); return; }
  var l = currentLayout(bl[0]), base = S.units.length;
  var rows = layoutCodes(l.floors, l.per, l.under).map(function(c, i) { return { code: c, name: '', sort: base + i, weight: 1, lang: 'both', active: true, resident_token: token(), block: name }; });
  ops.then(function() { return dbInsertMany('units', rows); }).then(function() {
    UI.sheet = { name: 'layout', data: { block: name } }; render();
    toast(t('Block ' + name + ' added with ' + rows.length + ' apartments. Adjust its floors here.', 'أُضيف البلوك ' + name + ' مع ' + rows.length + ' شقق. عدّل طوابقه هنا.'));
  }, fail);
}

function obSign() {

function obBump(k, d) {
  var min = k === 'under' ? 0 : 1, max = k === 'floors' ? 12 : k === 'under' ? 3 : 6;
  var was = OB[k] || (k === 'blocks' ? 1 : 0);
  OB[k] = Math.max(min, Math.min(max, was + d));
  if ((OB.floors + (OB.under || 0)) * OB.per > 48 || (OB.floors + (OB.under || 0)) * OB.per * (OB.blocks || 1) > 150) OB[k] = was;

/* Create the building from the answers, in whichever backend is active. */
function finishSetup(displayName) {
  var settings = { rate: 89500, opening_usd: num(OB.openUsd), opening_lbp: num(OB.openLbp), books_public: true, show_who_paid: false,
                   collector_name: OB.who === 'other' ? (OB.colName || '') : '', collector_name_ar: OB.who === 'other' ? (OB.colNameAr || '') : '' };
  var bid;
  return rpc('create_building', { p_name: OB.name.trim(), p_name_ar: OB.nameAr.trim() || null, p_settings: settings, p_display_name: displayName || t('Manager', 'المدير') })
    .then(function(id) { bid = id; return openBuilding(bid); })
    .then(function() {
      var units = [], nb = OB.blocks || 1;
      for (var bi = 0; bi < nb; bi++) obUnits().forEach(function(code) {
        units.push({ code: code, name: '', sort: units.length, weight: 1, lang: 'both', active: true, resident_token: token(), block: nb > 1 ? 'ABCDEF'.charAt(bi) : null });
      });
      return dbInsertMany('units', units);
    })
    .then(function() {
      var p = currentPeriod();
      var cyc = { kind: 'month', period: p, title: periodLabel(p, 'en'), title_ar: periodLabel(p, 'ar'), published: true };
      return dbInsert('cycles', cyc).then(function() {
        return dbInsert('charges', { cycle_id: cyc.id, kind: 'fixed', title: 'Maintenance', title_ar: 'الصيانة', cur: OB.cur, amount: num(OB.fee),
                                     split: OB.split, overrides: {}, pass_through: false, recurring: true, sort: 0 });
      }).then(function() { UI.cycleId = cyc.id; });
    })
    .then(function() {
      if (OB.who === 'other' && !isCloud()) return dbInsert('members', { user_id: 'u-collector', role: 'collector', display_name: OB.colName || t('Collector', 'الجابي'), display_name_ar: OB.colNameAr || null });
    })
    .then(function() {
      return dbInsertMany('tasks', [
        { title: 'Clean water tanks', title_ar: 'تنظيف خزانات المياه', due_on: rollDate(todayIso(), 'monthly'), repeat: 'halfyear', assignee: OB.who === 'other' ? 'collector' : 'manager' },
        { title: 'Wash trash bins', title_ar: 'غسل مستوعبات النفايات', due_on: rollDate(todayIso(), 'weekly'), repeat: 'weekly', assignee: OB.who === 'other' ? 'collector' : 'manager' }
      ]);
    })
    .then(function() {
      var askInvite = OB.who === 'other' && isCloud();
      var name = OB.colName, nameAr = OB.colNameAr;
      OB = null;
      UI.screen = 'app'; UI.tab = 'home'; HERO_REVEAL = true;
      render(); window.scrollTo(0, 0); launchConfetti();
      if (askInvite) setTimeout(function() { openSheet('invite', { role: 'collector' }); setTimeout(function() { var el = document.getElementById('inv-name'); if (el) el.value = name || ''; var ea = document.getElementById('inv-name-ar'); if (ea) ea.value = nameAr || ''; }, 50); }, 1600);
    })
    .catch(function(e) { fail(e); });
}

function boot() {
  var q = new URLSearchParams(location.search);
  var r = q.get('r'), join = q.get('join');
  render();
  initCloud().catch(function(e) { console.warn(e); SB = null; toast(t('Couldn\'t reach the server. Working on this phone.', 'تعذّر الوصول للخادم. العمل على هذا الهاتف.')); })
    .then(function() {

      UI.screen = 'app'; render();

    var ns = emptyState();

    var mine = v.my_payments || [];

  }).filter(Boolean));
}
function compoundsList() {
  if (isCloud()) return cloudCall(SB.from('compounds').select('*')).then(function(r) { return r || []; }, function() { return []; });

}

/* ---------------- Overview ---------------- */
function showOverview() {

    })).then(function(rows) { UI.ov = { rows: rows, comps: comps }; render(); });
  }).catch(function(e) { UI.ov = { error: e.message, rows: [] }; render(); });

function overviewStats(ns) {
  return withState(ns, function() {
    var cyc = latestMonth(), s = cycleSummary(cyc), cash = cashState();
    var mine = cash.pockets[S.me.id] || pair();
    var mgr = S.role === 'manager' || S.role === 'comanager';

    var late = tasks.filter(function(x) { return x.due_on && x.due_on <= todayIso(); }).length;
    return { cyc: cyc, s: s, cash: cash, mine: { USD: mine.USD || 0, LBP: mine.LBP || 0 }, mgr: mgr,
             pending: mgr ? cash.pending.length : cash.pending.filter(function(h) { return h.collector_id === S.me.id; }).length,
             tasks: tasks.length, late: late, owing: s.owing.length, compound: S.building.compound_id || null, hero: heroThumb(cyc) };
  });
}
function heroThumb(cyc) {

  if (!wins.length) wins = [{ state: 'closed' }];

  return buildBuildingScene({ phase: { key: 'day', sunX: 0, sunY: 0 }, bare: true, wins: wins, levels: levels, signText: S.building.name, elevator: !!setting('elevator'), idp: 'ov' + Math.random().toString(36).slice(2, 6), extraCls: 'studio bh-bare nopop' });
}
function renderOverview() {

  h += tile(t('Needs you', 'بانتظارك'), '<span>' + (pend + late) + '</span>', t(pend + ' handovers · ' + late + ' tasks due', pend + ' تسليم · ' + late + ' مهام مستحقة'), '', 'var(--acc)');

    groups[c].forEach(function(r) { h += overviewCard(r); });
    h += '</div></div>';
  });
  h += '<div class="sec"><button class="btn sec block" onclick="startSetup()">＋ ' + esc(t('Set up a new building', 'أعدّ بناية جديدة')) + '</button>';
  if (isCloud()) h += '<button class="btn ghost block" style="margin-top:6px" onclick="signOut()">' + esc(t('Sign out', 'خروج')) + '</button>';
  h += '</div></div>';
  return h;

/* ============================================================================
   Photos in, forms filled: receipts → expenses, transfer screenshots → payments.
   The "read-doc" server function reads the image (AI key kept server-side).
   Nothing is saved until a person checks the form and taps Save.
   ============================================================================ */

/* Ask for an image (camera or gallery) and shrink it so uploads stay small. */
function pickImage(cb) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function() {
    var f = inp.files && inp.files[0];
    if (!f) return;
    shrinkImage(f, 1600, 0.8).then(cb, function() { toast(t('Couldn\'t open that image', 'تعذّر فتح الصورة')); });
  };
  inp.click();
}
function shrinkImage(file, max, q) {
  return new Promise(function(res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function() {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var dataUrl = c.toDataURL('image/jpeg', q);
      c.toBlob(function(blob) { res({ dataUrl: dataUrl, b64: dataUrl.split(',')[1], blob: blob }); }, 'image/jpeg', q);
    };
    img.onerror = rej;
    img.src = url;
  });
}
function aiReady() { return isCloud(); }
function readDoc(kind, b64, extra) {
  var body = Object.assign({ kind: kind, image: b64, mime: 'image/jpeg' }, extra || {});
  return SB.functions.invoke('read-doc', { body: body }).then(function(r) {
    if (r.error || !r.data || !r.data.ok) throw new Error(t('Couldn\'t read it. Fill it in by hand, or try a sharper photo.', 'تعذّرت القراءة. املأها يدوياً أو جرّب صورة أوضح.'));
    return r.data.fields || {};
  });
}
function uploadPhoto(blob) {
  if (!blob || !isCloud()) return Promise.resolve(null);
  var path = S.building.id + '/' + uuid() + '.jpg';
  return SB.storage.from('receipts').upload(path, blob, { contentType: 'image/jpeg', upsert: false }).then(function(r) {
    if (r.error) throw new Error(niceError(r.error));
    return path;
  });
}
var PHOTO_URLS = {};
function photoImg(path, cls) {
  if (!path) return '';
  var id = 'ph-' + path.replace(/[^a-z0-9]/gi, '').slice(-16);
  if (PHOTO_URLS[path]) return '<img id="' + id + '" class="' + (cls || 'doc-thumb') + '" src="' + esc(PHOTO_URLS[path]) + '" alt="" onclick="window.open(this.src)">';
  if (isCloud()) SB.storage.from('receipts').createSignedUrl(path, 3600).then(function(r) {
    if (r.data && r.data.signedUrl) { PHOTO_URLS[path] = r.data.signedUrl; var el = document.getElementById(id); if (el) el.src = r.data.signedUrl; }
  });
  return '<img id="' + id + '" class="' + (cls || 'doc-thumb') + '" alt="" onclick="if(this.src)window.open(this.src)">';
}
function scanStatus(d) {
  if (d.scan === 'reading') return '<div class="scan-state"><span class="spin"></span>' + esc(t('Reading the photo…', 'جارٍ قراءة الصورة…')) + '</div>';
  if (d.scan === 'done') return '<div class="scan-state ok">' + esc(d.scanNote || t('Filled in from the photo. Check the amount before saving.', 'مُلئت من الصورة. تحقق من المبلغ قبل الحفظ.')) + '</div>';
  if (d.scan === 'error') return '<div class="scan-state bad">' + esc(d.scanErr || '') + '</div>';
  return '';
}

/* ---------------- 1. Receipts → expenses ---------------- */
function scanBlockExpense(d, e) {
  var h = '<div class="scan-row">';
  if (d.photo) h += '<img class="doc-thumb" src="' + esc(d.photo) + '" alt="" onclick="window.open(this.src)">';
  else if (e && e.photo_path) h += photoImg(e.photo_path);
  if (!e) {
    h += aiReady()
      ? '<button class="btn sec sm grow scan-btn" onclick="scanReceipt()">📷 ' + esc(d.photo ? t('Scan another photo', 'صورة أخرى') : t('Scan the receipt', 'امسح الإيصال')) + '</button>'
      : '<div class="hint grow" style="margin:0">' + esc(t('Receipt scanning works once the app is connected to the server.', 'مسح الإيصالات يعمل عند ربط التطبيق بالخادم.')) + '</div>';
  }
  return h + '</div>' + scanStatus(d);

function scanReceipt() {
  keepExpense();
  pickImage(function(img) {
    var d = UI.sheet.data;
    d.photo = img.dataUrl; d.photoBlob = img.blob; d.scan = 'reading'; render();
    readDoc('receipt', img.b64, { cats: Object.keys(CATS).filter(function(k) { return k !== 'supplier'; }) }).then(function(f) {
      if (!UI.sheet || UI.sheet.data !== d) return;
      if (f.title || f.title_ar) d.title = f.title && f.title_ar ? (LANG === 'ar' ? f.title_ar + ' · ' + f.title : f.title + ' · ' + f.title_ar) : (f.title || f.title_ar);
      if (f.supplier && d.title && d.title.indexOf(f.supplier) < 0) d.title += ' (' + f.supplier + ')';
      if (f.amount) d.amount = f.amount;
      if (f.cur) d.cur = f.cur;
      if (f.cat && CATS[f.cat]) d.cat = f.cat;
      if (f.date && /^\d{4}-\d{2}-\d{2}$/.test(f.date) && f.date <= todayIso()) d.date = f.date;
      if (f.ref) d.ref = f.ref;
      d.scan = 'done';
      d.scanNote = f.confidence === 'low' ? t('Hard to read: check every field.', 'صعبة القراءة: تحقق من كل الحقول.') : null;
      render();
    }, function(err) { d.scan = 'error'; d.scanErr = err.message; render(); });
  });

/* ---------------- 2. Transfer screenshots → payments ---------------- */
function scanTransfer() {
  if (UI.sheet && UI.sheet.name === 'pay') keepPay();
  pickImage(function(img) {
    var d = (UI.sheet && UI.sheet.name === 'pay') ? UI.sheet.data : {};
    d.photo = img.dataUrl; d.photoBlob = img.blob; d.scan = 'reading';
    UI.sheet = { name: 'pay', data: d }; render();
    var units = activeUnits().map(function(u) { return { code: u.code + (blockOf(u) ? ' (' + blockOf(u) + ')' : ''), name: u.name, name_ar: u.name_ar, phone: u.phone }; });
    readDoc('transfer', img.b64, { units: units }).then(function(f) {
      if (!UI.sheet || UI.sheet.data !== d) return;
      var u = matchUnit(f);
      if (u) { d.unit = u.id; }
      if (f.amount) d.amount = f.amount;
      if (f.cur) d.cur = f.cur;
      var m = { Whish: 'Whish', OMT: 'OMT', BOB: 'Whish', Bank: 'Bank' }[f.method] || 'Whish';
      d.channel = 'transfer:' + m;
      d.ref = f.ref || '';
      d.sender = [f.sender_name, f.sender_phone].filter(Boolean).join(' · ');
      d.scan = 'done';
      var dup = d.ref && livePayments().some(function(p) { return p.note && p.note.indexOf(d.ref) >= 0; });
      d.scanNote = dup ? t('This reference was already recorded. Check it isn\'t a duplicate.', 'هذا المرجع مسجّل سابقاً. تأكد أنه ليس مكرراً.')
                 : !u ? t('Pick the apartment: the sender didn\'t clearly match anyone.', 'اختر الشقة: المرسِل لا يطابق أحداً بوضوح.')
                 : f.confidence === 'low' ? t('Hard to read: check every field.', 'صعبة القراءة: تحقق من كل الحقول.') : null;
      if (dup || !u) { d.scan = 'error'; d.scanErr = d.scanNote; }
      render();
    }, function(err) { d.scan = 'error'; d.scanErr = err.message; render(); });
  });
}
/* Find the apartment: AI's pick first, then the phone number, then the name. */
function matchUnit(f) {
  var units = activeUnits();
  if (f.unit_code) {
    var code = String(f.unit_code).split(' (')[0].toUpperCase();
    var hit = units.filter(function(u) { return String(u.code).toUpperCase() === code; });
    if (hit.length === 1) return hit[0];
  }
  var digits = String(f.sender_phone || '').replace(/\D/g, '').slice(-7);
  if (digits.length === 7) {
    var byPhone = units.filter(function(u) { return String(u.phone || '').replace(/\D/g, '').slice(-7) === digits; });
    if (byPhone.length === 1) return byPhone[0];
  }
  var name = String(f.sender_name || '').toLowerCase().trim();
  if (name) {
    var byName = units.filter(function(u) {
      var a = String(u.name || '').toLowerCase(), b = String(u.name_ar || '');
      return (a && (a === name || name.indexOf(a) >= 0 || a.indexOf(name) >= 0)) || (b && (b === f.sender_name || String(f.sender_name).indexOf(b) >= 0));
    });
    if (byName.length === 1) return byName[0];
  }
  return null;
}
function scanBlockPay(d) {
  var h = '';
  if (isManager()) {
    h += '<div class="scan-row">';
    if (d.photo) h += '<img class="doc-thumb" src="' + esc(d.photo) + '" alt="" onclick="window.open(this.src)">';
    h += aiReady() ? '<button class="btn sec sm grow scan-btn" onclick="scanTransfer()">📷 ' + esc(d.photo ? t('Another screenshot', 'لقطة أخرى') : t('Read a transfer screenshot', 'اقرأ لقطة تحويل')) + '</button>' : '';
    h += '</div>';
  }
  if (d.sender || d.ref) h += '<div class="hint">' + esc([d.sender ? t('From ', 'من ') + d.sender : '', d.ref ? t('Ref ', 'مرجع ') + d.ref : ''].filter(Boolean).join(' · ')) + '</div>';
  return h + scanStatus(d);
}
function keepPay() {
  var d = UI.sheet.data;
  if (document.getElementById('pay-unit')) d.unit = val('pay-unit');
  if (document.getElementById('pay-amt')) d.amount = val('pay-amt');
  if (document.getElementById('pay-ch')) d.channel = val('pay-ch');
}

/* ============================================================================
   Reminders that sound like a person: tone picked from the apartment's history,
   written in the resident's language, always with the exact amounts.
   ============================================================================ */
var TONE_INFO = {
  gentle: ['Gentle nudge', 'تذكير لطيف'], warm: ['Warm, regular payer', 'ودّي لمن يدفع دائماً'],
  firm: ['Firm, months behind', 'حازم، أشهر متأخرة'], thanks: ['Thank you', 'شكر']
};
function unitHistory(u, cyc) {
  var months = monthCycles().filter(function(c) { return c.published !== false && cyc && c.period < cyc.period; }).slice(0, 6);
  var paid = 0, behind = 0;
  months.forEach(function(c) {
    var r = unitCycle(u, c);
    if (!r.any) return;
    if (r.state === 'paid') paid++; else behind++;
  });
  return { checked: months.length, paid: paid, behind: behind };
}
function suggestTone(u, cyc) {
  var r = unitCycle(u, cyc);
  if (pairUsd(r.allLeft) < 0.005) return 'thanks';
  var h = unitHistory(u, cyc);
  if (h.behind >= 2) return 'firm';
  if (h.paid >= 3 && h.behind === 0) return 'warm';
  return 'gentle';
}
/* The short standard message: one line of facts, plus the link. */
function waTextShort(u, cyc, lang) {
  var r = unitCycle(u, cyc), b = unitBalance(u, cyc), owes = pairUsd(r.allLeft) > 0.005;
  function one(lg) {
    var T = function(en, ar) { return lg === 'ar' ? ar : en; };
    var name = (lg === 'ar' ? (u.name_ar || u.name) : u.name || '').split(/\s+/)[0];
    var hi = T('Hi', 'مرحباً') + (name ? ' ' + name : '') + ' (' + u.code + ')';
    var s = owes
      ? hi + ' 👋 ' + cycleTitle(cyc, lg) + ': *' + fmtPair(r.allLeft) + '* ' + T('still open', 'متبقي') + (pairUsd(b.arrears) > 0.005 ? T(' (+ ' + fmtPair(b.arrears) + ' earlier)', ' (+ ' + fmtPair(b.arrears) + ' سابقاً)') : '') + '.' + (collectors().length ? T(' You can hand it to ' + collectorLabel('en') + '.', ' يمكنك تسليمه إلى ' + collectorLabel('ar') + '.') : '')
      : hi + ' ✅ ' + T('Received in full for ', 'تم استلام كامل ') + cycleTitle(cyc, lg) + T('. Thank you!', '. شكراً!');
    return s;
  }
  lang = lang || u.lang || 'both';
  var txt = lang === 'both' ? one('ar') + '\n\n' + one('en') : one(lang);
  if (u.resident_token) txt += '\n\n' + residentLink(u);
  return txt;
}
function digitsAscii(s) { return String(s).replace(/[٠-٩]/g, function(d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/[٬،]/g, ','); }

SHEETS.remind = function(d) {
  var u = byId(S.units, d.u), cyc = byId(S.cycles, d.cyc) || currentCycle();
  if (!u || !cyc) return '';
  if (!d.tone) d.tone = suggestTone(u, cyc);
  if (!d.len) d.len = 'short';
  if (d.text == null) d.text = d.len === 'long' ? waText(u, cyc) : waTextShort(u, cyc);
  var h = '<h3>' + esc(t('Message to ', 'رسالة إلى ') + u.code + (unitName(u) ? ' · ' + unitName(u) : '')) + '</h3>';
  var hist = unitHistory(u, cyc);
  h += '<p class="lead">' + esc(hist.checked ? t('Last ' + hist.checked + ' months: paid ' + hist.paid + ', still open ' + hist.behind + '.', 'آخر ' + hist.checked + ' أشهر: سدد ' + hist.paid + '، متأخر ' + hist.behind + '.') : t('No earlier months yet.', 'لا أشهر سابقة بعد.')) + '</p>';
  h += '<div class="chips" style="padding:0 0 8px;flex-wrap:wrap">';
  Object.keys(TONE_INFO).forEach(function(k) {
    h += '<button class="chip' + (d.tone === k ? ' on' : '') + '" onclick="UI.sheet.data.text=val(\'rm-text\');UI.sheet.data.tone=\'' + k + '\';render()">' + esc(LANG === 'ar' ? TONE_INFO[k][1] : TONE_INFO[k][0]) + (k === suggestTone(u, cyc) ? ' ★' : '') + '</button>';
  });
  h += '</div>';
  h += '<div class="seg" style="margin-bottom:8px"><button class="' + (d.len === 'short' ? 'on' : '') + '" onclick="UI.sheet.data.len=\'short\';UI.sheet.data.text=null;UI.sheet.data.ai=false;UI.sheet.data.scan=null;render()">' + esc(t('Short', 'قصيرة')) + '</button><button class="' + (d.len === 'long' ? 'on' : '') + '" onclick="UI.sheet.data.len=\'long\';UI.sheet.data.text=null;UI.sheet.data.ai=false;UI.sheet.data.scan=null;render()">' + esc(t('Detailed', 'مفصّلة')) + '</button></div>';
  if (aiReady()) h += '<button class="btn sec block" onclick="aiReminder()">✨ ' + esc(d.ai ? t('Write it again', 'أعد الكتابة') : t('Write it in this tone', 'اكتبها بهذه النبرة')) + '</button>';
  h += scanStatus(d);
  h += '<label class="field"><span>' + esc(t('Message (you can edit it)', 'الرسالة (يمكنك تعديلها)')) + '</span><textarea class="input" id="rm-text" dir="auto" style="min-height:' + (d.len === 'long' ? 220 : 140) + 'px;font-size:15px">' + esc(d.text) + '</textarea></label>';
  h += '<div id="sheet-err" class="err"></div><div class="foot"><button class="btn sec" onclick="UI.sheet.data.text=null;UI.sheet.data.ai=false;UI.sheet.data.scan=null;render()">' + esc(t('Standard text', 'النص العادي')) + '</button>';
  h += u.phone ? '<button class="btn wa" onclick="sendReminder()">' + esc(t('Send on WhatsApp', 'أرسل على واتساب')) + '</button>' : '<button class="btn sec" onclick="copyText(val(\'rm-text\'))">' + esc(t('Copy (no phone saved)', 'نسخ (لا رقم محفوظ)')) + '</button>';
  return h + '</div>';
};
function aiReminder() {
  var d = UI.sheet.data, u = byId(S.units, d.u), cyc = byId(S.cycles, d.cyc) || currentCycle();
  var r = unitCycle(u, cyc), b = unitBalance(u, cyc), hist = unitHistory(u, cyc);
  var lang = u.lang || 'both';
  var lines = r.cells.map(function(x) { return (lang === 'ar' ? (x.ch.title_ar || x.ch.title) : x.ch.title) + ': ' + fmt(x.c.due, x.ch.cur) + (x.c.state === 'paid' ? ' (paid)' : ''); });
  var left = fmtPair(r.allLeft);
  var body = { tone: d.tone, lang: lang, length: d.len === 'long' ? 'long' : 'short', building: lang === 'ar' ? (S.building.name_ar || S.building.name) : S.building.name, unit: u.code,
               name: lang === 'ar' ? (u.name_ar || u.name) : u.name, month: cycleTitle(cyc, lang === 'ar' ? 'ar' : 'en'), items: lines,
               left: d.tone === 'thanks' ? '' : left, arrears: pairUsd(b.arrears) > 0.005 ? fmtPair(b.arrears) : '', monthsBehind: hist.behind,
               payTo: collectors().length ? (lang === 'ar' ? collectorLabel('ar') : lang === 'en' ? collectorLabel('en') : collectorLabel('ar') + ' / ' + collectorLabel('en')) : '', manager: memberName(S.me.id, lang === 'ar' ? 'ar' : 'en') };
  d.text = val('rm-text'); d.scan = 'reading'; render();
  SB.functions.invoke('write-reminder', { body: body }).then(function(res) {
    if (!UI.sheet || UI.sheet.data !== d) return;
    var txt = res && res.data && res.data.ok ? String(res.data.text).replace(/\\([$*_])/g, '$1') : '';
    // The figures must survive word for word, or we don't offer the text.
    var must = [d.tone === 'thanks' ? null : left].filter(Boolean);
    var plain = digitsAscii(txt).replace(/\s/g, '');
    var okFigures = must.every(function(m) { return (m.match(/[\d,.]+/g) || []).every(function(n) { return plain.indexOf(n) >= 0; }); });
    if (!txt || !okFigures) { d.scan = 'error'; d.scanErr = t('The AI version changed the amounts, so it was not used. The standard text is below.', 'النسخة المقترحة غيّرت المبالغ فلم تُستعمل. النص العادي أدناه.'); render(); return; }
    if (u.resident_token) txt += '\n\n' + (d.len === 'long' ? (lang === 'en' ? 'Your bill and receipts:' : lang === 'ar' ? 'فاتورتك وإيصالاتك:' : 'فاتورتك وإيصالاتك · Your bill and receipts:') + '\n' : '') + residentLink(u);
    d.text = txt; d.ai = true; d.scan = 'done';
    d.scanNote = t('Written by AI from your numbers. Read it before sending.', 'كتبها الذكاء الاصطناعي من أرقامك. اقرأها قبل الإرسال.');
    render();
  }, function() { d.scan = 'error'; d.scanErr = t('Couldn\'t write it now. The standard text is below.', 'تعذّرت الكتابة الآن. النص العادي أدناه.'); render(); });
}
function sendReminder() {
  var d = UI.sheet.data, u = byId(S.units, d.u);
  var digits = String(u.phone || '').replace(/\D/g, '');
  if (digits.length === 8 && digits.charAt(0) !== '9') digits = '961' + digits.replace(/^0/, '');
  if (digits.length === 7) digits = '961' + digits;
  window.open('https://wa.me/' + digits + '?text=' + encodeURIComponent(val('rm-text')), '_blank');
}

boot();
</script>
