<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Binayati">
<title>Binayati · بنايتي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B4CF5'/%3E%3Crect x='20' y='14' width='24' height='38' rx='3' fill='%23fff'/%3E%3Crect x='25' y='20' width='5' height='5' fill='%23FFC35E'/%3E%3Crect x='34' y='20' width='5' height='5' fill='%23FFC35E'/%3E%3Crect x='25' y='30' width='5' height='5' fill='%23FFC35E'/%3E%3Crect x='34' y='30' width='5' height='5' fill='%235B4CF5' opacity='.3'/%3E%3Crect x='29' y='42' width='6' height='10' fill='%235B4CF5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1F5F4; --bg2: #E7EFEC; --card: #FFFFFF; --card2: #F7FAF9; --ink: #13201C; --mut: #5E6E69; --faint: #8C9A95;
  --line: #DCE6E2; --soft: #ECEAFF; --acc: #5B4CF5; --acc-ink: #4536D9; --on-acc: #FFFFFF;
  --ok: #0E8A5F; --okbg: #E2F5EC; --warn: #B76E00; --wbg: #FFF3DD; --bad: #D33A3A; --badbg: #FDE8E8;
  --info: #2C74D6; --infobg: #E5F0FD;
  --shadow: 0 1px 2px rgba(19,32,28,.05), 0 8px 24px rgba(19,32,28,.06);
  --shadow-lg: 0 18px 40px rgba(60,52,180,.18);
  --sheet: #FFFFFF; --scrim: rgba(12,20,18,.42);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --bg2: #151E1B; --card: #18221F; --card2: #1D2925; --ink: #E8F0ED; --mut: #9AAAA4; --faint: #6F7F7A;
    --line: #2A3833; --soft: #26244A; --acc: #8E83FF; --acc-ink: #B3AAFF; --on-acc: #120F33;
    --ok: #45C993; --okbg: #15342A; --warn: #F2B14C; --wbg: #3A2C12; --bad: #FF7B7B; --badbg: #3D1A1C;
    --info: #78AEFF; --infobg: #172A44;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 40px rgba(0,0,0,.4);
    --sheet: #18221F; --scrim: rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --bg2: #151E1B; --card: #18221F; --card2: #1D2925; --ink: #E8F0ED; --mut: #9AAAA4; --faint: #6F7F7A;
  --line: #2A3833; --soft: #26244A; --acc: #8E83FF; --acc-ink: #B3AAFF; --on-acc: #120F33;
  --ok: #45C993; --okbg: #15342A; --warn: #F2B14C; --wbg: #3A2C12; --bad: #FF7B7B; --badbg: #3D1A1C;
  --info: #78AEFF; --infobg: #172A44;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 40px rgba(0,0,0,.4);
  --sheet: #18221F; --scrim: rgba(0,0,0,.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow-x: hidden; }
[dir="rtl"] body, body[dir="rtl"] { font-family: "IBM Plex Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.shell { max-width: 520px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom)); min-height: 100vh; }
.hidden { display: none !important; }
.muted { color: var(--mut); }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; }
.bpill { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 1; padding: 0; text-align: start; }
.bpill .logo { flex: none; width: 34px; height: 34px; border-radius: 11px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.bpill b { display: block; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bpill small { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--mut); font-weight: 600; }
.sync { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.live { background: var(--ok); }
.sync.busy { background: var(--warn); }
.sync.off { background: var(--bad); }
.iconbtn { flex: none; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); }

/* Hero */
.hero-wrap { position: relative; margin: 0 16px; }
.hero-wrap .bh { margin: 0; }
.hero-cap { position: absolute; right: 12px; bottom: 12px; left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: rgba(255,255,255,.86); color: #14172C; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
[dir="rtl"] .hero-cap { right: auto; left: 12px; }
.bh.dusk + .hero-cap, .bh.night + .hero-cap, .bh.eve + .hero-cap { background: rgba(10,12,40,.55); color: #F3EEDC; }
.hero-cap i { width: 8px; height: 8px; border-radius: 50%; background: #FFC35E; display: block; box-shadow: 0 0 6px #FFC35E; }

/* Sections and cards */
.sec { padding: 0 16px; margin-top: 16px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 8px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 800; }
.sec-h button { font-size: 13px; font-weight: 700; color: var(--acc-ink); padding: 4px 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.pad { padding: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
.h-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }

/* Month progress */
.month { padding: 14px; }
.month-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.month-top b { font-size: 16px; font-weight: 800; }
.month-top span { font-size: 13px; color: var(--mut); font-weight: 600; }
.bar { height: 10px; border-radius: 999px; background: var(--bg2); overflow: hidden; margin: 10px 0 8px; display: flex; }
.bar i { display: block; height: 100%; }
.bar i.paid { background: var(--ok); }
.bar i.pocket { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }

/* Money tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; text-align: start; width: 100%; }
.tile .lbl { font-size: 12px; color: var(--mut); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tile .val { font-size: 21px; font-weight: 800; margin-top: 4px; letter-spacing: -.01em; line-height: 1.15; }
.tile .val small { display: block; font-size: 13px; font-weight: 700; color: var(--mut); letter-spacing: 0; }
.tile .sub { font-size: 12px; color: var(--mut); margin-top: 4px; font-weight: 600; }
.tile.wide { grid-column: 1 / -1; }
.tile.alert { border-color: var(--warn); background: var(--wbg); }
.tile.alert .lbl, .tile.alert .sub { color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* Banner / notices */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; }
.banner.warn { background: var(--wbg); color: var(--warn); }
.banner.info { background: var(--infobg); color: var(--info); }
.banner.ok { background: var(--okbg); color: var(--ok); }
.banner .grow b { display: block; font-weight: 800; }
.banner button { flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 14px; font-weight: 800; font-size: 14.5px; transition: transform .12s ease, background .15s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--acc); color: var(--on-acc); }
.btn.sec { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost { color: var(--acc-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border: 1.5px solid var(--line); background: var(--card); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.wa { background: #1FA855; color: #fff; }

/* Segmented control + chips */
.seg { display: flex; background: var(--bg2); border-radius: 13px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 36px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--mut); padding: 0 8px; white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .cnt { font-size: 11px; opacity: .7; }

/* Unit cards (collect) */
.unit { padding: 12px 12px 12px 14px; }
.unit-h { display: flex; align-items: center; gap: 10px; }
.ucode { flex: none; min-width: 44px; height: 44px; padding: 0 6px; border-radius: 13px; background: var(--bg2); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.unit.settled .ucode { background: var(--okbg); color: var(--ok); }
.uname { font-weight: 800; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.umeta { font-size: 12.5px; color: var(--mut); font-weight: 600; }
.status { flex: none; font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.status.paid { background: var(--okbg); color: var(--ok); }
.status.owes { background: var(--wbg); color: var(--warn); }
.status.part { background: var(--infobg); color: var(--info); }
.status.none { background: var(--bg2); color: var(--mut); }
.arrears { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--bad); background: var(--badbg); padding: 6px 10px; border-radius: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ticks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tick { min-height: 38px; padding: 4px 11px; border-radius: 12px; border: 1.5px dashed var(--line); background: var(--card2); text-align: start; display: inline-flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.tick b { font-size: 12.5px; font-weight: 800; }
.tick span { font-size: 11px; color: var(--mut); font-weight: 600; }
.tick.paid { border-style: solid; border-color: transparent; background: var(--okbg); }
.tick.paid b, .tick.paid span { color: var(--ok); }
.tick.pocket { border-style: solid; border-color: transparent; background: var(--wbg); }
.tick.pocket b, .tick.pocket span { color: var(--warn); }
.tick.part { border-style: solid; border-color: var(--info); background: var(--infobg); }
.tick.sup { opacity: .92; }
.tick.sup b::after { content: " ↗"; font-size: 10px; }
.unit-actions { display: flex; gap: 6px; margin-top: 10px; }
.unit-actions .btn { flex: 1; }

/* Lists */
.list { padding: 4px 0; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; width: 100%; text-align: start; }
.li + .li { border-top: 1px solid var(--line); }
.li .ic { flex: none; width: 36px; height: 36px; border-radius: 11px; background: var(--bg2); display: grid; place-items: center; font-size: 16px; }
.li .ic.in { background: var(--okbg); color: var(--ok); }
.li .ic.out { background: var(--badbg); color: var(--bad); }
.li .ic.move { background: var(--wbg); color: var(--warn); }
.li b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li small { display: block; font-size: 12px; color: var(--mut); font-weight: 600; }
.li .amt { flex: none; font-weight: 800; font-size: 14px; text-align: end; }
.li .amt.in { color: var(--ok); }
.li .amt.out { color: var(--bad); }
.li .chev { color: var(--faint); font-weight: 800; }
.daylbl { font-size: 12px; font-weight: 800; color: var(--mut); margin: 14px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
.empty { text-align: center; padding: 28px 16px; color: var(--mut); font-weight: 600; font-size: 14px; }

/* Task row */
.task { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.task + .task { border-top: 1px solid var(--line); }
.check { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 900; font-size: 14px; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.done b { text-decoration: line-through; color: var(--mut); }
.task b { font-size: 14px; font-weight: 700; display: block; }
.task small { font-size: 12px; color: var(--mut); font-weight: 600; }
.task small.late { color: var(--bad); }

/* Dock */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 496px; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(19,32,28,.16); z-index: 50; }
.dock button.tab { flex: 1; min-height: 52px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--mut); }
.dock button.tab svg { width: 22px; height: 22px; }
.dock button.tab.on { color: var(--acc-ink); background: var(--soft); }
.dock .fab { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--acc); color: var(--on-acc); font-size: 26px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(91,76,245,.35); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .18s ease; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--sheet); border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); animation: up .24s cubic-bezier(.2,.8,.2,1); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet h3 { margin: 4px 0 4px; font-size: 19px; font-weight: 800; }
.sheet .lead { margin: 0 0 14px; color: var(--mut); font-size: 13.5px; }
.sheet .foot { display: flex; gap: 10px; margin-top: 18px; }
.sheet .foot .btn { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.menu { padding: 0; }
.menu .li { border-radius: 0; }

/* Forms */
.field { display: block; margin-top: 12px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--mut); margin-bottom: 5px; }
.input { width: 100%; min-height: 46px; padding: 10px 13px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--card2); font-size: 16px; color: var(--ink); }
.input:focus { border-color: var(--acc); outline: none; background: var(--card); }
textarea.input { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.money-in { display: flex; gap: 8px; }
.money-in .input { flex: 1; }
.money-in .seg { flex: none; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.switch-row:first-child { border-top: 0; }
.switch-row b { font-size: 14px; display: block; }
.switch-row small { font-size: 12px; color: var(--mut); font-weight: 600; display: block; }
.sw { flex: none; position: relative; width: 48px; height: 28px; border-radius: 14px; background: var(--line); transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.sw.on { background: var(--acc); }
.sw.on::after { transform: translateX(20px); }
[dir="rtl"] .sw.on::after { transform: translateX(-20px); }
[dir="rtl"] .sw::after { left: auto; right: 3px; }
.hint { font-size: 12.5px; color: var(--mut); margin-top: 6px; line-height: 1.45; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; margin-top: 10px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; font-size: 14px; }
.kv + .kv { border-top: 1px dashed var(--line); }
.kv span { color: var(--mut); font-weight: 600; }
.kv b { font-weight: 800; text-align: end; }
.linkbox { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg2); font-size: 12.5px; font-weight: 600; word-break: break-all; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 700; z-index: 200; max-width: calc(100% - 32px); transition: all .25s ease; text-align: center; }
.toast.pop { opacity: 1; transform: translate(-50%, 0); }

/* Onboarding — full screen, never scrolls */
.ob { position: fixed; inset: 0; z-index: 80; display: flex; justify-content: center; background: linear-gradient(180deg, #EAF4F0 0%, #F4F8F6 50%, var(--bg) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ob { background: linear-gradient(180deg, #14211D 0%, var(--bg) 60%); } }
:root[data-theme="dark"] .ob { background: linear-gradient(180deg, #14211D 0%, var(--bg) 60%); }
.ob-in { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; }
.ob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 20px 0; min-height: 52px; }
.ob-dots { display: flex; gap: 5px; flex: 1; max-width: 200px; }
.ob-dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; }
.ob-dots i.on { background: var(--acc); }
.ob-stage { flex: 1 1 auto; min-height: 120px; display: flex; align-items: flex-end; justify-content: center; padding: 6px 24px 0; position: relative; }
.ob-stage::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 80%; height: 80%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(91,76,245,.14) 0%, rgba(91,76,245,0) 70%); }
.ob-stage .bh { max-height: 100%; }
.ob-body { flex: 0 0 auto; padding: 14px 22px 0; }
.ob-body h1 { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 800; letter-spacing: -.015em; }
.ob-body p.sub { margin: 6px 0 0; font-size: 14.5px; color: var(--mut); line-height: 1.45; }
.ob-foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 16px 22px calc(16px + env(safe-area-inset-bottom)); }
.ob-foot .row .btn { flex: 1; }
.ob-step { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.ob-step + .ob-step { border-top: 1px solid var(--line); }
.ob-step b { font-size: 15px; display: block; }
.ob-step small { font-size: 12.5px; color: var(--mut); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.stepper button { width: 42px; height: 42px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-size: 21px; font-weight: 700; }
.stepper span { min-width: 40px; text-align: center; font-size: 18px; font-weight: 800; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); text-align: start; }
.choice + .choice { margin-top: 8px; }
.choice.on { border-color: var(--acc); background: var(--soft); }
.choice .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--bg2); display: grid; place-items: center; font-size: 19px; }
.choice b { display: block; font-size: 14.5px; }
.choice small { display: block; font-size: 12.5px; color: var(--mut); font-weight: 600; margin-top: 1px; }
.features { display: grid; gap: 8px; margin-top: 14px; }
.feat { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.feat i { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.feat span small { display: block; color: var(--mut); font-weight: 600; font-size: 12.5px; }

/* Resident page */
.res-head { padding: calc(16px + env(safe-area-inset-top)) 18px 10px; }
.res-head small { color: var(--mut); font-weight: 700; font-size: 12.5px; }
.res-head h1 { margin: 2px 0 0; font-size: 24px; font-weight: 800; }
.bill-total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 10px; margin-top: 6px; border-top: 2px solid var(--line); font-weight: 800; font-size: 16px; }
.receipt-stamp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--okbg); color: var(--ok); font-weight: 800; font-size: 12.5px; }
.foot-note { text-align: center; font-size: 12px; color: var(--faint); padding: 24px 16px; }

/* Activity */
.ev { display: flex; gap: 10px; padding: 10px 14px; font-size: 13.5px; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev .who { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--acc-ink); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.ev small { display: block; color: var(--mut); font-size: 12px; font-weight: 600; }

/* Splash */
.splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 300; }
.splash .logo { width: 58px; height: 58px; border-radius: 18px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; font-size: 26px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }

@media (min-width: 560px) { .shell { padding-top: 8px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
a.btn { text-decoration: none; }
.unit-actions .btn { min-height: 40px; }
.hero-cap { right: auto; left: 12px; }
[dir="rtl"] .hero-cap { left: auto; right: 12px; }
.tr-box:empty { display: none; }
.tr-box { margin-top: 6px; }
.tr-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 34px; padding: 4px 12px; border-radius: 999px; background: var(--soft); color: var(--acc-ink); font-size: 13px; font-weight: 600; text-align: start; }
.tr-chip span { opacity: .75; }

.tr-wait { font-size: 12.5px; color: var(--mut); font-weight: 600; }
.scan-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
.doc-thumb { width: 64px; height: 64px; flex: none; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); cursor: zoom-in; }
.scan-btn { min-height: 44px; }
.scan-state { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 9px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; background: var(--infobg); color: var(--info); }
.scan-state.ok { background: var(--okbg); color: var(--ok); }
.scan-state.bad { background: var(--wbg); color: var(--warn); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- living building scene ---- */
.bh { position: relative; margin: 0 16px 12px; border-radius: 26px; overflow: hidden; aspect-ratio: 366 / 256; box-shadow: var(--shadow-lg); background: var(--sky2); }

.bh-chip { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.bh-chip i { width: 7px; height: 7px; border-radius: 50%; display: block; }

.bh.day .bh-chip i { background: #F5A524; } .bh.dusk .bh-chip i { background: #FF9A6C; } .bh.night .bh-chip i { background: #F3EEDC; }
.bh.day { --sky1:#3FA9F5; --sky2:#8FD3FF; --sky3:#FFF1DC; --sun:#FFF4CF; --cloud:rgba(255,255,255,.88); --mount:#B4C6DA; --far:#C3D0E0; --neigh:#DDD1C1; --nline:#CABEAC; --nw:#8FA5BD; --nwlit:#8FA5BD; --facade:#ECE2CF; --shade:#CDBDA2; --parapet:#F6EFE2; --slab:#F8F2E7; --slabEdge:#B9A688; --lobby:#D6C7AE; --doorFrame:#5A4A38; --doorGlass:#A9C3DE; --side:#D2CBBD; --street:#8F8B98; --lane:#EDEAE2; --pole:#56515E; --wire:#3B3A44; --rail:#4E4234; --trunk:#6A5442; --leaf:#4E8B5F; --leaf2:#76AD7F; --tankBase:#8D8577; --ac:#F4F6FA; --core:#BFC9D3; --sh:#7E9E86; --sl:#5F7F68; --w1:#FCE7B8; --w2:#F2C077; --w3:#EDB566; --glassOff:#4A5A75; --bulb:#E5E2D8; }
.bh.dusk { --sky1:#3B6FD8; --sky2:#F59FB5; --sky3:#FFD49A; --sun:#FFB36B; --cloud:rgba(255,228,218,.8); --mount:#9AA6DD; --far:#AEB3E2; --neigh:#C4BCDF; --nline:#B0A8D0; --nw:#8A90C2; --nwlit:#FFC56E; --facade:#F3DFCB; --shade:#CCB2A8; --parapet:#FCEDE0; --slab:#FFF4EA; --slabEdge:#BC9E93; --lobby:#DCC3B2; --doorFrame:#5A4440; --doorGlass:#FFC35E; --side:#CDBDCB; --street:#76729A; --lane:#EAE4F3; --pole:#4A4266; --wire:#3A3256; --rail:#4A3A3E; --trunk:#5E4A40; --leaf:#4C7A62; --leaf2:#6E9E7E; --tankBase:#8A7E8E; --ac:#F4F2F8; --core:#BCB8DA; --sh:#7E9E86; --sl:#5F7F68; --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#5B6386; --bulb:#FFF4D6; }
.bh.night { --sky1:#0E1A4A; --sky2:#22357F; --sky3:#4262B4; --sun:#F7F1DE; --cloud:transparent; --mount:#2F428C; --far:#2C3A7C; --neigh:#36438A; --nline:#2B3775; --nw:#45529A; --nwlit:#FFC56E; --facade:#5E6DB0; --shade:#404D8C; --parapet:#7886C6; --slab:#8A99D8; --slabEdge:#B3BEEE; --lobby:#4A5796; --doorFrame:#1C2350; --doorGlass:#FFC35E; --side:#3D4A88; --street:#1C275C; --lane:#6572AE; --pole:#18204A; --wire:#121A40; --rail:#1A2150; --trunk:#2E2630; --leaf:#2D5260; --leaf2:#427080; --tankBase:#404D8C; --ac:#DCE2F4; --core:#5463A8; --sh:#7080B8; --sl:#5A6AA2; --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#2C3774; --bulb:#FFF8E2; }
.bh.eve { --sky1:#1E2160; --sky2:#5B4E8E; --sky3:#C97E8A; --sun:#FF9A7A; --cloud:rgba(255,190,190,.35); --mount:#4A4688; --far:#4F4888; --neigh:#4A4277; --nline:#3F386A; --nw:#3A3566; --nwlit:#F0B05A; --facade:#8E7E9E; --shade:#5E5276; --parapet:#A595B2; --slab:#B3A3BE; --slabEdge:#6E6290; --lobby:#6E5F86; --doorFrame:#2E2448; --doorGlass:#FFC35E; --side:#5E5486; --street:#34305A; --lane:#8C84B0; --pole:#241F3E; --wire:#1A1530; --rail:#22193A; --trunk:#3A2E30; --leaf:#2A4448; --leaf2:#3B5C5E; --tankBase:#4A4266; --ac:#D4D2E2; --core:#62598E; --sh:#556A62; --sl:#43554D; --w1:#FFE6A6; --w2:#FFC35E; --w3:#E38A36; --glassOff:#2C2E58; --bulb:#FFF4D6; }
.bh.eve .bh-chip { background: rgba(10,12,40,.5); color: #F3EEDC; }
.bh.eve .bh-moon { display: none; }
.bh.eve .bh-star { opacity: .6; }
.bh.eve .bh-lampglow { opacity: .9; }
.bh.bh-ob { margin: 0 0 14px; border-radius: 22px; box-shadow: 0 10px 28px rgba(20,23,44,.18); }
.bh-stream { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 3 6; animation: bhDash 1s linear infinite; }
.bh-drop { fill: #3B9EFF; opacity: 0; }
.bh.drops .bh-drop { animation: bhDrop 1.8s ease-in infinite; }
.bh-burst { transform-box: fill-box; transform-origin: center; animation: bhBurst 3.6s ease-out infinite both; }
.bh-pop { animation: bhPop .5s cubic-bezier(.2,.8,.2,1.3) both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes bhDash { to { stroke-dashoffset: -18; } }
@keyframes bhDrop { 0% { transform: translateY(-14px); opacity: 0; } 25% { opacity: 1; } 75% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(2px); opacity: 0; } }
@keyframes bhBurst { 0% { transform: scale(.15); opacity: 0; } 8% { opacity: 1; } 55% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(1.12); opacity: 0; } }

.bh-mount{fill:var(--mount)} .bh-far{fill:var(--far)} .bh-neigh{fill:var(--neigh)} .bh-nline{fill:var(--nline)} .bh-nw{fill:var(--nw)} .bh-nw.lit{fill:var(--nwlit)}

/* Onboarding studio (building only), reveal + confetti */
.bh.studio { --w1:#FFE6A6; --w2:#FFC35E; --w3:#F0A040; --glassOff:#5D6B85; }

<script>
/* ============================================================================
   Binayati V15 — core helpers and the money model
   Everything here is pure: it reads the loaded building in S and computes.
   ============================================================================ */
var LANG = 'en';
try { LANG = localStorage.getItem('bny15_lang') || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en'); } catch (e) {}

var MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_AR = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

/* The loaded building and who is looking at it. */
var S = emptyState();
function emptyState() {
  return { building: null, members: [], units: [], cycles: [], charges: [], payments: [], handovers: [],
           expenses: [], tasks: [], events: [], invites: [], me: null, role: null, resident: null };
}

function t(en, ar) { return LANG === 'ar' ? ar : en; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayIso() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dayKey(iso) { if (!iso) return ''; if (iso.length <= 10) return iso; var d = new Date(iso); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function nowIso() { return new Date().toISOString(); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function jsArg(s) { return esc(JSON.stringify(s == null ? '' : s)); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}
function token() { return uuid().replace(/-/g, ''); }
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
function round(v, cur) { return cur === 'LBP' ? Math.round(v) : Math.round(v * 100) / 100; }
function tiny(v, cur) { return Math.abs(v) < (cur === 'LBP' ? 1 : 0.005); }

function fmt(amt, cur) {
  var n = num(amt), sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (cur === 'LBP') {
    if (n >= 1e6 && n % 1e5 === 0) return sign + (n / 1e6).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'M LBP';
    return sign + Math.round(n).toLocaleString('en-US') + ' LBP';
  }
  return sign + '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
}
/* A two-currency pair {USD, LBP} as text, skipping zero sides. */
function fmtPair(p, zeroCur) {
  var parts = [];
  if (!tiny(p.USD || 0, 'USD')) parts.push(fmt(p.USD, 'USD'));
  if (!tiny(p.LBP || 0, 'LBP')) parts.push(fmt(p.LBP, 'LBP'));
  return parts.length ? parts.join(' + ') : fmt(0, zeroCur || 'USD');
}
function pair() { return { USD: 0, LBP: 0 }; }
function addTo(p, cur, v) { p[cur] = (p[cur] || 0) + v; return p; }
function rate() { return num(setting('rate')) || 89500; }
function toUsd(v, cur) { return cur === 'LBP' ? v / rate() : v; }
function pairUsd(p) { return (p.USD || 0) + (p.LBP || 0) / rate(); }

function setting(k) { return S.building && S.building.settings ? S.building.settings[k] : undefined; }
function bName() { if (!S.building) return ''; return LANG === 'ar' ? (S.building.name_ar || S.building.name) : S.building.name; }
function L(row, key) { key = key || 'title'; return LANG === 'ar' ? (row[key + '_ar'] || row[key]) : row[key]; }
function unitName(u) { return u ? (LANG === 'ar' ? (u.name_ar || u.name) : u.name) : ''; }

function dateLabel(iso, withTime) {
  if (!iso) return '';
  var d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  var o = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  var s = d.toLocaleDateString(LANG === 'ar' ? 'ar-LB' : 'en-GB', o);
  if (withTime) s += ' · ' + d.toLocaleTimeString(LANG === 'ar' ? 'ar-LB' : 'en-US', { hour: 'numeric', minute: '2-digit' });
  return s;
}
function periodLabel(period, lang) {
  if (!period) return '';
  var p = period.split('-'), m = Number(p[1]) - 1;
  return ((lang || LANG) === 'ar' ? MONTHS_AR[m] : MONTHS_EN[m]) + ' ' + p[0];
}
function cycleTitle(c, lang) {
  if (!c) return '';
  lang = lang || LANG;
  if (c.kind === 'month' && c.period) return periodLabel(c.period, lang);
  return lang === 'ar' ? (c.title_ar || c.title) : c.title;
}
function nextPeriod(period) {
  var p = period.split('-'), y = Number(p[0]), m = Number(p[1]) + 1;
  if (m > 12) { m = 1; y++; }
  return y + '-' + pad2(m);
}
function currentPeriod() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }

/* ---------------------------------------------------------------------------
   Units and charges
   --------------------------------------------------------------------------- */
function activeUnits() {
  return S.units.filter(function(u) { return u.active !== false; }).sort(function(a, b) {
    return (a.sort || 0) - (b.sort || 0) || String(a.code).localeCompare(String(b.code), 'en', { numeric: true });
  });
}
/* An apartment added later isn't billed for months before it existed. */
function unitInCycle(u, cyc) {
  if (!u || u.active === false) return false;
  if (!cyc || !u.created_at) return true;
  var made = dayKey(u.created_at);
  if (cyc.kind === 'month' && cyc.period) return made.slice(0, 7) <= cyc.period;
  return !cyc.created_at || made <= dayKey(cyc.created_at);
}
/* A shared bill is split among the apartments that existed when it was added. */
function inSplit(u, ch) { return !ch || !ch.created_at || !u.created_at || u.created_at <= ch.created_at; }
/* Blocks: a compound run as one building can have blocks A, B, C… A charge can target one block. */
function blockOf(u) { return (u && u.block) || ''; }
function blocks() {
  var seen = {}, out = [];
  activeUnits().forEach(function(u) { var b = blockOf(u); if (b && !seen[b]) { seen[b] = 1; out.push(b); } });
  return out.sort(function(a, b) { return a.localeCompare(b, 'en', { numeric: true }); });
}
function inBlock(u, ch) { return !ch || !ch.block || blockOf(u) === ch.block; }
function blockLabel(b) { return b ? t('Block ', 'بلوك ') + b : t('Whole building', 'كل البناية'); }
function weightSum(cyc, ch) {
  return activeUnits().filter(function(u) { return unitInCycle(u, cyc) && inSplit(u, ch) && inBlock(u, ch); })
    .reduce(function(s, u) { return s + num(u.weight == null ? 1 : u.weight); }, 0) || 1;
}

/* What one apartment owes for one charge. */
function dueFor(ch, u) {
  if (!u || u.active === false) return 0;
  var ov = ch.overrides || {};
  if (ov[u.id] != null && ov[u.id] !== '') return num(ov[u.id]);
  var cyc = byId(S.cycles, ch.cycle_id);
  if (!unitInCycle(u, cyc) || !inBlock(u, ch)) return 0;
  if (ch.pass_through || ch.split === 'custom') return 0;
  var w = num(u.weight == null ? 1 : u.weight);
  if (ch.split === 'weight') return round(num(ch.amount) * w, ch.cur);
  if (ch.split === 'total') return inSplit(u, ch) ? round(num(ch.amount) * w / weightSum(cyc, ch), ch.cur) : 0;
  return num(ch.amount);
}
function chargesOf(cycleId) {
  return S.charges.filter(function(c) { return c.cycle_id === cycleId; }).sort(function(a, b) {
    var ko = { fixed: 0, due: 1, service: 2 };
    return (ko[a.kind] - ko[b.kind]) || ((a.sort || 0) - (b.sort || 0)) || String(a.created_at || '').localeCompare(String(b.created_at || ''));
  });
}
function chargeTotal(ch) { return activeUnits().reduce(function(s, u) { return s + dueFor(ch, u); }, 0); }

function livePayments() { return S.payments.filter(function(p) { return !p.voided_at; }); }
function liveExpenses() { return S.expenses.filter(function(e) { return !e.voided_at; }); }

/* Index payments by charge+unit once per render pass. */
var _payIdx = null, _payIdxKey = '';
function payIndex() {
  var key = S.payments.length + ':' + (S.payments.length ? S.payments[S.payments.length - 1].id : '') + ':' + S._rev;
  if (_payIdx && _payIdxKey === key) return _payIdx;
  _payIdx = {};
  livePayments().forEach(function(p) {
    var k = p.charge_id + '|' + p.unit_id;
    (_payIdx[k] = _payIdx[k] || []).push(p);
  });
  _payIdxKey = key;
  return _payIdx;
}
function paymentsFor(chId, uId) { return payIndex()[chId + '|' + uId] || []; }
function paidFor(ch, u) { return paymentsFor(ch.id, u.id).reduce(function(s, p) { return s + num(p.amount); }, 0); }

/* One cell: what is due, what came in, and where the money is now. */
function cell(ch, u) {
  var due = dueFor(ch, u);
  var ps = paymentsFor(ch.id, u.id);
  var paid = ps.reduce(function(s, p) { return s + num(p.amount); }, 0);
  var left = round(Math.max(0, due - paid), ch.cur);
  var st = due <= 0 && paid <= 0 ? 'none' : (tiny(left, ch.cur) ? 'paid' : (paid > 0 ? 'part' : 'owes'));
  var pocket = ps.some(function(p) { return p.channel === 'collector' && !handoverConfirmed(p.handover_id); });
  return { due: due, paid: paid, left: tiny(left, ch.cur) ? 0 : left, state: st, pocket: pocket && st === 'paid', payments: ps };
}

function handoverConfirmed(hid) {
  if (!hid) return false;
  var h = byId(S.handovers, hid);
  return !!h && h.status === 'confirmed';
}

/* ---------------------------------------------------------------------------
   Cycles
   --------------------------------------------------------------------------- */
function visibleCycles() {
  return S.cycles.slice().sort(function(a, b) {
    var ka = a.kind === 'month' ? (a.period || '') : String(a.created_at || '').slice(0, 7);
    var kb = b.kind === 'month' ? (b.period || '') : String(b.created_at || '').slice(0, 7);
    if (ka !== kb) return ka < kb ? 1 : -1;
    return a.kind === 'month' ? -1 : 1;
  });
}
function monthCycles() { return visibleCycles().filter(function(c) { return c.kind === 'month'; }); }
function latestMonth() {
  var cp = currentPeriod(), ms = monthCycles();
  for (var i = 0; i < ms.length; i++) if (ms[i].period <= cp) return ms[i];
  return ms[ms.length - 1] || null;
}
function cycleOrderKey(c) { return c.kind === 'month' ? (c.period || '') : String(c.created_at || '').slice(0, 7); }

/* Month summary: building money only (supplier pass-through is reported apart). */
function cycleSummary(cyc) {
  var s = { due: pair(), paid: pair(), pocket: pair(), dueEq: 0, paidEq: 0, pocketEq: 0, units: 0, settled: 0, owing: [],
            supDue: pair(), supPaid: pair(), pct: 0 };
  if (!cyc) return s;
  var chs = chargesOf(cyc.id);
  activeUnits().forEach(function(u) {
    var any = false, owes = false, owed = pair();
    chs.forEach(function(ch) {
      var c = cell(ch, u);
      if (c.due <= 0) return;
      if (ch.pass_through) { addTo(s.supDue, ch.cur, c.due); addTo(s.supPaid, ch.cur, Math.min(c.paid, c.due)); return; }
      any = true;
      addTo(s.due, ch.cur, c.due);
      var got = Math.min(c.paid, c.due);
      addTo(s.paid, ch.cur, got);
      if (c.pocket) addTo(s.pocket, ch.cur, got);
      if (c.left > 0) { owes = true; addTo(owed, ch.cur, c.left); }
    });
    if (any) { s.units++; if (!owes) s.settled++; else s.owing.push({ unit: u, owed: owed }); }
  });
  s.dueEq = pairUsd(s.due); s.paidEq = pairUsd(s.paid); s.pocketEq = pairUsd(s.pocket);
  s.pct = s.dueEq > 0 ? Math.round(s.paidEq / s.dueEq * 100) : 0;
  return s;
}

/* Per apartment, this cycle: status for the windows and the cards. */
function unitCycle(u, cyc) {
  var r = { due: pair(), paid: pair(), left: pair(), any: false, state: 'none', cells: [] };
  if (!cyc) return r;
  chargesOf(cyc.id).forEach(function(ch) {
    var c = cell(ch, u);
    if (c.due <= 0 && c.paid <= 0) return;
    r.cells.push({ ch: ch, c: c });
    if (ch.pass_through) return;
    r.any = true;
    addTo(r.due, ch.cur, c.due); addTo(r.paid, ch.cur, Math.min(c.paid, c.due)); addTo(r.left, ch.cur, c.left);
  });
  var allLeft = pair();
  r.cells.forEach(function(x) { addTo(allLeft, x.ch.cur, x.c.left); });
  r.allLeft = allLeft;
  var leftEq = pairUsd(r.left), paidEq = pairUsd(r.paid);
  r.state = !r.any ? (pairUsd(allLeft) > 0 ? 'owes' : 'none') : (leftEq < 0.005 ? 'paid' : (paidEq > 0 ? 'part' : 'owes'));
  return r;
}

/* Running balance across every published cycle; arrears = what's left from cycles before `cyc`. */
function unitBalance(u, cyc) {
  var r = { owed: pair(), arrears: pair(), credit: pair() };
  var curKey = cyc ? cycleOrderKey(cyc) : '9999';
  S.cycles.forEach(function(c) {
    if (c.published === false) return;
    var earlier = cyc && c.id !== cyc.id && cycleOrderKey(c) < curKey && c.kind === 'month';
    chargesOf(c.id).forEach(function(ch) {
      var x = cell(ch, u);
      if (x.left > 0) { addTo(r.owed, ch.cur, x.left); if (earlier) addTo(r.arrears, ch.cur, x.left); }
      if (x.paid > x.due) addTo(r.credit, ch.cur, x.paid - x.due);
    });
  });
  return r;
}
function totalArrears(cyc) {
  var tot = pair(), n = 0;
  activeUnits().forEach(function(u) {
    var b = unitBalance(u, cyc);
    if (pairUsd(b.arrears) > 0.005) { n++; addTo(tot, 'USD', b.arrears.USD); addTo(tot, 'LBP', b.arrears.LBP); }
  });
  return { total: tot, units: n };
}

/* ---------------------------------------------------------------------------
   Where the cash is: in the safe, with each collector, owed to suppliers
   --------------------------------------------------------------------------- */
function cashState() {
  var safe = { USD: num(setting('opening_usd')), LBP: num(setting('opening_lbp')) };
  var pockets = {}; // user_id -> {USD, LBP, pending: pair, pendingId}
  var supplier = pair();
  function pk(uid) { return pockets[uid] = pockets[uid] || { USD: 0, LBP: 0, pending: pair(), pendingId: null }; }
  var passIds = {};
  S.charges.forEach(function(c) { if (c.pass_through) passIds[c.id] = true; });

  livePayments().forEach(function(p) {
    var v = num(p.amount);
    if (passIds[p.charge_id]) addTo(supplier, p.cur, v);
    if (p.channel !== 'collector' || handoverConfirmed(p.handover_id)) { addTo(safe, p.cur, v); return; }
    var pocket = pk(p.received_by || 'unknown');
    addTo(pocket, p.cur, v);
    if (p.handover_id) { addTo(pocket.pending, p.cur, v); pocket.pendingId = p.handover_id; }
  });
  liveExpenses().forEach(function(e) {
    var v = num(e.amount);
    if (e.charge_id && passIds[e.charge_id]) addTo(supplier, e.cur, -v);
    if (e.paid_from !== 'collector' || handoverConfirmed(e.handover_id)) { addTo(safe, e.cur, -v); return; }
    var pocket = pk(e.paid_by || 'unknown');
    addTo(pocket, e.cur, -v);
    if (e.handover_id) { addTo(pocket.pending, e.cur, -v); pocket.pendingId = e.handover_id; }
  });
  var withCol = pair();
  Object.keys(pockets).forEach(function(k) { addTo(withCol, 'USD', pockets[k].USD); addTo(withCol, 'LBP', pockets[k].LBP); });
  var pending = S.handovers.filter(function(h) { return h.status === 'pending'; });
  return { safe: safe, pockets: pockets, withCollector: withCol, supplier: supplier, pending: pending,
           building: { USD: safe.USD + withCol.USD - Math.max(0, supplier.USD), LBP: safe.LBP + withCol.LBP - Math.max(0, supplier.LBP) } };
}

/* Money collected inside a cycle (all channels), for the "collected" tile. */
function collectedIn(cyc) {
  var p = pair();
  if (!cyc) return p;
  var ids = {};
  chargesOf(cyc.id).forEach(function(c) { if (!c.pass_through) ids[c.id] = true; });
  livePayments().forEach(function(x) { if (ids[x.charge_id]) addTo(p, x.cur, num(x.amount)); });
  return p;
}
function spentIn(cyc) {
  var p = pair();
  liveExpenses().forEach(function(e) { if (cyc && e.cycle_id === cyc.id && !e.charge_id) addTo(p, e.cur, num(e.amount)); });
  return p;
}

function rollDate(iso, rep) {
  var d = new Date((iso || todayIso()) + 'T12:00:00');
  if (rep === 'daily') { var td = new Date(todayIso() + 'T12:00:00'); if (d < td) d = td; d.setDate(d.getDate() + 1); }
  else if (rep === 'weekly') d.setDate(d.getDate() + 7);
  else if (rep === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (rep === 'quarterly') d.setMonth(d.getMonth() + 3);
  else if (rep === 'halfyear') d.setMonth(d.getMonth() + 6);
  else if (rep === 'yearly') d.setFullYear(d.getFullYear() + 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* ---------------------------------------------------------------------------
   Which floor an apartment is on, read from its code:
   SS1A / SS2 / -1 → underground, G / GF / 0 → ground, 2B / 12 / 201 → that floor.
   --------------------------------------------------------------------------- */
function unitLevel(code) {
  var c = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
  var m;
  if ((m = c.match(/^SS(\d*)/))) return -(Number(m[1]) || 1);
  if ((m = c.match(/^-(\d+)/))) return -Number(m[1]);
  if (/^(G|RDC|0)/.test(c)) return 0;
  if ((m = c.match(/^(\d+)/))) { var v = Number(m[1]); return m[1].length >= 3 ? Math.floor(v / 100) : v; }
  return null;
}
/* Group scene windows into floors. items: [{code, win}]. Returns null when codes don't say. */
function levelsFor(items) {
  var known = items.filter(function(x) { return unitLevel(x.code) != null; });
  if (!items.length || known.length < items.length / 2) return null;
  var by = {};
  items.forEach(function(x) {
    var lv = unitLevel(x.code);
    if (lv == null) lv = 1;
    (by[lv] = by[lv] || []).push(x);
  });
  return Object.keys(by).map(function(k) {
    var row = by[k].sort(function(a, b) { return String(a.code).localeCompare(String(b.code), 'en', { numeric: true }); });
    // more than 6 on one floor: split into extra rows above so nothing is hidden
    return { lv: Number(k), wins: row.map(function(x) { return x.win; }) };
  }).reduce(function(out, r) {
    if (r.wins.length <= 6) { out.push(r); return out; }
    for (var i = 0; i < r.wins.length; i += 6) out.push({ lv: r.lv + i / 600, wins: r.wins.slice(i, i + 6) });
    return out;
  }, []);
}

/* Instant answer from the lists, or null. */
function localTranslate(text, kind, to) {
  var s = String(text || '').trim();
  if (!s) return null;
  if (to === 'ar') {
    var low = s.toLowerCase().replace(/\s+/g, ' ');
    var lists = [].concat(CHARGE_PRESETS.fixed, CHARGE_PRESETS.due, CHARGE_PRESETS.service, TASK_PRESETS, EXPENSE_PRESETS);
    for (var i = 0; i < lists.length; i++) if (lists[i].en.toLowerCase() === low) return lists[i].ar;
    if (kind === 'name') {
      var parts = low.split(/\s+/), out = [];
      for (var j = 0; j < parts.length; j++) {
        var w = parts[j], hit = NAME_DICT[w];
        if (!hit && /^(el|al)-/.test(w) && NAME_DICT[w.slice(3)]) hit = 'ال' + NAME_DICT[w.slice(3)].replace(/^ال/, '');
        if (!hit) return null;
        out.push(hit);
      }
      return out.join(' ');
    }
  } else {
    var lists2 = [].concat(CHARGE_PRESETS.fixed, CHARGE_PRESETS.due, CHARGE_PRESETS.service, TASK_PRESETS, EXPENSE_PRESETS);
    for (var k = 0; k < lists2.length; k++) if (lists2[k].ar === s) return lists2[k].en;
  }
  return null;
}

var TR_CACHE = {};
function serverTranslate(text, kind, to) {
  var key = kind + '|' + to + '|' + text;
  if (TR_CACHE[key] !== undefined) return Promise.resolve(TR_CACHE[key]);
  if (!isCloud()) return Promise.resolve(null);
  return SB.functions.invoke('translate', { body: { text: text, kind: kind, to: to } }).then(function(r) {
    var out = r && !r.error && r.data && r.data.text ? r.data.text : null;
    if (out && out.trim().toLowerCase() === text.trim().toLowerCase()) out = null;
    TR_CACHE[key] = out;
    return out;
  }, function() { return null; });
}

/* Wiring: an input with data-tr="otherId" data-tr-kind="name|phrase" proposes text for #otherId.
   The suggestion appears under #otherId, in a div with id "trs-otherId". */
var _trT = {};
function trInput(el) {
  var dst = el.getAttribute('data-tr'), kind = el.getAttribute('data-tr-kind') || 'phrase';
  var target = document.getElementById(dst), box = document.getElementById('trs-' + dst);
  if (!target || !box) return;
  var src = el.value.trim();
  var arabicSrc = /[؀-ۿ]/.test(src);
  // The pair can go either way: English field → Arabic field, or the reverse.
  var to = target.getAttribute('dir') === 'rtl' ? 'ar' : 'en';
  if (!src || (to === 'ar' && arabicSrc) || (to === 'en' && !arabicSrc)) { box.innerHTML = ''; return; }
  if (target.value.trim() && target.getAttribute('data-tr-auto') !== String(target.value)) { box.innerHTML = ''; return; }
  var quick = localTranslate(src, kind, to);
  if (quick) { showTr(box, dst, quick); return; }
  clearTimeout(_trT[dst]);
  if (!isCloud()) { box.innerHTML = ''; return; }
  box.innerHTML = '<span class="tr-wait">' + esc(t('Suggesting…', 'جارٍ الاقتراح…')) + '</span>';
  _trT[dst] = setTimeout(function() {
    serverTranslate(src, kind, to).then(function(out) {
      if (el.value.trim() !== src) return;
      if (out) showTr(box, dst, out); else box.innerHTML = '';
    });
  }, 650);
}
function showTr(box, dst, text) {
  box.innerHTML = '<button type="button" class="tr-chip" onclick="useTr(' + jsArg(dst) + ',' + jsArg(text) + ')"><span>' + esc(t('Use', 'استعمل')) + '</span> <b dir="auto">' + esc(text) + '</b></button>';
}
function useTr(dst, text) {
  var el = document.getElementById(dst);
  if (!el) return;
  el.value = text;
  el.setAttribute('data-tr-auto', text);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  var box = document.getElementById('trs-' + dst); if (box) box.innerHTML = '';
}
document.addEventListener('input', function(e) {
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-tr')) trInput(e.target);
});
/* After a re-render, show a suggestion again for fields that already have text. */
function trRefresh() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-tr]'), function(el) { if (el.value.trim()) trInput(el); });
}

/* Living building scene — carried over from V13 (windows = who paid, sky = real time of day). */
function sunTimesLocal(d) {
 var lat = 33.89, lon = 35.5;
 var N = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
 var B = (2 * Math.PI / 365) * (N - 81);
 var decl = (23.44 * Math.PI / 180) * Math.sin(B);
 var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
 var tz = -d.getTimezoneOffset() / 60;
 var noon = 720 - 4 * lon - eot + tz * 60;
 var phi = lat * Math.PI / 180;
 var cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(decl)) / (Math.cos(phi) * Math.cos(decl));
 var H = Math.acos(Math.max(-1, Math.min(1, cosH))) * 180 / Math.PI;
 return { rise: noon - 4 * H, set: noon + 4 * H };
}

function heroPhase(now) {
 var st = sunTimesLocal(now);
 var m = now.getHours() * 60 + now.getMinutes();
 var key, label;
 if (m < st.rise - 35 || m > st.set + 45) { key = 'night'; label = t('Night', 'ليلاً'); }
 else if (m < st.rise + 45) { key = 'dusk'; label = t('Sunrise', 'الشروق'); }
 else if (m > st.set - 50) { key = 'dusk'; label = t('Sunset', 'الغروب'); }
 else { key = 'day'; label = m < (st.rise + st.set) / 2 ? t('Morning', 'صباحاً') : t('Afternoon', 'بعد الظهر'); }
 var frac = Math.max(0, Math.min(1, (m - st.rise) / (st.set - st.rise)));
 var time = now.toLocaleTimeString(LANG === 'ar' ? 'ar-LB' : 'en-US', { hour: 'numeric', minute: '2-digit' });
 return { key: key, label: label, chip: time + ' · ' + label, sunX: 40 + frac * 286, sunY: 150 - Math.sin(Math.PI * frac) * 118 };
}
function heroR(n) { return Math.round(n * 10) / 10; }

function heroRailPath(x, w, y1, y2) {
 var d = 'M' + heroR(x - 4) + ' ' + heroR(y1) + 'H' + heroR(x + w + 4);

/* ---------------------------------------------------------------------------
   Generic writes (same calls in both modes)
   --------------------------------------------------------------------------- */
function applyLocal(tbl, op, row) {
  // keep S in step
  var list = tbl === 'buildings' ? null : S[tbl];
  if (tbl === 'buildings') { if (op === 'update' && S.building && S.building.id === row.id) Object.assign(S.building, row); }
  else if (op === 'insert') list.push(row);
  else if (op === 'update') { var x = byId(list, row.id); if (x) Object.assign(x, row); }
  else if (op === 'delete') { S[tbl] = list.filter(function(r) { return r.id !== row.id; }); }
  S._rev = (S._rev || 0) + 1;
}

function dbInsert(tbl, row) {
  row.id = row.id || uuid();
  if (tbl !== 'buildings' && !row.building_id) row.building_id = S.building.id;
  if (!row.created_at && tbl !== 'payments') row.created_at = nowIso();
  if (!isCloud()) {
    var db = localLoad();
    db[tbl].push(JSON.parse(JSON.stringify(row)));
    if (S.building && row.building_id === S.building.id) { applyLocal(tbl, 'insert', row); localEvent(tbl, 'insert', row); }
    localSave();
    return Promise.resolve(row);
  }
  applyLocal(tbl, 'insert', row);
  return cloudCall(SB.from(tbl).insert(row).select().single()).then(function(r) {
    var x = byId(S[tbl], row.id); if (x && r) Object.assign(x, r);
    return r || row;
  }, function(e) { S[tbl] = S[tbl].filter(function(r) { return r.id !== row.id; }); S._rev++; render(); throw e; });
}
function dbInsertMany(tbl, rows) {
  rows.forEach(function(r) { r.id = r.id || uuid(); if (!r.building_id) r.building_id = S.building.id; if (!r.created_at && tbl !== 'payments') r.created_at = nowIso(); });
  if (!isCloud()) {
    var db = localLoad();
    rows.forEach(function(r) { db[tbl].push(JSON.parse(JSON.stringify(r))); applyLocal(tbl, 'insert', r); localEvent(tbl, 'insert', r); });
    localSave();
    return Promise.resolve(rows);
  }
  rows.forEach(function(r) { applyLocal(tbl, 'insert', r); });
  if (!rows.length) return Promise.resolve(rows);
  return cloudCall(SB.from(tbl).insert(rows)).then(function() { return rows; }, function(e) { reloadBuilding(); throw e; });
}
function dbUpdate(tbl, id, patch) {
  var row = Object.assign({ id: id }, patch);
  if (!isCloud()) {
    var db = localLoad();
    var list = tbl === 'buildings' ? db.buildings : db[tbl];
    var x = byId(list, id); if (x) Object.assign(x, patch);
    applyLocal(tbl, 'update', row);
    localEvent(tbl, 'update', x || row);
    localSave();
    return Promise.resolve(x);
  }
  var before = tbl === 'buildings' ? null : JSON.parse(JSON.stringify(byId(S[tbl], id) || null));
  applyLocal(tbl, 'update', row);
  return cloudCall(SB.from(tbl).update(patch).eq('id', id).select()).then(function(r) {
    if (!r || !r.length) { reloadBuilding(); throw new Error(t('Not allowed for your role', 'غير مسموح لدورك')); }
    return r[0];
  }, function(e) { if (before) applyLocal(tbl, 'update', before); render(); throw e; });
}
function dbDelete(tbl, id) {
  if (!isCloud()) {
    var db = localLoad();
    var x = byId(db[tbl], id);
    db[tbl] = db[tbl].filter(function(r) { return r.id !== id; });
    applyLocal(tbl, 'delete', { id: id });
    if (x) localEvent(tbl, 'delete', x);
    localSave();
    return Promise.resolve();

}
function cloudCall(q) {

  return q.then(function(res) {
    if (res.error) { setSync('live'); throw new Error(niceError(res.error)); }
    setSync('live');

function niceError(e) {

  if (/row-level security|permission denied/i.test(m)) return t('Your role can\'t do that', 'دورك لا يسمح بذلك');
  if (/Invalid login credentials/i.test(m)) return t('Wrong username or password', 'اسم المستخدم أو كلمة المرور خطأ');
  if (/already registered|already been registered/i.test(m)) return t('There is already an account with this email. Sign in instead.', 'يوجد حساب بهذا البريد. سجّل الدخول.');
  if (/email.*invalid|invalid.*email/i.test(m)) return t('That email address isn\'t accepted. Check it for typos.', 'هذا البريد غير مقبول. تحقق منه.');
  if (/Email not confirmed/i.test(m)) return t('Confirm your email first: open the link we sent you.', 'أكّد بريدك أولاً من الرابط المرسل.');
  if (/Password should be/i.test(m)) return t('Password must be at least 6 characters', 'كلمة المرور 6 أحرف على الأقل');
  if (/schema cache|does not exist/i.test(m)) return t('The server isn\'t set up yet: run schema.sql in Supabase', 'الخادم غير مُعد بعد: شغّل schema.sql في Supabase');

}

/* People sign in with a username (no email needed) or an email. Usernames map to a
   placeholder address on binayati.local that never receives mail. */
function isEmail(u) { return String(u || '').indexOf('@') > 0; }
function cleanUsername(u) { return String(u || '').trim().toLowerCase(); }
function usernameToEmail(u) {
  u = cleanUsername(u);
  if (isEmail(u)) {
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)) throw new Error(t('Enter a valid email address', 'أدخل بريداً إلكترونياً صحيحاً'));
    return u;
  }
  if (!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(u)) throw new Error(t('Usernames are 3 to 30 letters or numbers, no spaces', 'اسم المستخدم من 3 إلى 30 حرفاً أو رقماً بلا مسافات'));
  return u + '@binayati.local';
}
function cloudSession() {

}
function cloudSignIn(username, password) {
  return SB.auth.signInWithPassword({ email: usernameToEmail(username), password: password }).then(function(r) {
    if (r.error) throw new Error(niceError(r.error));
    return r.data.session;
  });
}
function cloudSignUp(username, password, name) {
  var email = usernameToEmail(username);
  if (!isEmail(username)) {
    var c = cfg();
    return fetch(c.url + '/functions/v1/username-signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: c.key },
      body: JSON.stringify({ username: cleanUsername(username), password: password, name: name })
    }).then(function(r) { return r.json().catch(function() { return {}; }); }, function() {
      throw new Error(t('No connection to the server. Check your internet and try again.', 'لا اتصال بالخادم. تحقق من الإنترنت وحاول مجدداً.'));
    }).then(function(res) {
      if (res.error === 'taken') throw new Error(t('That username is taken. Try another, or sign in.', 'اسم المستخدم مستعمل. جرّب غيره أو سجّل الدخول.'));
      if (res.error === 'weak_password') throw new Error(t('Password must be at least 6 characters', 'كلمة المرور 6 أحرف على الأقل'));
      if (res.error === 'bad_username') throw new Error(t('Usernames are 3 to 30 letters or numbers, no spaces', 'اسم المستخدم من 3 إلى 30 حرفاً أو رقماً بلا مسافات'));
      if (!res.ok) throw new Error(t('Couldn\'t create the account. Try again.', 'تعذّر إنشاء الحساب. حاول مجدداً.'));
      return cloudSignIn(username, password);
    });
  }
  return SB.auth.signUp({ email: email, password: password, options: { data: { name: name } } }).then(function(r) {
    if (r.error) throw new Error(niceError(r.error));
    if (!r.data.session) { var e = new Error(t('Almost there: open the confirmation link we just emailed you, then come back and sign in.', 'تقريباً: افتح رابط التأكيد الذي أرسلناه لبريدك ثم عد وسجّل الدخول.')); e.confirm = true; throw e; }
    return r.data.session;
  });
}

function subscribe(bid) {

  ['units', 'cycles', 'charges', 'payments', 'handovers', 'expenses', 'tasks', 'members'].forEach(function(tbl) {
    ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: tbl, filter: 'building_id=eq.' + bid }, function() { reloadBuilding(); });
  });
  ch = ch.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'buildings', filter: 'id=eq.' + bid }, function() { reloadBuilding(); });
  ch.subscribe(function(status) {

/* ---------------------------------------------------------------------------
   The living building, driven by real data and the real clock
   --------------------------------------------------------------------------- */
var HERO_REVEAL = false, HERO_KEY = '';
function heroHtml(cyc, opts) {
  opts = opts || {};
  var ph = heroPhase(new Date());
  HERO_KEY = ph.key + '|' + ph.label;
  var bl = blocks();
  var blk = opts.block !== undefined ? opts.block : (bl.length > 1 ? (bl.indexOf(UI.block) >= 0 ? UI.block : bl[0]) : null);
  var units = activeUnits().filter(function(u) { return !blk || blockOf(u) === blk; });
  var wins = units.map(function(u) {
    var st = opts.only ? (u.id === opts.only ? unitCycle(u, cyc).state : 'closed') : (opts.hideWho ? 'closed' : unitCycle(u, cyc).state);
    var state = st === 'paid' ? 'paid' : (st === 'closed' || st === 'none' ? 'closed' : 'owes');
    var lbl = u.code + ' · ' + (state === 'paid' ? t('paid', 'مسدد') : state === 'owes' ? t('still owes', 'لم يسدد بعد') : '');
    return { state: state, label: lbl, onclick: opts.noTap ? null : 'openSheet(\'unit\',{id:' + jsArg(u.id) + '})' };
  });
  if (!wins.length) wins = [{ state: 'closed' }];
  var levels = units.length ? levelsFor(units.map(function(u, i) { return { code: u.code, win: wins[i] }; })) : null;
  var cash = opts.noSafe ? null : cashState();
  var reveal = HERO_REVEAL; HERO_REVEAL = false;
  var safe = cash ? { split: true, usdH: Math.max(2, Math.min(22, 2 + Math.max(0, cash.safe.USD) / 40)), lbpH: Math.max(2, Math.min(22, 2 + Math.max(0, cash.safe.LBP) / 4e6)), usd: cash.safe.USD, lbp: cash.safe.LBP, style: setting('safe_style') || 'lobby', tap: opts.noTap ? null : 'go(\'books\')', sub: t('in the safe', 'في الصندوق') } : null;
  var html = buildBuildingScene({
    phase: ph, wins: wins, levels: levels, interactive: !opts.noTap, idp: opts.idp || 'hm', signText: blk ? (S.building.name + ' ' + blk).slice(0, 12) : S.building.name, chip: opts.only || opts.hideWho ? null : heroChipText(cyc, units),
    safe: safe, elevator: !!setting('elevator'), coreGlow: openTasks().some(function(x) { return x.due_on && x.due_on <= todayIso(); }),
    extraCls: reveal ? 'reveal' : ''
  });
  var paid = wins.filter(function(w) { return w.state === 'paid'; }).length;
  var cap = '';
  return '<div class="hero-wrap">' + html + cap + '</div>';
}
/* Top chip: a few short, useful facts that take turns (tap to go there). */
var HERO_FACTS = [], HERO_FI = 0;
function heroFacts(cyc, units) {
  var f = [];
  if (cyc) {
    var left = pair(), owe = 0;
    units.forEach(function(u) {
      var any = false;
      chargesOf(cyc.id).forEach(function(ch) { var x = cell(ch, u); if (x.left > 0) { addTo(left, ch.cur, x.left); any = true; } });
      if (any) owe++;
    });
    if (!left.USD && !left.LBP) f.push({ dot: '#22B07D', tx: t('All paid ✓', 'الكل سدّد ✓'), go: "go('collect')" });
    else {
      f.push({ dot: '#F5A524', tx: fmtPair(left) + ' ' + t('left', 'متبقٍ'), go: "go('collect')" });
      f.push({ dot: '#F5A524', tx: t(owe + (owe === 1 ? ' apartment owes' : ' apartments owe'), owe + ' شقق لم تسدد'), go: "go('collect')" });
    }
  }
  var late = openTasks().filter(function(x) { return x.due_on && x.due_on <= todayIso(); });
  if (late.length) f.push({ dot: '#EF4444', tx: late.length === 1 ? trName(late[0]) : t(late.length + ' tasks due', late.length + ' مهام مستحقة'), go: "go('building')" });
  return f;
}
function trName(x) { var n = (LANG === 'ar' ? (x.title_ar || x.title) : (x.title || x.title_ar)) || t('Task due', 'مهمة مستحقة'); return n.length > 22 ? n.slice(0, 21) + '…' : n; }
function heroChipText(cyc, units) {
  HERO_FACTS = heroFacts(cyc, units); HERO_FI = HERO_FI % Math.max(1, HERO_FACTS.length);
  return HERO_FACTS.length ? HERO_FACTS[HERO_FI] : null;
}
function heroChipTap() { var f = HERO_FACTS[HERO_FI % HERO_FACTS.length]; if (f && f.go) (new Function(f.go))(); }
setInterval(function() {
  var chip = document.getElementById('bh-time');
  if (!chip || HERO_FACTS.length < 2) return;
  HERO_FI = (HERO_FI + 1) % HERO_FACTS.length;
  chip.classList.add('swap');
  setTimeout(function() {
    var f = HERO_FACTS[HERO_FI]; var sp = chip.querySelector('span'), i = chip.querySelector('i');
    if (sp) sp.textContent = f.tx; if (i) i.style.background = f.dot;
    chip.classList.remove('swap');
  }, 220);
}, 4000);
setInterval(function() {
  var chip = document.getElementById('bh-time');
  if (!chip || UI.sheet) return;
  var ph = heroPhase(new Date());
  if ((ph.key + '|' + ph.label) !== HERO_KEY) { render(); return; }
}, 60000);

/* ---------------------------------------------------------------------------
   Month card (shared by managers, collectors and residents)
   --------------------------------------------------------------------------- */
function monthCard(cyc, clickable) {
  var s = cycleSummary(cyc);
  var inHand = s.paidEq - s.pocketEq;
  var wPaid = s.dueEq > 0 ? Math.max(0, inHand / s.dueEq * 100) : 0, wPocket = s.dueEq > 0 ? s.pocketEq / s.dueEq * 100 : 0;
  var h = '<div class="card month"' + (clickable ? ' role="button" tabindex="0" onclick="go(\'collect\')"' : '') + '>';
  h += '<div class="month-top"><b>' + esc(cycleTitle(cyc)) + '</b><span>' + esc(t(s.settled + ' of ' + s.units + ' paid', s.settled + ' من ' + s.units + ' سددوا')) + ' · ' + s.pct + '%</span></div>';
  h += '<div class="bar"><i class="paid" style="width:' + wPaid.toFixed(1) + '%"></i><i class="pocket" style="width:' + wPocket.toFixed(1) + '%"></i></div>';
  h += '<div class="legend"><span><i style="background:var(--ok)"></i>' + esc(t('Collected', 'محصّل')) + ' ' + esc(fmtPair(s.paid)) + '</span>';
  var left = { USD: s.due.USD - s.paid.USD, LBP: s.due.LBP - s.paid.LBP };
  h += '<span><i style="background:var(--bg2);border:1px solid var(--line)"></i>' + esc(t('Still to collect', 'المتبقي')) + ' ' + esc(fmtPair(left)) + '</span>';
  if (s.pocketEq > 0) h += '<span><i style="background:var(--warn)"></i>' + esc(t('Not handed over yet', 'لم يُسلَّم بعد')) + '</span>';

function unitCard(u, cyc, r, b) {

  var stTxt = st === 'paid' ? t('Paid', 'مسدد') : st === 'none' ? t('Nothing due', 'لا مستحقات') : t('Owes', 'عليه') + ' ' + fmtPair(r.allLeft);
  var h = '<div class="card unit' + (st === 'paid' ? ' settled' : '') + '">';

  if (blockOf(u) && blocks().length > 1 && !UI.block) h += '<div class="umeta">' + esc(blockLabel(blockOf(u))) + '</div>';
  if (num(u.weight) !== 1) h += '<div class="umeta">' + esc(t('Share ×' + num(u.weight), 'حصة ×' + num(u.weight))) + '</div>';
  h += '</div><span class="status ' + st + '">' + esc(stTxt) + '</span></div>';
  if (pairUsd(b.arrears) > 0.005) h += '<div class="arrears"><span>' + esc(t('From earlier months', 'من أشهر سابقة')) + '</span><b>' + esc(fmtPair(b.arrears)) + '</b></div>';
  h += '<div class="ticks">';
  r.cells.forEach(function(x) {
    var c = x.c, cls = c.state === 'paid' ? (c.pocket ? 'pocket' : 'paid') : c.state === 'part' ? 'part' : '';
    var amt = c.state === 'part' ? fmt(c.left, x.ch.cur) + ' ' + t('left', 'متبقي') : fmt(c.due, x.ch.cur);
    h += '<button class="tick ' + cls + (x.ch.pass_through ? ' sup' : '') + '" onclick="tapCell(' + jsArg(x.ch.id) + ',' + jsArg(u.id) + ')" aria-pressed="' + (c.state === 'paid') + '"><b>' + (c.state === 'paid' ? '✓ ' : '') + esc(L(x.ch)) + '</b><span>' + esc(amt) + '</span></button>';
  });
  h += '</div>';
  h += '<div class="unit-actions">';
  if (owes) h += '<button class="btn sec sm" onclick="payAll(' + jsArg(u.id) + ',' + jsArg(cyc.id) + ')">' + esc(t('Paid it all', 'سدد الكل')) + '</button>';

  h += '</div></div>';
  return h;
}

/* Tap a charge: unpaid → paid in full by the chosen channel; paid → offer to undo. */
function channelRow() {
  var ch = defaultChannel();
  if (ch.indexOf('collector:') === 0) return { channel: 'collector', received_by: ch.slice(10), method: 'Cash' };
  if (ch === 'transfer') return { channel: 'transfer', received_by: S.me.id, method: setting('transfer_method') || 'Whish' };
  return { channel: 'manager', received_by: S.me.id, method: 'Cash' };
}
function tapCell(chId, uId) {
  var ch = byId(S.charges, chId), u = byId(S.units, uId);
  if (!ch || !u) return;
  var c = cell(ch, u);
  if (c.state === 'paid' || c.state === 'part') { openSheet('cell', { ch: chId, u: uId }); return; }
  var r = channelRow();
  dbInsert('payments', { charge_id: ch.id, unit_id: u.id, amount: c.left, cur: ch.cur, channel: r.channel, method: r.method, received_by: r.received_by, received_at: nowIso() })
    .then(function() { render(); }, fail);
  render();
}
function payAll(uId, cycId) {
  var u = byId(S.units, uId), r = channelRow(), rows = [];
  chargesOf(cycId).forEach(function(ch) {
    var c = cell(ch, u);
    if (c.left > 0) rows.push({ charge_id: ch.id, unit_id: u.id, amount: c.left, cur: ch.cur, channel: r.channel, method: r.method, received_by: r.received_by, received_at: nowIso() });
  });
  if (!rows.length) return;
  dbInsertMany('payments', rows).then(function() {
    render();
    toast(t(u.code + ' is settled for ' + cycleTitle(byId(S.cycles, cycId)), u.code + ' سدد ' + cycleTitle(byId(S.cycles, cycId))));
  }, fail);
  render();
}
function undoPayments(ids) {
  var p = Promise.resolve();
  ids.forEach(function(id) { p = p.then(function() { return rpc('void_payment', { p_payment: id }); }); });
  return p.then(function() { if (isCloud()) reloadBuilding(); closeSheet(); toast(t('Payment undone', 'تم التراجع عن الدفعة')); }, function(e) { fail(e); });
}
SHEETS.cell = function(d) {
  var ch = byId(S.charges, d.ch), u = byId(S.units, d.u);
  if (!ch || !u) return '';
  var c = cell(ch, u);
  var h = '<h3>' + esc(u.code + ' · ' + L(ch)) + '</h3><p class="lead">' + esc(t('Due', 'المستحق')) + ' ' + esc(fmt(c.due, ch.cur)) + ' · ' + esc(t('Paid', 'المدفوع')) + ' ' + esc(fmt(c.paid, ch.cur)) + '</p>';
  h += '<div class="card list">';
  c.payments.forEach(function(p) {
    var where = p.channel === 'collector' ? (handoverConfirmed(p.handover_id) ? t('handed over to the safe', 'سُلّم للصندوق') : t('with ', 'مع ') + memberName(p.received_by)) : p.channel === 'transfer' ? (p.method || t('transfer', 'تحويل')) : t('received by ', 'استلمه ') + memberName(p.received_by);
    h += '<div class="li"><div class="ic in">✓</div><div class="grow"><b>' + esc(fmt(p.amount, p.cur)) + '</b><small>' + esc(dateLabel(p.received_at, true) + ' · ' + where) + '</small></div></div>';
  });
  h += '</div>';
  var ids = c.payments.map(function(p) { return p.id; });
  var canUndo = isManager() || c.payments.every(function(p) { return p.received_by === S.me.id && !p.handover_id; });
  h += '<div class="foot">';

  if (canUndo) h += '<button class="btn danger" onclick="undoPayments(' + jsArg(ids) + ')">' + esc(t('Undo', 'تراجع')) + '</button>';
  h += '<button class="btn sec" onclick="closeSheet()">' + esc(t('Close', 'إغلاق')) + '</button></div>';
  if (!canUndo) h += '<p class="hint">' + esc(t('This cash was already handed over, so only the manager can undo it.', 'تم تسليم هذا المبلغ، فقط المدير يمكنه التراجع.')) + '</p>';
  return h;
};

/* ---------------------------------------------------------------------------
   Tasks
   --------------------------------------------------------------------------- */
function taskRow(x) {
  var late = x.due_on && x.due_on < todayIso() && !x.done_at;
  var sub = (x.due_on ? dateLabel(x.due_on) : t('No date', 'بلا تاريخ')) + (x.repeat !== 'none' ? ' · ' + (LANG === 'ar' ? REPEATS[x.repeat][1] : REPEATS[x.repeat][0]) : '') + (x.assignee === 'collector' ? ' · ' + collectorLabel() : '');
  return '<div class="task' + (x.done_at ? ' done' : '') + '"><button class="check' + (x.done_at ? ' on' : '') + '" onclick="tickTask(' + jsArg(x.id) + ')" aria-label="' + esc(t('Done', 'تم')) + '">✓</button><div class="grow" role="button" tabindex="0" onclick="' + (isManager() ? 'openSheet(\'task\',{id:' + jsArg(x.id) + '})' : '') + '"><b>' + esc(L(x)) + '</b><small class="' + (late ? 'late' : '') + '">' + esc(sub) + '</small></div></div>';
}
function tickTask(id) {
  var x = byId(S.tasks, id);
  if (!x) return;
  if (x.done_at) { dbUpdate('tasks', id, { done_at: null, done_by: null }).then(render, fail); render(); return; }
  var rep = x.repeat && x.repeat !== 'none' ? x.repeat : null;
  var next = rep ? rollDate(x.due_on, rep) : null;
  // On the server a trigger creates the next one; locally we do the same here.
  var p = dbUpdate('tasks', id, isCloud() ? { done_at: nowIso(), done_by: S.me.id } : { done_at: nowIso(), done_by: S.me.id, repeat: 'none' });
  if (rep) {
    if (!isCloud()) p = p.then(function() { return dbInsert('tasks', { title: x.title, title_ar: x.title_ar, due_on: next, repeat: rep, assignee: x.assignee }); });
    else p = p.then(function() { reloadBuilding(); });
    toast(t('Done. Next one on ' + dateLabel(next), 'تم. التالية في ' + dateLabel(next)));
  }
  p.then(render, fail);
  render();
}
function renderTasksScreen() {
  var h = renderTopbar(t('Tasks', 'المهام'));
  var mine = S.tasks.filter(function(x) { return x.assignee === 'collector' || isManager(); });
  var open = mine.filter(function(x) { return !x.done_at; }).sort(function(a, b) { return String(a.due_on || '9').localeCompare(String(b.due_on || '9')); });
  var done = mine.filter(function(x) { return x.done_at; }).sort(function(a, b) { return String(b.done_at).localeCompare(String(a.done_at)); }).slice(0, 10);
  h += '<div class="sec">' + (open.length ? '<div class="card">' + open.map(taskRow).join('') + '</div>' : '<div class="card empty">' + esc(t('All done', 'أُنجز كل شيء')) + '</div>') + '</div>';
  if (done.length) h += '<div class="sec"><div class="sec-h"><h2>' + esc(t('Done recently', 'أُنجزت مؤخراً')) + '</h2></div><div class="card">' + done.map(taskRow).join('') + '</div></div>';
  return h;
}

function residentLink(u) {

function waText(u, cyc, lang) {

/* Every movement, newest first. Payments for the same apartment, day and hand are grouped. */
function ledger(cycleId) {
  var out = [], groups = {};
  var cycCharges = {};
  if (cycleId) chargesOf(cycleId).forEach(function(c) { cycCharges[c.id] = 1; });
  livePayments().forEach(function(p) {
    if (cycleId && !cycCharges[p.charge_id]) return;
    var u = byId(S.units, p.unit_id), ch = byId(S.charges, p.charge_id);
    var k = p.unit_id + '|' + dayKey(p.received_at) + '|' + p.channel + '|' + p.received_by + '|' + p.cur;
    var g = groups[k];
    if (!g) {
      g = groups[k] = { kind: 'in', icon: '↓', at: p.received_at, amount: 0, cur: p.cur, titles: [], unit: u, p: p };
      out.push(g);
    }
    g.amount += num(p.amount);
    if (ch) g.titles.push(L(ch));
    if (p.received_at > g.at) g.at = p.received_at;
  });
  out.forEach(function(g) {
    var p = g.p;
    g.title = (g.unit ? g.unit.code + (unitName(g.unit) ? ' · ' + unitName(g.unit) : '') : t('Apartment', 'شقة'));
    var who = p.channel === 'collector' ? (handoverConfirmed(p.handover_id) ? memberName(p.received_by) + ' → ' + t('safe', 'الصندوق') : t('with ', 'مع ') + memberName(p.received_by)) : p.channel === 'transfer' ? (p.method || t('Transfer', 'تحويل')) : memberName(p.received_by);
    g.sub = g.titles.join(', ') + ' · ' + who;
    if (g.unit) g.onclick = 'openSheet(\'unit\',{id:' + jsArg(g.unit.id) + '})';
  });
  liveExpenses().forEach(function(e) {
    if (cycleId && e.cycle_id !== cycleId && !(e.charge_id && cycCharges[e.charge_id])) return;
    out.push({ kind: 'out', icon: catIcon(e.charge_id ? 'supplier' : e.cat), at: (e.spent_on === dayKey(e.created_at) ? e.created_at : e.spent_on + 'T12:00:00'), amount: num(e.amount), cur: e.cur,
               title: e.title, sub: catName(e.charge_id ? 'supplier' : e.cat) + ' · ' + (e.paid_from === 'collector' ? t('paid by ', 'دفعه ') + memberName(e.paid_by) : t('from the safe', 'من الصندوق')) + (e.ref ? ' · #' + e.ref : ''),
               onclick: isManager() || e.paid_by === (S.me && S.me.id) ? 'openSheet(\'expense\',{id:' + jsArg(e.id) + '})' : '' });
  });
  if (!cycleId) S.handovers.forEach(function(ho) {
    if (ho.status === 'rejected') return;
    out.push({ kind: 'move', icon: '⇄', at: ho.resolved_at || ho.created_at, amount: 0, cur: 'USD', amtText: fmtPair({ USD: num(ho.usd), LBP: num(ho.lbp) }),
               title: t('Handover from ', 'تسليم من ') + memberName(ho.collector_id), sub: ho.status === 'confirmed' ? t('Confirmed by ', 'أكّده ') + memberName(ho.resolved_by) : t('Waiting for confirmation', 'بانتظار التأكيد'),
               onclick: isManager() && ho.status === 'pending' ? 'openSheet(\'handover\',{id:' + jsArg(ho.id) + '})' : '' });
  });
  out.sort(function(a, b) { return String(b.at).localeCompare(String(a.at)); });
  return out;
}

/* ---------------------------------------------------------------------------
   Activity: the audit trail in plain words
   --------------------------------------------------------------------------- */
function renderActivity() {
  var ev = S.events.slice().reverse();
  var h = '<div class="sec">';
  if (!ev.length) return h + '<div class="card empty">' + esc(t('Every change will show here with who made it.', 'كل تغيير سيظهر هنا مع من قام به.')) + '</div></div>';

}
function eventText(e) {

/* ---------------------------------------------------------------------------
   Record a payment of any amount: it settles the oldest unpaid charges first
   --------------------------------------------------------------------------- */
function unpaidCells(u, cur) {
  var out = [];
  S.cycles.slice().filter(function(c) { return c.published !== false; }).sort(function(a, b) { return cycleOrderKey(a).localeCompare(cycleOrderKey(b)); }).forEach(function(c) {
    chargesOf(c.id).forEach(function(ch) {
      if (cur && ch.cur !== cur) return;
      var x = cell(ch, u);
      if (x.left > 0) out.push({ ch: ch, cyc: c, left: x.left });
    });
  });
  return out;
}
function allocate(u, cur, amount) {
  var rest = amount, rows = [];
  unpaidCells(u, cur).forEach(function(x) {
    if (rest <= 0) return;
    var a = round(Math.min(rest, x.left), cur);
    if (a <= 0) return;
    rows.push({ ch: x.ch, cyc: x.cyc, amount: a });
    rest = round(rest - a, cur);
  });
  return { rows: rows, extra: rest };
}

    ['Whish', 'OMT', 'Bank'].forEach(function(m) { h += '<option value="transfer:' + m + '"' + (ch === 'transfer:' + m || (ch === 'transfer' && m === 'Whish') ? ' selected' : '') + '>' + esc(t('Transfer · ', 'تحويل · ') + m) + '</option>'; });
    h += '</select></label>';
  }
  h += '<div id="pay-prev" class="card pad" style="margin-top:12px"></div><div id="sheet-err" class="err"></div>';
